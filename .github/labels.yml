# 由治理负责人维护的标签清单。GitHub 标签通过 CLI/API 同步，文件用于审计与复现。
- name: type:program
  color: "5319e7"
  description: 总体规划与跨模块治理
- name: type:epic
  color: "3e4b9e"
  description: 稳定业务域或治理域的长期 Epic
- name: type:work-item
  color: "1d76db"
  description: 可独立验收的最小工作项
- name: type:security-audit
  color: "b60205"
  description: 安全审计或安全整改
- name: type:threat-model
  color: "d93f0b"
  description: 资产、信任边界和攻击路径分析
- name: type:governance
  color: "6f42c1"
  description: GitHub、流程、发布和职责治理
- name: priority:P0
  color: "b60205"
  description: 阻断发布或可能造成严重数据与安全损害
- name: priority:P1
  color: "d93f0b"
  description: 高优先级，应在稳定期尽快处理
- name: priority:P2
  color: "fbca04"
  description: 中优先级架构、性能或体验债务
- name: priority:P3
  color: "c2e0c6"
  description: 低优先级改进
- name: status:needs-triage
  color: "ededed"
  description: 等待 PM 分类与补充上下文
- name: status:discovery
  color: "bfdadc"
  description: 只读调查、审计或需求澄清中
- name: status:ready
  color: "0e8a16"
  description: 已满足开始条件
- name: status:blocked
  color: "b60205"
  description: 有明确外部阻塞
- name: status:needs-review
  color: "fbca04"
  description: 等待代码、设计或安全审阅
- name: status:needs-uat
  color: "0052cc"
  description: 等待人工业务验收
- name: area:pm
  color: "5319e7"
  description: 总体规划、路线图和跨模块决策
- name: area:workflow
  color: "006b75"
  description: 跨模块状态机与业务事实投影
- name: area:master-data
  color: "0e8a16"
  description: 客户、产品、报价和基础资料
- name: area:orders
  color: "1d76db"
  description: 订单、PDF 录入和订单详情
- name: area:requisition-incoming
  color: "0075ca"
  description: 报料、供应商报料单和来料确认
- name: area:production
  color: "7057ff"
  description: 轻生产、BOM 和生产回退
- name: area:warehouse
  color: "008672"
  description: 轻库存、预占、盘点、模具和库位
- name: area:delivery-return
  color: "0366d6"
  description: 送货、拣货、部分送货和回单
- name: area:finance
  color: "2ea44f"
  description: 对账、开票和收款
- name: area:frontend-platform
  color: "c5def5"
  description: 前端平台、路由、组件、打印和导出
- name: area:security-platform
  color: "b60205"
  description: 认证、会话、权限、网络和上传安全
- name: area:qe-release
  color: "6f42c1"
  description: 测试、CI、发布、备份恢复和可观测性
- name: area:database
  color: "f9d0c4"
  description: SQLite、Alembic、数据完整性和 PostgreSQL 门禁
- name: scope:read-only
  color: "c2e0c6"
  description: 当前任务只允许读取和报告
- name: scope:no-db-write
  color: "c2e0c6"
  description: 禁止写入任何正式或来源数据库
- name: risk:production-data
  color: "b60205"
  description: 可能影响正式业务数据
- name: risk:migration
  color: "d93f0b"
  description: 涉及 schema 或数据迁移
- name: risk:network
  color: "d93f0b"
  description: 涉及局域网、HTTPS、代理或防火墙边界
- name: gate:human-approval
  color: "fbca04"
  description: 执行前必须获得人工明确授权
- name: gate:backup-required
  color: "fbca04"
  description: 执行前必须备份并验证备份
- name: phase:stabilization
  color: "bfd4f2"
  description: 当前 SQLite 稳定与安全整改阶段
- name: phase:postgresql-evaluation
  color: "d4c5f9"
  description: 仅在触发门槛满足后评估 PostgreSQL
