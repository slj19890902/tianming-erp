<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>ERP手机版UI设计图</title>
    <style>
      :root{
        --board-bg:#e9edeb;
        --board-ink:#22302a;
        --board-muted:#71807a;
        --green:#2e7d4f;
        --green-dark:#22653e;
        --green-soft:#e7f2ea;
        --blue:#1f6fb2;
        --ink:#1d2622;
        --muted:#68766f;
        --line:#e2e8e4;
        --bg:#f4f6f5;
        --card:#ffffff;
        --chip:#eef4f0;
        --amber:#b97a1e;
      }
      @media (prefers-color-scheme: dark){
        :root{ --board-bg:#14181a; --board-ink:#dfe7e2; --board-muted:#8b9992; }
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ margin:0; padding:0; }
      body{
        background:var(--board-bg);
        color:var(--board-ink);
        font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
      }
      .board{
        max-width:1560px; margin:0 auto; padding:28px 20px 48px;
        display:grid; grid-template-columns:repeat(auto-fit,minmax(min(375px,100%),1fr));
        gap:38px 26px; justify-items:center; align-items:start;
      }
      .phone-wrap{ width:min(375px,100%); }
      .phone-label{
        display:flex; align-items:center; gap:9px; margin:0 2px 12px;
        font-size:16px; font-weight:700; letter-spacing:.02em;
      }
      .phone-label .num{
        width:25px; height:25px; border-radius:50%; background:var(--green); color:#fff;
        display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;
        flex:none;
      }
      .phone-label .sub{ font-size:13px; font-weight:500; color:var(--board-muted); }

      /* ---------- phone frame ---------- */
      .phone{
        width:100%; border-radius:46px; background:#10151a; padding:11px;
        box-shadow:0 18px 42px rgba(16,30,22,.28), 0 3px 10px rgba(16,30,22,.22);
      }
      .screen{
        position:relative; height:782px; border-radius:36px; overflow:hidden;
        background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
      }
      .statusbar{
        flex:none; height:34px; padding:6px 22px 0; display:flex; align-items:center; justify-content:space-between;
        font-size:13.5px; font-weight:700; color:var(--ink);
      }
      .statusbar .sicons{ display:flex; align-items:center; gap:5px; }
      .view{ flex:1; overflow-y:auto; scrollbar-width:none; position:relative; }
      .view::-webkit-scrollbar{ display:none; }
      .page{ padding:8px 16px 18px; }

      /* ---------- app header ---------- */
      .appbar{ display:flex; align-items:center; gap:10px; padding:8px 2px 12px; }
      .appbar h1{ font-size:21px; margin:0; font-weight:800; letter-spacing:.01em; }
      .appbar .back{
        width:40px; height:40px; border:none; border-radius:12px; background:var(--card);
        box-shadow:inset 0 0 0 1px var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
      }
      .appbar .sp{ flex:1; }
      .appbar .mini{ font-size:13px; color:var(--muted); font-weight:600; }

      /* ---------- tab bar ---------- */
      .tabbar{
        flex:none; height:64px; background:var(--card); border-top:1px solid var(--line);
        display:flex; padding-bottom:6px;
      }
      .tabbar button{
        flex:1; border:none; background:none; cursor:pointer; color:#7a8781;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
        font-size:13px; font-weight:600; font-family:inherit;
      }
      .tabbar button.on{ color:var(--green); }
      .tabbar button svg{ display:block; }

      /* ---------- home ---------- */
      .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      .bigbtn{
        position:relative; border:none; cursor:pointer; border-radius:18px; background:var(--card);
        box-shadow:inset 0 0 0 1px var(--line); padding:18px 14px 15px; text-align:left; font-family:inherit;
        display:flex; flex-direction:column; gap:9px; min-height:102px;
      }
      .bigbtn .ic{ width:42px; height:42px; border-radius:13px; background:var(--green-soft); color:var(--green); display:flex; align-items:center; justify-content:center; }
      .bigbtn .t{ font-size:19px; font-weight:800; color:var(--ink); }
      .bigbtn .badge{
        position:absolute; top:12px; right:12px; min-width:24px; height:24px; padding:0 7px; border-radius:12px;
        background:#d84a35; color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center;
      }
      .todo{
        margin-top:12px; width:100%; border:none; cursor:pointer; font-family:inherit; text-align:left;
        background:#fdf3e2; box-shadow:inset 0 0 0 1px #f0dcb6; border-radius:16px; padding:15px 16px;
        display:flex; align-items:center; gap:10px; font-size:16.5px; font-weight:700; color:#7c5510;
      }
      .todo b{ color:#c22f1c; font-size:19px; }
      .todo .sep{ color:#d8bd8a; font-weight:400; }
      .todo svg{ margin-left:auto; flex:none; }
      .card{ background:var(--card); border-radius:18px; box-shadow:inset 0 0 0 1px var(--line); }
      .boss{ margin-top:12px; padding:16px 18px 18px; }
      .boss .cap{ display:flex; justify-content:space-between; align-items:baseline; font-size:15px; font-weight:700; color:var(--ink); margin-bottom:12px; }
      .boss .cap span{ font-size:13px; color:var(--muted); font-weight:600; }
      .boss .nums{ display:flex; }
      .boss .nums > div{ flex:1; }
      .boss .nums > div + div{ border-left:1px solid var(--line); padding-left:16px; }
      .boss .v{ font-size:25px; font-weight:800; color:var(--green); font-variant-numeric:tabular-nums; line-height:1.15; }
      .boss .v.blue{ color:var(--blue); }
      .boss .k{ font-size:13.5px; color:var(--muted); margin-top:3px; font-weight:600; }
      .recent{ margin-top:12px; padding:14px 16px; }
      .recent .cap{ font-size:15px; font-weight:700; margin-bottom:10px; }
      .recent .row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:15.5px; }
      .recent .row:first-of-type{ border-top:none; padding-top:0; }
      .recent .code{ font-size:19px; font-weight:800; color:var(--blue); min-width:42px; }
      .recent .loc{ margin-left:auto; color:var(--muted); font-size:14px; font-weight:600; }

      /* ---------- query ---------- */
      .seg{ display:flex; background:#e6ece8; border-radius:14px; padding:4px; gap:4px; }
      .seg button{
        flex:1; border:none; background:none; cursor:pointer; font-family:inherit; height:48px; border-radius:11px;
        font-size:17px; font-weight:700; color:#5d6c65;
      }
      .seg button.on{ background:var(--green); color:#fff; box-shadow:0 2px 6px rgba(46,125,79,.35); }
      .searchrow{ display:flex; gap:9px; margin-top:14px; }
      .searchrow input{
        flex:1; min-width:0; height:56px; border:1.5px solid #cfd8d2; border-radius:14px; background:var(--card);
        padding:0 14px; font-size:17px; font-family:inherit; color:var(--ink); outline:none;
      }
      .searchrow input:focus{ border-color:var(--green); }
      .searchrow input::placeholder{ color:#9aa7a0; }
      .btn-go{
        flex:none; width:76px; height:56px; border:none; border-radius:14px; background:var(--green); color:#fff;
        font-size:18px; font-weight:800; cursor:pointer; font-family:inherit;
      }
      .btn-go:active{ background:var(--green-dark); }
      .btn-scan{
        flex:none; width:56px; height:56px; border-radius:14px; border:1.5px solid #cfd8d2; background:var(--card);
        color:var(--green); cursor:pointer; display:flex; align-items:center; justify-content:center;
      }
      .chips{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
      .chips .lb{ font-size:14px; color:var(--muted); font-weight:600; align-self:center; }
      .chip{
        border:none; cursor:pointer; font-family:inherit; background:var(--chip); color:var(--green-dark);
        border-radius:999px; padding:9px 14px; font-size:15px; font-weight:700;
      }
      .sizecard{ margin-top:16px; padding:16px; }
      .sizecard .cap{ font-size:17px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
      .sizecard .cap svg{ color:var(--green); }
      .sizeinputs{ display:flex; gap:10px; align-items:flex-end; }
      .sizeinputs .f{ flex:1; }
      .sizeinputs label{ display:block; font-size:13.5px; color:var(--muted); font-weight:700; margin-bottom:6px; }
      .sizeinputs input{
        width:100%; height:54px; border:1.5px solid #cfd8d2; border-radius:12px; padding:0 12px;
        font-size:19px; font-weight:700; font-family:inherit; color:var(--ink); outline:none; font-variant-numeric:tabular-nums;
      }
      .sizeinputs input:focus{ border-color:var(--green); }
      .sizeinputs .x{ font-size:18px; color:var(--muted); padding-bottom:14px; font-weight:700; }
      .sizeinputs .unit{ font-size:13.5px; color:var(--muted); font-weight:600; padding-bottom:16px; }
      .btn-wide{
        margin-top:14px; width:100%; height:54px; border:none; border-radius:14px; background:var(--green); color:#fff;
        font-size:18px; font-weight:800; cursor:pointer; font-family:inherit;
      }
      .btn-wide:active{ background:var(--green-dark); }

      /* ---------- detail ---------- */
      .codehead{ display:flex; align-items:flex-start; gap:12px; }
      .codehead .code{ font-size:38px; font-weight:800; color:var(--blue); line-height:1; font-variant-numeric:tabular-nums; }
      .tag-on{ background:var(--green-soft); color:var(--green-dark); font-size:13.5px; font-weight:800; border-radius:8px; padding:5px 9px; margin-top:5px; }
      .pname{ font-size:20px; font-weight:800; margin-top:9px; line-height:1.3; }
      .psub{ font-size:15.5px; color:var(--muted); margin-top:4px; font-weight:600; font-variant-numeric:tabular-nums; }
      .psub b{ color:var(--ink); }
      .stockcard{ margin-top:12px; padding:13px 16px 14px; }
      .stockcard .k{ font-size:14px; color:var(--muted); font-weight:700; }
      .stockcard .big{ font-size:34px; font-weight:800; color:var(--blue); line-height:1.1; font-variant-numeric:tabular-nums; }
      .stockcard .big small{ font-size:18px; font-weight:700; }
      .locrow{ display:flex; align-items:center; gap:8px; padding:8px 0 0; margin-top:8px; border-top:1px solid var(--line); font-size:15.5px; }
      .locrow .pin{ color:var(--green); flex:none; display:flex; }
      .locrow .where{ font-weight:800; }
      .locrow .qty{ margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums; }
      .locrow .qty span{ color:var(--muted); font-weight:600; font-size:14px; }
      .ministats{ display:flex; gap:9px; margin-top:10px; }
      .ministats > div{ flex:1; border-radius:13px; padding:7px 6px; text-align:center; }
      .ministats .n{ font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; }
      .ministats .k{ font-size:13px; font-weight:700; margin-top:1px; }
      .ms-a{ background:#e9f1fb; color:#20557f; } .ms-b{ background:#f0ebfa; color:#55458a; } .ms-c{ background:#e9f5ec; color:#2c6b45; }
      .craft{ margin-top:12px; padding:12px 16px 13px; }
      .craft .cap{ font-size:16px; font-weight:800; margin-bottom:4px; }
      .craftgrid{ display:grid; grid-template-columns:1fr 1fr; column-gap:16px; }
      .craftgrid .cg{ display:flex; align-items:baseline; gap:7px; padding:7.5px 0; border-top:1px solid var(--line); min-width:0; }
      .craftgrid .cg.full{ grid-column:1 / -1; }
      .craftgrid .k{ font-size:13.5px; color:var(--muted); font-weight:700; white-space:nowrap; }
      .craftgrid .v{ font-size:15.5px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
      .craftgrid .v.flow{ color:var(--green-dark); }
      .actions{ display:flex; gap:11px; margin-top:12px; }
      .actions button{
        flex:1; height:52px; border-radius:14px; font-size:18px; font-weight:800; cursor:pointer; font-family:inherit;
        display:flex; align-items:center; justify-content:center; gap:8px;
      }
      .btn-line{ background:var(--card); border:1.5px solid var(--green); color:var(--green-dark); }
      .btn-solid{ background:var(--green); border:1.5px solid var(--green); color:#fff; }

      /* ---------- recognize results ---------- */
      .measure{ padding:15px 18px; display:flex; align-items:center; gap:12px; }
      .measure .sz{ font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
      .measure .sz small{ font-size:15px; color:var(--muted); font-weight:700; }
      .measure .tol{ margin-left:auto; background:var(--chip); color:var(--green-dark); border-radius:9px; padding:6px 10px; font-size:14.5px; font-weight:800; }
      .reslist{ margin-top:12px; display:flex; flex-direction:column; gap:11px; }
      .res{
        border:none; cursor:pointer; font-family:inherit; text-align:left; width:100%;
        background:var(--card); border-radius:17px; box-shadow:inset 0 0 0 1px var(--line); padding:15px 16px;
        display:flex; gap:13px; align-items:center;
      }
      .res .code{ font-size:27px; font-weight:800; color:var(--blue); min-width:50px; font-variant-numeric:tabular-nums; }
      .res .mid{ flex:1; min-width:0; }
      .res .mid > span{ display:block; }
      .res .nm{ font-size:16.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .res .nm span{ color:var(--muted); font-weight:700; font-size:15px; margin-right:7px; }
      .res .mt{ font-size:14.5px; color:var(--muted); margin-top:3px; font-weight:600; font-variant-numeric:tabular-nums; }
      .res .rt{ text-align:right; flex:none; }
      .res .stk{ font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; }
      .res .stk small{ font-size:13px; color:var(--muted); font-weight:700; }
      .res .loc{ font-size:14px; color:var(--green-dark); font-weight:800; margin-top:2px; }
      .res .best{ display:inline-block; background:#fdf3e2; color:#96690f; font-size:12.5px; font-weight:800; border-radius:7px; padding:3px 7px; margin-top:5px; }

      /* ---------- map ---------- */
      .maptools{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
      .fseg{ display:flex; background:#e6ece8; border-radius:11px; padding:3px; gap:3px; }
      .fseg button{ border:none; background:none; cursor:pointer; font-family:inherit; height:38px; padding:0 16px; border-radius:9px; font-size:15.5px; font-weight:800; color:#5d6c65; }
      .fseg button.on{ background:var(--green); color:#fff; }
      .maptools .sp{ flex:1; }
      .zbtn{
        width:42px; height:42px; border-radius:12px; border:1.5px solid #cfd8d2; background:var(--card); cursor:pointer;
        font-size:19px; font-weight:800; color:var(--ink); font-family:inherit; display:flex; align-items:center; justify-content:center;
      }
      .zbtn.wide{ width:auto; padding:0 13px; font-size:15px; }
      .mapview{
        border-radius:18px; background:#eef1ee; box-shadow:inset 0 0 0 1px var(--line);
        overflow:hidden; aspect-ratio:360 / 436;
      }
      .mapview svg{ width:100%; height:100%; display:block; transition:transform .25s ease; }
      .area{ cursor:pointer; }
      .area rect{ fill:#d5e3f6; stroke:#7ea6dd; stroke-width:1.4; }
      .area text{ fill:#33527c; font-weight:700; pointer-events:none; }
      .area.sel rect{ fill:var(--green); stroke:var(--green-dark); stroke-width:2.4; }
      .area.sel text{ fill:#fff; }
      .infobar{ margin-top:11px; padding:11px 16px 12px; }
      .infobar .ir{ padding:7px 0; }
      .infobar .ir + .ir{ border-top:1px solid var(--line); }
      .infobar .line1{ display:flex; align-items:center; gap:9px; font-size:16px; }
      .infobar .pin{ color:var(--green); display:flex; flex:none; }
      .infobar .t{ font-weight:800; white-space:nowrap; }
      .infobar .n{ margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
      .infobar .c{ background:var(--chip); color:var(--green-dark); border-radius:8px; padding:4px 8px; font-size:13.5px; font-weight:800; white-space:nowrap; }
      .infobar .line2{ font-size:15px; color:var(--muted); font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; }

      /* ---------- receive ---------- */
      .rcard{ padding:16px; margin-bottom:12px; cursor:pointer; }
      .rcard .spec{ font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; }
      .rcard .spec span{ color:var(--muted); font-weight:600; font-size:15.5px; margin-left:6px; }
      .rcard .qtyrow{ display:flex; align-items:center; margin-top:7px; }
      .rcard .qty{ font-size:15.5px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; }
      .rcard .qty b{ color:var(--ink); font-size:19px; }
      .rcard .exp{ margin-left:auto; display:flex; align-items:center; gap:2px; font-size:14px; font-weight:800; color:var(--green-dark); }
      .rcard .exp svg{ transition:transform .2s ease; }
      .rcard.open .exp svg{ transform:rotate(90deg); }
      .btn-confirm{
        margin-top:13px; width:100%; height:52px; border:none; border-radius:13px; background:var(--green); color:#fff;
        font-size:17.5px; font-weight:800; cursor:pointer; font-family:inherit;
      }
      .btn-confirm.done{ background:var(--green-soft); color:var(--green-dark); cursor:default; }
      .craftmini{ margin-top:13px; border-top:1px dashed #cfd8d2; padding-top:12px; display:none; }
      .craftmini.open{ display:block; }
      .craftmini .meta{ font-size:15px; color:var(--muted); font-weight:700; margin-bottom:11px; }
      .craftmini .meta b{ color:var(--ink); font-size:16px; }
      .craftmini .cap{ font-size:14px; color:var(--muted); font-weight:700; margin-bottom:9px; }
      .craftmini .body{ display:flex; gap:13px; }
      .craftmini .thumb{
        flex:none; width:104px; height:82px; border-radius:11px; background:#fbfcfb;
        box-shadow:inset 0 0 0 1.5px #c9d6cd; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      }
      .craftmini .thumb .tn{ font-size:13px; font-weight:800; color:var(--blue); }
      .craftmini .info{ flex:1; font-size:15.5px; }
      .craftmini .info .r{ display:flex; padding:4.5px 0; }
      .craftmini .info .k{ color:var(--muted); font-weight:700; width:44px; flex:none; }
      .craftmini .info .v{ font-weight:800; }
      .craftmini .info .v .code2{ color:var(--blue); font-size:19px; }

      /* ---------- more ---------- */
      .mrow{
        width:100%; border:none; cursor:pointer; font-family:inherit; text-align:left; background:var(--card);
        border-radius:17px; box-shadow:inset 0 0 0 1px var(--line); padding:18px 16px; margin-bottom:11px;
        display:flex; align-items:center; gap:13px;
      }
      .mrow .ic{ width:44px; height:44px; border-radius:13px; background:var(--green-soft); color:var(--green); display:flex; align-items:center; justify-content:center; flex:none; }
      .mrow .t{ font-size:18px; font-weight:800; }
      .mrow .d{ font-size:14px; color:var(--muted); font-weight:600; margin-top:2px; }
      .mrow svg.chev{ margin-left:auto; flex:none; }
      .mrow .bdg{ background:#d84a35; color:#fff; font-size:13px; font-weight:800; border-radius:10px; min-width:22px; height:22px; padding:0 6px; display:flex; align-items:center; justify-content:center; }

      /* ---------- drawing sheet / toast ---------- */
      .sheet{
        position:absolute; inset:0; background:rgba(20,28,24,.45); display:none; z-index:30;
        align-items:flex-end; justify-content:center;
      }
      .sheet.open{ display:flex; }
      .sheet .panel{
        background:var(--card); width:100%; border-radius:24px 24px 0 0; padding:18px 18px 26px;
      }
      .sheet .cap{ display:flex; align-items:center; margin-bottom:6px; }
      .sheet .cap .t{ font-size:19px; font-weight:800; }
      .sheet .cap .t span{ color:var(--blue); }
      .sheet .cap button{ margin-left:auto; border:none; background:var(--chip); width:38px; height:38px; border-radius:50%; font-size:17px; cursor:pointer; color:var(--ink); }
      .sheet .dims{ display:flex; gap:9px; margin-top:12px; }
      .sheet .dims > div{ flex:1; background:var(--bg); border-radius:12px; padding:10px 12px; }
      .sheet .dims .k{ font-size:13px; color:var(--muted); font-weight:700; }
      .sheet .dims .v{ font-size:17.5px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px; white-space:nowrap; }
      .toast{
        position:absolute; left:50%; bottom:80px; transform:translateX(-50%) translateY(8px); z-index:40;
        background:rgba(24,34,29,.92); color:#fff; font-size:15px; font-weight:700; padding:11px 18px; border-radius:999px;
        opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; white-space:nowrap;
      }
      .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
      @media (prefers-reduced-motion: reduce){
        .mapview svg, .toast, .rcard .exp svg{ transition:none; }
      }
    </style>
  </head>
  <body>
    <main class="board" id="board"></main>

    <script>
      /* ================= icons ================= */
      function ic(name, s){
        s = s || 24;

        + '<div class="maptools"><div class="fseg">'
        +   '<button data-act="floor" data-f="3" class="'+(st.floor==='3'?'on':'')+'">三楼</button>'
        +   '<button data-act="floor" data-f="2" class="'+(st.floor==='2'?'on':'')+'">二楼</button></div>'
        +   '<span class="sp"></span>'
        +   '<button class="zbtn wide" data-act="zoom" data-z="reset">全图</button>'
        +   '<button class="zbtn" data-act="zoom" data-z="out" aria-label="缩小">－</button>'
        +   '<button class="zbtn" data-act="zoom" data-z="in" aria-label="放大">＋</button></div>'
        + '<div class="mapview">' + mapSVG(st) + '</div>'
        + '<div class="card infobar">';
        infos.forEach(function(r){
          s += '<div class="ir"><div class="line1"><span class="pin">'+ic('pin',18)+'</span><span class="t">'+r.t+'</span>'
            + (r.n ? '<span class="n">'+r.n+'</span>' : '')
            + (r.c ? '<span class="c">'+r.c+'</span>' : '')
            + '</div><div class="line2">'+r.d+'</div></div>';
        });
        return s + '</div></div>';
      }

      /* ================= receive ================= */
      var RCARDS = [
        { sup:'联盛纸业', spec:'1250×900', flute:'三层B楞', qty:'5000', time:'今天 09:40',
          code:'227', cust:'驿力', pname:'加厚48入装风机纸箱', flow:'印刷 → 模切 → 粘箱', draw:'图-227' },
        { sup:'宏图纸板', spec:'1100×850', flute:'五层AB楞', qty:'3200', time:'今天 11:15',
          code:'318', cust:'明俊德', pname:'过滤器外箱', flow:'印刷 → 模切 → 钉箱', draw:'图-318' }
      ];
      function vReceive(st){
        var s = '<div class="page">' + appbar('收料', true);
        RCARDS.forEach(function(r, i){
          var done = !!st.received[i];
          var open = st.expanded === i;
          s += '<div class="card rcard'+(open?' open':'')+'" data-act="expand" data-i="'+i+'">'
            + '<div class="spec">'+r.spec+'<span>'+r.flute+'</span></div>'
            + '<div class="qtyrow"><span class="qty">数量 <b>'+r.qty+'</b> 片</span>'
            + '<span class="exp">'+(open?'收起':'展开')+ic('chev',16)+'</span></div>'
            + '<div class="craftmini'+(open?' open':'')+'">'
            +   '<div class="meta">供应商 <b>'+r.sup+'</b> · '+r.time+' 到货</div>'
            +   '<div class="cap">用此纸板的产品</div><div class="body">'
            +   '<div class="thumb">'+dieLineSVG(84,58,'#7ea6dd')+'<span class="tn">'+r.draw+'</span></div>'
            +   '<div class="info"><div class="r"><span class="k">短码</span><span class="v"><span class="code2">'+r.code+'</span> · '+r.cust+'</span></div>'
            +   '<div class="r"><span class="k">品名</span><span class="v">'+r.pname+'</span></div>'
            +   '<div class="r"><span class="k">工艺</span><span class="v">'+r.flow+'</span></div></div>'
            +   '</div>'
            +   '<button class="btn-confirm'+(done?' done':'')+'" data-act="confirm" data-i="'+i+'">'+(done?'✓ 已收料':'确认收料')+'</button>'
            + '</div></div>';
        });
        return s + '</div>';
      }

      function vMore(){
        return '<div class="page">' + appbar('更多', true)
        + '<button class="mrow" data-act="go" data-go="receive"><span class="ic">'+ic('in',23)+'</span><span><span class="t">收料</span><span class="d" style="display:block">供应商来料确认</span></span><span class="bdg">2</span>'+ic('chev',19)+'</button>'
        + '<button class="mrow" data-act="toast" data-msg="生产 · 本稿未含此屏"><span class="ic">'+ic('gear',23)+'</span><span><span class="t">生产</span><span class="d" style="display:block">印刷工位 · 模切工位</span></span>'+ic('chev',19)+'</button>'
        + '<button class="mrow" data-act="toast" data-msg="预送货 · 本稿未含此屏"><span class="ic">'+ic('truck',23)+'</span><span><span class="t">预送货</span><span class="d" style="display:block">本人拿货任务</span></span>'+ic('chev',19)+'</button>'
        + '<button class="mrow" data-act="go" data-go="map"><span class="ic">'+ic('pin',23)+'</span><span><span class="t">仓库地图</span><span class="d" style="display:block">三楼 · 二楼平面图</span></span>'+ic('chev',19)+'</button>'
        + '</div>';
      }

      var VIEWS = { home:vHome, query:vQuery, detail:vDetail, recognize:vRecognize, map:vMap, receive:vReceive, more:vMore };

      /* ================= render / nav ================= */
      var board = document.getElementById('board');
      Object.keys(P).forEach(function(pid){
        var wrap = document.createElement('section');
        wrap.className = 'phone-wrap';
        wrap.innerHTML = '<div class="phone-label"><span class="num">'+pid+'</span>'+LABELS[pid][0]
          + (LABELS[pid][1] ? '<span class="sub">'+LABELS[pid][1]+'</span>' : '')
          + '</div><div class="phone" data-pid="'+pid+'"><div class="screen">'
          + statusbar()
          + '<div class="view"></div><div class="tabbar-slot"></div><div class="toast"></div>'
          + '</div></div>';
        board.appendChild(wrap);
      });
      function render(pid){
        var st = P[pid];
        var phone = board.querySelector('.phone[data-pid="'+pid+'"]');
        phone.querySelector('.view').innerHTML = VIEWS[st.view](st, pid);
        phone.querySelector('.tabbar-slot').innerHTML = tabbar(NAVMAP[st.view]);
        phone.querySelector('.view').scrollTop = 0;
      }
      Object.keys(P).forEach(function(pid){ render(pid); });

      function go(pid, view){
        var st = P[pid];
        if (st.view !== view){ st.stack.push(st.view); st.view = view; }
        render(pid);
      }
      function toast(pid, msg){
        var phone = board.querySelector('.phone[data-pid="'+pid+'"]');
        var t = phone.querySelector('.toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._tm);
        t._tm = setTimeout(function(){ t.classList.remove('show'); }, 1700);
      }

      document.addEventListener('click', function(e){
        var phoneEl = e.target.closest('.phone');
        if (!phoneEl) return;
        var pid = phoneEl.getAttribute('data-pid');
        var st = P[pid];
        var nav = e.target.closest('[data-nav]');
        if (nav){
          var target = { home:'home', query:'query', map:'map', more:'more' }[nav.getAttribute('data-nav')];
          st.stack = []; st.view = target; render(pid); return;
        }
        var el = e.target.closest('[data-act]');
        if (!el) return;
        var act = el.getAttribute('data-act');
        if (act === 'back'){ st.view = st.stack.pop() || 'home'; render(pid); }
        else if (act === 'go'){ go(pid, el.getAttribute('data-go')); }
        else if (act === 'toast'){ toast(pid, el.getAttribute('data-msg')); }
        else if (act === 'qtab'){ st.qtab = el.getAttribute('data-t'); render(pid); }
        else if (act === 'qsearch'){
          if (st.qtab === 'board') go(pid, 'recognize');
          else if (st.qtab === 'loc') go(pid, 'map');
          else go(pid, 'detail');
        }
        else if (act === 'sizesearch'){ go(pid, 'recognize'); }
        else if (act === 'area'){ st.area = el.getAttribute('data-area'); render(pid); }
        else if (act === 'floor'){
          st.floor = el.getAttribute('data-f');
          st.area = st.floor === '3' ? 'E28' : 'F2A'; st.zoom = 1; render(pid);
        }
        else if (act === 'zoom'){
          var z = el.getAttribute('data-z');
          if (z === 'reset') st.zoom = 1;
          else if (z === 'in') st.zoom = Math.min(2, Math.round((st.zoom + 0.25) * 100) / 100);
          else st.zoom = Math.max(0.6, Math.round((st.zoom - 0.25) * 100) / 100);
          render(pid);
        }
        else if (act === 'expand'){
          var i = +el.getAttribute('data-i');
          st.expanded = st.expanded === i ? -1 : i; render(pid);
        }
        else if (act === 'confirm'){
          var ci = +el.getAttribute('data-i');
          if (!st.received[ci]){ st.received[ci] = true; render(pid); toast(pid, '已确认收料'); }
        }
        else if (act === 'draw'){ phoneEl.querySelector('.sheet').classList.add('open'); }
        else if (act === 'undraw'){ phoneEl.querySelector('.sheet').classList.remove('open'); }
      });
      document.addEventListener('input', function(e){
        var phoneEl = e.target.closest('.phone');
        if (!phoneEl || !e.target.hasAttribute('data-bind')) return;
        var st = P[phoneEl.getAttribute('data-pid')];
        st[e.target.getAttribute('data-bind')] = e.target.value;
      });
    </script>
  </body>
</html>
