{
    admin 127.0.0.1:20190
    auto_https off
    persist_config off
    servers {
        trusted_proxies static 127.0.0.1 ::1
        trusted_proxies_strict
    }
}

http://:18180 {
    bind 127.0.0.1
    @public_host host tianmingerp0909.share.zrok.io
    handle @public_host {
        @not_https not header X-Forwarded-Proto https
        @landing path / /index.html
        @mobile_home {
            method GET HEAD
            path / /index.html
            header_regexp User-Agent (?i)(Android|iPhone|iPad|iPod|Mobile)
            expression {http.request.uri.query} == ""
        }
        route {
            redir @not_https https://tianmingerp0909.share.zrok.io{uri} 308
            header @landing +Vary User-Agent
            header @mobile_home Cache-Control "no-store"
            redir @mobile_home /mobile/ 302
            encode gzip
            reverse_proxy 127.0.0.1:8000 {
                header_up Host tianmingerp0909.share.zrok.io
                header_up X-Forwarded-Host tianmingerp0909.share.zrok.io
                header_up X-Forwarded-Proto https
                header_up X-Forwarded-For {client_ip}
                header_up X-Real-IP {client_ip}
                header_up -Forwarded
            }
        }
    }
    handle {
        respond "Invalid host" 400
    }
}
