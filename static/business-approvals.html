<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业务申请与审批</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172c46;font:15px system-ui,"Microsoft YaHei",sans-serif}header{display:flex;align-items:center;gap:18px;padding:18px 24px;background:white;border-bottom:1px solid #dae2ee}h1{font-size:21px;margin:0}main{max-width:1440px;margin:20px auto;padding:0 20px}section{background:white;border:1px solid #dbe3ef;border-radius:10px;padding:18px;margin-bottom:18px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:1px solid #becbdd;border-radius:5px;padding:9px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#0868df;color:white;border-color:#0868df}button:disabled{opacity:.5;cursor:wait}a{color:#0868df}h2{font-size:17px;margin:0 0 14px}label{display:flex;flex-direction:column;gap:7px;min-width:180px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px;margin:16px 0}#message{padding:12px 0;white-space:pre-wrap;color:#b82828}table{border-collapse:collapse;width:100%;margin:14px 0}td,th{text-align:left;padding:10px;border-bottom:1px solid #e0e7ef;vertical-align:top}th{background:#f2f6fc}td{overflow-wrap:anywhere}small{color:#677b91}dialog{border:1px solid #cad7e8;border-radius:12px;max-width:950px;width:90%;max-height:85vh;overflow:auto}dialog::backdrop{background:#172c4670}pre{white-space:pre-wrap}#target{min-width:360px;max-width:100%}.scroll{overflow:auto}.status{font-weight:600;color:#0967ce}.wide{grid-column:1/-1}#request-panel[hidden], [hidden]{display:none!important}
</style></head><body><header><a href="/">← 返回 ERP</a><h1 id="title">业务申请</h1><span id="account"></span></header><main><div id="message" role="status" aria-live="polite"></div>
<section id="request-panel" hidden><h2>新申请</h2><div class="bar"><label>客户<select id="customer"></select></label><label>业务<select id="action"><option value="customer_update">客户资料修改</option><option value="product_update">常用箱修改</option><option value="order_update">订单修改</option><option value="stock_replenishment">库存预警报料</option><option value="delivery_create">送货单申请</option><option value="statement_create">对账申请</option><option value="statement_confirm">确认对账申请</option><option value="invoice_task_create">开票申请</option></select></label></div>
<div id="selector" class="bar" style="margin-top:14px"><input id="search" aria-label="查找单据或产品" placeholder="输入编码、名称或单号"><button id="find">查找</button><select id="target" aria-label="选择单据或产品"></select><button id="prevOptions">上一批</button><button id="nextOptions">下一批</button><button id="choose">选择</button></div>
<form id="form"><div id="fields" class="fields"></div><div id="lines" class="scroll"></div><div class="bar"><label style="flex:1">申请备注<input id="note" maxlength="1000"></label><button id="submit" class="primary" disabled>提交审批</button></div></form></section>
<section><div class="bar"><h2 id="list-title" style="margin:0">我的申请</h2><select id="status" aria-label="申请状态"><option value="pending">待审批</option><option value="applied">已生效</option><option value="rejected">已拒绝</option><option value="withdrawn">已撤回</option><option value="">全部</option></select><button id="refresh">刷新</button></div><div class="scroll"><table><thead><tr><th>申请号</th><th>客户</th><th>业务</th><th>申请人</th><th>时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="bar"><button id="prev">上一页</button><span id="pagination"></span><button id="next">下一页</button></div></section>
</main><dialog id="detail"><div class="bar"><h2 id="detail-title" style="flex:1"></h2><button id="close">关闭</button></div><p id="detail-error" role="alert" style="color:#b82828"></p><div id="detail-body"></div><label id="decision-label">审批意见<textarea id="decision" rows="2" maxlength="1000"></textarea></label><div class="bar" style="margin-top:15px"><button id="approve" class="primary">同意并生效</button><button id="reject">拒绝</button><button id="withdraw">撤回申请</button></div></dialog><script src="/static/business-approvals.js?v=20261009-home1"></script></body></html>
