<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>核对客户Excel · 天明ERP</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#173d37;font:15px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#60736e;line-height:1.5}section{background:white;border:1px solid #d8e3df;border-radius:12px;padding:18px;margin:16px 0}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;min-height:40px;border:1px solid #b8cbc3;border-radius:7px;padding:8px;background:white}input[type=checkbox]{min-height:0;vertical-align:middle;margin-right:6px}button{cursor:pointer;font-weight:650}button.primary{background:#08775e;color:white;border:0}button:disabled{opacity:.5;cursor:wait}#message{white-space:pre-wrap;color:#a43b29}.mapping{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}.mapping label{display:grid;gap:5px}.table{overflow:auto}table{border-collapse:collapse;min-width:960px;width:100%;font-size:13px}th,td{padding:11px 8px;border-bottom:1px solid #dce5e1;text-align:left}th{background:#e9f3ef;white-space:nowrap}.different{background:#fff3e8}.summary{font-weight:700;margin-bottom:12px}details{margin-top:12px}summary{cursor:pointer}a{color:#08775e}[hidden]{display:none!important}@media(max-width:600px){main{padding:12px}section{padding:12px}}</style></head>
<body><main><h1>核对客户 Excel</h1><p id="context">选择客户发来的本期对账表，与这张ERP对账单核对。</p>
<section><div class="bar"><input id="file" type="file" accept=".xlsx" aria-label="客户对账文件"><button id="check" class="primary">开始核对</button><button id="download" disabled>下载差异报告</button></div><p>仅比对，不修改对账单。数量完全一致；金额允许相差0.01元。同单号和存货编码的多行合并核对。</p>
<details id="settings" hidden><summary>表头与列对应</summary><div class="bar" style="margin-top:12px"><label>工作表 <select id="sheet"></select></label><label>表头在第 <input id="header" type="number" min="1" max="100" value="1" style="width:75px"> 行</label><button id="recognize">重新识别</button></div><div class="mapping" id="mapping"></div></details><p id="message" role="status"></p></section>
<section id="result" hidden><div class="summary" id="summary"></div><p id="rules"></p><label><input id="onlyDifferences" type="checkbox" checked> 只显示差异</label><div class="table"><table><thead><tr><th>结果</th><th>送货单号</th><th>客户单号</th><th>存货编码 / 产品</th><th>客户数量</th><th>ERP数量</th><th>数量差</th><th>客户金额</th><th>ERP金额</th><th>金额差</th><th>客户文件行</th></tr></thead><tbody id="rows"></tbody></table></div><p id="errors"></p></section></main>
<script>
const byId=id=>document.getElementById(id),statementId=Number(new URLSearchParams(location.search).get('statement_id'));let last=null,busy=false;
function option(value,label){const el=document.createElement('option');el.value=value;el.textContent=label;return el;}
function settings(data){byId('settings').hidden=false;byId('sheet').replaceChildren(...data.sheets.map(name=>option(name,name)));byId('sheet').value=data.sheet_name;byId('header').value=data.header_row;byId('mapping').replaceChildren();for(const [key,label]of Object.entries(data.fields)){const wrap=document.createElement('label');wrap.textContent=label;const select=document.createElement('select');select.dataset.field=key;select.append(option('','不使用'),...data.headers.map((name,index)=>option(index,`${index+1}. ${name}`)));select.value=data.columns[key]??'';select.onchange=()=>{last=null;byId('download').disabled=true;};wrap.append(select);byId('mapping').append(wrap);}}
function render(){if(!last)return;byId('result').hidden=false;byId('summary').textContent=Object.entries(last.summary).map(([key,value])=>`${key} ${value}组`).join('　')||'没有可核对的明细';byId('rules').textContent=`${last.amount_label}、${last.price_label}按ERP客户对账口径比较，请确认客户文件税口径一致。按${last.matching_fields.join(' + ')}匹配；相同组合合并数量与金额。`;byId('rows').replaceChildren();for(const row of last.items){if(byId('onlyDifferences').checked&&row.status==='一致')continue;const tr=document.createElement('tr');if(row.status!=='一致')tr.className='different';for(const value of [row.status,row.delivery_number,row.customer_po,`${row.product_code} ${row.product_name}`,row.customer_quantity,row.erp_quantity,row.quantity_difference,row.customer_amount,row.erp_amount,row.amount_difference,row.customer_rows.join(',')]){const td=document.createElement('td');td.textContent=value;tr.append(td);}byId('rows').append(tr);}byId('errors').textContent=last.errors.length?'未核对行：'+last.errors.map(row=>`第${row.row}行 ${row.message}`).join('；'):'';}
async function run(download=false,auto=false){if(busy)return;const file=byId('file').files[0];if(!statementId||!file){byId('message').textContent='请从ERP对账单的“核对客户Excel”进入，并选择文件。';return;}busy=true;byId('check').disabled=true;byId('download').disabled=true;byId('message').textContent='正在核对…';try{const form=new FormData();form.append('file',file);form.append('output_format',download?'xlsx':'json');if(!byId('settings').hidden){form.append('sheet_name',byId('sheet').value);form.append('header_row',byId('header').value);if(!auto){const mapping={};byId('mapping').querySelectorAll('select').forEach(select=>{if(select.value!=='')mapping[select.dataset.field]=Number(select.value);});form.append('columns',JSON.stringify(mapping));}}if(download&&last)form.append('expected_version',last.statement_version);const response=await fetch(`/api/finance/statements/${statementId}/customer-check`,{method:'POST',body:form,credentials:'same-origin'});if(!response.ok){const error=await response.json();throw Error(typeof error.detail==='string'?error.detail:`核对失败（${response.status}），请检查文件或重新登录ERP`);}if(download&&response.headers.get('content-type').includes('spreadsheetml')){const url=URL.createObjectURL(await response.blob());const link=document.createElement('a');link.href=url;link.download='客户对账差异.xlsx';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);byId('message').textContent='报告已下载。';}else{const data=await response.json();settings(data);if(data.needs_mapping){last=null;byId('settings').open=true;byId('message').textContent=data.message;byId('result').hidden=true;}else{last=data;byId('context').textContent=`${data.customer_name} · ${data.statement_month} · ${data.statement_number}`;byId('message').textContent=data.complete?'核对完成。':'存在未识别行，请修正后重新核对；当前结果不完整。';render();}}}catch(error){byId('message').textContent=error.message;}finally{busy=false;byId('check').disabled=false;byId('download').disabled=!last;}}
byId('check').onclick=()=>run();byId('download').onclick=()=>run(true);byId('recognize').onclick=()=>run(false,true);byId('onlyDifferences').onchange=render;byId('file').onchange=()=>{last=null;byId('settings').hidden=true;byId('result').hidden=true;byId('download').disabled=true;};for(const id of ['sheet','header'])byId(id).onchange=()=>{last=null;byId('download').disabled=true;};
</script></body></html>
