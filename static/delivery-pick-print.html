<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>仓库找货单（出库备货）</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #111827; background: #e5e7eb; font-family: "Microsoft YaHei", "SimSun", sans-serif; }
    .toolbar { display: flex; justify-content: center; gap: 10px; padding: 14px; }
    button, a.action { border: 0; border-radius: 6px; padding: 10px 18px; color: white; background: #166534; font-size: 15px; text-decoration: none; cursor: pointer; }
    button.secondary, a.secondary { background: #475569; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .state { max-width: 760px; margin: 28px auto; padding: 18px; border: 1px solid #93c5fd; border-radius: 8px; color: #1e3a8a; background: #eff6ff; text-align: center; }
    .pages { width: 210mm; margin: 0 auto; }
    .page { position: relative; display: flex; flex-direction: column; width: 210mm; min-height: 296mm; margin: 0 auto 18px; padding: 10mm 10mm 9mm; background: white; box-shadow: 0 2px 12px #0002; page-break-after: always; }
    .page:last-child { page-break-after: auto; }
    h1 { margin: 0 0 3mm; text-align: center; font-size: 23px; letter-spacing: 5px; }
    .meta { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.5mm 7mm; margin-bottom: 3mm; font-size: 12px; line-height: 1.4; }
    .meta strong { display: inline-block; min-width: 76px; }
    .page-number { position: absolute; top: 10mm; right: 10mm; font-size: 12px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11px; }
    th, td { border: 1px solid #111827; padding: 2.2mm 1.2mm; vertical-align: middle; text-align: center; overflow-wrap: anywhere; line-height: 1.25; }
    th { background: #f3f4f6; font-weight: 700; }
    .code { width: 14%; } .location { width: 20%; text-align: left; }
    .planned { width: 8%; } .actual { width: 8%; }
    td.code { font-size: 10px; }
    .pair-start { border-left: 2px solid #111827; }
    .product-name { font-weight: 700; }
    .spec, .subtotal { margin-top: 1mm; color: #4b5563; font-size: 10px; }
    .subtotal { color: #111827; font-weight: 700; }
    .route { font-weight: 700; }
    .muted { color: #6b7280; }
    .warning { color: #b91c1c; font-weight: 700; }
    .write-line { display: block; min-height: 5mm; border-bottom: 1px solid #111827; }
    .footer { margin-top: auto; padding-top: 4mm; font-size: 12px; }
    .summary { display: flex; justify-content: space-between; gap: 10mm; margin-bottom: 5mm; }
    .signatures { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10mm; }
    .signature { min-height: 8mm; border-bottom: 1px solid #111827; }
    .notice { margin-top: 4mm; color: #4b5563; font-size: 10px; }
    [hidden] { display: none !important; }
    @page { size: A4 portrait; margin: 0; }
    @media print {
      body { background: white; }
      .toolbar, .state { display: none !important; }
      .pages { width: auto; margin: 0; }
      .page { width: 210mm; min-height: 296mm; margin: 0; box-shadow: none; break-after: page; }
      .page:last-child { break-after: auto; }
      tr { break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <nav class="toolbar">
    <button id="printButton" disabled>打印仓库找货单</button>
    <a id="differenceButton" class="action secondary" href="#" hidden>回录差异</a>
    <button class="secondary" onclick="window.close()">关闭</button>
  </nav>
  <div id="state" class="state">正在读取拿货任务和位置……</div>
  <main id="pages" class="pages" hidden></main>
  <script>
    const ROWS_PER_PAGE = 48;
    const taskId = new URLSearchParams(location.search).get("task_id");
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const displayDateTime = value => {
      const date = value ? new Date(value) : new Date();
      if (Number.isNaN(date.getTime())) return "-";
      return new Intl.DateTimeFormat("zh-CN", { timeZone:"Asia/Shanghai", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false }).format(date).replaceAll("/", "-");
    };
    async function request(url) {
      let response;
      try { response = await fetch(url, { credentials:"include", cache:"no-store" }); }
      catch (_error) { throw new Error("无法连接 ERP 服务，请检查网络后重试"); }
      const text = await response.text().catch(() => "");
      let body = {};
      if (text) { try { body = JSON.parse(text); } catch (_error) { body = {}; } }
      if (!response.ok) {
        const detail = typeof body.detail === "string" ? body.detail : body.detail?.message;
        throw new Error(detail || (response.status === 401 ? "登录已失效，请返回 ERP 登录后重新打开" : `读取失败（HTTP ${response.status}）`));
      }
      return body;
    }
    function printLocation(group, line) {
      const floor = {1:'一楼',2:'二楼',3:'三楼',4:'四楼'}[group.warehouse_floor] || (group.warehouse_floor ? `${group.warehouse_floor}楼` : '');
      if (group.address_kind === 'rack_slot' && floor && group.rack_display_name && group.level_no && group.slot_no) {
        return `${floor}-${group.rack_display_name}-${group.level_no}层-${group.slot_no}格${group.needs_relocation ? '（待归位）' : ''}`;
      }
      return group.label || line.employee_location_name || line.current_address_name || line.location_name || '位置待核对';
    }
    function buildRows(task) {
      const totals = new Map();
      const items = new Map((task.items || []).map(item => [String(item.id), item]));
      const rows = [];
      (task.location_groups || []).forEach(group => {
        [...(group.lines || [])].sort((left, right) => String(left.product_code || "").localeCompare(String(right.product_code || ""), "zh-CN")).forEach(line => {
          const itemKey = JSON.stringify([line.pick_item_id, line.component_snapshot_id, line.product_code, line.product_name, line.specification, line.unit]);
          totals.set(itemKey, (totals.get(itemKey) || 0) + Number(line.pick_quantity || 0));
          rows.push({
            itemKey,
            routeSequence: Number(group.recommended_sequence || 0),
            productCode: line.customer_inventory_code || line.product_code || "-",
            productName: line.product_name || "未命名产品",
            specification: line.specification_display || line.specification || "-",
            location: printLocation(group, line),
            quantity: Number(line.pick_quantity || 0),
            unit: line.unit || "个",
            bundleText: line.bundle_text || "每捆数量待核",
            putawayPending: !!line.putaway_pending,
            warning: line.inventory_note || (line.source_type === 'unassigned' ? '库存/位置未落实，不代表可拿货' : line.requires_attention ? '位置待核对' : ''),
            staging: items.get(String(line.pick_item_id))?.staging_required
              ? items.get(String(line.pick_item_id)).staging_area_label || '集货区待配置'
              : '',
          });
        });
      });
      const firstSeen = new Set();
      return rows.map((row, index) => {
        row.sequence = index + 1;
        row.productTotal = firstSeen.has(row.itemKey) ? null : totals.get(row.itemKey);
        firstSeen.add(row.itemKey);
        return row;
      });
    }
    function cellsHtml(row, second = false) {
      if (!row) return '<td class="pair-start"></td><td></td><td></td><td></td>';
      return `
        <td class="code${second ? ' pair-start' : ''}"><strong>${escapeHtml(row.productCode)}</strong></td>
        <td class="location"><strong>${escapeHtml(row.location)}</strong>${row.warning ? `<div class="warning">${escapeHtml(row.warning)}</div>` : ''}</td>
        <td><strong>${row.quantity} ${escapeHtml(row.unit)}</strong>${row.bundleText && row.bundleText !== '每捆数量待核' ? `<div class="spec">${escapeHtml(row.bundleText)}</div>` : ''}</td>
        <td><span class="write-line"></span></td>`;
    }
    function rowHtml(row, second) {
      return `<tr>${cellsHtml(row)}${cellsHtml(second, true)}</tr>`;
    }
    function pairedRowsHtml(rows) {
      const pairs = [];
      for (let index = 0; index < rows.length; index += 2) pairs.push(rowHtml(rows[index], rows[index + 1]));
      return pairs.join('');
    }
    function pageHtml(task, user, rows, pageIndex, pageCount, pageRows = rows.slice(pageIndex * ROWS_PER_PAGE, (pageIndex + 1) * ROWS_PER_PAGE)) {
      const totalsByUnit = new Map();
      rows.forEach(row => totalsByUnit.set(row.unit, (totalsByUnit.get(row.unit) || 0) + row.quantity));
      const totalQuantity = [...totalsByUnit].map(([unit, quantity]) => `${quantity}${unit}`).join('、');
      const printUser = user.display_name || user.real_name || user.username || "-";
      const summaryText = pageIndex === pageCount - 1
        ? `整单共 ${rows.length} 行，列示 ${escapeHtml(totalQuantity)}（含待核对）`
        : `本页 ${pageRows.length} 个位置行，整单合计见末页`;
      return `<section class="page">
        <div class="page-number">第 ${pageIndex + 1}/${pageCount} 页</div>
        <h1>仓库找货单（出库备货）</h1>
        ${rows.some(row => row.warning) ? '<div class="warning">有库存或位置待核对项，请勿按本单默认拿齐。</div>' : ''}
        <div class="meta">
          <div><strong>客户：</strong>${escapeHtml(task.customer_name || "-")}</div>
          <div><strong>拿货单号：</strong>NH-${escapeHtml(task.id)}</div>
          <div><strong>关联送货单：</strong>${escapeHtml(task.delivery_number || "-")}</div>
          <div><strong>计划送货：</strong>${escapeHtml(task.planned_delivery_date || "-")}</div>
          <div><strong>打印版本：</strong>${escapeHtml(task.print_version || task.snapshot_version || "-")}</div>
          <div><strong>打印人/时间：</strong>${escapeHtml(printUser)} / ${escapeHtml(displayDateTime())}</div>
        </div>
        <table>
          <thead><tr><th class="code">存货编码</th><th class="location">货架</th><th class="planned">数量</th><th class="actual">实际数量</th><th class="code pair-start">存货编码</th><th class="location">货架</th><th class="planned">数量</th><th class="actual">实际数量</th></tr></thead>
          <tbody>${pairedRowsHtml(pageRows)}</tbody>
        </table>
        <footer class="footer">
          <div class="summary"><span>${summaryText}</span><span>异常：________</span></div>
          <div class="signatures"><div>拿货人：<div class="signature"></div></div><div>复核人：<div class="signature"></div></div><div>异常说明：<div class="signature"></div></div></div>
          <div class="notice">本单只用于仓库找货备货，不代表已出库。纸面填写和扫码拿齐不改库存、不发货；无需再次集货确认，装车后按原流程确认发货。</div>
        </footer>
      </section>`;
    }
    async function boot() {
      const state = document.getElementById("state");
      if (!taskId || !/^\d+$/.test(taskId)) { state.textContent = "缺少有效拿货任务编号"; return; }
      try {
        const [user, task] = await Promise.all([request("/api/auth/me"), request(`/api/delivery-picks/${encodeURIComponent(taskId)}`)]);
        const rows = buildRows(task);
        if (!rows.length) throw new Error("当前任务没有可打印的拿货位置，请先核对库存分配");
        const pages = document.getElementById("pages");
        pages.hidden = false;
        await document.fonts.ready;
        const batches = [];
        let batch = [];
        for(let index = 0; index < rows.length; index += 2){
          const pair = rows.slice(index, index + 2);
          const candidate = [...batch, ...pair];
          pages.innerHTML = pageHtml(task, user, rows, 0, 1, candidate);
          const tooTall = pages.firstElementChild.getBoundingClientRect().height > 296 * 96 / 25.4 + 1;
          if(batch.length && (tooTall || candidate.length > ROWS_PER_PAGE)){batches.push(batch);batch=pair;}
          else if(tooTall){throw Error("明细超过A4可打印高度，请核对存货编码或位置说明");}
          else batch=candidate;
        }
        if(batch.length)batches.push(batch);
        const pageCount = batches.length;
        pages.innerHTML = batches.map((batch,index)=>pageHtml(task,user,rows,index,pageCount,batch)).join("");
        if ([...pages.children].some(page => page.getBoundingClientRect().height > 296 * 96 / 25.4 + 1)) {
          pages.hidden = true;
          throw Error("明细超过A4可打印高度，请核对存货编码或位置说明");
        }
        state.hidden = true;
        const differenceButton = document.getElementById("differenceButton");
        differenceButton.href = `/mobile/delivery-pick.html?task_id=${encodeURIComponent(task.id)}&print_version=${encodeURIComponent(task.print_version)}`;
        differenceButton.hidden = false;
        document.getElementById("printButton").disabled = false;
      } catch (error) { state.textContent = error.message || "拿货单读取失败"; }
    }
    document.getElementById("printButton").addEventListener("click", () => window.print());
    boot();
  </script>
</body>
</html>
