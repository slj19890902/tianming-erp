<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/static/assets/time-utils.js?v=95c91f9ded41"></script>
  <title>送货单打印</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --paper-width: 241mm;
      --paper-height: 139.5mm;
      --content-safe-width: 215mm;
    }
    body {
      margin: 0;
      background: #eef1f4;
      color: #111;
      font-family: "Microsoft YaHei", "SimSun", sans-serif;
    }
    .toolbar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px;
    }
    .toolbar button, .toolbar a {
      min-width: 120px;
      border: 0;
      border-radius: 6px;
      padding: 11px 20px;
      background: #1d4ed8;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      text-align: center;
      text-decoration: none;
    }
    .toolbar button.secondary { background: #475569; }
    .toolbar button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }
    .hidden { display: none !important; }
    .load-state {
      max-width: 700px;
      margin: 30px auto;
      padding: 18px 24px;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      background: #eff6ff;
      color: #1e3a8a;
      text-align: center;
    }
    .print-guide {
      max-width: 920px;
      margin: -6px auto 14px;
      padding: 9px 12px;
      border: 1px solid #f59e0b;
      border-radius: 6px;
      background: #fffbeb;
      color: #92400e;
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
    }
    .sheet {
      position: relative;
      display: flex;
      flex-direction: column;
      width: var(--paper-width);
      height: calc(var(--paper-height) - 0.5mm);
      margin: 0 auto 24px;
      padding: 4mm 0;
      background: #fff;
      box-shadow: 0 2px 14px rgba(0,0,0,.12);
      overflow: hidden;
    }
    .sheets {
      width: var(--paper-width);
      margin: 0 auto;
    }
    .print-safe-area {
      display: flex;
      flex-direction: column;
      width: var(--content-safe-width);
      max-width: calc(100% - 12mm);
      height: 100%;
      margin: 0 auto;
      min-width: 0;
    }
    .page-number {
      font-size: 11px;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }
    .company {
      margin: 0;
      text-align: center;
      font-family: "SimSun", serif;
      font-size: 21px;
      letter-spacing: 2px;
    }
    .document-title {
      margin: 2px 0 4px;
      text-align: center;
      font-family: "SimSun", serif;
      font-size: 18px;
      letter-spacing: 7px;
    }
    .factory-address {
      padding-bottom: 2px;
      text-align: center;
      font-size: 11px;
    }
    .meta {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 2px 18px;
      padding: 2px 0 4px;
      font-size: 12px;
      line-height: 1.35;
    }
    .meta-row {
      display: grid;
      grid-template-columns: 62px 1fr;
      min-width: 0;
    }
    .meta-value {
      min-height: 17px;
      overflow-wrap: anywhere;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #111;
      padding: 2px 3px;
      text-align: center;
      vertical-align: middle;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.25;
    }
    th { font-weight: 700; }
    .product-code { font-size: 12px; }
    .sequence { width: 5%; }
    .product-name { text-align: left; overflow-wrap: anywhere; }
    .product-name.long-name { font-size: 12px; line-height: 1.18; }
    .product-specification { color: #222; font-size: 13px; line-height: 1.2; }
    .item-remark { font-size: 12px; }
    .component-line td { background: #fafafa; }
    .component-line .product-name { padding-left: 10px; }
    .component-marker { font-size: 10px; font-weight: 700; white-space: nowrap; }
    .total {
      padding: 3px 2px 2px;
      text-align: right;
      font-size: 13px;
      font-weight: 700;
    }
    .remark-notes {
      margin-top: 2px;
      padding: 2px 0;
      font-size: 12px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .remark-note { white-space: pre-wrap; }
    .remark-note + .remark-note { margin-top: 2px; }
    .print-footer {
      margin-top: auto;
    }
    .signatures {
      display: grid;
      grid-template-columns: 1fr 1.8fr;
      gap: 18px;
      align-items: end;
      padding-top: 4px;
      font-size: 11px;
    }
    .signature-line {
      display: inline-block;
      width: calc(100% - 70px);
      min-width: 50px;
    }
    .receiver-signature .signature-line {
      border-bottom: 1px solid #111;
    }
    .footer-meta {
      display: grid;
      grid-template-columns: 38mm minmax(0, 1fr);
      gap: 6mm;
      align-items: end;
      margin-top: 3px;
      font-size: 10px;
    }
    .footer-detail {
      min-width: 0;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .error {
      margin: 30px auto;
      max-width: 700px;
      padding: 24px;
      border: 1px solid #dc2626;
      background: #fff;
      color: #991b1b;
      text-align: center;
    }
    @page {
      /* 物理方向沿用实际打印电脑的驱动，避免浏览器再次旋转 90°。 */
      size: auto;
      margin: 0;
    }
    @media print {
      body { background: #fff; }
      html, body {
        width: var(--paper-width);
        margin: 0;
        padding: 0;
      }
      .no-print { display: none !important; }
      .sheets {
        width: var(--paper-width);
        margin: 0;
        padding: 0;
      }
      .sheet {
        width: var(--paper-width);
        height: calc(var(--paper-height) - 0.5mm);
        margin: 0;
        padding: 4mm 0;
        box-shadow: none;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .sheet:not(:last-child) {
        break-after: page;
        page-break-after: always;
      }
      .sheet:last-child {
        break-after: auto;
        page-break-after: auto;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <button id="printButton" disabled type="button">确认打印</button>
    <button id="retryButton" class="secondary hidden" type="button">重新读取</button>
    <a href="/" aria-label="返回系统">返回系统</a>
  </div>

  <div id="loadState" class="load-state no-print">正在读取送货单…</div>
  <div id="errorBox" class="error no-print" hidden></div>

  <template id="sheetTemplate">
  <main class="sheet">
    <div class="print-safe-area">
    <h1 data-field="senderCompanyName" class="company">苏州天明包装有限公司</h1>
    <h2 class="document-title">送货单</h2>
    <div data-field="senderContact" class="factory-address">地址：苏州市吴中区临湖镇浦庄大道工业区　电话：0512-66530018</div>

    <section class="meta">
      <div class="meta-row"><span>客户名称：</span><span data-field="customerName" class="meta-value"></span></div>
      <div class="meta-row"><span>送货单号：</span><span data-field="deliveryNumber" class="meta-value"></span></div>
      <div class="meta-row"><span>联系电话：</span><span data-field="customerPhone" class="meta-value"></span></div>
      <div class="meta-row"><span>送货日期：</span><span data-field="deliveryDate" class="meta-value"></span></div>
      <div class="meta-row"><span>客户地址：</span><span data-field="customerAddress" class="meta-value"></span></div>
      <div class="meta-row"><span>车牌号码：</span><span data-field="vehicleNumber" class="meta-value"></span></div>
    </section>

    <table>
      <colgroup>
        <col style="width:5%">
        <col style="width:14%">
        <col style="width:13%">
        <col style="width:25%">
        <col style="width:15%">
        <col style="width:5%">
        <col style="width:8%">
        <col style="width:15%">
      </colgroup>
      <thead>
        <tr>
          <th>序号</th>
          <th>客户单号</th>
          <th>款号</th>
          <th>产品名称</th>
          <th>规格（mm）</th>
          <th>单位</th>
          <th>数量</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody data-field="itemRows"></tbody>
    </table>

    <footer class="print-footer">
      <div class="total">本页数量：<span data-field="pageQuantity"></span>　总数：<span data-field="totalQuantity"></span></div>
      <section data-field="remarkNotes" class="remark-notes" hidden>
        <strong>备注说明：</strong>
        <div data-field="remarkNoteItems"></div>
      </section>
      <section class="signatures">
        <div class="signature-item sender-signature">送货人：</div>
        <div class="signature-item receiver-signature">收货单位(签章)：<span class="signature-line"></span></div>
      </section>
      <div class="footer-meta">
        <div class="page-number" data-field="pageNumber"></div>
        <div class="footer-detail">开单时间：<span data-field="createdAt"></span>　白联存档　红联客户　黄联回单</div>
      </div>
    </footer>
    </div>
  </main>
  </template>
  <div id="sheets" class="sheets" hidden></div>

  <script>
    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const getField = (sheet, name) => sheet.querySelector(`[data-field="${name}"]`);

    function createSheet() {
      return document.getElementById("sheetTemplate").content.firstElementChild.cloneNode(true);
    }

    function applyPrintProfile(settings = {}) {
      const widthValue = settings.paper_width_mm;
      const heightValue = settings.paper_height_mm;
      const width = Number(widthValue);
      const height = Number(heightValue);
      const safeWidth = Number.isFinite(width) && width >= 100 && width <= 400 ? width : 241;
      const safeHeight = Number.isFinite(height) && height >= 80 && height <= 400 ? height : 139.5;
      const printerModel = String(settings.printer_model || "EPSON SK820").trim() || "EPSON SK820";
      document.documentElement.style.setProperty("--paper-width", `${safeWidth}mm`);
      document.documentElement.style.setProperty("--paper-height", `${safeHeight}mm`);
      document.documentElement.dataset.printerModel = printerModel;
      document.documentElement.dataset.orientationMode = "driver_managed";

    }

    async function loadPaperSettings() {
      try {
        const response = await fetch("/api/system/delivery-print-settings", {
          credentials: "same-origin",
        });
        if (!response.ok) throw new Error("读取纸张设置失败");
        const settings = await response.json();
        applyPrintProfile(settings);
      } catch (_error) {
        applyPrintProfile({
          printer_model: "EPSON SK820",
          orientation_mode: "driver_managed",
          paper_width_mm: 241,
          paper_height_mm: 139.5,
        });
      }
    }

    function normalizeComponentPrintLine(component, parentItem = {}) {
      return {
        customer_po: component.customer_po ?? parentItem.customer_po ?? "",
        product_code: component.product_code ?? component.component_code ?? "",
        product_name: component.product_name ?? component.component_name ?? "未命名组件",
        specification: component.specification ?? parentItem.specification ?? "",
        unit: component.unit || parentItem.unit || "PCS",
        quantity: component.quantity
          ?? component.planned_delivery_quantity
          ?? component.delivered_quantity
          ?? 0,
        remarks: component.remarks || "",
        pricing_included: false,
        is_component_line: true,
      };
    }

    function normalizeDeliveryPrintItems(data) {
      if (Array.isArray(data.actual_goods_items) && data.actual_goods_items.length) {
        return data.actual_goods_items.map((item) => ({
          ...item,
          pricing_included: item.pricing_included !== false,
          is_component_line: (
            item.line_type === "component" || item.pricing_included === false
          ),
        }));
      }
      const normalized = [];
      let hasNestedComponents = false;
      (data.items || []).forEach((item) => {
        normalized.push({
          ...item,
          pricing_included: item.pricing_included !== false,
          is_component_line: item.is_component_line === true,
        });
        const components = Array.isArray(item.component_lines)
          ? item.component_lines.filter(component => component?.show_on_delivery !== false)
          : [];
        if (components.length) hasNestedComponents = true;
        components.forEach((component) => {
          normalized.push(normalizeComponentPrintLine(component, item));
        });
      });
      if (!hasNestedComponents && Array.isArray(data.component_lines)) {
        data.component_lines.filter(component => component?.show_on_delivery !== false).forEach((component) => {
          normalized.push(normalizeComponentPrintLine(component));
        });
      }
      return normalized;
    }

    function populateSheet(sheet, data, entries, pageNumber, totalPages) {
      const sender = data.sender || {};
      const senderParts = [];
      if (sender.address) senderParts.push(`地址：${sender.address}`);
      if (sender.phone) senderParts.push(`电话：${sender.phone}`);
      if (sender.fax) senderParts.push(`传真：${sender.fax}`);
      if (sender.company_name) getField(sheet, "senderCompanyName").textContent = sender.company_name;
      if (senderParts.length) getField(sheet, "senderContact").textContent = senderParts.join("　");
      getField(sheet, "pageNumber").textContent = `${pageNumber}/${totalPages}页`;
      getField(sheet, "customerName").textContent = data.customer?.name || "";
      getField(sheet, "customerPhone").textContent = data.customer?.phone || "";
      getField(sheet, "customerAddress").textContent = data.customer?.address || "";
      getField(sheet, "deliveryNumber").textContent = data.delivery_number || "";
      getField(sheet, "deliveryDate").textContent = data.delivery_date || "";
      getField(sheet, "vehicleNumber").textContent = data.vehicle_number || "";
      getField(sheet, "totalQuantity").textContent = data.total_actual_goods_quantity ?? data.total_quantity ?? 0;
      getField(sheet, "createdAt").textContent = data.created_at
        ? TmTime.formatBeijingDateTime(data.created_at)
        : "";
      getField(sheet, "pageQuantity").textContent = entries.reduce(
        (total, entry) => total + (Number(entry.item.quantity) || 0),
        0,
      );
      getField(sheet, "itemRows").innerHTML = entries.map((entry) => {
        const item = entry.item;
        const productName = String(item.product_name || "").trim() || "产品名称未登记";
        const specification = String(item.specification || "").replace(/(?:mm|毫米)/gi, "").trim();
        const customerRemark = String(item.remarks || "").trim();
        const tableRemark = customerRemark.length > 12 ? "详见备注说明" : customerRemark;
        const longNameClass = productName.length > 28 ? " long-name" : "";
        const rowClass = item.is_component_line ? ' class="component-line"' : "";
        const componentMarker = item.is_component_line
          ? '<span class="component-marker">套内子件</span> '
          : "";
        return `<tr${rowClass}>
          <td class="sequence">${entry.index + 1}</td>
          <td>${escapeHtml(item.customer_po)}</td>
          <td class="product-code">${escapeHtml(item.product_code)}</td>
          <td class="product-name${longNameClass}">${componentMarker}${escapeHtml(productName)}</td>
          <td class="product-specification">${escapeHtml(specification)}</td>
          <td>${escapeHtml(item.unit)}</td>
          <td>${escapeHtml(item.quantity)}</td>
          <td class="item-remark">${escapeHtml(tableRemark)}</td>
        </tr>`;
      }).join("");
      const remarkNotes = entries
        .map((entry) => {
          const customerRemark = String(entry.item.remarks || "").trim();
          return {
            index: entry.index + 1,
            text: customerRemark,
          };
        })
        .filter((entry) => entry.text);
      if (remarkNotes.length) {
        getField(sheet, "remarkNoteItems").innerHTML = remarkNotes
          .map((entry) => `<div class="remark-note">${entry.index}. ${escapeHtml(entry.text)}</div>`)
          .join("");
        getField(sheet, "remarkNotes").hidden = false;
      }
    }

    function renderDelivery(data) {
      const container = document.getElementById("sheets");
      const normalizedItems = normalizeDeliveryPrintItems(data);
      const entries = normalizedItems.map((item, index) => ({ item, index }));
      const actualGoodsTotalQuantity = normalizedItems.reduce(
        (total, item) => total + (Number(item.quantity) || 0),
        0,
      );
      const printData = {
        ...data,
        total_actual_goods_quantity: actualGoodsTotalQuantity,
      };
      const pages = [];
      let currentPage = [];
      container.hidden = false;
      container.style.visibility = "hidden";
      container.innerHTML = "";
      const pageFits = (candidateEntries) => {
        const probe = createSheet();
        populateSheet(probe, printData, candidateEntries, 1, 1);
        container.appendChild(probe);
        const safeArea = probe.querySelector(".print-safe-area");
        const fits = safeArea.scrollHeight <= safeArea.clientHeight + 1;
        probe.remove();
        return fits;
      };
      entries.forEach((entry) => {
        if (!pageFits([entry])) {
          throw new Error(
            `第${entry.index + 1}行产品名称或备注过长，当前纸张高度无法完整打印。请缩短内容或在系统备份中增加纸张高度后重试。`,
          );
        }
        const candidate = [...currentPage, entry];
        if (currentPage.length && !pageFits(candidate)) {
          pages.push(currentPage);
          currentPage = [entry];
        } else {
          currentPage = candidate;
        }
      });
      if (currentPage.length || !pages.length) pages.push(currentPage);
      container.innerHTML = "";
      pages.forEach((pageEntries, index) => {
        const sheet = createSheet();
        populateSheet(sheet, printData, pageEntries, index + 1, pages.length);
        container.appendChild(sheet);
      });
      container.style.visibility = "visible";
    }

    const printButton = document.getElementById("printButton");
    const retryButton = document.getElementById("retryButton");
    const loadState = document.getElementById("loadState");
    const errorBox = document.getElementById("errorBox");
    const sheets = document.getElementById("sheets");
    let loadController = null;
    let loadGeneration = 0;

    function parseErrorDetail(detail) {
      if (typeof detail === "string") return detail.trim();
      if (Array.isArray(detail)) {
        return detail.map((item) => parseErrorDetail(item)).filter(Boolean).join("；");
      }
      if (!detail || typeof detail !== "object") return "";
      const message = parseErrorDetail(
        detail.message ?? detail.detail ?? detail.error ?? detail.msg,
      );
      const code = String(detail.code || "").trim();
      return [message, code ? `错误代码 ${code}` : ""].filter(Boolean).join("；");
    }

    function requestIdOf(response, body) {
      const headerValue = response?.headers?.get?.("x-request-id")
        || response?.headers?.get?.("x-correlation-id")
        || "";
      return String(headerValue || body?.request_id || body?.requestId || "").trim();
    }

    async function requestDeliveryPrint(id, signal) {
      const response = await fetch(`/api/deliveries/${id}/print`, {
        credentials: "same-origin",
        signal,
      });
      const raw = await response.text();
      let body = null;
      if (raw.trim()) {
        try { body = JSON.parse(raw); } catch (_error) { body = null; }
      }
      if (response.status === 401) {
        throw new Error("登录已失效，请返回系统登录后重新打印。HTTP 401");
      }
      if (!response.ok) {
        const detail = parseErrorDetail(body?.detail ?? body?.message ?? body?.error);
        const requestId = requestIdOf(response, body);
        const fallback = response.status >= 500
          ? "服务器内部错误，送货单未能读取。"
          : "读取送货单失败。";
        throw new Error([
          detail || fallback,
          `HTTP ${response.status}`,
          requestId ? `请求编号 ${requestId}` : "",
        ].filter(Boolean).join("；"));
      }
      if (!body || typeof body !== "object") {
        throw new Error("服务器返回了空白或无法识别的送货单内容；HTTP 200");
      }
      return body;
    }

    function showLoading(message = "正在读取送货单…") {
      printButton.disabled = true;
      retryButton.classList.add("hidden");
      retryButton.hidden = true;
      errorBox.hidden = true;
      loadState.textContent = message;
      loadState.hidden = false;
      sheets.hidden = true;
    }

    function showError(message, allowRetry = true) {
      printButton.disabled = true;
      loadState.hidden = true;
      errorBox.textContent = message;
      errorBox.hidden = false;
      retryButton.hidden = !allowRetry;
      retryButton.classList.toggle("hidden", !allowRetry);
      sheets.hidden = true;
    }

    function showReady() {
      loadState.hidden = true;
      errorBox.hidden = true;
      retryButton.hidden = true;
      retryButton.classList.add("hidden");
      sheets.hidden = false;
      printButton.disabled = false;
    }

    async function loadDelivery() {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id || !/^\d+$/.test(id)) {
        showError("送货单链接无效，请返回 ERP 重新打开。", false);
        return false;
      }
      if (loadController) loadController.abort();
      const controller = new AbortController();
      loadController = controller;
      const generation = ++loadGeneration;
      showLoading("正在读取送货单…");
      try {
        const data = await requestDeliveryPrint(id, controller.signal);
        if (generation !== loadGeneration || controller.signal.aborted) return false;
        renderDelivery(data);
        showReady();
        return true;
      } catch (error) {
        if (generation !== loadGeneration || controller.signal.aborted || error?.name === "AbortError") {
          return false;
        }
        const message = error instanceof TypeError
          ? "无法连接 ERP 服务，请确认服务正常后点击“重新读取”。"
          : (error?.message || "读取送货单失败，请点击“重新读取”。");
        showError(message, true);
        return false;
      } finally {
        if (generation === loadGeneration) loadController = null;
      }
    }

    const printOpenParams = new URLSearchParams(window.location.search);
    const printOpenToken = printOpenParams.get("open_token") || "";
    const deferDeliveryLoad = printOpenParams.get("defer") === "1";
    const printOpenChannel = printOpenToken && typeof BroadcastChannel === "function"
      ? new BroadcastChannel(`erp-delivery-print-${printOpenToken}`)
      : null;
    const startDeliveryPrint = async () => {
      showLoading("正在读取送货单纸张设置…");
      await loadPaperSettings();
      return loadDelivery();
    };

    if (printOpenChannel) {
      printOpenChannel.onmessage = (event) => {
        if (event?.data?.type === "activate") {
          printOpenChannel.close();
          startDeliveryPrint();
        } else if (event?.data?.type === "abort") {
          printOpenChannel.close();
          loadGeneration += 1;
          if (loadController) loadController.abort();
          showError(event?.data?.message || "送货单处理失败，未打开打印内容。", false);
        }
      };
      printOpenChannel.postMessage({ type: "ready" });
    }

    printButton.addEventListener("click", () => {
      if (!printButton.disabled) window.print();
    });
    retryButton.addEventListener("click", () => loadDelivery());
    if (deferDeliveryLoad) {
      showLoading("等待发货确认，完成后自动读取送货单…");
    } else {
      startDeliveryPrint();
    }
  </script>
</body>
</html>
