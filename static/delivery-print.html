<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/static/assets/time-utils.js"></script>
  <script src="/static/assets/print-template-editor.js"></script>
  <title>送货单打印</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --paper-width: 241mm;
      --paper-height: 139.5mm;
    }
    body {
      margin: 0;
      background: #eef1f4;
      color: #111;
      font-family: "Microsoft YaHei", "SimSun", sans-serif;
    }
    .toolbar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px;
    }
    .toolbar button, .toolbar a {
      min-width: 120px;
      border: 0;
      border-radius: 6px;
      padding: 11px 20px;
      background: #1d4ed8;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      text-align: center;
      text-decoration: none;
    }
    .sheet {
      position: relative;
      width: var(--paper-width);
      height: var(--paper-height);
      margin: 0 auto 24px;
      padding: 5mm 6mm;
      background: #fff;
      box-shadow: 0 2px 14px rgba(0,0,0,.12);
      overflow: hidden;
    }
    .page-number {
      position: absolute;
      top: 5mm;
      right: 6mm;
      font-size: 10px;
      font-weight: 700;
    }
    .company {
      margin: 0;
      text-align: center;
      font-family: "SimSun", serif;
      font-size: 20px;
      letter-spacing: 2px;
    }
    .document-title {
      margin: 2px 0 4px;
      text-align: center;
      font-family: "SimSun", serif;
      font-size: 17px;
      letter-spacing: 7px;
    }
    .factory-address {
      padding-bottom: 4px;
      border-bottom: 2px solid #111;
      text-align: center;
      font-size: 10px;
    }
    .meta {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 2px 18px;
      padding: 4px 0;
      font-size: 11px;
      line-height: 1.35;
    }
    .meta-row {
      display: grid;
      grid-template-columns: 62px 1fr;
      min-width: 0;
    }
    .meta-value {
      min-height: 17px;
      border-bottom: 1px solid #555;
      overflow-wrap: anywhere;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 11px;
    }
    th, td {
      border: 1px solid #111;
      padding: 2px 3px;
      text-align: center;
      vertical-align: middle;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.25;
    }
    th { font-weight: 700; }
    .product-code { font-size: 10px; }
    .sequence { width: 5%; }
    .product-name { text-align: left; overflow-wrap: anywhere; }
    .product-name.long-name { font-size: 10px; line-height: 1.18; }
    .item-remark { font-size: 10px; }
    .total {
      padding: 4px 2px 3px;
      text-align: right;
      font-size: 12px;
      font-weight: 700;
    }
    .copies {
      padding: 3px 0;
      border-top: 1px solid #111;
      border-bottom: 1px solid #111;
      text-align: center;
      font-size: 10px;
      word-spacing: 8px;
    }
    .remark-notes {
      margin-top: 4px;
      padding: 3px 0;
      border-top: 1px solid #111;
      font-size: 10px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .remark-note + .remark-note { margin-top: 2px; }
    .signatures {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      gap: 14px;
      padding-top: 7px;
      font-size: 10px;
    }
    .signature-line {
      display: inline-block;
      width: calc(100% - 70px);
      min-width: 50px;
      border-bottom: 1px solid #111;
    }
    .opened-at {
      margin-top: 6px;
      text-align: right;
      font-size: 9px;
    }
    .error {
      margin: 30px auto;
      max-width: 700px;
      padding: 24px;
      border: 1px solid #dc2626;
      background: #fff;
      color: #991b1b;
      text-align: center;
    }
    @page {
      size: 241mm 139.5mm;
      margin: 0;
    }
    @media print {
      body { background: #fff; }
      html, body { width: var(--paper-width); min-height: var(--paper-height); }
      .no-print { display: none !important; }
      .sheet {
        width: var(--paper-width);
        height: var(--paper-height);
        margin: 0;
        padding: 5mm 6mm;
        box-shadow: none;
        break-after: page;
        page-break-after: always;
      }
      .sheet:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body>
  <div id="printTemplateToolbar" class="toolbar no-print">
    <button id="printButton" type="button">确认打印</button>
    <a href="/" aria-label="返回系统">返回系统</a>
  </div>

  <div id="errorBox" class="error" hidden></div>

  <template id="sheetTemplate">
  <main class="sheet">
    <div class="page-number" data-field="pageNumber"></div>
    <h1 data-field="senderCompanyName" class="company">苏州天明包装有限公司</h1>
    <h2 class="document-title" data-print-edit-key="document_title">送货单</h2>
    <div data-field="senderContact" class="factory-address">
      <span data-field="senderAddressPart"><span data-print-edit-key="address_label">地址：</span><span data-field="senderAddress">苏州市吴中区临湖镇浦庄大道工业区</span></span>
      <span data-field="senderPhonePart">　<span data-print-edit-key="phone_label">电话：</span><span data-field="senderPhone">0512-66530018</span></span>
      <span data-field="senderFaxPart" hidden>　<span data-print-edit-key="fax_label">传真：</span><span data-field="senderFax"></span></span>
    </div>

    <section class="meta">
      <div class="meta-row"><span data-print-edit-key="customer_name_label">客户名称：</span><span data-field="customerName" class="meta-value"></span></div>
      <div class="meta-row"><span data-print-edit-key="delivery_number_label">送货单号：</span><span data-field="deliveryNumber" class="meta-value"></span></div>
      <div class="meta-row"><span data-print-edit-key="customer_phone_label">联系电话：</span><span data-field="customerPhone" class="meta-value"></span></div>
      <div class="meta-row"><span data-print-edit-key="delivery_date_label">送货日期：</span><span data-field="deliveryDate" class="meta-value"></span></div>
      <div class="meta-row"><span data-print-edit-key="customer_address_label">客户地址：</span><span data-field="customerAddress" class="meta-value"></span></div>
      <div class="meta-row"><span data-print-edit-key="vehicle_number_label">车牌号码：</span><span data-field="vehicleNumber" class="meta-value"></span></div>
    </section>

    <table>
      <colgroup>
        <col style="width:5%">
        <col style="width:16%">
        <col style="width:15%">
        <col style="width:30%">
        <col style="width:7%">
        <col style="width:9%">
        <col style="width:18%">
      </colgroup>
      <thead>
        <!-- 兼容离线包静态检查的系统原版锚点：<th>序号</th> <th>单位</th> -->
        <tr>
          <th data-print-edit-key="column_sequence">序号</th>
          <th data-print-edit-key="column_customer_po">客户单号</th>
          <th data-print-edit-key="column_product_code">款号</th>
          <th data-print-edit-key="column_product_name">产品名称</th>
          <th data-print-edit-key="column_unit">单位</th>
          <th data-print-edit-key="column_quantity">数量</th>
          <th data-print-edit-key="column_remarks">备注</th>
        </tr>
      </thead>
      <tbody data-field="itemRows"></tbody>
    </table>

    <span data-field="longRemarkPlaceholder" data-print-edit-key="long_remark_placeholder" hidden>详见备注说明</span>
    <div class="total"><span data-print-edit-key="page_quantity_label">本页数量：</span><span data-field="pageQuantity"></span>　<span data-print-edit-key="total_quantity_label">送货总量：</span><span data-field="totalQuantity"></span></div>
    <section data-field="remarkNotes" class="remark-notes" hidden>
      <strong data-print-edit-key="remark_notes_label">备注说明：</strong>
      <div data-field="remarkNoteItems"></div>
    </section>
    <div class="copies" data-print-edit-key="copies_text">白联:存档　红联:客户　黄联:回单</div>
    <section class="signatures">
      <div><span data-print-edit-key="delivery_person_label">送货人：</span><span class="signature-line"></span></div>
      <div><span data-print-edit-key="receiving_unit_label">收货单位(签章)：</span><span class="signature-line"></span></div>
      <div><span data-print-edit-key="handler_label">经手人：</span><span class="signature-line"></span></div>
    </section>
    <div class="opened-at"><span data-print-edit-key="created_at_label">开单时间：</span><span data-field="createdAt"></span></div>
  </main>
  </template>
  <div id="sheets" class="sheets" hidden></div>

  <script>
    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const getField = (sheet, name) => sheet.querySelector(`[data-field="${name}"]`);
    let currentDeliveryData = null;
    let deliveryPrintEditor = null;

    function createSheet() {
      const sheet = document.getElementById("sheetTemplate").content.firstElementChild.cloneNode(true);
      if (deliveryPrintEditor) deliveryPrintEditor.applyTo(sheet);
      return sheet;
    }

    function applyPaperSize(widthValue, heightValue) {
      const width = Number(widthValue);
      const height = Number(heightValue);
      const safeWidth = Number.isFinite(width) && width >= 100 && width <= 400 ? width : 241;
      const safeHeight = Number.isFinite(height) && height >= 80 && height <= 400 ? height : 139.5;
      document.documentElement.style.setProperty("--paper-width", `${safeWidth}mm`);
      document.documentElement.style.setProperty("--paper-height", `${safeHeight}mm`);
      let pageStyle = document.getElementById("dynamicPageSize");
      if (!pageStyle) {
        pageStyle = document.createElement("style");
        pageStyle.id = "dynamicPageSize";
        document.head.appendChild(pageStyle);
      }
      pageStyle.textContent = `@page { size: ${safeWidth}mm ${safeHeight}mm; margin: 0; }`;
    }

    async function loadPaperSettings() {
      try {
        const response = await fetch("/api/system/delivery-print-settings", {
          credentials: "same-origin",
        });
        if (!response.ok) throw new Error("读取纸张设置失败");
        const settings = await response.json();
        applyPaperSize(settings.paper_width_mm, settings.paper_height_mm);
      } catch (_error) {
        applyPaperSize(241, 139.5);
      }
    }

    function populateSheet(sheet, data, entries, pageNumber, totalPages) {
      const sender = data.sender || {};
      if (sender.company_name) getField(sheet, "senderCompanyName").textContent = sender.company_name;
      if (sender.address || sender.phone || sender.fax) {
        getField(sheet, "senderAddress").textContent = sender.address || "";
        getField(sheet, "senderAddressPart").hidden = !sender.address;
        getField(sheet, "senderPhone").textContent = sender.phone || "";
        getField(sheet, "senderPhonePart").hidden = !sender.phone;
        getField(sheet, "senderFax").textContent = sender.fax || "";
        getField(sheet, "senderFaxPart").hidden = !sender.fax;
      }
      getField(sheet, "pageNumber").textContent = `${pageNumber}/${totalPages}页`;
      getField(sheet, "customerName").textContent = data.customer?.name || "";
      getField(sheet, "customerPhone").textContent = data.customer?.phone || "";
      getField(sheet, "customerAddress").textContent = data.customer?.address || "";
      getField(sheet, "deliveryNumber").textContent = data.delivery_number || "";
      getField(sheet, "deliveryDate").textContent = data.delivery_date || "";
      getField(sheet, "vehicleNumber").textContent = data.vehicle_number || "";
      getField(sheet, "totalQuantity").textContent = data.total_quantity ?? 0;
      getField(sheet, "createdAt").textContent = data.created_at
        ? TmTime.formatBeijingDateTime(data.created_at)
        : "";
      getField(sheet, "pageQuantity").textContent = entries.reduce(
        (total, entry) => total + (Number(entry.item.quantity) || 0),
        0,
      );
      getField(sheet, "itemRows").innerHTML = entries.map((entry) => {
        const item = entry.item;
        const productName = String(item.product_name || "").trim();
        const customerRemark = String(item.remarks || "").trim();
        const hasLongRemark = customerRemark.length > 12;
        const tableRemark = customerRemark.length > 12
          ? (deliveryPrintEditor?.value().fields.long_remark_placeholder
            || getField(sheet, "longRemarkPlaceholder").textContent)
          : customerRemark;
        const longNameClass = productName.length > 28 ? " long-name" : "";
        return `<tr>
          <td class="sequence">${entry.index + 1}</td>
          <td>${escapeHtml(item.customer_po)}</td>
          <td class="product-code">${escapeHtml(item.product_code)}</td>
          <td class="product-name${longNameClass}">${escapeHtml(productName)}</td>
          <td>${escapeHtml(item.unit)}</td>
          <td>${escapeHtml(item.quantity)}</td>
          <td class="item-remark"${hasLongRemark ? ' data-print-edit-key="long_remark_placeholder"' : ""}>${escapeHtml(tableRemark)}</td>
        </tr>`;
      }).join("");
      const remarkNotes = entries
        .map((entry) => ({ index: entry.index + 1, text: String(entry.item.remarks || "").trim() }))
        .filter((entry) => entry.text);
      if (remarkNotes.length) {
        getField(sheet, "remarkNoteItems").innerHTML = remarkNotes
          .map((entry) => `<div class="remark-note">${entry.index}. ${escapeHtml(entry.text)}</div>`)
          .join("");
        getField(sheet, "remarkNotes").hidden = false;
      }
    }

    function renderDelivery(data) {
      const container = document.getElementById("sheets");
      const entries = (data.items || []).map((item, index) => ({ item, index }));
      const pages = [];
      let currentPage = [];
      container.hidden = false;
      container.style.visibility = "hidden";
      container.innerHTML = "";
      const pageFits = (candidateEntries) => {
        const probe = createSheet();
        populateSheet(probe, data, candidateEntries, 1, 1);
        container.appendChild(probe);
        const fits = probe.scrollHeight <= probe.clientHeight + 1;
        probe.remove();
        return fits;
      };
      entries.forEach((entry) => {
        if (!pageFits([entry])) {
          throw new Error(
            `第${entry.index + 1}行产品名称或备注过长，当前纸张高度无法完整打印。请缩短内容或在系统备份中增加纸张高度后重试。`,
          );
        }
        const candidate = [...currentPage, entry];
        if (currentPage.length && !pageFits(candidate)) {
          pages.push(currentPage);
          currentPage = [entry];
        } else {
          currentPage = candidate;
        }
      });
      if (currentPage.length || !pages.length) pages.push(currentPage);
      container.innerHTML = "";
      pages.forEach((pageEntries, index) => {
        const sheet = createSheet();
        populateSheet(sheet, data, pageEntries, index + 1, pages.length);
        container.appendChild(sheet);
      });
      if (deliveryPrintEditor) deliveryPrintEditor.applyTo(container);
      container.style.visibility = "visible";
      const errorBox = document.getElementById("errorBox");
      errorBox.textContent = "";
      errorBox.hidden = true;
    }

    async function initializePrintEditor() {
      const printButton = document.getElementById("printButton");
      if (!window.PrintTemplateEditor) {
        printButton.addEventListener("click", () => window.print());
        return;
      }
      try {
        deliveryPrintEditor = PrintTemplateEditor.create({
          templateKey: "delivery_note",
          root: document.getElementById("sheets"),
          toolbar: document.getElementById("printTemplateToolbar"),
          printButton,
          onApplied: () => {
            if (currentDeliveryData) renderDelivery(currentDeliveryData);
          },
          onBeforePrint: () => {
            if (currentDeliveryData) renderDelivery(currentDeliveryData);
          },
          onPrint: () => {
            if (currentDeliveryData) renderDelivery(currentDeliveryData);
            window.print();
          },
        });
        await deliveryPrintEditor.ready;
      } catch (error) {
        console.error("送货单打印模板编辑器加载失败", error);
        deliveryPrintEditor = null;
        printButton.addEventListener("click", () => window.print(), { once: false });
      }
    }

    function showError(message) {
      document.getElementById("errorBox").textContent = message;
      document.getElementById("errorBox").hidden = false;
      document.getElementById("sheets").hidden = true;
    }

    async function loadDelivery() {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id || !/^\d+$/.test(id)) {
        showError("缺少有效的送货单 ID。");
        return;
      }
      try {
        const response = await fetch(`/api/deliveries/${id}/print`, {
          credentials: "same-origin",
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) {
          throw new Error("登录已失效，请返回系统登录后重新打印。");
        }
        if (!response.ok) {
          throw new Error(data.detail || "读取送货单失败。");
        }
        currentDeliveryData = data;
        renderDelivery(data);
      } catch (error) {
        showError(error.message);
      }
    }

    (async () => {
      await loadPaperSettings();
      await initializePrintEditor();
      await loadDelivery();
    })();
  </script>
</body>
</html>
