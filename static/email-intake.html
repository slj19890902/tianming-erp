<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邮箱收单 · 天明ERP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#213c4c;font:15px/1.5 system-ui}main{max-width:1350px;margin:auto;padding:22px}header,.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:25px;margin:0}h2{font-size:18px}p{color:#617583}a{color:#1267a0}button,input,select{font:inherit;min-height:42px;padding:8px 12px;border:1px solid #bccdd8;border-radius:7px;background:white}button{cursor:pointer;color:#174e70}button.primary{color:white;background:#1267a0;border-color:#1267a0}button:disabled{opacity:.55;cursor:wait}section,details{background:white;border:1px solid #d9e3ea;border-radius:10px;padding:16px;margin-top:14px}summary{cursor:pointer}#layout{display:grid;grid-template-columns:360px 1fr;gap:16px}#messages button{display:block;width:100%;text-align:left;margin-bottom:8px;overflow-wrap:anywhere}#messages button.selected{border-color:#1267a0;background:#eef7ff}small{display:block;color:#647a87}#detail{min-width:0;overflow-wrap:anywhere}pre{font:inherit;white-space:pre-wrap;max-height:260px;overflow:auto;background:#f5f8fa;padding:12px}#status{color:#9a401d;min-height:24px}.attachment{border-top:1px solid #d9e3ea;padding:12px 0}.attachment .bar{justify-content:flex-start}table{border-collapse:collapse;width:100%}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left}.table-wrap{overflow:auto}footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}@media(max-width:760px){main{padding:12px}#layout{grid-template-columns:1fr}#messages{max-height:280px;overflow:auto}h1{font-size:22px}}
</style></head><body><main>
<header><div><h1>邮箱收单</h1><p>读取附件，核对后再导入订单</p></div><a href="/?page=orders">返回订单</a></header>
<details id="settings"><summary>邮箱设置 · <span id="configured">正在读取</span></summary><p><strong>sz_tmbz@126.com · 收件箱</strong></p><p>在126邮箱开启IMAP并新增客户端授权码，然后在此保存。更换服务器或Windows运行账号后需重新填写。</p><div class="bar" style="justify-content:flex-start"><input id="code" type="password" autocomplete="new-password" placeholder="126客户端授权码" aria-label="126客户端授权码"><button id="save">保存授权码</button></div><small>授权码不会回显。请使用HTTPS ERP地址保存；不用在聊天里发送。</small></details>
<section><div class="bar"><div><button class="primary" id="sync">读取收件箱</button> <button id="refresh">刷新列表</button></div><select id="state" aria-label="邮件状态"><option value="all">全部邮件</option><option value="pending">待核对</option><option value="ignored">已忽略</option><option value="oversize">需从原邮箱处理</option></select><select id="association" aria-label="订单关联"><option value="all">全部关联状态</option><option value="linked">已有关联订单</option><option value="unlinked">尚无关联订单</option></select></div><p>每次读取20封新邮件；重复点击会继续读取。不会改变邮箱里的已读状态。PDF可进入现有订单草稿编辑，人工确认后保存；支持从订单返回原邮件核对。</p><div id="status" role="status"></div></section>
<div id="layout"><section><div id="messages"></div><footer><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></footer></section><section id="detail"><p>选择邮件查看正文和附件</p></section></div>
</main><script>
const $=id=>document.getElementById(id),el=(tag,text)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;return n;};
let page=1,total=0,settingsVersion=0,selected=null,detailController=null;
async function api(path,options={}){const response=await fetch('/api/email-intake'+path,{credentials:'same-origin',cache:'no-store',...options,headers:{'Content-Type':'application/json',...options.headers}});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:`操作失败（${response.status}）`);return data;}
async function config(){const data=await api('/settings');settingsVersion=data.version;$('configured').textContent=data.configured?'已保存授权码':'尚未配置';$('sync').disabled=!data.configured;if(!data.configured)$('settings').open=true;}
async function list(){const data=await api(`?page=${page}&state=${$('state').value}&association=${$('association').value}`);total=data.total;$('messages').replaceChildren();for(const row of data.items){const button=el('button');button.classList.toggle('selected',row.id===selected);button.append(el('strong',row.subject||'无主题'),el('small',row.sender),el('small',`${row.received||''} · ${{pending:'待核对',ignored:'已忽略',oversize:'需从原邮箱处理'}[row.status]||row.status}`));button.dataset.mailId=row.id;button.append(el('small',row.linked_order_count?`已关联 ${row.linked_order_count} 张订单`:'尚无关联订单'));button.onclick=()=>openMail(row.id).catch(showError);$('messages').append(button);}if(!data.items.length)$('messages').append(el('p','暂无邮件，请读取收件箱。'));$('page').textContent=`${page} / ${Math.max(1,Math.ceil(total/25))}`;$('previous').disabled=page<=1;$('next').disabled=page*25>=total;}
function showError(error){if(error.name!=='AbortError')$('status').textContent=error.message;}
async function openMail(id){detailController?.abort();const ctrl=detailController=new AbortController();selected=id;const data=await api('/'+id,{signal:ctrl.signal});if(ctrl.signal.aborted)return;const url=new URL(location.href);url.searchParams.delete('order');url.searchParams.set('message',id);history.replaceState(null,'',url);for(const node of $('messages').querySelectorAll('[data-mail-id]'))node.classList.toggle('selected',Number(node.dataset.mailId)===id);const target=$('detail');target.replaceChildren(el('h2',data.subject||'无主题'),el('small',data.sender+' · '+data.received));if(data.notice)target.append(el('p',data.notice));const state=el('button',data.status==='ignored'?'恢复待核对':'忽略此邮件');state.onclick=async()=>{state.disabled=true;try{await api(`/${id}/state`,{method:'PUT',body:JSON.stringify({status:data.status==='ignored'?'pending':'ignored',expected_version:data.version})});await openMail(id);await list();}catch(error){showError(error);state.disabled=false;}};target.append(state,el('pre',data.body||'无纯文本正文'));for(const item of data.attachments){const box=el('div');box.className='attachment';box.append(el('strong',item.filename));for(const order of item.orders||[]){if(order.id){const link=el('a',`查看订单 ${order.order_number} · 客户单号 ${order.customer_po||'无'}`);link.href=`/?page=orders&email_order=${order.id}`;link.target='_blank';link.rel='noopener';const line=el('p');line.append(link);box.append(line);}else box.append(el('p','原关联订单已删除，请人工核对'));}if((item.orders||[]).some(row=>row.id))box.append(el('small','此附件已有关联订单；请先查看订单，确认是否还有未导入的明细。'));if(item.duplicate_of)box.append(el('small','与已收录附件内容相同，请避免重复导入'));const bar=el('div');bar.className='bar';const download=el('a','下载原附件');download.href=`/api/email-intake/attachments/${item.id}/download`;bar.append(download);if(item.filename.toLowerCase().endsWith('.pdf')){const button=el('button','预览识别结果');button.onclick=()=>preview(item,box,button);bar.append(button);const edit=el('a',(item.orders||[]).some(row=>row.id)?'重新识别核对':'编辑并导入订单');edit.href=`/?page=orders&email_attachment=${item.id}`;edit.target='_blank';edit.rel='noopener';bar.append(edit);}box.append(bar);target.append(box);}if(!data.attachments.length)target.append(el('p','没有收录的PDF附件，请结合正文或原邮箱处理。'));}
async function preview(item,box,button){button.disabled=true;const old=box.querySelector('.preview');old?.remove();const result=el('div');result.className='preview';box.append(result);try{const data=await api(`/attachments/${item.id}/preview`,{method:'POST'});result.append(el('p','仅为识别预览，请核对客户、数量、单价及交期；预览不会创建订单。'));result.append(el('h2',data.customer_name||data.customer_name_raw||'客户待确认'),el('p',`客户单号：${data.customer_po||'待确认'} · 订单日期：${data.order_date||'待确认'} · 交期：${data.delivery_date||'待确认'}`));if(data.duplicate_reason)result.append(el('p',data.duplicate_reason));for(const warning of data.warnings||[])if(typeof warning==='string')result.append(el('p',warning));const wrap=el('div');wrap.className='table-wrap';const table=el('table'),head=el('tr');for(const label of ['存货编码','名称','规格','数量','单价'])head.append(el('th',label));table.append(head);for(const item of data.items||[]){const tr=el('tr');for(const value of [item.product_code,item.product_name,item.spec||item.specification,item.quantity,item.unit_price])tr.append(el('td',value??'待确认'));table.append(tr);}wrap.append(table);result.append(wrap);if(!(data.items||[]).length)result.append(el('p','未识别出明细，请下载原附件人工核对。'));}catch(error){result.textContent=error.message;}finally{button.disabled=false;}}
$('save').onclick=async()=>{$('save').disabled=true;try{await api('/settings',{method:'PUT',body:JSON.stringify({authorization_code:$('code').value,expected_version:settingsVersion})});$('code').value='';await config();$('status').textContent='授权码已保存，可以读取收件箱。';}catch(error){showError(error);}finally{$('save').disabled=false;}};
$('sync').onclick=async()=>{$('sync').disabled=true;$('status').textContent='正在读取收件箱…';try{const result=await api('/sync',{method:'POST'});$('status').textContent=`本次读取 ${result.received} 封，尚有 ${result.remaining} 封待读取。`;page=1;await list();}catch(error){showError(error);await list().catch(()=>{});}finally{$('sync').disabled=false;}};
$('refresh').onclick=()=>Promise.all([list(),selected?openMail(selected):Promise.resolve()]).catch(showError);$('association').onchange=()=>{page=1;list().catch(showError)};$('state').onchange=()=>{page=1;list().catch(showError)};$('previous').onclick=()=>{if(page>1){page--;list().catch(showError)}};$('next').onclick=()=>{if(page*25<total){page++;list().catch(showError)}};async function start(){await Promise.all([config(),list()]);const params=new URLSearchParams(location.search),order=params.get('order'),message=params.get('message');if(order&&/^[1-9][0-9]*$/.test(order)){const data=await api(`/orders/${order}/source`);if(data.sources.length)await openMail(data.sources[0].message_id);else $('detail').replaceChildren(el('p','此订单没有邮箱收单来源记录。'));}else if(message&&/^[1-9][0-9]*$/.test(message))await openMail(Number(message));}start().catch(showError);
</script></body></html>
