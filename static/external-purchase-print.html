<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>外购包装采购单</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#111;font:13px/1.35 "Microsoft YaHei",sans-serif}
    .actions{display:flex;justify-content:center;gap:8px;margin:14px}.actions button,.return-link{padding:8px 18px;border:0;border-radius:5px;background:#1769aa;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.actions button:disabled{opacity:.5;cursor:not-allowed}.actions .secondary{background:#64748b}
    .load-state{width:800px;max-width:calc(100% - 24px);margin:0 auto 10px;padding:9px 12px;border:1px solid #bfdbfe;border-radius:6px;background:#eff6ff;color:#1e3a8a}.load-state.error{border-color:#fecaca;background:#fef2f2;color:#991b1b}.hidden{display:none!important}
    .sheet{width:800px;max-width:calc(100% - 24px);margin:0 auto 18px;padding:18px 22px;background:#fff;box-shadow:0 4px 18px #0002}.title{text-align:center}.title h1{margin:0;font-size:22px}.title div{margin-top:2px;font-size:20px;letter-spacing:7px}
    .head{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:10px 0}.head-card{border:1px solid #111;padding:7px 9px;line-height:1.65}.head-card strong{display:inline-block;min-width:68px}
    table{width:100%;border-collapse:collapse;table-layout:fixed}thead{display:table-header-group}th,td{border:1px solid #111;padding:8px;text-align:center;vertical-align:middle;overflow-wrap:anywhere}th{background:#f3f4f6}.left{text-align:left}.footer{display:flex;justify-content:flex-end;margin-top:12px;font-size:12px}
    tr{break-inside:avoid;page-break-inside:avoid}
    @media print{body{background:#fff}.actions,.load-state{display:none}.sheet{width:auto;max-width:none;margin:0;padding:0;box-shadow:none}@page{size:A4 portrait;margin:12mm}}
  </style>
</head>
<body>
  <div class="actions"><button id="printButton" disabled>打印 / 保存为 PDF</button><button id="retryButton" class="secondary hidden" type="button">重新读取</button><a class="return-link" href="/?page=orders">返回 ERP</a></div>
  <div id="loadState" class="load-state" role="status">正在读取外购包装采购单，请稍候…</div>
  <main id="sheet" class="sheet">
    <div class="title"><h1 id="companyName">苏州天明包装有限公司</h1><div>外购包装采购单</div></div>
    <div class="head">
      <div class="head-card"><div><strong>供应商</strong><span id="supplierName">-</span></div></div>
      <div class="head-card"><div><strong>采购单号</strong><span id="purchaseNumber">-</span></div><div><strong>确认日期</strong><span id="confirmedDate">-</span></div></div>
    </div>
    <table>
      <colgroup><col style="width:10%"><col style="width:65%"><col style="width:25%"></colgroup>
      <thead><tr><th>序号</th><th>规格</th><th>数量</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="footer"><span>制单：ERP 人工确认采购记录</span></div>
  </main>
  <script src="/static/assets/time-utils.js?v=95c91f9ded41"></script>
  <script>
    const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const printButton=document.getElementById("printButton");
    const retryButton=document.getElementById("retryButton");
    const loadState=document.getElementById("loadState");
    const rowsNode=document.getElementById("rows");
    let loadGeneration=0;
    let loadController=null;

    function displayDate(value){
      if(!value)return "-";
      try{return TmTime.formatBusinessDate(value);}catch(_){return String(value);}
    }
    function parseErrorDetail(detail){
      if(typeof detail==="string"&&detail.trim())return detail;
      if(Array.isArray(detail)){const messages=detail.map(item=>item?.msg||item?.message).filter(Boolean);if(messages.length)return messages.join("；");}
      if(detail&&typeof detail==="object"){const message=detail.message||detail.msg||detail.detail;if(typeof message==="string"&&message.trim())return detail.code?`${message}（${detail.code}）`:message;}
      return "";
    }
    function isAbortError(error){return error?.name==="AbortError"||error?.code==="ABORT_ERR";}
    async function requestPrintData(id,signal){
      let response;
      try{response=await fetch(`/api/external-packaging-purchases/${encodeURIComponent(id)}/print`,{credentials:"include",signal});}
      catch(error){if(isAbortError(error))throw error;const networkError=new Error("无法连接 ERP 服务，请检查网络后重试");networkError.code="NETWORK_ERROR";throw networkError;}
      let raw="";let body={};
      try{raw=await response.text();body=raw?JSON.parse(raw):{};}catch(_){body={};}
      if(!response.ok){const detail=parseErrorDetail(body?.detail)||parseErrorDetail(body)||(response.status>=500?"服务器内部错误":"无法读取采购单");const error=new Error(`${detail}（HTTP ${response.status}）`);error.status=response.status;throw error;}
      if(!body||typeof body!=="object"||Array.isArray(body))throw new Error("服务器返回的采购单数据无效，请重试");
      return body;
    }
    function setLoading(){printButton.disabled=true;retryButton.classList.add("hidden");loadState.classList.remove("hidden","error");loadState.textContent="正在读取外购包装采购单，请稍候…";}
    function renderError(error,allowRetry=true){printButton.disabled=true;loadState.classList.remove("hidden");loadState.classList.add("error");loadState.textContent=error?.status===401?"登录已失效，请返回 ERP 登录后重新打印。":(error?.status===403?"当前账号没有打印该采购单的权限。":(error?.message||"无法读取采购单，请重试"));retryButton.classList.toggle("hidden",!allowRetry);}
    function renderPurchase(data){
      document.getElementById("companyName").textContent=data.buyer?.company_name||"苏州天明包装有限公司";
      document.getElementById("supplierName").textContent=data.supplier?.name||"-";
      document.getElementById("purchaseNumber").textContent=data.purchase_number||"-";
      document.getElementById("confirmedDate").textContent=displayDate(data.confirmed_at);
      const items=Array.isArray(data.items)?data.items:[];
      rowsNode.innerHTML=items.length?items.map((item,index)=>`<tr><td>${index+1}</td><td class="left">${escapeHtml(item.specification_summary||"-")}</td><td>${escapeHtml(item.purchase_quantity)} ${escapeHtml(item.purchase_unit)}</td></tr>`).join(""):'<tr><td colspan="3">该采购单暂无明细</td></tr>';
      loadState.classList.add("hidden");loadState.classList.remove("error");retryButton.classList.add("hidden");printButton.disabled=false;
    }
    async function loadPurchase(){
      const id=Number(new URLSearchParams(location.search).get("id"));
      if(!Number.isInteger(id)||id<=0){renderError(new Error("采购单链接无效，请从订单详情重新打开。"),false);return;}
      const generation=++loadGeneration;loadController?.abort();const controller=new AbortController();loadController=controller;setLoading();
      try{const data=await requestPrintData(id,controller.signal);if(generation!==loadGeneration)return;renderPurchase(data);}
      catch(error){if(isAbortError(error)||generation!==loadGeneration)return;renderError(error);}
      finally{if(generation===loadGeneration)loadController=null;}
    }
    printButton.addEventListener("click",()=>{if(!printButton.disabled)window.print();});
    retryButton.addEventListener("click",loadPurchase);
    loadPurchase();
  </script>
</body>
</html>
