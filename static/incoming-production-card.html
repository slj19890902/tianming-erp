<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>生产随料卡</title>
  <style>
    :root { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; color:#111827; }
    * { box-sizing:border-box; }
    body { margin:0; background:#eef2f7; }
    .toolbar { position:sticky; top:0; z-index:2; display:flex; gap:10px; align-items:center; padding:10px 16px; background:#fff; border-bottom:1px solid #cbd5e1; }
    button { border:1px solid #94a3b8; border-radius:8px; padding:8px 18px; background:#fff; font-size:15px; cursor:pointer; }
    button.primary { color:#fff; background:#0369a1; border-color:#0369a1; }
    .message { margin-left:auto; color:#475569; }
    .message.error { color:#b91c1c; font-weight:700; }
    .sheet { width:190mm; min-height:277mm; margin:12px auto; padding:10mm; background:#fff; box-shadow:0 3px 16px rgba(15,23,42,.15); }
    .title { display:flex; justify-content:space-between; gap:16px; border-bottom:3px solid #111827; padding-bottom:8px; }
    .title h1 { margin:0; font-size:30px; letter-spacing:2px; }
    .title .card-no { font-size:15px; text-align:right; }
    .customer { margin:12px 0 4px; font-size:30px; font-weight:800; }
    .product-code { font-size:27px; font-weight:800; }
    .product-name { margin-top:4px; font-size:21px; font-weight:700; }
    .grid { display:grid; grid-template-columns:1fr 1fr; border:2px solid #334155; margin-top:12px; }
    .cell { min-height:58px; padding:8px 10px; border-right:1px solid #64748b; border-bottom:1px solid #64748b; }
    .cell:nth-child(2n) { border-right:0; }
    .label { color:#475569; font-size:13px; }
    .value { margin-top:3px; font-size:20px; font-weight:700; }
    .quantity { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .quantity > div { border:3px solid #0f172a; padding:10px; text-align:center; }
    .quantity .number { font-size:38px; font-weight:900; }
    .section { margin-top:14px; }
    .section h2 { margin:0 0 7px; font-size:19px; }
    .route { display:flex; flex-wrap:wrap; gap:8px; align-items:center; min-height:55px; padding:10px; border:2px solid #0369a1; background:#f0f9ff; }
    .step { font-size:22px; font-weight:800; }
    .arrow { color:#0369a1; font-size:24px; }
    .warning { color:#b91c1c; font-size:25px; font-weight:900; }
    .notes { min-height:64px; padding:9px; border:1px solid #94a3b8; white-space:pre-wrap; font-size:17px; }
    .record { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
    .record div { min-height:52px; border-bottom:1px solid #111827; padding-top:8px; }
    footer { margin-top:16px; display:flex; justify-content:space-between; color:#475569; font-size:12px; }
    [hidden] { display:none !important; }
    @page { size:A4 portrait; margin:10mm; }
    @media print {
      body { background:#fff; }
      .toolbar { display:none; }
      .sheet { width:auto; min-height:auto; margin:0; padding:0; box-shadow:none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="primary" id="printButton" type="button" disabled>打印生产卡</button>
    <button type="button" onclick="window.close()">关闭</button>
    <span id="message" class="message">正在读取正式收料资料…</span>
  </div>
  <main id="sheet" class="sheet" hidden>
    <div class="title"><h1>纸板生产随料卡</h1><div class="card-no"><div id="cardNumber"></div><div>第 1 / 1 页</div></div></div>
    <div id="customerName" class="customer"></div>
    <div id="productCode" class="product-code"></div>
    <div id="productName" class="product-name"></div>
    <div class="grid">
      <div class="cell"><div class="label">订单号 / 客户单号</div><div id="orderNumber" class="value"></div></div>
      <div class="cell"><div class="label">报料单 / 实收单</div><div id="sourceNumbers" class="value"></div></div>
      <div class="cell"><div class="label">交货日期</div><div id="deliveryDate" class="value"></div></div>
      <div class="cell"><div class="label">纸板规格</div><div id="boardSpec" class="value"></div></div>
      <div class="cell"><div class="label">楞型 / 压线</div><div id="crease" class="value"></div></div>
      <div class="cell"><div class="label">开料方式 / 模具</div><div id="cuttingMode" class="value"></div></div>
    </div>
    <div class="quantity">
      <div><div class="label">本垛实收纸板</div><div><span id="receivedQuantity" class="number"></span> 张</div></div>
      <div><div class="label">本垛最多可生产</div><div><span id="capacityQuantity" class="number"></span> <span id="productionUnit"></span></div></div>
    </div>
    <section class="section"><h2>生产顺序</h2><div id="route" class="route"></div></section>
    <section class="section"><h2>生产说明</h2><div id="notes" class="notes"></div></section>
    <div class="record"><div>班组 / 操作员：</div><div>开始时间：</div><div>完成时间：</div><div>异常备注：</div></div>
    <footer><span id="version"></span><span id="printedBy"></span><span id="generatedAt"></span></footer>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const receiptItemId = Number(params.get("id") || 0);
      const openToken = params.get("open_token") || "";
      const message = document.getElementById("message");
      const sheet = document.getElementById("sheet");
      const printButton = document.getElementById("printButton");
      const channel = openToken && typeof BroadcastChannel === "function"
        ? new BroadcastChannel(`erp-incoming-production-card-${openToken}`)
        : null;
      channel?.postMessage({ type:"ready" });
      setTimeout(() => channel?.close(), 0);
      const setText = (id, value, fallback="-") => {
        document.getElementById(id).textContent = value === null || value === undefined || value === "" ? fallback : String(value);
      };
      const dateTime = value => value ? new Date(value).toLocaleString("zh-CN", {hour12:false}) : "-";
      const showError = text => {
        message.textContent = text;
        message.className = "message error";
        printButton.disabled = true;
      };
      const render = data => {
        setText("cardNumber", data.card_number);
        setText("customerName", data.customer_name, "客户未登记");
        setText("productCode", data.product_code, "存货编码未登记");
        setText("productName", [data.product_name, data.specification].filter(Boolean).join("｜"), "产品未登记");
        setText("orderNumber", [data.order_number, data.customer_po].filter(Boolean).join(" / "));
        setText("sourceNumbers", [data.requisition_number, data.receipt_number].filter(Boolean).join(" / "));
        setText("deliveryDate", data.delivery_date);
        setText("boardSpec", data.board_length_mm && data.board_width_mm ? `${data.board_length_mm} × ${data.board_width_mm} mm` : null, "尺寸待确认");
        const creaseValues = [data.crease_left_mm, data.crease_middle_mm, data.crease_right_mm].filter(value => value !== null && value !== undefined);
        setText("crease", `${data.flute_type || "楞型待确认"} / ${data.crease_type || "压线待确认"}${creaseValues.length ? ` ${creaseValues.join("+")} mm` : ""}`);
        const mold = [data.mold_tool_code, data.mold_tool_name].filter(Boolean).join(" ");
        setText("cuttingMode", `${data.cutting_mode || "一开一"}（每张产出 ${data.output_factor || 1}）${mold ? ` / 模具 ${mold}` : ""}`);
        setText("receivedQuantity", data.received_sheet_quantity, "0");
        setText("capacityQuantity", data.production_capacity_quantity, "0");
        setText("productionUnit", data.production_unit, "只");
        setText("notes", data.production_notes, "工艺待确认：请先回 ERP 核对订单生产说明");
        const route = document.getElementById("route");
        route.replaceChildren();
        const steps = Array.isArray(data.process_steps) ? data.process_steps : [];
        if (!steps.length) {
          const warning = document.createElement("span");
          warning.className = "warning";
          warning.textContent = "工艺待确认";
          route.appendChild(warning);
        } else {
          steps.forEach((step, index) => {
            if (index) {
              const arrow = document.createElement("span");
              arrow.className = "arrow";
              arrow.textContent = "→";
              route.appendChild(arrow);
            }
            const node = document.createElement("span");
            node.className = "step";
            node.textContent = step;
            route.appendChild(node);
          });
        }
        setText("version", `任务 ${data.production_task_id || "-"}｜版本 ${data.production_task_version || 1}｜实收明细 ${data.receipt_item_id}`);
        setText("printedBy", `打印人：${data.printed_by || "-"}`);
        setText("generatedAt", `生成：${dateTime(data.generated_at)}`);
        sheet.hidden = false;
        printButton.disabled = false;
        message.textContent = "资料已核对，可打印；打印不会改变 ERP 状态。";
      };
      printButton.addEventListener("click", () => window.print());
      if (!Number.isInteger(receiptItemId) || receiptItemId <= 0) {
        showError("缺少有效的来料实收明细编号");
        return;
      }
      fetch(`/api/incoming/receipt-items/${encodeURIComponent(receiptItemId)}/production-card`, {credentials:"same-origin"})
        .then(async response => {
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            if (response.status === 401) throw new Error("登录已过期，请关闭本页并在 ERP 重新登录");
            if (response.status === 403) throw new Error("当前账号无权查看这张生产卡");
            throw new Error(data.detail || `生产卡读取失败（HTTP ${response.status}）`);
          }
          return data;
        })
        .then(render)
        .catch(error => showError(error?.message || "生产卡读取失败，请稍后重试"));
    })();
  </script>
</body>
</html>
