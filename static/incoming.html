<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>车间来料入库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [hidden] { display: none !important; }
    body { -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <header class="sticky top-0 z-20 border-b border-slate-300 bg-slate-900 px-4 py-3 text-white shadow">
    <div class="mx-auto flex max-w-2xl items-center justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold">车间来料入库</h1>
        <p id="userLabel" class="mt-0.5 text-sm text-slate-300">正在校验登录状态</p>
      </div>
      <button id="refreshButton" class="min-h-12 rounded-lg bg-blue-600 px-5 text-base font-bold active:bg-blue-700">
        刷新
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-2xl p-3 pb-24">
    <div id="authNotice" hidden class="mb-3 rounded-xl border border-red-300 bg-red-50 p-4 text-red-800">
      <p class="font-bold">登录已失效</p>
      <p class="mt-1 text-sm">请先在 ERP 首页完成登录，再重新扫描二维码。</p>
      <a href="/" class="mt-3 inline-flex min-h-12 items-center rounded-lg bg-red-700 px-5 font-bold text-white">返回登录</a>
    </div>

    <nav class="mb-3 grid grid-cols-2 gap-2 rounded-xl bg-white p-2 shadow-sm">
      <button data-tab="pending" class="tab-button min-h-14 rounded-lg bg-blue-700 px-3 text-lg font-bold text-white">
        待收料 <span id="pendingCount" class="ml-1 rounded-full bg-white/20 px-2 py-0.5 text-sm">0</span>
      </button>
      <button data-tab="received" class="tab-button min-h-14 rounded-lg bg-slate-200 px-3 text-lg font-bold text-slate-700">
        今日已收 <span id="receivedCount" class="ml-1 rounded-full bg-slate-300 px-2 py-0.5 text-sm">0</span>
      </button>
    </nav>

    <div id="loadingState" class="rounded-xl bg-white p-8 text-center text-lg font-semibold text-slate-500 shadow-sm">
      正在读取来料任务...
    </div>
    <div id="errorState" hidden class="rounded-xl border border-red-300 bg-red-50 p-5 text-red-800">
      <p class="font-bold">加载失败</p>
      <p id="errorMessage" class="mt-1"></p>
    </div>
    <section id="cardList" class="space-y-3"></section>
    <div id="emptyState" hidden class="rounded-xl bg-white p-8 text-center shadow-sm">
      <p class="text-xl font-bold text-slate-700">当前没有记录</p>
      <p class="mt-2 text-slate-500">点击右上角刷新重新检查。</p>
    </div>
  </main>

  <div id="detailModal" hidden class="fixed inset-0 z-40 flex items-end bg-black/50 sm:items-center sm:justify-center">
    <div class="w-full rounded-t-2xl bg-white p-5 shadow-2xl sm:max-w-lg sm:rounded-2xl">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold">来料任务详情</h2>
        <button id="closeDetail" class="min-h-12 min-w-12 rounded-lg bg-slate-200 text-xl font-bold">×</button>
      </div>
      <dl id="detailContent" class="mt-4 grid grid-cols-[7rem_1fr] gap-y-3 text-base"></dl>
    </div>
  </div>

  <div id="revertModal" hidden class="fixed inset-0 z-50 flex items-end bg-black/60 sm:items-center sm:justify-center">
    <form id="revertForm" class="w-full rounded-t-2xl bg-white p-5 shadow-2xl sm:max-w-lg sm:rounded-2xl">
      <h2 class="text-xl font-bold text-red-700">撤回来料入库</h2>
      <p class="mt-2 text-slate-600">请填写原因，操作将记录到审计日志。</p>
      <textarea id="revertReason" rows="3" required maxlength="200"
        class="mt-4 w-full rounded-xl border-2 border-slate-300 p-3 text-lg focus:border-red-600 focus:outline-none"
        placeholder="例如：纸板规格核对错误"></textarea>
      <div class="mt-4 grid grid-cols-2 gap-3">
        <button type="button" id="cancelRevert" class="min-h-14 rounded-xl bg-slate-200 text-lg font-bold">取消</button>
        <button type="submit" class="min-h-14 rounded-xl bg-red-700 text-lg font-bold text-white">确认撤回</button>
      </div>
    </form>
  </div>

  <div id="toast" hidden class="fixed bottom-5 left-1/2 z-50 w-[calc(100%-2rem)] max-w-md -translate-x-1/2 rounded-xl bg-slate-900 px-5 py-4 text-center text-lg font-bold text-white shadow-xl"></div>

  <script>
    const state = {
      activeTab: "pending",
      pending: [],
      received: [],
      user: null,
      revertingItemId: null,
      busyItemId: null,
    };

    const $ = (id) => document.getElementById(id);
    const canOperate = () => ["admin", "workshop"].includes(state.user?.role);

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showToast(message, isError = false) {
      const toast = $("toast");
      toast.textContent = message;
      toast.className = `fixed bottom-5 left-1/2 z-50 w-[calc(100%-2rem)] max-w-md -translate-x-1/2 rounded-xl px-5 py-4 text-center text-lg font-bold text-white shadow-xl ${isError ? "bg-red-700" : "bg-slate-900"}`;
      toast.hidden = false;
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => { toast.hidden = true; }, 2400);
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) {
        $("authNotice").hidden = false;
        throw new Error("登录已失效");
      }
      if (!response.ok) {
        const detail = Array.isArray(data.detail)
          ? data.detail.map((item) => item.msg).join("；")
          : data.detail;
        throw new Error(detail || "操作失败");
      }
      return data;
    }

    async function checkAuth() {
      try {
        const data = await api("/api/auth/me");
        state.user = data.user;
        $("userLabel").textContent = `${data.user.real_name} · ${data.user.role}`;
        return true;
      } catch (error) {
        $("userLabel").textContent = "未登录";
        $("loadingState").hidden = true;
        $("errorState").hidden = true;
        return false;
      }
    }

    function formatDate(value) {
      return value || "未指定";
    }

    function formatBoardDimension(value) {
      if (value === null || value === undefined || value === "") return "-";
      const number = Number(value);
      if (!Number.isFinite(number)) return String(value || "-").trim() || "-";
      return `${Math.round(number)}mm`;
    }

    function formatBoardSpec(length, width) {
      if (length === null || length === undefined || length === "" || width === null || width === undefined || width === "") {
        return "未填写";
      }
      return `${formatBoardDimension(length)} × ${formatBoardDimension(width)}`;
    }

    function formatCreaseValue(value) {
      if (value === null || value === undefined || value === "") return null;
      const number = Number(value);
      return Number.isFinite(number) ? Math.round(number) : null;
    }

    function formatCreaseSpec(left, middle, right) {
      const l = formatCreaseValue(left);
      const m = formatCreaseValue(middle);
      const r = formatCreaseValue(right);
      if (l === null || m === null || r === null) return "-";
      return `${l} + ${m} + ${r}`;
    }

    function formatMaterialDisplay(item) {
      const code = (item.material_code || item.material || "").trim();
      const flute = (item.flute_type || "").trim();
      if (code && flute) return `${code} / ${flute}`;
      return code || "未填写";
    }

    function formatTime(value) {
      if (!value) return "";
      return new Date(`${value}Z`).toLocaleString("zh-CN", { hour12: false });
    }

    function render() {
      const items = state[state.activeTab];
      $("pendingCount").textContent = state.pending.length;
      $("receivedCount").textContent = state.received.length;
      $("emptyState").hidden = items.length !== 0;
      const list = $("cardList");
      list.innerHTML = items.map((item) => {
        const isPending = state.activeTab === "pending";
        const disabled = state.busyItemId === item.item_id;
        const action = !canOperate()
          ? `<div class="rounded-lg bg-slate-100 px-4 py-3 text-center font-semibold text-slate-500">只读查看</div>`
          : isPending
            ? `<button data-receive="${item.item_id}" ${disabled ? "disabled" : ""} class="min-h-14 w-full rounded-xl bg-green-700 px-4 text-lg font-bold text-white disabled:bg-slate-400">确认入库</button>`
            : `<button data-revert="${item.item_id}" ${disabled ? "disabled" : ""} class="min-h-14 w-full rounded-xl bg-red-700 px-4 text-lg font-bold text-white disabled:bg-slate-400">撤回</button>`;
        return `
          <article data-detail="${item.item_id}" class="rounded-xl border-l-4 ${isPending ? "border-orange-500" : "border-green-600"} bg-white p-3 shadow-sm active:bg-slate-50">
            <div class="flex items-start justify-between gap-2">
              <div class="grid flex-1 grid-cols-2 gap-2">
                <div class="rounded-lg bg-blue-50 p-2"><p class="text-xs font-semibold text-blue-700">报料尺寸</p><p class="mt-0.5 text-lg font-black text-blue-950 break-words">${escapeHtml(formatBoardSpec(item.cardboard_len, item.cardboard_width))}</p></div>
                <div class="rounded-lg bg-indigo-50 p-2"><p class="text-xs font-semibold text-indigo-700">压线尺寸</p><p class="mt-0.5 text-lg font-black text-indigo-950 break-words">${escapeHtml(formatCreaseSpec(item.snapshot_crease_left_mm, item.snapshot_crease_middle_mm, item.snapshot_crease_right_mm))}</p></div>
              </div>
              <span class="shrink-0 rounded-full ${isPending ? "bg-orange-100 text-orange-800" : "bg-green-100 text-green-800"} px-2 py-1 text-xs font-bold">
                ${isPending ? "待收料" : "已入库"}
              </span>
            </div>
            <div class="mt-2 rounded-lg bg-slate-100 p-2"><p class="text-sm text-slate-500">入库数量</p>${isPending ? `<input data-quantity="${item.item_id}" class="mt-1 w-full rounded-lg border-2 border-slate-300 bg-white p-2 text-xl font-black" type="number" min="1" step="1" value="${escapeHtml(item.incoming_quantity)}">` : `<p class="mt-1 text-xl font-black">${escapeHtml(item.incoming_quantity)}</p>`}</div>
            <div class="mt-2 rounded-lg bg-slate-50 p-2">
              <p class="text-xs text-slate-500">客户 · 存货编码 · 产品名称</p>
              <p class="mt-0.5 break-words font-bold">${escapeHtml(item.customer_name)} · ${escapeHtml(item.product_code || "未填写")} · ${escapeHtml(item.product_name)}</p>
            </div>
            <p class="mt-2 text-center text-xs text-slate-400">点击卡片查看更多详情</p>
            <div class="mt-2">${action}</div>
          </article>`;
      }).join("");
    }

    async function loadData() {
      $("loadingState").hidden = false;
      $("errorState").hidden = true;
      $("cardList").innerHTML = "";
      $("emptyState").hidden = true;
      try {
        const [pending, received] = await Promise.all([
          api("/api/incoming/pending"),
          api("/api/incoming/received"),
        ]);
        state.pending = pending.items;
        state.received = received.items;
        render();
      } catch (error) {
        $("errorMessage").textContent = error.message;
        $("errorState").hidden = false;
      } finally {
        $("loadingState").hidden = true;
      }
    }

    function findItem(itemId) {
      return [...state.pending, ...state.received].find((item) => item.item_id === itemId);
    }

    function openDetail(itemId) {
      const item = findItem(itemId);
      if (!item) return;
      const fields = [
        ["报料尺寸", formatBoardSpec(item.cardboard_len, item.cardboard_width)],
        ["压线尺寸", formatCreaseSpec(item.snapshot_crease_left_mm, item.snapshot_crease_middle_mm, item.snapshot_crease_right_mm)],
        ["材质代码/楞型", formatMaterialDisplay(item)],
        ["供应商", item.snapshot_supplier_name || "未填写"],
        ["客户", item.customer_name],
        ["客户单号", item.customer_po || "未填写"],
        ["订单号", item.order_number],
        ["产品", item.product_name],
        ["存货编码", item.product_code || "未填写"],
        ["规格", item.specification || "未填写"],
        ["数量", item.quantity],
        ["报料日期", item.requisition_date || "未填写"],
        ["交货日期", formatDate(item.delivery_date)],
        ["PDF 图纸", item.drawing_is_pdf && item.drawing_path ? "点击卡片上的“打开 PDF 图纸”按钮" : "暂无 PDF 图纸"],
        ["备注", item.requisition_remark || "无"],
      ];
      $("detailContent").innerHTML = fields.map(([label, value]) =>
        `<dt class="font-semibold text-slate-500">${escapeHtml(label)}</dt><dd class="font-bold break-words">${escapeHtml(value)}</dd>`
      ).join("") + (item.drawing_is_pdf && item.drawing_path
        ? `<a href="${escapeHtml(item.drawing_path)}" target="_blank" rel="noopener" class="col-span-2 mt-2 flex min-h-14 w-full items-center justify-center rounded-xl bg-blue-700 px-4 text-lg font-bold text-white">打开 PDF 图纸</a>`
        : "");
      $("detailModal").hidden = false;
    }

    async function receive(itemId) {
      const item = findItem(itemId);
      const quantity = Number(item?.incoming_quantity);
      if (!Number.isInteger(quantity) || quantity <= 0) {
        showToast("入库数量必须是大于0的整数", true);
        return;
      }
      if (!window.confirm(`确认该批 ${quantity} 张纸板已经到厂并完成入库吗？`)) return;
      state.busyItemId = itemId;
      render();
      try {
        await api(`/api/incoming/receive/${itemId}`, {
          method: "PUT",
          body: JSON.stringify({ received_quantity: quantity }),
        });
        showToast("入库成功");
        await loadData();
      } catch (error) {
        showToast(error.message, true);
      } finally {
        state.busyItemId = null;
        render();
      }
    }

    function openRevert(itemId) {
      state.revertingItemId = itemId;
      $("revertReason").value = "";
      $("revertModal").hidden = false;
      window.setTimeout(() => $("revertReason").focus(), 50);
    }

    document.querySelectorAll(".tab-button").forEach((button) => {
      button.addEventListener("click", () => {
        state.activeTab = button.dataset.tab;
        document.querySelectorAll(".tab-button").forEach((item) => {
          const active = item.dataset.tab === state.activeTab;
          item.className = `tab-button min-h-14 rounded-lg px-3 text-lg font-bold ${active ? "bg-blue-700 text-white" : "bg-slate-200 text-slate-700"}`;
        });
        render();
      });
    });

    $("cardList").addEventListener("click", (event) => {
      if (event.target.closest("a[href]")) return;
      if (event.target.closest("[data-quantity]")) return;
      const receiveButton = event.target.closest("[data-receive]");
      const revertButton = event.target.closest("[data-revert]");
      if (receiveButton) {
        event.stopPropagation();
        receive(Number(receiveButton.dataset.receive));
        return;
      }
      if (revertButton) {
        event.stopPropagation();
        openRevert(Number(revertButton.dataset.revert));
        return;
      }
      const card = event.target.closest("[data-detail]");
      if (card) openDetail(Number(card.dataset.detail));
    });
    $("cardList").addEventListener("input", (event) => {
      const input = event.target.closest("[data-quantity]");
      if (!input) return;
      const item = findItem(Number(input.dataset.quantity));
      if (item) item.incoming_quantity = Number(input.value);
    });

    $("revertForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const reason = $("revertReason").value.trim();
      if (!reason) {
        showToast("请填写撤回原因", true);
        return;
      }
      const itemId = state.revertingItemId;
      $("revertModal").hidden = true;
      state.busyItemId = itemId;
      render();
      try {
        await api(`/api/incoming/revert/${itemId}`, {
          method: "PUT",
          body: JSON.stringify({ reason }),
        });
        showToast("已撤回，任务返回待收料");
        await loadData();
      } catch (error) {
        showToast(error.message, true);
      } finally {
        state.busyItemId = null;
        state.revertingItemId = null;
        render();
      }
    });

    $("refreshButton").addEventListener("click", loadData);
    $("closeDetail").addEventListener("click", () => { $("detailModal").hidden = true; });
    $("detailModal").addEventListener("click", (event) => {
      if (event.target === $("detailModal")) $("detailModal").hidden = true;
    });
    $("cancelRevert").addEventListener("click", () => {
      $("revertModal").hidden = true;
      state.revertingItemId = null;
    });

    (async () => {
      if (await checkAuth()) await loadData();
    })();
  </script>
</body>
</html>
