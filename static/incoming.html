<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>车间来料入库</title>
  <script src="/static/assets/time-utils.js?v=95c91f9ded41"></script>
  <style>
    /* 本地 Tailwind 资产加载失败时仍保留最基础的可操作样式，
       避免出现"只看到裸文字、没有任何 UI"的情况。 */
    [hidden] { display: none !important; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { -webkit-tap-highlight-color: transparent; margin: 0; background: #f1f5f9; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    button { touch-action: manipulation; font: inherit; cursor: pointer; }
    header { position: sticky; top: 0; z-index: 20; background: #0f172a; color: #fff; padding: 12px 16px; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.25rem; font-weight: 700; margin: 0; }
    main { box-sizing: border-box; width: 100%; max-width: 640px; min-width: 0; margin: 0 auto; padding: 12px; padding-bottom: 96px; }
    .card { min-width: 0; overflow-wrap: anywhere; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); margin-bottom: 10px; padding: 10px; }
    .card select, .card input { box-sizing: border-box; max-width: 100%; min-width: 0; }
    .btn-primary { background: #1d4ed8; color: #fff; border: none; border-radius: 10px; min-height: 44px; padding: 0 16px; font-weight: 700; }
    .btn-danger { background: #b91c1c; color: #fff; border: none; border-radius: 10px; min-height: 44px; padding: 0 16px; font-weight: 700; }
  </style>
  <link rel="stylesheet" href="/static/vendor/tailwindcss-3.4.17-incoming.min.css?v=77e10624d5e1">
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <header class="sticky top-0 z-20 border-b border-slate-300 bg-slate-900 px-4 py-3 text-white shadow">
    <div class="mx-auto flex max-w-2xl items-center justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold">车间来料入库</h1>
        <p id="userLabel" class="mt-0.5 text-sm text-slate-300">正在校验登录状态</p>
      </div>
      <button id="refreshButton" class="min-h-12 rounded-lg bg-blue-600 px-5 text-base font-bold active:bg-blue-700">
        刷新
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-2xl p-3 pb-24">
    <div id="authNotice" hidden class="mb-3 rounded-xl border border-red-300 bg-red-50 p-4 text-red-800">
      <p class="font-bold">登录已失效</p>
      <p class="mt-1 text-sm">请先在 ERP 登录页完成登录，登录后会自动返回本页面。</p>
      <a href="/?redirect=/incoming.html" class="mt-3 inline-flex min-h-12 items-center rounded-lg bg-red-700 px-5 font-bold text-white">前往登录</a>
    </div>

    <nav class="mb-3 grid grid-cols-2 gap-2 rounded-xl bg-white p-2 shadow-sm">
      <button data-tab="pending" class="tab-button min-h-14 rounded-lg bg-blue-700 px-3 text-lg font-bold text-white">
        待收料 <span id="pendingCount" class="ml-1 rounded-full bg-white/20 px-2 py-0.5 text-sm">0</span>
      </button>
      <button data-tab="received" class="tab-button min-h-14 rounded-lg bg-slate-200 px-3 text-lg font-bold text-slate-700">
        今日已收 <span id="receivedCount" class="ml-1 rounded-full bg-slate-300 px-2 py-0.5 text-sm">0</span>
      </button>
    </nav>

    <section id="pendingSearchPanel" class="mb-3 rounded-xl bg-white p-3 shadow-sm">
      <label for="pendingSearchInput" class="text-sm font-bold text-slate-700">查待收料：客户名称或报料长宽尺寸</label>
      <div class="mt-2 grid grid-cols-2 gap-2">
        <input id="pendingSearchInput" class="min-h-12 rounded-lg border-2 border-slate-300 bg-white p-2 text-base" maxlength="100" placeholder="例如：天华、14、1430×516">
        <select id="pendingDimensionMode" class="min-h-12 rounded-lg border-2 border-slate-300 bg-white p-2 text-base">
          <option value="any">任意报料边</option>
          <option value="length">只查报料长</option>
          <option value="width">只查报料宽</option>
        </select>
      </div>
      <div class="mt-2 grid grid-cols-2 gap-2">
        <button id="pendingSearchButton" class="min-h-12 rounded-lg bg-blue-700 px-4 font-bold text-white active:bg-blue-700">查询待收料</button>
        <button id="pendingSearchClear" class="min-h-12 rounded-lg bg-slate-200 px-4 font-bold text-slate-700">清除并显示全部</button>
      </div>
      <p id="pendingSearchStatus" class="mt-2 text-sm text-slate-500">当前显示全部待收料，每页 20 条。</p>
    </section>

    <div id="loadingState" class="rounded-xl bg-white p-8 text-center text-lg font-semibold text-slate-500 shadow-sm">
      正在读取来料任务...
    </div>
    <div id="errorState" hidden class="rounded-xl border border-red-300 bg-red-50 p-5 text-red-800">
      <p class="font-bold">加载失败</p>
      <p id="errorMessage" class="mt-1"></p>
      <button id="errorRetryButton" class="mt-3 min-h-12 w-full rounded-lg bg-red-700 px-5 text-base font-bold text-white active:bg-red-800">重新加载</button>
    </div>
    <section id="cardList" class="space-y-2"></section>
    <nav id="pendingPager" hidden class="mb-3 flex items-center justify-between gap-2 rounded-xl bg-white p-2 shadow-sm">
      <button id="pendingPreviousPage" class="min-h-12 rounded-lg bg-slate-200 px-4 font-bold text-slate-700 disabled:cursor-not-allowed disabled:opacity-50">上一页</button>
      <span id="pendingPageInfo" class="text-center text-sm font-semibold text-slate-600">第 1 / 1 页 · 共 0 条</span>
      <button id="pendingNextPage" class="min-h-12 rounded-lg bg-slate-200 px-4 font-bold text-slate-700 disabled:cursor-not-allowed disabled:opacity-50">下一页</button>
    </nav>
    <div id="emptyState" hidden class="rounded-xl bg-white p-8 text-center shadow-sm">
      <p class="text-xl font-bold text-slate-700">当前没有记录</p>
      <p class="mt-2 text-slate-500">点击右上角刷新重新检查。</p>
    </div>
  </main>

  <div id="revertModal" hidden class="fixed inset-0 z-50 flex items-end bg-black/60 sm:items-center sm:justify-center">
    <form id="revertForm" class="w-full rounded-t-2xl bg-white p-5 shadow-2xl sm:max-w-lg sm:rounded-2xl">
      <h2 class="text-xl font-bold text-red-700">确认撤回来料入库</h2>
      <p class="mt-2 text-slate-600">只撤回当前这一笔；系统会自动记录管理员、时间、关联记录和前后状态。</p>
      <div class="mt-4 grid grid-cols-2 gap-3">
        <button type="button" id="cancelRevert" class="min-h-14 rounded-xl bg-slate-200 text-lg font-bold">取消</button>
        <button type="submit" id="confirmRevert" class="min-h-14 rounded-xl bg-red-700 text-lg font-bold text-white disabled:bg-slate-400">确认撤回</button>
      </div>
    </form>
  </div>

  <!-- v0.23.0 P0-3：图纸在页面内查看，不再跳转常用箱弹窗、不再用新窗口丢失来料页面。
       支持 jpg/png/pdf；"返回来料入库"关闭本层即可回到卡片列表，不影响已输入的入库数量。 -->
  <div id="drawingViewer" hidden class="fixed inset-0 z-50 flex flex-col bg-black">
    <div class="flex items-center justify-between bg-slate-900 px-4 py-3 text-white shadow">
      <p class="font-bold">图纸预览</p>
      <button id="closeDrawingViewer" class="min-h-12 rounded-lg bg-blue-600 px-5 text-base font-bold active:bg-blue-700">返回来料入库</button>
    </div>
    <div class="flex-1 overflow-auto bg-slate-800 p-2">
      <img id="drawingViewerImage" hidden class="mx-auto max-w-full rounded-lg bg-white">
      <iframe id="drawingViewerFrame" hidden class="h-full w-full rounded-lg border-0 bg-white"></iframe>
    </div>
    <div class="bg-slate-900 px-4 py-3 text-center">
      <button id="closeDrawingViewerBottom" class="min-h-12 w-full rounded-lg bg-blue-600 px-5 text-base font-bold text-white active:bg-blue-700">返回来料入库</button>
    </div>
  </div>

  <div id="productionDetailViewer" hidden class="fixed inset-0 z-50 flex flex-col bg-black text-white">
    <div class="flex items-center justify-between bg-slate-900 px-4 py-3 text-white shadow">
      <div>
        <p class="font-bold">对应生产明细</p>
        <p class="text-sm text-slate-300">按当前待收料明细精确关联，不按款号跨订单猜测</p>
      </div>
      <button id="closeProductionDetail" class="min-h-12 rounded-lg bg-blue-600 px-5 text-base font-bold active:bg-blue-700">返回待收料</button>
    </div>
    <div id="productionDetailBody" class="flex-1 overflow-auto bg-slate-100 p-3 text-slate-900"></div>
  </div>

  <div id="toast" hidden class="fixed bottom-5 left-1/2 z-50 w-[calc(100%-2rem)] max-w-md -translate-x-1/2 rounded-xl bg-slate-900 px-5 py-4 text-center text-lg font-bold text-white shadow-xl"></div>

  <script>
    const state = {
      activeTab: "pending",
      pending: [],
      pendingTotal: 0,
      pendingPage: 1,
      pendingRetryPage: 1,
      pendingPageSize: 20,
      pendingLoading: false,
      pendingError: "",
      pendingAppliedQuery: "",
      pendingAppliedDimensionMode: "any",
      pendingAsOf: "",
      received: [],
      receivedLoaded: false,
      receivedLoading: false,
      receivedError: "",
      locationsLoading: false,
      locations: [],
      user: null,
      permissions: [],
      sessionIdentity: null,
      revertingItemId: null,
      busyItemIds: new Set(),
      receiveIdempotencyKeys: new Map(),
      revertIdempotencyKeys: new Map(),
      revertSubmitting: false,
      expandedIds: new Set(),
      authGeneration: 0,
      productionDetailRouteId: null,
      initialContentReported: false,
      performanceRequests: [],
    };

    const $ = (id) => document.getElementById(id);
    const requestControllers = new Map();
    const hasPermission = (code) => state.user?.role === "admin" || state.permissions.includes(code);
    const canOperate = () => hasPermission("incoming.execute");
    const incomingPerformancePrefix = "tm.mobile.incoming.";

    function markIncomingPerformance(stage) {
      if (!globalThis.performance || typeof globalThis.performance.mark !== "function") return;
      const name = `${incomingPerformancePrefix}${stage}`;
      globalThis.performance.clearMarks?.(name);
      globalThis.performance.mark(name);
    }

    function notifyIncomingPerformance(stage, extra = {}) {
      markIncomingPerformance(stage);
      if (!window.parent || window.parent === window || typeof window.parent.postMessage !== "function") return;
      window.parent.postMessage({
        type: "tm-mobile-incoming-performance",
        stage,
        ...extra,
      }, window.location.origin);
    }

    function recordIncomingRequestTiming(endpointAlias, response, startedAt, serverTiming, requestId) {
      if (!endpointAlias) return;
      const duration = globalThis.performance && typeof globalThis.performance.now === "function"
        ? globalThis.performance.now() - startedAt
        : 0;
      state.performanceRequests.push({
        endpoint_alias: String(endpointAlias).slice(0, 32),
        status: Number(response.status || 0),
        duration_ms: Math.round(Math.max(0, duration) * 10) / 10,
        server_timing: String(serverTiming || "").slice(0, 256),
        request_id: String(requestId || "").slice(0, 128),
      });
      state.performanceRequests = state.performanceRequests.slice(-8);
    }

    function reportIncomingContentReady() {
      if (state.initialContentReported) return;
      state.initialContentReported = true;
      window.requestAnimationFrame(() => {
        notifyIncomingPerformance("content-ready", {
          requests: state.performanceRequests.map(item => ({...item})),
        });
      });
    }

    function resetAuthenticatedIncomingState({abortRequests = false} = {}) {
      if (abortRequests) {
        for (const controller of requestControllers.values()) controller.abort();
        requestControllers.clear();
      }
      state.pending = [];
      state.pendingTotal = 0;
      state.pendingPage = 1;
      state.pendingRetryPage = 1;
      state.pendingLoading = false;
      state.pendingError = "";
      state.pendingAppliedQuery = "";
      state.pendingAppliedDimensionMode = "any";
      state.pendingAsOf = "";
      state.productionDetailRouteId = null;
      state.received = [];
      state.receivedLoaded = false;
      state.receivedLoading = false;
      state.receivedError = "";
      state.locations = [];
      state.locationsLoading = false;
      state.busyItemIds.clear();
      state.receiveIdempotencyKeys.clear();
      state.revertIdempotencyKeys.clear();
      state.revertingItemId = null;
      state.revertSubmitting = false;
      state.expandedIds = new Set();
      state.sessionIdentity = null;
      state.initialContentReported = false;
      state.performanceRequests = [];
      $("pendingCount").textContent = "0";
      $("receivedCount").textContent = "0";
      $("cardList").innerHTML = "";
      $("pendingPager").hidden = true;
      $("emptyState").hidden = true;
      $("loadingState").hidden = true;
      if ($("productionDetailViewer")) $("productionDetailViewer").hidden = true;
      if ($("productionDetailBody")) $("productionDetailBody").innerHTML = "";
      if ($("pendingSearchInput")) $("pendingSearchInput").value = "";
      if ($("pendingDimensionMode")) $("pendingDimensionMode").value = "any";
    }

    function beginLatestRequest(key) {
      requestControllers.get(key)?.abort();
      const controller = new AbortController();
      requestControllers.set(key, controller);
      return controller;
    }

    function finishLatestRequest(key, controller) {
      if (requestControllers.get(key) === controller) requestControllers.delete(key);
    }

    function isLatestRequest(key, controller) {
      return requestControllers.get(key) === controller && !controller.signal.aborted;
    }

    function createIdempotencyKey() {
      const cryptoApi = globalThis.crypto;
      if (cryptoApi && typeof cryptoApi.randomUUID === "function") return cryptoApi.randomUUID();
      if (cryptoApi && typeof cryptoApi.getRandomValues === "function") {
        const values = new Uint32Array(4);
        cryptoApi.getRandomValues(values);
        return Array.from(values, value => value.toString(16).padStart(8, "0")).join("");
      }
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showToast(message, isError = false) {
      const toast = $("toast");
      toast.textContent = message;
      toast.className = `fixed bottom-5 left-1/2 z-50 w-[calc(100%-2rem)] max-w-md -translate-x-1/2 rounded-xl px-5 py-4 text-center text-lg font-bold text-white shadow-xl ${isError ? "bg-red-700" : "bg-slate-900"}`;
      toast.hidden = false;
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => { toast.hidden = true; }, 2400);
    }

    // v0.23.0 P0-2：把网络层/后端的英文或原始异常文案统一转成中文提示，
    // 避免车间同事在弱网或后端报错时看到无法理解的原始报错文本。
    function toChineseMessage(error) {
      const raw = String(error?.message || error || "").trim();
      if (!raw) return "操作失败，请重试";
      if (/failed to fetch|networkerror|load failed|timeout/i.test(raw)) {
        return "网络连接失败，请检查网络后点击“重新加载”";
      }
      return raw;
    }

    function formatApiDetail(detail) {
      if (typeof detail === "string") return detail.trim();
      if (Array.isArray(detail)) {
        return detail.map(item => formatApiDetail(item)).filter(Boolean).join("；");
      }
      if (detail && typeof detail === "object") {
        const message = String(detail.message || detail.msg || "").trim();
        const code = String(detail.code || "").trim();
        if (message) return code ? `${message}（${code}）` : message;
        if (code) return `操作失败（${code}）`;
      }
      return "";
    }

    async function api(url, options = {}, endpointAlias = "") {
      // v0.23.0 P0-2：来料相关接口一律禁止缓存，避免手机浏览器复用上一次的旧数据。
      const bustUrl = url.includes("?") ? `${url}&_=${Date.now()}` : `${url}?_=${Date.now()}`;
      const startedAt = globalThis.performance && typeof globalThis.performance.now === "function"
        ? globalThis.performance.now()
        : 0;
      let response;
      try {
        response = await fetch(bustUrl, {
          credentials: "same-origin",
          cache: "no-store",
          ...options,
          headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        });
      } catch (networkError) {
        if (networkError?.name === "AbortError") throw networkError;
        throw new Error("网络连接失败，请检查网络后重试");
      }
      const responseText = await response.text().catch(() => "");
      let data = {};
      if (responseText) {
        try {
          data = JSON.parse(responseText);
        } catch (_error) {
          data = {};
        }
      }
      const responseSessionIdentity = response.headers && typeof response.headers.get === "function"
        ? String(response.headers.get("X-ERP-Session-Identity") || "")
        : "";
      if (responseSessionIdentity) data.session_identity_header = responseSessionIdentity;
      if (typeof recordIncomingRequestTiming === "function") {
        const serverTiming = response.headers && typeof response.headers.get === "function"
          ? response.headers.get("Server-Timing")
          : "";
        const requestId = response.headers && typeof response.headers.get === "function"
          ? response.headers.get("X-Request-ID")
          : "";
        recordIncomingRequestTiming(endpointAlias, response, startedAt, serverTiming, requestId);
      }
      if (response.ok && endpointAlias === "pending-initial" && typeof notifyIncomingPerformance === "function") {
        notifyIncomingPerformance("data-ready");
      }
      if (response.status === 401) {
        resetAuthenticatedIncomingState({abortRequests: true});
        state.authGeneration += 1;
        state.user = null;
        state.permissions = [];
        state.sessionIdentity = null;
        $("authNotice").hidden = false;
        const authError = new Error("登录已失效，请重新登录");
        authError.status = 401;
        throw authError;
      }
      if (!response.ok) {
        const detail = formatApiDetail(data.detail);
        const fallback = response.status >= 500
          ? `服务器内部错误（HTTP ${response.status}），请稍后重试`
          : `请求失败（HTTP ${response.status}）`;
        const apiError = new Error(detail || fallback);
        apiError.status = response.status;
        apiError.detail = data.detail;
        throw apiError;
      }
      return data;
    }

    async function checkAuth() {
      try {
        const previousUserId = state.user?.id ?? null;
        const data = await api("/api/auth/me", {}, "auth-initial");
        if (previousUserId !== null && String(previousUserId) !== String(data.user?.id ?? "")) {
          resetAuthenticatedIncomingState({abortRequests: true});
        }
        state.authGeneration += 1;
        state.user = data.user;
        state.permissions = data.permissions || [];
        state.sessionIdentity = data.session_identity || null;
        if (!hasPermission("incoming.view")) {
          resetAuthenticatedIncomingState({abortRequests: true});
          $("authNotice").textContent = "当前账号没有来料入库查看权限，请联系管理员。";
          $("authNotice").hidden = false;
          return false;
        }
        $("userLabel").textContent = `${data.user.real_name} · ${data.user.role}`;
        $("authNotice").hidden = true;
        if (!state.initialContentReported && typeof notifyIncomingPerformance === "function") {
          notifyIncomingPerformance("auth-ready");
        }
        return true;
      } catch (error) {
        $("userLabel").textContent = "未登录";
        $("loadingState").hidden = true;
        $("cardList").innerHTML = "";
        $("emptyState").hidden = true;
        if (error?.status === 401) {
          // v0.23.0 P0-2：未登录时明确显示登录入口；登录页会安全返回本页面。
          $("errorState").hidden = true;
          $("authNotice").hidden = false;
        } else {
          // 网络异常不能误报为未登录，否则员工会反复登录仍无法解决。
          $("authNotice").hidden = true;
          $("errorMessage").textContent = toChineseMessage(error);
          $("errorState").hidden = false;
        }
        return false;
      }
    }

    function formatDate(value) {
      return value || "未指定";
    }

    function formatBoardDimension(value) {
      if (value === null || value === undefined || value === "") return "-";
      const number = Number(value);
      if (!Number.isFinite(number)) return String(value || "-").trim() || "-";
      return `${Math.round(number)}mm`;
    }

    function formatBoardSpec(length, width) {
      if (length === null || length === undefined || length === "" || width === null || width === undefined || width === "") {
        return "未填写";
      }
      return `${formatBoardDimension(length)} × ${formatBoardDimension(width)}`;
    }

    function formatCreaseValue(value) {
      if (value === null || value === undefined || value === "") return null;
      const number = Number(value);
      return Number.isFinite(number) ? Math.round(number) : null;
    }

    function formatCreaseSpec(left, middle, right) {
      const l = formatCreaseValue(left);
      const m = formatCreaseValue(middle);
      const r = formatCreaseValue(right);
      if (l === null || m === null || r === null) return "-";
      return `${l} + ${m} + ${r}`;
    }

    function formatCreaseDisplay(item) {
      const creaseType = String(item.snapshot_crease_type || "").trim();
      const spec = formatCreaseSpec(
        item.snapshot_crease_left_mm,
        item.snapshot_crease_middle_mm,
        item.snapshot_crease_right_mm,
      );
      if (spec !== "-") return spec;
      if (creaseType === "压线") return "压线";
      if (creaseType === "毛片") return "毛片";
      if (creaseType === "净料") return "净料";
      return "-";
    }

    function formatMaterialDisplay(item) {
      const code = (item.material_code || item.material || "").trim();
      const flute = (item.flute_type || "").trim();
      if (code && flute) return `${code} / ${flute}`;
      return code || "-";
    }

    function formatTime(value) {
      if (!value) return "";
      return TmTime.formatBeijingDateTime(value);
    }

    function hasDrawing(item) {
      return !!(item.drawing_path && String(item.drawing_path).trim());
    }

    function receiptExecutionIssue(item) {
      const reserveQuantity = Math.max(Number(item?.remaining_reserve_purpose_sheet_qty ?? item?.expected_reserve_purpose_sheet_qty ?? 0), 0);
      const orderQuantity = Math.max(Number(item?.remaining_order_purpose_sheet_qty ?? item?.expected_order_purpose_sheet_qty ?? 0), 0);
      const reserveNeeded = reserveQuantity > 0 && Number(item?.incoming_quantity || 0) > orderQuantity;
      if (
        item?.receipt_execution_ready === false
        && item?.reserve_location_ready === false
        && !reserveNeeded
        && item?.finished_location_ready !== false
      ) return "";
      if (
        item?.receipt_execution_ready !== false
        && item?.receipt_location_ready !== false
        && item?.finished_location_ready !== false
      ) return "";
      const purposeIssue = String(item?.purpose_issue || "").trim();
      if (purposeIssue) return purposeIssue;
      if (item?.finished_location_ready === false) {
        return "成品入库位置尚未准备好，请先在仓库实测地图发布可用库位";
      }
      return "当前收料位置尚未准备好，请刷新后重试";
    }

    function isPdfPath(path) {

                <div class="col-span-2"><p class="text-slate-500">产品名称</p><p class="font-bold break-words">${escapeHtml(item.product_name)}</p></div>

                <div><p class="text-slate-500">订单号</p><p class="font-bold break-words">${escapeHtml(item.order_number)}</p></div>

              </div>
              ${productionDetailButton}
              ${!isPending && state.user?.role === "admin" && item.can_revert_receipt !== false
                ? `<button data-revert="${key}" ${disabled ? "disabled" : ""} class="min-h-12 w-full rounded-xl bg-red-700 px-4 text-base font-bold text-white disabled:bg-slate-400">撤回</button>`
                : ""}
            </div>` : "";

      return `
          <article data-detail="${key}" class="rounded-xl border-l-4 ${isPending ? "border-orange-500" : "border-green-600"} bg-white p-2 shadow-sm active:bg-slate-50">

              <div class="rounded-lg bg-blue-50 p-2"><p class="text-xs font-semibold text-blue-700">报料尺寸</p><p class="mt-0.5 text-lg font-black text-blue-950 break-words">${escapeHtml(formatBoardSpec(item.cardboard_len, item.cardboard_width))}</p><p class="mt-1 text-xs font-semibold text-blue-700">压线：<span class="text-blue-950">${escapeHtml(formatCreaseDisplay(item))}</span></p></div>
              <span class="shrink-0 rounded-full ${isPending ? "bg-orange-100 text-orange-800" : "bg-green-100 text-green-800"} px-2 py-1 text-xs font-bold">
                ${isPending ? "待收料" : "已实收"}
              </span>
            </div>
            <div class="mt-1.5 grid grid-cols-3 gap-2">
              <div class="col-span-2 rounded-lg bg-slate-100 p-2"><p class="text-xs text-slate-500">入库数量</p>${quantityBlock}</div>
              <div class="flex items-center">${drawingButton}</div>
            </div>
            <p class="mt-1.5 break-words text-xs text-slate-500">${escapeHtml(item.customer_name)} · ${escapeHtml(item.product_code || "未填写")} · ${escapeHtml(item.product_name)}</p>
            <p class="mt-1 text-xs text-slate-600">计划 ${planned}｜已收 ${cumulative}｜待收 ${Math.max(planned-cumulative,0)}</p>
            ${searchMatchBlock}
            ${decisionBlock}

            ${primaryAction ? `<div class="mt-1.5">${primaryAction}</div>` : ""}

            <p class="mt-1 text-center text-xs text-slate-400">${expanded ? "点击卡片收起" : "点击卡片查看更多详情"}</p>

    function applyIncomingPrimarySpecLayout(items) {
      const cards = Array.from($("cardList").children || []);
      cards.forEach((card, index) => {
        const item = items[index];
        const primaryRow = card.firstElementChild;
        if (!item || !primaryRow || primaryRow.dataset.layoutApplied === "1") return;
        const badge = primaryRow.lastElementChild?.outerHTML || "";
        primaryRow.innerHTML = `
              <div class="min-w-0 flex-1 grid grid-cols-2 gap-2">
                <div class="rounded-lg bg-blue-50 p-2"><p class="text-xs font-semibold text-blue-700">报料尺寸</p><p class="mt-0.5 text-lg font-black text-blue-950 break-words">${escapeHtml(formatBoardSpec(item.cardboard_len, item.cardboard_width))}</p></div>
                <div class="rounded-lg bg-indigo-50 p-2"><p class="text-xs font-semibold text-indigo-700">压线尺寸</p><p class="mt-0.5 text-lg font-black text-indigo-950 break-words">${escapeHtml(formatCreaseDisplay(item))}</p></div>
              </div>
              ${badge}`;
        primaryRow.dataset.layoutApplied = "1";
      });
    }
    function render() {
      const items = state[state.activeTab];
      const pendingPageCount = Math.max(1, Math.ceil(Number(state.pendingTotal || 0) / Number(state.pendingPageSize || 20)));
      $("pendingSearchPanel").hidden = state.activeTab !== "pending";
      $("pendingSearchStatus").textContent = state.pendingAppliedQuery
        ? `当前条件：${state.pendingAppliedQuery}（${state.pendingAppliedDimensionMode === "length" ? "报料长" : state.pendingAppliedDimensionMode === "width" ? "报料宽" : "任意报料边/客户"}），共 ${state.pendingTotal} 条${state.pendingAsOf ? ` · ${state.pendingAsOf}` : ""}`
        : `当前显示全部待收料，每页 ${state.pendingPageSize} 条。`;
      $("pendingCount").textContent = state.pendingTotal;
      $("receivedCount").textContent = state.received.length;
      $("pendingPager").hidden = state.activeTab !== "pending";
      $("pendingPageInfo").textContent = `第 ${state.pendingPage} / ${pendingPageCount} 页 · 共 ${state.pendingTotal} 条`;
      $("pendingPreviousPage").disabled = state.pendingLoading || state.pendingPage <= 1;
      $("pendingNextPage").disabled = state.pendingLoading || state.pendingPage >= pendingPageCount;
      if (state.activeTab === "pending") {
        $("loadingState").hidden = !state.pendingLoading || state.pending.length > 0;
        $("errorState").hidden = !state.pendingError;
        if (state.pendingError) $("errorMessage").textContent = state.pendingError;
      } else {
        $("loadingState").hidden = true;
        if (state.user) $("errorState").hidden = true;
      }
      const pendingBusy = state.activeTab === "pending" && state.pendingLoading && !items.length;
      const pendingFailed = state.activeTab === "pending" && state.pendingError && !items.length;
      const receivedPending = state.activeTab === "received" && state.receivedLoading && !items.length;
      const receivedFailed = state.activeTab === "received" && state.receivedError && !items.length;
      $("emptyState").hidden = items.length !== 0 || pendingBusy || pendingFailed || receivedPending || receivedFailed;
      if (receivedPending) {
        $("cardList").innerHTML = '<div class="empty">正在读取今日已收记录…</div>';
      } else if (receivedFailed) {
        $("cardList").innerHTML = `<div class="empty">${escapeHtml(state.receivedError)}</div>`;
      } else {
        $("cardList").innerHTML = items.map(renderCard).join("");
      }
      applyIncomingPrimarySpecLayout(items);
    }

    async function applyPendingSearch() {
      const query = String($("pendingSearchInput").value || "").trim();
      const dimensionMode = String($("pendingDimensionMode").value || "any");
      if (!query) {
        showToast("请输入客户名称或报料尺寸", true);
        return false;
      }
      return loadPending({page: 1, query, dimensionMode});
    }

    async function clearPendingSearch() {
      $("pendingSearchInput").value = "";
      $("pendingDimensionMode").value = "any";
      return loadPending({page: 1, query: "", dimensionMode: "any"});
    }

    async function loadPending({page = state.pendingPage || 1} = {}) {
      const options = arguments[0] || {};
      const authorizationPromise = options.authorizationPromise || null;
      const query = Object.prototype.hasOwnProperty.call(options, "query")
        ? options.query
        : state.pendingAppliedQuery;
      const dimensionMode = Object.prototype.hasOwnProperty.call(options, "dimensionMode")
        ? options.dimensionMode
        : state.pendingAppliedDimensionMode;
      const requestedPage = Math.max(1, Number(page) || 1);
      const pageSize = Math.max(1, Number(state.pendingPageSize) || 20);
      const requestedQuery = String(query || "").trim();
      const requestedDimensionMode = ["any", "length", "width"].includes(dimensionMode) ? dimensionMode : "any";
      let authGeneration = Number(state.authGeneration || 0);
      let userId = String(state.user?.id ?? "");
      const controller = beginLatestRequest("incoming:pending");
      state.pendingRetryPage = requestedPage;
      state.pendingLoading = true;
      state.pendingError = "";
      $("errorState").hidden = true;
      if (!state.pending.length) $("loadingState").hidden = false;
      render();
      try {
        const params = new URLSearchParams({
          page: String(requestedPage),
          page_size: String(pageSize),
        });
        let endpoint = "/api/incoming/pending";
        if (requestedQuery) {
          endpoint = "/api/mobile/erp/incoming/search";
          params.set("q", requestedQuery);
          params.set("dimension_mode", requestedDimensionMode);
        }
        const pendingPromise = api(
          `${endpoint}?${params.toString()}`,
          {signal: controller.signal},
          authorizationPromise ? "pending-initial" : (requestedQuery ? "pending-search" : "pending"),
        );
        let pending;
        if (authorizationPromise) {
          const [authorizationResult, pendingResult] = await Promise.allSettled([authorizationPromise, pendingPromise]);
          if (!isLatestRequest("incoming:pending", controller)) return false;
          if (authorizationResult.status !== "fulfilled" || authorizationResult.value !== true) return false;
          authGeneration = Number(state.authGeneration || 0);
          userId = String(state.user?.id ?? "");
          if (pendingResult.status === "rejected") throw pendingResult.reason;
          pending = pendingResult.value;
        } else {
          pending = await pendingPromise;
        }
        const authIdentity = state.sessionIdentity;
        const pendingIdentity = String(pending.session_identity_header || "");
        const expectedIdentity = `${authIdentity?.user_id ?? ""}:${authIdentity?.auth_version ?? ""}`;
        if (!authIdentity || !pendingIdentity || pendingIdentity !== expectedIdentity) {
          resetAuthenticatedIncomingState({abortRequests: true});
          state.authGeneration += 1;
          state.user = null;
          state.permissions = [];
          state.sessionIdentity = null;
          const identityError = new Error("登录状态已变化，请重新加载后继续");
          identityError.status = 409;
          throw identityError;
        }
        if (!isLatestRequest("incoming:pending", controller)) return false;
        if (Number(state.authGeneration || 0) !== authGeneration || String(state.user?.id ?? "") !== userId) return false;
        const previousPage = Number(state.pendingPage || 1);
        const rows = Array.isArray(pending.items) ? pending.items : [];
        const resolvedPage = Math.max(1, Number(pending.page) || requestedPage);
        const resolvedPageSize = Math.max(1, Number(pending.page_size) || pageSize);
        const total = Number.isFinite(Number(pending.total)) ? Math.max(0, Number(pending.total)) : rows.length;
        state.pending = rows.map(item => ({...item,incoming_quantity:Number(item.remaining_quantity ?? item.incoming_quantity ?? item.requisition_qty ?? item.quantity ?? 0),resolution_action:"",resolution_reason:"",surplus_location_id:null}));
        state.pendingTotal = total;
        state.pendingPage = resolvedPage;
        state.pendingRetryPage = resolvedPage;
        state.pendingPageSize = resolvedPageSize;
        state.pendingAppliedQuery = requestedQuery;
        state.pendingAppliedDimensionMode = requestedQuery ? requestedDimensionMode : "any";
        state.pendingAsOf = String(pending.as_of || "");
        const currentIds = new Set(state.pending.map(item => String(item.history_key || item.item_id)));
        state.expandedIds = resolvedPage === previousPage
          ? new Set([...state.expandedIds].filter(itemId => currentIds.has(String(itemId))))
          : new Set();
        state.pendingError = "";
        $("errorState").hidden = true;
        render();
        if (!state.initialContentReported && typeof reportIncomingContentReady === "function") reportIncomingContentReady();
        return true;
      } catch (error) {
        if (error?.name === "AbortError" || !isLatestRequest("incoming:pending", controller)) return false;
        if (Number(state.authGeneration || 0) !== authGeneration || String(state.user?.id ?? "") !== userId) return false;
        if (error?.status === 401) {
          state.pendingError = "";
          $("errorState").hidden = true;
          $("authNotice").hidden = false;
        } else {
          state.pendingError = toChineseMessage(error);
          $("errorMessage").textContent = state.pendingError;
          $("errorState").hidden = false;
        }
        render();
        return false;
      } finally {
        if (isLatestRequest("incoming:pending", controller)) {
          state.pendingLoading = false;
          $("loadingState").hidden = true;
          render();
        }
        finishLatestRequest("incoming:pending", controller);
      }
    }

    async function changePendingPage(nextPage) {
      if (state.pendingLoading) return false;
      const pageCount = Math.max(1, Math.ceil(Number(state.pendingTotal || 0) / Number(state.pendingPageSize || 20)));
      const targetPage = Math.min(pageCount, Math.max(1, Number(nextPage) || 1));
      if (targetPage === state.pendingPage) return true;
      return loadPending({page: targetPage});
    }

    async function loadReceived({force = false} = {}) {
      if (!force && state.receivedLoaded) return true;
      const controller = beginLatestRequest("incoming:received");
      state.receivedLoading = true;
      state.receivedError = "";
      render();
      try {
        const received = await api("/api/incoming/received", {signal: controller.signal});
        if (!isLatestRequest("incoming:received", controller)) return false;
        state.received = received.items || [];
        state.receivedLoaded = true;
        render();
        return true;
      } catch (error) {
        if (error?.name !== "AbortError" && isLatestRequest("incoming:received", controller)) {
          state.receivedError = `读取今日实收失败：${toChineseMessage(error)}`;
          render();
          showToast(state.receivedError, true);
        }
        return false;
      } finally {
        if (requestControllers.get("incoming:received") === controller) {
          state.receivedLoading = false;
          render();
        }
        finishLatestRequest("incoming:received", controller);
      }
    }

    async function ensureSurplusLocations() {
      if (!canOperate() || state.locations.length || state.locationsLoading) return;
      const controller = beginLatestRequest("incoming:surplus-locations");
      state.locationsLoading = true;
      try {
        const locations = await api("/api/incoming/surplus-locations", {signal: controller.signal});
        state.locations = locations.items || [];
        render();
      } catch (error) {
        if (error?.name !== "AbortError") showToast("半成品库位读取失败，请重试后再确认余量入库", true);
      } finally {
        if (requestControllers.get("incoming:surplus-locations") === controller) state.locationsLoading = false;
        finishLatestRequest("incoming:surplus-locations", controller);
      }
    }

    async function loadData() {
      if (state.activeTab === "received") return loadReceived({force: true});
      return loadPending({page: state.pendingPage});
    }

    async function refreshAfterIncomingWrite() {
      const tasks = [loadPending({page: state.pendingPage})];
      if (state.receivedLoaded) tasks.push(loadReceived({force: true}));
      const results = await Promise.all(tasks);
      return results[0] === true;
    }

    function findItem(itemId) {
      return [...state.pending, ...state.received].find((item) => String(item.history_key || item.item_id) === String(itemId));
    }

    function toggleExpand(itemId) {
      if (state.expandedIds.has(itemId)) state.expandedIds.delete(itemId);
      else state.expandedIds.add(itemId);
      render();
    }

    function openDrawing(itemId) {
      const item = findItem(itemId);
      if (!item || !hasDrawing(item)) return;
      const pdf = !!item.drawing_is_pdf || isPdfPath(item.drawing_path);
      $("drawingViewerImage").hidden = pdf;
      $("drawingViewerFrame").hidden = !pdf;
      if (pdf) {
        $("drawingViewerFrame").src = item.drawing_path;
        $("drawingViewerImage").removeAttribute("src");
      } else {
        $("drawingViewerImage").src = item.drawing_path;
        $("drawingViewerFrame").removeAttribute("src");
      }
      $("drawingViewer").hidden = false;
    }

    function closeDrawing() {
      // v0.23.0 P0-3："返回来料入库"只关闭预览层，绝不触发 loadData/render，
      // 保证卡片列表和用户已输入的入库数量原样保留。
      $("drawingViewer").hidden = true;
      $("drawingViewerFrame").removeAttribute("src");
      $("drawingViewerImage").removeAttribute("src");
    }

    function renderProductionDetail(payload) {
      const item = payload.incoming_item || {};
      const tasks = Array.isArray(payload.production_tasks) ? payload.production_tasks : [];
      const taskCards = tasks.length
        ? tasks.map(task => `
            <article class="rounded-xl bg-white p-3 shadow-sm">
              <div class="flex items-start justify-between gap-2">
                <div><p class="text-sm text-slate-500">生产任务 #${escapeHtml(task.task_id)}</p><p class="text-lg font-black">${escapeHtml(task.product_code || "未填款号")} · ${escapeHtml(task.product_name || "未填名称")}</p></div>
                <span class="rounded-full bg-blue-50 px-2 py-1 text-sm font-bold text-blue-700">${escapeHtml(task.status_text || task.status)}</span>
              </div>
              <div class="mt-2 grid grid-cols-2 gap-2 text-sm">
                <div><p class="text-slate-500">订单号</p><p class="font-bold">${escapeHtml(task.order_number || "-")}</p></div>
                <div><p class="text-slate-500">${task.receipt_purpose_managed ? "已自动形成" : "计划生产"}</p><p class="font-bold">${escapeHtml(task.receipt_purpose_managed ? (task.actual_output_quantity ?? 0) : (task.planned_output_quantity ?? task.order_quantity ?? 0))} 只</p></div>
                <div><p class="text-slate-500">当前可生产</p><p class="font-bold">${escapeHtml(task.current_producible_quantity ?? 0)} 只</p></div>
                <div><p class="text-slate-500">工艺</p><p class="font-bold">${escapeHtml(task.production_process || task.cutting_mode || "-")}</p></div>
              </div>
              ${task.receipt_purpose_managed && task.completion_block_message ? `<p class="mt-2 rounded-lg bg-blue-50 p-2 text-sm font-bold text-blue-800">${escapeHtml(task.completion_block_message)}</p>` : ""}
            </article>`).join("")
        : `<div class="rounded-xl bg-white p-5 text-center font-bold text-slate-600">${escapeHtml(payload.message || "未生成生产任务")}</div>`;
      $("productionDetailBody").innerHTML = `
        <div class="mb-3 rounded-xl bg-white p-3 shadow-sm">
          <p class="text-sm text-slate-500">本次精确关联的待收料</p>
          <p class="text-lg font-black">${escapeHtml(item.customer_name)} · ${escapeHtml(item.product_code || "未填款号")}</p>
          <p class="mt-1 text-sm">${escapeHtml(item.product_name)} · 报料 ${escapeHtml(formatBoardSpec(item.cardboard_len, item.cardboard_width))} · 订单 ${escapeHtml(item.order_number)}</p>
        </div>
        <div class="space-y-2">${taskCards}</div>`;
    }

    async function openProductionDetail(itemId) {
      const item = findItem(itemId);
      if (!item?.production_detail_url) return false;
      const routeId = String(item.item_id);
      const authGeneration = Number(state.authGeneration || 0);
      const userId = String(state.user?.id ?? "");
      const controller = beginLatestRequest("incoming:production-detail");
      state.productionDetailRouteId = routeId;
      $("productionDetailBody").innerHTML = '<div class="rounded-xl bg-white p-5 text-center font-bold text-slate-600">正在读取对应生产明细...</div>';
      $("productionDetailViewer").hidden = false;
      try {
        const payload = await api(item.production_detail_url, {signal: controller.signal});
        if (!isLatestRequest("incoming:production-detail", controller)) return false;
        if (Number(state.authGeneration || 0) !== authGeneration || String(state.user?.id ?? "") !== userId) return false;
        if (String(state.productionDetailRouteId || "") !== routeId) return false;
        renderProductionDetail(payload);
        return true;
      } catch (error) {
        if (error?.name !== "AbortError" && isLatestRequest("incoming:production-detail", controller)) {
          $("productionDetailBody").innerHTML = `<div class="rounded-xl bg-white p-5 text-center font-bold text-red-700">${escapeHtml(toChineseMessage(error))}</div>`;
        }
        return false;
      } finally {
        finishLatestRequest("incoming:production-detail", controller);
      }
    }

    function closeProductionDetail() {
      requestControllers.get("incoming:production-detail")?.abort();
      requestControllers.delete("incoming:production-detail");
      state.productionDetailRouteId = null;
      $("productionDetailViewer").hidden = true;
      $("productionDetailBody").innerHTML = "";
    }

    async function ensureAutomaticReceiptFact(item) {
      if (item?.purpose_status !== "frozen" || item.receipt_fact_ready) return;
      const executionIssue = receiptExecutionIssue(item);
      if (executionIssue) throw new Error(executionIssue);
      const payload = {
        actual_material_id: Number(item.material_variance_actual_material_id || item.actual_material_id || item.formal_material_id) || null,
        purchase_purpose_source_snapshot_id: Number(item.purchase_purpose_source_snapshot_id || 0),
        purpose_snapshot_version: Number(item.expected_purpose_snapshot_version || 0),
        receipt_plan_fingerprint: String(item.receipt_plan_fingerprint || ""),
        expected_source_version: Number(item.expected_source_version || 0),
        expected_latest_receipt_fact_version: Number(item.latest_receipt_fact_version ?? item.expected_receipt_fact_version ?? 0),
        material_variance_approval_id: Number(item.material_variance_approval_id || 0) || null,
        idempotency_key: item._automatic_receipt_fact_key || createIdempotencyKey(),
      };
      item._automatic_receipt_fact_key = payload.idempotency_key;
      const fact = await api(`/api/requisition/purchase-sources/${encodeURIComponent(item.source_key)}/receipt-facts/auto`, {
        method: "PUT",
        body: JSON.stringify(payload),
      });
      item.receipt_fact_ready = true;
      item.expected_receipt_fact_version = Number(fact.receipt_fact_version);
      item.latest_receipt_fact_version = Number(fact.receipt_fact_version);
      item.expected_actual_material_version = Number(fact.actual_material_version);
      item.actual_material_fingerprint = String(fact.actual_material_fingerprint || "");
    }

    function recordReceiptPriceError(item, error) {
      const code = String(error?.detail?.code || "");
      if (!code.startsWith("SUPPLIER_RECEIPT_") && !["PAPERBOARD_PURCHASE_SOURCE_MISSING", "PURCHASE_RECEIPT_FACT_REQUIRED", "MATERIAL_MASTER_PRICE_REQUIRED"].includes(code)) return false;
      item._receipt_price_error = String(error.detail.message || toChineseMessage(error));
      return true;
    }

    async function receive(itemId) {
      const key = String(itemId);
      if (state.busyItemIds.has(key)) return;
      const item = findItem(itemId);
      const executionIssue = receiptExecutionIssue(item);
      if (executionIssue) {
        showToast(executionIssue, true);
        return;
      }
      const quantity = Number(item?.incoming_quantity);
      if (!Number.isInteger(quantity) || quantity <= 0) {
        showToast("入库数量必须是大于0的整数", true);
        return;
      }
      const planned = Number(item.planned_quantity ?? item.requisition_qty ?? item.quantity ?? 0);
      const projectedVariance = Number(item.cumulative_received_quantity || 0) + quantity - planned;
      let action = null;
      if (item.purpose_status === "legacy_unset") {
        action = projectedVariance === 0 ? null : (item.resolution_action || null);
        if (projectedVariance < 0 && !["await_supplier", "accept_short"].includes(action)) {
          showToast("短收时请选择继续等待补货或按当前数量结单", true);
          return;
        }
        if (projectedVariance > 0 && !["all_to_production", "transfer_to_semi_inventory"].includes(action)) {
          showToast("超收时请选择全部投入生产或余量转半成品库存", true);
          return;
        }
        if (action === "transfer_to_semi_inventory" && state.locationsLoading) {
          showToast("正在读取半成品库位，请稍候再确认", true);
          return;
        }
        if (action === "transfer_to_semi_inventory" && !Number(item.surplus_location_id)) {
          showToast("余量转半成品库存时必须选择库位", true);
          return;
        }
      }
      const operationKey = state.receiveIdempotencyKeys.get(key) || createIdempotencyKey();
      state.receiveIdempotencyKeys.set(key, operationKey);
      state.busyItemIds.add(key);
      render();
      try {
        await ensureAutomaticReceiptFact(item);
        const surplusLocation = state.locations.find(location => Number(location.id) === Number(item.surplus_location_id));
        const result = await api(`/api/incoming/receive/${item.item_id}`, {
          method: "PUT",
          body: JSON.stringify({
            received_quantity: quantity,
            resolution_action: action,
            resolution_reason: String(item.resolution_reason || "").trim() || null,
            surplus_location_id: Number(item.surplus_location_id) || null,
            expected_surplus_layout_version: surplusLocation?.layout_version || null,
            purchase_purpose_source_snapshot_id: item.purchase_purpose_source_snapshot_id ?? null,
            expected_receipt_fact_version: item.expected_receipt_fact_version ?? null,
            expected_purpose_snapshot_version: item.expected_purpose_snapshot_version ?? null,
            receipt_plan_fingerprint: item.receipt_plan_fingerprint || null,
            expected_actual_material_version: item.expected_actual_material_version ?? null,
            actual_material_fingerprint: item.actual_material_fingerprint || null,
            idempotency_key: operationKey,
          }),
        });
        const refreshed = await refreshAfterIncomingWrite();
        if (refreshed) {
          state.receiveIdempotencyKeys.delete(key);
          const purpose = result.purpose_allocation;
          const purposeMessage = purpose
            ? `；订单用途 ${purpose.order_sheet_delta || 0} 张，片料备库 ${purpose.reserve_sheet_delta || 0} 张，形成成品 ${purpose.theoretical_finished_delta || 0} 只`
            : "";
          showToast((result.material_status === "pending" ? `已记录实收，仍待补 ${result.remaining_quantity} 张` : "入库成功") + purposeMessage);
        } else {
          showToast("入库已提交，但列表刷新失败；请点击刷新，勿重复录入", true);
        }
      } catch (error) {
        recordReceiptPriceError(item, error);
        showToast(toChineseMessage(error), true);
      } finally {
        state.busyItemIds.delete(key);
        render();
      }
    }

    async function acceptShortNow(itemId) {
      const key = String(itemId);
      if (state.busyItemIds.has(key)) return;
      const item = findItem(itemId);
      if (!item?.pending_receipt_item_id) return;
      if (!window.confirm("确认供应商不再补货，并按当前累计数量完成收货？")) return;
      state.busyItemIds.add(key);
      render();
      try {
        await api(`/api/incoming/receipt-items/${item.pending_receipt_item_id}/accept-short`, {
          method: "PUT",
          body: JSON.stringify({}),
        });
        showToast("已按当前实收数量完成短收结单");
        await refreshAfterIncomingWrite();
      } catch (error) {
        showToast(toChineseMessage(error), true);
      } finally {
        state.busyItemIds.delete(key);
        render();
      }
    }

    function openRevert(itemId) {
      state.revertingItemId = itemId;
      $("revertModal").hidden = false;
    }

    document.querySelectorAll(".tab-button").forEach((button) => {
      button.addEventListener("click", async () => {
        state.activeTab = button.dataset.tab;
        document.querySelectorAll(".tab-button").forEach((item) => {
          const active = item.dataset.tab === state.activeTab;
          item.className = `tab-button min-h-14 rounded-lg px-3 text-lg font-bold ${active ? "bg-blue-700 text-white" : "bg-slate-200 text-slate-700"}`;
        });
        render();
        if (state.activeTab === "received") await loadReceived();
      });
    });

    $("cardList").addEventListener("click", (event) => {
      if (event.target.closest("[data-quantity], [data-resolution], [data-resolution-reason], [data-surplus-location]")) return;
      const drawingButton = event.target.closest("[data-drawing]");
      const receiveButton = event.target.closest("[data-receive]");
      const acceptShortButton = event.target.closest("[data-accept-short]");
      const revertButton = event.target.closest("[data-revert]");
      const productionDetailButton = event.target.closest("[data-production-detail]");
      if (drawingButton) {
        event.stopPropagation();
        openDrawing(drawingButton.dataset.drawing);
        return;
      }
      if (receiveButton) {
        event.stopPropagation();
        receive(receiveButton.dataset.receive);
        return;
      }
      if (acceptShortButton) {
        event.stopPropagation();
        acceptShortNow(acceptShortButton.dataset.acceptShort);
        return;
      }
      if (revertButton) {
        event.stopPropagation();
        openRevert(revertButton.dataset.revert);
        return;
      }
      if (productionDetailButton) {
        event.stopPropagation();
        openProductionDetail(productionDetailButton.dataset.productionDetail);
        return;
      }
      const card = event.target.closest("[data-detail]");
      if (card) toggleExpand(card.dataset.detail);
    });
    $("cardList").addEventListener("input", (event) => {
      const input = event.target.closest("[data-quantity]");
      const reasonInput = event.target.closest("[data-resolution-reason]");
      if (input) {
        const item = findItem(input.dataset.quantity);
        if (item) item.incoming_quantity = Number(input.value);
      } else if (reasonInput) {
        const item = findItem(reasonInput.dataset.resolutionReason);
        if (item) item.resolution_reason = reasonInput.value;
      }
    });
    $("cardList").addEventListener("change", async (event) => {
      const quantityInput = event.target.closest("[data-quantity]");
      const actionSelect = event.target.closest("[data-resolution]");
      const locationSelect = event.target.closest("[data-surplus-location]");
      if (quantityInput) {
        const item = findItem(quantityInput.dataset.quantity);
        if (item) item.incoming_quantity = Number(quantityInput.value);
        render();
      } else if (actionSelect) {
        const item = findItem(actionSelect.dataset.resolution);
        if (item) {
          item.resolution_action = actionSelect.value;
          if (item.resolution_action !== "accept_short") item.resolution_reason = "";
          if (item.resolution_action !== "transfer_to_semi_inventory") item.surplus_location_id = null;
          render();
          if (item.resolution_action === "transfer_to_semi_inventory") await ensureSurplusLocations();
        }
      } else if (locationSelect) {
        const item = findItem(locationSelect.dataset.surplusLocation);
        if (item) item.surplus_location_id = Number(locationSelect.value) || null;
      }
    });

    $("revertForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const itemId = state.revertingItemId;
      const key = String(itemId || "");
      if (!itemId || state.revertSubmitting || state.busyItemIds.has(key)) return;
      state.revertSubmitting = true;
      $("confirmRevert").disabled = true;
      $("revertModal").hidden = true;
      state.busyItemIds.add(key);
      render();
      try {
        const item = findItem(itemId);
        const url = item?.receipt_item_id
          ? `/api/incoming/receipt-items/${item.receipt_item_id}/revert`
          : `/api/incoming/revert/${item?.item_id ?? itemId}`;
        const revertKey = state.revertIdempotencyKeys.get(key) || createIdempotencyKey();
        state.revertIdempotencyKeys.set(key, revertKey);
        await api(url, {
          method: "PUT",
          body: JSON.stringify({idempotency_key: revertKey}),
        });
        state.revertIdempotencyKeys.delete(key);
        showToast("已撤回，任务返回待收料");
        await refreshAfterIncomingWrite();
      } catch (error) {
        showToast(toChineseMessage(error), true);
      } finally {
        state.busyItemIds.delete(key);
        state.revertSubmitting = false;
        $("confirmRevert").disabled = false;
        state.revertingItemId = null;
        render();
      }
    });

    async function retryCurrentView() {
      if (!state.user && !(await checkAuth())) return;
      if (state.activeTab === "pending" && state.pendingError) {
        return loadPending({page: state.pendingRetryPage});
      }
      await loadData();
    }

    $("refreshButton").addEventListener("click", retryCurrentView);
    $("errorRetryButton").addEventListener("click", retryCurrentView);
    $("pendingSearchButton").addEventListener("click", applyPendingSearch);
    $("pendingSearchClear").addEventListener("click", clearPendingSearch);
    $("pendingSearchInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        applyPendingSearch();
      }
    });
    $("pendingPreviousPage").addEventListener("click", () => changePendingPage(state.pendingPage - 1));
    $("pendingNextPage").addEventListener("click", () => changePendingPage(state.pendingPage + 1));
    $("cancelRevert").addEventListener("click", () => {
      $("revertModal").hidden = true;
      state.revertingItemId = null;
    });
    $("closeDrawingViewer").addEventListener("click", closeDrawing);
    $("closeDrawingViewerBottom").addEventListener("click", closeDrawing);
    $("closeProductionDetail").addEventListener("click", closeProductionDetail);
    if (typeof window.addEventListener === "function") {
      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin || event.source !== window.parent) return;
        if (event.data?.type !== "tm-mobile-incoming-performance-resume" || !state.initialContentReported) return;
        window.requestAnimationFrame(() => notifyIncomingPerformance("content-ready", {requests: []}));
      });
    }
    // v0.23.0 P0-2：初始加载统一走 init()，扫码/刷新/重新打开都强制重新校验登录 +
    // 重新拉取数据，不依赖任何上一次渲染留下的 DOM/状态。
    async function init() {
      notifyIncomingPerformance("document-ready");
      markIncomingPerformance("auth-start");
      markIncomingPerformance("data-start");
      const authorizationPromise = checkAuth();
      await loadPending({page: state.pendingPage, authorizationPromise});
    }
    init();
  </script>
</body>
</html>
