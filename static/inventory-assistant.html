<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>库存助手 · 天明ERP</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f4;color:#183e36;font:15px/1.5 system-ui}main{max-width:1280px;margin:auto;padding:22px}h1{font-size:25px;margin:0}h2{font-size:17px;margin:0}p{margin:8px 0;color:#58756a}header,.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}a{color:#08775e}button,input,select{font:inherit;padding:9px 12px;border:1px solid #b5ccc0;border-radius:7px;background:white;min-height:42px}button{cursor:pointer;color:#0b6650}button.active,.primary{background:#08775e;color:white}button:disabled{opacity:.5;cursor:wait}section,article{background:white;border:1px solid #d5e3db;border-radius:10px;padding:16px;margin-top:14px}.metrics{display:flex;gap:25px;flex-wrap:wrap}.metrics strong{display:block;font-size:24px}.ai-panel{border-color:#9ccfbd;background:#f7fffb}.ai-result{margin-top:12px;padding-top:12px;border-top:1px solid #cfe5da}.ai-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ai-card{border:1px solid #d5e3db;border-radius:8px;padding:12px;background:white}.ai-actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#688477}#results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}article{margin:0;overflow-wrap:anywhere}small{color:#688477}.facts{display:flex;gap:8px 18px;flex-wrap:wrap;margin:10px 0}ul{padding-left:20px}dialog{border:1px solid #bed4c8;border-radius:12px;max-width:900px;width:95vw;max-height:85vh;overflow:auto}dialog::backdrop{background:#123b3360}.detail-row{padding:12px 0;border-bottom:1px solid #dae5de}[hidden]{display:none!important}#status,#aiStatus{color:#9a3a23}footer{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:20px}@media(max-width:700px){main{padding:12px}#results,.ai-grid{grid-template-columns:1fr}.metrics{gap:16px}.metrics strong{font-size:21px}}
</style><link rel="stylesheet" href="/static/ui/order-reference.css?v=423" /><script src="/static/ui/order-reference.js?v=423"></script></head><body><main><header><div><h1>库存助手</h1><p>先用现货 · 查片料用途 · 处理积压</p></div><a href="/factory-twin-assets/warehouse-costs.html" target="_blank" rel="noopener">库存成本明细</a></header>
<section><div class="metrics"><div>已定价库存金额<strong id="value">—</strong></div><div>现存批次<strong id="lots">—</strong></div><div>待核价<strong id="missing">—</strong></div></div><p id="basis"></p><small>本地规则分析，尚未调用云模型；建议需在原业务页面核对后执行。</small></section>
<section class="ai-panel"><div class="bar"><div><h2>AI 库存经营解读</h2><p id="aiProvider">正在检查安全配置…</p></div><button class="primary" id="aiGenerate" disabled>生成本次解读</button></div><small>AI 只解释本页由 ERP 算出的库存、需求、库龄和成本摘要，不会自动抵扣、报料、报废、建单或修改库存。</small><p id="aiStatus" role="status"></p><div id="aiResult" class="ai-result" hidden></div></section>
<section><div class="bar" id="filters"><button class="active" data-focus="all">全部建议</button><button data-focus="demand">现货与订单</button><button data-focus="materials">片料反查用途</button><button data-focus="aged">180天以上库存</button><button data-focus="missing">待核价</button><input id="search" placeholder="客户 / 编码 / 名称 / 批次 / 位置" aria-label="筛选库存"><button id="refresh">查询</button></div><p id="notice"></p><p id="status" role="status"></p></section>
<div id="results"></div><footer><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></footer>
<dialog id="detail"><header><h2 id="detailTitle">库存依据</h2><button id="close">关闭</button></header><div id="detailContent"></div></dialog></main><script>
const $=id=>document.getElementById(id), el=(tag,text)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;return n;};let focus='all',page=1,total=0,controller=null,detailController=null,currentAiRun=null;
async function get(url,signal){const response=await fetch(url,{credentials:'same-origin',cache:'no-store',signal});if(!response.ok){let data={};try{data=await response.json()}catch{}throw Error(typeof data.detail==='string'?data.detail:(response.status===401?'登录已失效，请重新登录ERP后重试':response.status===403?'当前账号没有查看权限':`库存数据读取失败（${response.status}），请重试；仍失败请联系管理员`))}return response.json()}
async function post(url,body){const response=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!response.ok){let data={};try{data=await response.json()}catch{}throw Error(typeof data.detail==='string'?data.detail:`操作失败（${response.status}）`)}return response.json()}
const aiFocus=()=>({demand:'demand_coverage',aged:'aged_inventory',missing:'cost_missing'}[focus]||'all');
function renderAi(data){currentAiRun=data.public_id;$('aiResult').replaceChildren();$('aiResult').hidden=false;const interpretation=data.interpretation;if(!interpretation){$('aiResult').append(el('p',data.message));return;}$('aiResult').append(el('h2','本次摘要'),el('p',interpretation.summary||data.message));const grid=el('div');grid.className='ai-grid';for(const group of interpretation.risk_groups||[]){const card=el('div');card.className='ai-card';card.append(el('strong',group.title),el('p',group.explanation));card.append(el('small',`依据：${(group.evidence_refs||[]).join('、')}`));grid.append(card);}for(const check of interpretation.next_checks||[]){const card=el('div');card.className='ai-card';card.append(el('strong',check.title),el('p',check.reason));card.append(el('small',`依据：${(check.evidence_refs||[]).join('、')}`));grid.append(card);}$('aiResult').append(grid);if((interpretation.limitations||[]).length){$('aiResult').append(el('p',`限制：${interpretation.limitations.join('；')}`));}const actions=el('div');actions.className='ai-actions';for(const [rating,label] of [['helpful','有帮助'],['inaccurate','不准确']]){const button=el('button',label);button.onclick=()=>sendAiFeedback(rating);actions.append(button);}$('aiResult').append(actions);}
async function sendAiFeedback(rating){if(!currentAiRun)return;try{await post(`/api/ai/inventory-insights/runs/${currentAiRun}/feedback`,{rating,reason_code:rating==='helpful'?'useful_actionable':'wrong_data'});$('aiStatus').textContent='反馈已保存。';}catch(error){$('aiStatus').textContent=error.message;}}
async function loadAiStatus(){try{const data=await get('/api/ai/status');$('aiProvider').textContent=data.message;$('aiGenerate').disabled=!data.enabled;$('aiGenerate').title=data.enabled?'生成只读解读':'请先在天明ERP助手中设置AI密钥，完成模型接入后即可启用';}catch(error){$('aiProvider').textContent=error.message;$('aiGenerate').disabled=true;}}
async function generateAi(){const button=$('aiGenerate');button.disabled=true;$('aiStatus').textContent='正在生成只读解读…';$('aiResult').hidden=true;try{const data=await post('/api/ai/inventory-insights/runs',{focus:aiFocus(),idempotency_key:`inventory-${Date.now()}-${crypto.randomUUID?.()||Math.random().toString(16).slice(2)}`});renderAi(data);$('aiStatus').textContent=data.message;}catch(error){$('aiStatus').textContent=error.message;}finally{await loadAiStatus();}}
async function show(row,kind,morePage=1){detailController?.abort();const ctrl=detailController=new AbortController();if(!$('detail').open)$('detail').showModal();$('detailTitle').textContent=kind==='orders'?'本款未送订单':'片料用途候选';$('detailContent').textContent='正在读取…';try{const url=kind==='orders'?`/api/inventory-assistant/${row.lot_id}/orders?page=${morePage}`:`/api/inventory-assistant/${row.lot_id}/materials?page=${morePage}`;const data=await get(url,ctrl.signal);if(ctrl.signal.aborted)return;$('detailContent').replaceChildren();if(kind==='orders'){const link=el('a','打开订单管理');link.href='/?page=orders';link.target='_blank';link.rel='noopener';$('detailContent').append(link);}$('detailContent').append(el('p',kind==='orders'?'以下为未送需求。库存预占、已生产和采购进度请进入订单核对。':'完全一致优先；近似项只供选料，不自动抵扣。颜色、加工状态和客户适用范围仍须符合。'));for(const item of data.items||[]){const div=el('div');div.className='detail-row';if(kind==='orders'){div.append(el('strong',item.customer_name||''),TMOrderReference.node(item),el('p',`${item.product_code} ${item.product_name}｜未送 ${item.remaining_quantity}${item.unit||''}`));}else{div.append(el('strong',`${item.customer_name} · ${item.inventory_code} ${item.product_name}`),el('p',`${item.length_mm}×${item.width_mm}mm · ${item.flute_type}楞 · ${item.exact_dimension_match?'尺寸完全一致':`面积利用率 ${item.score}%`}`),el('small',(item.warnings||[]).join('；')));}$('detailContent').append(div);}if(data.excluded_color_count)$('detailContent').append(el('p',`已排除 ${data.excluded_color_count} 个面纸颜色不兼容的产品。`));if(!(data.items||[]).length)$('detailContent').append(el('p','当前没有符合的候选。'));if(data.has_more){const b=el('button','下一页');b.onclick=()=>show(row,kind,morePage+1);$('detailContent').append(b);}}catch(error){if(error.name!=='AbortError')$('detailContent').textContent=error.message;}}
async function load(){controller?.abort();const ctrl=controller=new AbortController();$('status').textContent='正在分析已录入库存…';try{const data=await get(`/api/inventory-assistant?focus=${focus}&page=${page}&q=${encodeURIComponent($('search').value.trim())}`,ctrl.signal);if(ctrl.signal.aborted)return;total=data.total;$('value').textContent='¥'+data.summary.inventory_value;$('lots').textContent=data.summary.total_lots;$('missing').textContent=data.summary.missing_lots;$('basis').textContent=data.summary.basis;$('notice').textContent=data.notice;$('results').replaceChildren();for(const row of data.items){const article=el('article');article.append(el('h2',`${row.detail.inventory_code||''} ${row.detail.name||'片料'}`),el('p',`${row.detail.customer_name||'通用 / 已维护适用客户'} · ${row.location_name||'未归位'}`),el('small',`批次 ${row.lot_number}`));const facts=el('div');facts.className='facts';facts.append(el('strong',`可用 ${row.quantity_available}${row.unit_label}`),el('span',row.age_days==null?'库龄待确认':`库龄 ${row.age_days}天`),el('span',row.cost.unit_cost?`${row.cost.label||'批次成本'} ¥${row.cost.unit_cost}/${row.unit_label}`:'待核价'));article.append(facts);const list=el('ul');for(const reason of row.reasons)list.append(el('li',reason.text));article.append(list);const b=el('button',row.is_material?'反查适用产品':'查看未送订单');b.onclick=()=>show(row,row.is_material?'materials':'orders');article.append(b);$('results').append(article);}$('status').textContent=total?`当前 ${total} 批建议 · 仅针对可用实物`:'当前筛选没有建议。';$('page').textContent=`第 ${page} / ${Math.max(1,Math.ceil(total/25))} 页`;$('previous').disabled=page<=1;$('next').disabled=page*25>=total;}catch(error){if(error.name!=='AbortError'){$('results').replaceChildren();$('status').textContent=error.message;}}}
$('filters').querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{focus=b.dataset.focus;page=1;$('filters').querySelectorAll('[data-focus]').forEach(n=>n.classList.toggle('active',n===b));load()});$('refresh').onclick=()=>{page=1;load()};$('search').onkeydown=e=>{if(e.key==='Enter'){page=1;load()}};$('previous').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page*25<total){page++;load()}};$('close').onclick=()=>$('detail').close();$('detail').addEventListener('close',()=>detailController?.abort());$('aiGenerate').onclick=generateAi;loadAiStatus();load();
</script></body></html>
