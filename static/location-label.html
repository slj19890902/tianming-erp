<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>仓库位置标签 - 天明ERP</title>
  <style id="pageStyle">@page{size:80mm 40mm;margin:0}</style>
  <style>
    :root{--paper-width:80mm;--paper-height:40mm;--blue:#2563eb;--line:#cbd5e1}
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111827;font:14px/1.35 Arial,"Microsoft YaHei",sans-serif}.hidden,[hidden]{display:none!important}
    .toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:end;justify-content:center;gap:10px;flex-wrap:wrap}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:3px}.field select{height:36px;border:1px solid #94a3b8;border-radius:7px;background:#fff;padding:0 9px;font-size:14px}.actions{display:flex;gap:8px}.button{height:36px;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:0 16px;font-weight:800;cursor:pointer}.button.secondary{background:#475569}.button.link{display:inline-flex;align-items:center;text-decoration:none;background:#e2e8f0;color:#1e293b}.button:disabled{cursor:not-allowed;opacity:.45}
    .notice,.error,.load-state{max-width:860px;margin:12px auto;padding:10px 12px;border-radius:8px}.notice,.load-state{background:#eff6ff;color:#1e3a8a}.error{background:#fee2e2;color:#991b1b}.summary{max-width:860px;margin:12px auto 8px;text-align:center;color:#475569}.labels{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 12px 24px}.label{width:var(--paper-width);height:var(--paper-height);background:#fff;border:0;padding:2mm;display:grid;grid-template-columns:minmax(0,1fr) 19mm;gap:2mm;overflow:hidden;page-break-after:always;break-after:page;box-shadow:0 4px 16px #0f172a24}.label:last-child{page-break-after:auto;break-after:auto}.main{min-width:0;display:flex;flex-direction:column}.area{font-size:9pt;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.address{font-size:17pt;line-height:1.08;font-weight:900;letter-spacing:.1px;margin:1.4mm 0;overflow:hidden}.hint{border-top:.25mm solid #111;margin-top:auto;padding-top:1mm;font-size:7pt;font-weight:800}.qr{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.qr img{width:17mm;height:17mm}.qr b{font-size:7pt;margin-top:.6mm}.qr span{font-size:5.8pt;color:#475569;margin-top:.3mm}
    .label.shelf{display:block;padding:2mm;overflow:visible}.shelf-head{height:13.3mm;display:grid;grid-template-columns:minmax(0,1fr) 13mm;gap:1mm;align-items:start}.shelf-title{display:flex;align-items:baseline;justify-content:space-between;gap:1mm;white-space:nowrap;line-height:1.2}.shelf-title b{font-size:16pt}.shelf-title span{font-size:12pt;font-weight:800}.shelf-address{font-size:7.4pt;margin-top:1.2mm;white-space:nowrap}.shelf-qr{width:13mm;height:13mm}.shelf-rule{border:0;border-top:.16mm solid #111;margin:0 0 .5mm}.shelf-customer{display:grid;grid-template-columns:minmax(0,1fr) 22mm;height:6.3mm;align-items:center}.shelf-customer-name{font-size:10pt;white-space:nowrap}.shelf-ref{font-size:7.2pt;line-height:1.25;white-space:nowrap}.shelf-field{display:grid;grid-template-columns:16mm minmax(0,1fr);align-items:center;height:5.2mm;white-space:nowrap;font-size:8pt}.shelf-value{font-size:10pt;min-width:0}.shelf-code{font-size:12pt;font-weight:800}.shelf-check{min-width:0}
    @media print{body{background:#fff}.toolbar,.notice,.error,.load-state,.summary{display:none!important}.labels{display:block;padding:0}.label{margin:0;border:0;box-shadow:none}}
  </style>
</head>
<body>
  <div class="toolbar">
    <div id="sortField" class="field hidden"><label for="labelSort">打印顺序</label><select id="labelSort"><option value="selected">选择顺序</option><option value="path">当前中文地址</option></select></div>
    <div class="actions"><button id="printButton" disabled class="button" type="button">打印位置标签</button><button id="retryButton" class="button secondary hidden" type="button" hidden>重新读取</button><a id="returnButton" class="button link" href="/warehouse-ledger.html?tab=location_labels">返回标签台</a><a class="button link" href="/warehouse.html?view=2d">打开实测地图</a></div>
  </div>
  <div id="loadState" class="load-state">正在读取位置标签，请稍候…</div>
  <div id="errorBox" class="error" role="alert" hidden></div>
  <section id="previewContent" hidden>
    <div class="notice">80×40 mm 横向标签，请按实际大小打印。已绑定货位显示客户中文简称和专用料号；二维码仅定位货位，扫码仍须登录。预警数为打印时参考值。</div>
    <div id="summary" class="summary"></div>
    <main id="labels" class="labels"></main>
  </section>
  <script src="/static/assets/print-recovery.js"></script>
  <script>
    const $=id=>document.getElementById(id);const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    const params=new URLSearchParams(location.search),rawIds=params.get("location_ids")||"",parts=rawIds.split(",").map(value=>value.trim()).filter(Boolean),batchIds=parts.filter((value,index,rows)=>/^\d+$/.test(value)&&Number(value)>0&&rows.indexOf(value)===index),batchMode=rawIds!=="",batchValid=parts.length>0&&parts.length===batchIds.length&&batchIds.length<=500,requestedReturn=params.get("return_to")||"",returnTo=requestedReturn.startsWith("/")&&!requestedReturn.startsWith("//")?requestedReturn:"/warehouse-ledger.html?tab=location_labels";let sourceRows=[];
    function loginNext(){location.href=`/?next=${encodeURIComponent(location.pathname+location.search)}`}
    function orderedRows(){const rows=[...sourceRows],sort=$("labelSort").value;if(sort==="path")rows.sort((a,b)=>String(a.display_path||"").localeCompare(String(b.display_path||""),"zh-CN",{numeric:true}));return rows}
    function labelHtml(row){if(row.shelf_content)return shelfHtml(row);return `<article class="label"><div class="main"><div class="area">${h(row.floor_text)} · ${h(row.area_text)}${row.rack_display_name?` · ${h(row.rack_display_name)}`:""}</div><div class="address">${h(row.print_address_code||row.current_address_code||"位置编号待完善")}</div><div class="hint">${h(row.display_path||row.employee_location_name||row.current_address_name||"位置名称待完善")}</div></div><div class="qr"><img src="${h(row.qr_data_url)}" alt="位置查询二维码"><b>扫码看位置</b><span>登录后打开仓库地图</span></div></article>`}
    function shelfHtml(row){const p=row.shelf_content;if(p.restricted)throw Error('所选货位绑定其他客户，请取消选择');if(!p.customer_short_name)throw Error('请先补充客户中文简称后打印');const pad=x=>String(x??'').padStart(2,'0');return `<article class="label shelf"><div class="shelf-head"><div><div class="shelf-title shelf-check"><b>${h([row.area_code,row.rack_code].filter(Boolean).join('-'))}架</b><span>${h(pad(row.level_no))}层 ${h(pad(row.slot_no))}格</span></div><div class="shelf-address shelf-check">${h(row.print_address_code||row.current_address_code)}</div></div><img class="shelf-qr" src="${h(row.qr_data_url)}" alt="位置查询二维码"></div><hr class="shelf-rule"><div class="shelf-customer"><div class="shelf-customer-name shelf-check">客户：<b>${h(p.customer_short_name)}</b></div><div class="shelf-ref shelf-check"><div>${p.units_per_bundle?h(p.units_per_bundle)+'只/捆':'每捆数量待核'}</div><div>预警参考${p.warning_quantity===null?'待设':h(p.warning_quantity)+'只'}</div></div></div><div class="shelf-field"><span>客户料号</span><b class="shelf-value shelf-code shelf-check">${h(p.inventory_code)}</b></div><div class="shelf-field"><span>产品名称</span><span class="shelf-value shelf-check">${h(p.product_name)}</span></div><div class="shelf-field"><span>规格</span><span class="shelf-value shelf-check">${h(p.specification)}</span></div></article>`}
    async function printLabels(){try{if(!await printPage.load())return;await document.fonts.ready;await Promise.all([...document.querySelectorAll('.label img')].map(img=>img.decode()));for(const node of document.querySelectorAll('.shelf-check')){if(node.scrollWidth>node.clientWidth+1)throw Error('标签文字超出80×40尺寸，请缩短中文简称或核对料号、名称长度后重印')}window.print()}catch(error){printPage.showError(error.message,true)}}
    function renderRows(){const rows=orderedRows();$("labels").innerHTML=rows.map(labelHtml).join("");$("summary").textContent=`80 × 40 mm · 共 ${rows.length} 个正式货位编号标签`}
    function renderLocationLabels(data){sourceRows=batchMode?(data.items||[]):[data];if(!sourceRows.length)throw new Error("没有可打印的位置标签");renderRows()}
    const printPage=TmPrintRecovery.createPrintPage({id:batchMode?(batchValid?batchIds[0]:null):params.get("location_id"),url:id=>batchMode?`/api/warehouse/locations/labels?location_ids=${encodeURIComponent(batchIds.join(","))}`:`/api/warehouse/locations/${id}/label`,printButton:$("printButton"),retryButton:$("retryButton"),loadState:$("loadState"),errorBox:$("errorBox"),content:$("previewContent"),loadingMessage:"正在读取位置标签，请稍候…",invalidMessage:batchMode?"批量位置选择无效，请返回位置台账重新选择。":"位置 ID 无效，请从位置台账重新打开。",authMessage:"登录已失效，正在返回 ERP 登录。",failureMessage:"位置标签读取失败",render:renderLocationLabels,print:printLabels,onUnauthorized:loginNext});
    $("returnButton").href=returnTo;$("sortField").classList.toggle("hidden",!batchMode);$("labelSort").onchange=renderRows;printPage.load();
  </script>
</body>
</html>
