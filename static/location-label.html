<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>仓库位置标签 - 天明ERP</title>
  <style id="pageStyle">@page{size:90mm 60mm;margin:0}</style>
  <style>
    :root{--paper-width:90mm;--paper-height:60mm;--blue:#2563eb;--line:#cbd5e1}
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111827;font:14px/1.35 Arial,"Microsoft YaHei",sans-serif}.hidden,[hidden]{display:none!important}
    .toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:end;justify-content:center;gap:10px;flex-wrap:wrap}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:3px}.field select{height:36px;border:1px solid #94a3b8;border-radius:7px;background:#fff;padding:0 9px;font-size:14px}.actions{display:flex;gap:8px}.button{height:36px;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:0 16px;font-weight:800;cursor:pointer}.button.secondary{background:#475569}.button.link{display:inline-flex;align-items:center;text-decoration:none;background:#e2e8f0;color:#1e293b}.button:disabled{cursor:not-allowed;opacity:.45}
    .notice,.error,.load-state{max-width:860px;margin:12px auto;padding:10px 12px;border-radius:8px}.notice,.load-state{background:#eff6ff;color:#1e3a8a}.error{background:#fee2e2;color:#991b1b}.summary{max-width:860px;margin:12px auto 8px;text-align:center;color:#475569}.labels{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 12px 24px}.label{width:var(--paper-width);height:var(--paper-height);background:#fff;border:.4mm solid #111;padding:3mm;display:grid;grid-template-columns:minmax(0,1fr) 24mm;gap:3mm;overflow:hidden;page-break-after:always;break-after:page}.label:last-child{page-break-after:auto;break-after:auto}.main{min-width:0;display:flex;flex-direction:column}.area{font-size:12pt;font-weight:900}.address{font-size:22pt;line-height:1.15;font-weight:900;letter-spacing:.2px;margin:3mm 0;overflow:hidden}.hint{border-top:.3mm solid #111;margin-top:auto;padding-top:1.5mm;font-size:9pt;font-weight:800}.qr{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.qr img{width:22mm;height:22mm}.qr b{font-size:8pt;margin-top:1mm}.qr span{font-size:6.8pt;color:#475569;margin-top:.5mm}
    @media print{body{background:#fff}.toolbar,.notice,.error,.load-state,.summary{display:none!important}.labels{display:block;padding:0}.label{margin:0;border:.25mm solid #000}}
  </style>
</head>
<body>
  <div class="toolbar">
    <div id="sortField" class="field hidden"><label for="labelSort">打印顺序</label><select id="labelSort"><option value="selected">选择顺序</option><option value="path">当前中文地址</option></select></div>
    <div class="actions"><button id="printButton" disabled class="button" type="button">打印位置标签</button><button id="retryButton" class="button secondary hidden" type="button" hidden>重新读取</button><a class="button link" href="/warehouse.html?tab=locations">返回仓库</a></div>
  </div>
  <div id="loadState" class="load-state">正在读取位置标签，请稍候…</div>
  <div id="errorBox" class="error" role="alert" hidden></div>
  <section id="previewContent" hidden>
    <div class="notice">位置标签只标识现有正式物理位置；扫码后仍须登录，不显示客户、库存数量或价格。</div>
    <div id="summary" class="summary"></div>
    <main id="labels" class="labels"></main>
  </section>
  <script src="/static/assets/print-recovery.js"></script>
  <script>
    const $=id=>document.getElementById(id);const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    const params=new URLSearchParams(location.search),rawIds=params.get("location_ids")||"",parts=rawIds.split(",").map(value=>value.trim()).filter(Boolean),batchIds=parts.filter((value,index,rows)=>/^\d+$/.test(value)&&Number(value)>0&&rows.indexOf(value)===index),batchMode=rawIds!=="",batchValid=parts.length>0&&parts.length===batchIds.length&&batchIds.length<=100;let sourceRows=[];
    function loginNext(){location.href=`/?next=${encodeURIComponent(location.pathname+location.search)}`}
    function orderedRows(){const rows=[...sourceRows],sort=$("labelSort").value;if(sort==="path")rows.sort((a,b)=>String(a.display_path||"").localeCompare(String(b.display_path||""),"zh-CN",{numeric:true}));return rows}
    function labelHtml(row){return `<article class="label"><div class="main"><div class="area">${h(row.floor_text)} · ${h(row.area_text)}</div><div class="address">${h(row.display_path||row.employee_location_name||row.current_address_name||"位置名称待完善")}</div><div class="hint">按中文地址摆放；扫码后查看 ERP 当前记录</div></div><div class="qr"><img src="${h(row.qr_data_url)}" alt="位置查询二维码"><b>扫码看位置</b><span>登录后打开仓库地图</span></div></article>`}
    function renderRows(){const rows=orderedRows();$("labels").innerHTML=rows.map(labelHtml).join("");$("summary").textContent=`90 × 60 mm · 共 ${rows.length} 个正式位置标签`}
    function renderLocationLabels(data){sourceRows=batchMode?(data.items||[]):[data];if(!sourceRows.length)throw new Error("没有可打印的位置标签");renderRows()}
    const printPage=TmPrintRecovery.createPrintPage({id:batchMode?(batchValid?batchIds[0]:null):params.get("location_id"),url:id=>batchMode?`/api/warehouse/locations/labels?location_ids=${encodeURIComponent(batchIds.join(","))}`:`/api/warehouse/locations/${id}/label`,printButton:$("printButton"),retryButton:$("retryButton"),loadState:$("loadState"),errorBox:$("errorBox"),content:$("previewContent"),loadingMessage:"正在读取位置标签，请稍候…",invalidMessage:batchMode?"批量位置选择无效，请返回位置台账重新选择。":"位置 ID 无效，请从位置台账重新打开。",authMessage:"登录已失效，正在返回 ERP 登录。",failureMessage:"位置标签读取失败",render:renderLocationLabels,print:()=>window.print(),onUnauthorized:loginNext});
    $("sortField").classList.toggle("hidden",!batchMode);$("labelSort").onchange=renderRows;printPage.load();
  </script>
</body>
</html>
