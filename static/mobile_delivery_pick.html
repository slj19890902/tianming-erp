<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>预送货拿货</title>
  <style>
    :root { --ink:#17211b; --muted:#68736c; --paper:#f4f1e8; --green:#197447; --orange:#d8661f; --red:#be3d32; --line:#d9d5c9; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 90% 0,#dcebdc,transparent 35%),var(--paper); font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; }
    header { position:sticky; top:0; z-index:5; padding:10px; color:white; background:#183f2c; box-shadow:0 3px 12px #17372830; }
    header h1 { margin:0; font-size:18px; } header p { margin:3px 0 0; color:#d9eddf; font-size:12px; }
    main { padding:10px 10px 28px; } .message { margin:35px auto; max-width:420px; padding:20px; text-align:center; background:#fffdf8; border:1px solid var(--line); border-radius:12px; }
    .login { display:grid; gap:10px; text-align:left; } label { color:var(--muted); font-size:13px; font-weight:700; } input { width:100%; padding:10px; border:1px solid #bbb7ac; border-radius:8px; font-size:16px; background:white; }
    button { min-height:38px; padding:8px 12px; border:1px solid #c6d2ca; border-radius:8px; color:#204b32; background:white; font-size:14px; font-weight:700; } button.primary { color:white; background:var(--green); border-color:var(--green); } button.partial { color:white; background:var(--orange); border-color:var(--orange); } button.no-stock { color:white; background:var(--red); border-color:var(--red); } button:disabled { opacity:.5; }
    .filters { position:sticky; top:57px; z-index:4; display:flex; gap:6px; overflow:auto; padding:5px 0 8px; scrollbar-width:none; } .filters::-webkit-scrollbar { display:none; } .filters button { flex:0 0 auto; min-width:62px; } .filters button.active { color:white; background:var(--green); }
    .customer { margin:12px 0 6px; font-size:15px; font-weight:800; } .card { margin-bottom:8px; padding:11px; background:#fffdf8; border:1px solid var(--line); border-left:5px solid var(--green); border-radius:11px; box-shadow:0 3px 12px #4b4b3518; } .card.partial { border-left-color:var(--orange); } .card.no_stock { border-left-color:var(--red); } .card.picked { opacity:.72; }
    .task-card { width:100%; margin-bottom:8px; padding:12px; text-align:left; background:#fffdf8; border-left:5px solid var(--green); } .task-card.exception { border-left-color:var(--orange); } .task-number { margin-top:4px; color:var(--muted); font-size:12px; font-weight:400; } .back-row { margin-bottom:8px; }
    .task-list-footer { display:grid; gap:7px; margin:12px 0; text-align:center; } .task-list-footer button { width:100%; } .task-list-progress { color:var(--muted); font-size:12px; }
    .name { font-size:19px; font-weight:800; line-height:1.3; } .spec { margin-top:3px; color:#385545; font-size:15px; } .code { margin-top:3px; color:#8b958e; font-size:11px; } .pick-components { margin-top:8px; padding:7px 8px; border:1px solid #d5e1d7; border-radius:7px; background:#f5faf5; } .pick-components-title { color:#385545; font-size:12px; font-weight:800; } .pick-component-row { display:flex; justify-content:space-between; gap:8px; margin-top:3px; color:#385545; font-size:12px; } .pick-component-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .pick-component-quantity { flex:0 0 auto; color:#17211b; font-weight:800; } .qty-row { display:grid; grid-template-columns:1fr 100px; gap:8px; align-items:center; margin-top:9px; } .qty-label { color:var(--muted); font-size:13px; } .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:9px; } .task-actions { display:flex; gap:8px; margin-top:12px; } .task-actions button { flex:1; }
    .normal-action { margin-bottom:10px; padding:12px; background:#e9f5ec; border:1px solid #bdd9c5; border-radius:11px; } .normal-action button { width:100%; min-height:52px; font-size:18px; } .normal-action p { margin:7px 0 0; color:#45604f; font-size:12px; text-align:center; }
    .location-card { margin-bottom:9px; padding:12px; background:#fffdf8; border:1px solid var(--line); border-left:6px solid var(--green); border-radius:11px; box-shadow:0 3px 12px #4b4b3518; } .location-card.direct { border-left-color:#3974a7; } .location-card.relocation { border-left-color:var(--orange); } .location-card.attention { border-left-color:var(--red); background:#fff5f2; } .location-title { font-size:21px; font-weight:900; line-height:1.25; } .location-meta { margin-top:4px; color:var(--muted); font-size:12px; } .location-line { display:grid; grid-template-columns:1fr auto; gap:9px; align-items:center; padding:9px 0; border-top:1px dashed #ddd7ca; } .location-line:first-of-type { margin-top:8px; } .location-product { font-size:15px; font-weight:800; } .location-spec { margin-top:2px; color:var(--muted); font-size:12px; } .location-qty { color:#143d27; font-size:22px; font-weight:900; white-space:nowrap; }
    .location-heading { display:flex; gap:8px; align-items:center; justify-content:space-between; } .sequence { flex:0 0 auto; min-width:34px; padding:4px 7px; color:white; background:var(--green); border-radius:999px; font-size:12px; text-align:center; } .map-button { margin-top:8px; width:100%; }
    [hidden] { display:none !important; } .map-overlay { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; background:#eef3ec; } .map-header { display:flex; gap:8px; align-items:center; padding:10px; color:white; background:#183f2c; } .map-header strong { flex:1; } .map-header button { color:white; border-color:#ffffff66; background:transparent; } .map-body { flex:1; overflow:auto; padding:10px; } .map-floor-tabs { display:flex; gap:7px; overflow:auto; margin-bottom:8px; } .map-floor-tabs button { flex:0 0 auto; } .map-floor-tabs button.active { color:white; background:var(--green); border-color:var(--green); } .map-guidance { margin:0 0 8px; padding:9px; color:#704700; background:#fff5d8; border-radius:9px; font-size:12px; font-weight:800; } .task-map { position:relative; width:100%; min-height:66vh; overflow:hidden; border:2px solid #8aa18f; border-radius:12px; background:#fffdf8; } .task-map-features { position:absolute; inset:0; width:100%; height:100%; } .task-map-zone { fill:#eef4f0; stroke:#9db1a6; stroke-width:80; } .task-map-aisle { fill:#fff8df; stroke:#d4b761; stroke-width:55; } .map-point { position:absolute; display:flex; align-items:center; justify-content:center; min-width:42px; min-height:36px; padding:4px; color:#153d27; background:#aee0bc; border:2px solid #287348; border-radius:7px; font-size:11px; font-weight:900; text-align:center; box-shadow:0 2px 7px #183f2c44; } .map-point.active { z-index:30 !important; color:white; background:#d8661f; border-color:#a53e0c; outline:4px solid #f3b18488; } .map-unavailable { display:grid; min-height:66vh; place-content:center; padding:24px; text-align:center; color:#704700; background:#fff8e7; } .map-unavailable strong { display:block; margin-bottom:8px; font-size:22px; } .map-legend { margin-top:10px; padding:10px; background:white; border-radius:10px; } .map-legend-row { padding:8px 0; border-top:1px dashed var(--line); font-size:13px; } .map-legend-row:first-child { border-top:0; } .map-line { margin-top:4px; color:var(--muted); font-size:12px; }
    .ready-banner { margin-bottom:10px; padding:13px; color:#145d36; background:#e1f4e8; border:1px solid #aad1b8; border-radius:10px; font-size:16px; font-weight:800; text-align:center; }
    details.exception-tools { margin-top:12px; padding:0 10px 10px; background:#fffdf8; border:1px solid var(--line); border-radius:11px; } details.exception-tools > summary { padding:13px 2px; color:#6c4631; font-weight:800; cursor:pointer; } .exception-help { margin:0 0 8px; color:var(--muted); font-size:12px; }
    .error { color:var(--red); margin-top:8px; font-size:13px; } .toast { position:fixed; left:50%; bottom:20px; z-index:10; transform:translateX(-50%); padding:10px 15px; color:white; background:#17211be8; border-radius:10px; }
  </style>
</head>
<body>
  <header><h1>预送货拿货</h1><p id="taskMeta">只处理分配给本账号的任务；拿齐后仍需电脑端发货打印</p></header>
  <main>
    <section id="loginBox" class="message" hidden>
      <form class="login" onsubmit="login(event)">
        <strong>请先登录</strong>
        <label>用户名<input id="username" autocomplete="username" required /></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" required /></label>
        <button id="loginButton" class="primary" type="submit">登录</button>
        <div id="loginError" class="error"></div>
      </form>
    </section>
    <section id="app" hidden>
      <section id="taskChooser"></section>
      <section id="taskDetail" hidden>
        <div class="back-row"><button id="backToTasksButton" onclick="showTaskList()">返回待拿货任务</button></div>
        <div id="normalAction" class="normal-action"><button id="completePlannedButton" class="primary" onclick="completePlanned()">本单全部按计划拿齐</button><p>正常拿齐只点这一个按钮，不会自动发货。</p></div>
        <div id="readyBanner" class="ready-banner" hidden>已拿齐，可回电脑发货打印</div>
        <div id="locationGroups"></div>
        <details id="exceptionTools" class="exception-tools">
          <summary>有缺货或数量不一致时再登记</summary>
          <p class="exception-help">只有实际少拿、未找到或多拿时才需要操作下面明细。</p>
          <nav id="filters" class="filters" aria-label="拿货状态筛选"></nav>
          <div id="groups"></div>
          <div class="task-actions"><button id="submitTaskButton" class="partial" onclick="submitTask()">提交异常结果</button><button id="refreshTaskButton" onclick="loadTask()">刷新</button></div>
        </details>
      </section>
      <div id="error" class="error"></div>
    </section>
  </main>
  <section id="mapOverlay" class="map-overlay" hidden aria-label="本次拿货位置地图">
    <div class="map-header"><button onclick="closeTaskMap()">返回拿货任务</button><strong id="mapTitle">本任务拿货位置</strong></div>
    <div class="map-body"><nav id="mapFloorTabs" class="map-floor-tabs" aria-label="本任务涉及楼层"></nav><nav id="mapAreaTabs" class="map-floor-tabs" aria-label="本任务涉及区域"></nav><p id="mapGuidance" class="map-guidance">只读取本任务涉及的一层一片区域。</p><div id="taskMap" class="task-map"></div><div id="mapLegend" class="map-legend"></div></div>
  </section>
  <div id="toast" class="toast" hidden></div>
  <script>
    const initialParams = new URLSearchParams(location.search);
    let taskId = initialParams.get("task_id");
    const expectedPrintVersion = initialParams.get("print_version");
    let task = null; let activeFilter = "open"; let taskScrollY = 0; let activeMapGroupKey = ""; let activeMapFloor = ""; let activeMapArea = "";
    let mapFloors=[], mapData=null, mapGeneration=0, mapController=null;
    let listGeneration=0, listController=null, detailGeneration=0, detailController=null;
    const listPageSize=20; let listPage=0, listTotal=0, listRows=[], listHasMore=false, listLoading=false, listAsOf="";
    const busyItems=new Set(); let taskActionBusy=false; let loginBusy=false;
    const statusOf = item => item.pick_status || "pending";
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const toast = text => { const node=document.getElementById("toast"); node.textContent=text; node.hidden=false; setTimeout(()=>node.hidden=true,2200); };
    function formatErrorDetail(detail) {
      if(typeof detail==="string") return detail.trim();
      if(Array.isArray(detail)) return detail.map(formatErrorDetail).filter(Boolean).join("；");
      if(detail&&typeof detail==="object") {
        const message=String(detail.message||detail.msg||"").trim();
        const code=String(detail.code||"").trim();
        if(message) return code?`${message}（${code}）`:message;
        if(code) return `操作失败（${code}）`;
      }
      return "";
    }
    async function request(url, options={}) {
      let response;
      try { response=await fetch(url,{credentials:"include",cache:"no-store",...options}); }
      catch(error) { if(error?.name==="AbortError") throw error; throw new Error("无法连接 ERP 服务，请检查网络后重试"); }
      const text=await response.text().catch(()=>""); let body={};
      if(text) { try { body=JSON.parse(text); } catch(_error) { body={}; } }
      if(!response.ok) {
        const detail=formatErrorDetail(body.detail);
        const fallback=response.status===401?"登录已失效，请重新登录":response.status>=500?`服务器内部错误（HTTP ${response.status}），请稍后重试`:`请求失败（HTTP ${response.status}）`;
        const error=new Error(detail||fallback); error.status=response.status; throw error;
      }
      return body;
    }
    function normalize(body) { const source=body.task || body; return { ...source, items: body.items || source.items || [] }; }
    function filters() { return [["open","未完成",item=>statusOf(item)!=="picked"],["pending","待拿货",item=>statusOf(item)==="pending"],["partial","少拿",item=>statusOf(item)==="partial"],["no_stock","未找到",item=>statusOf(item)==="no_stock"],["picked","拿齐",item=>statusOf(item)==="picked"],["all","全部",()=>true]]; }
    function setFilter(key) { activeFilter=key; render(); }
    function taskStatusLabel(value) { return ({pushed:"待拿货",driver_confirmed:"可发货打印",exception:"有异常",applied:"可发货打印",dispatched:"已发货"}[value] || value || "待拿货"); }
    function showLogin() { document.getElementById("loginBox").hidden=false; document.getElementById("app").hidden=true; }
    function handleAuthError(error) { if(error?.status!==401) return false; showLogin(); return true; }
    function showTaskLoading() {
      document.getElementById("taskChooser").hidden=true; document.getElementById("taskDetail").hidden=false;
      document.getElementById("taskMeta").textContent="正在读取拿货任务…";
      document.getElementById("locationGroups").innerHTML='<div class="message">正在读取拿货明细和位置…</div>';
      document.getElementById("groups").innerHTML=""; document.getElementById("error").textContent="";
    }
    function showTaskFailure(error) {
      const message=error?.message||"拿货任务读取失败"; document.getElementById("taskMeta").textContent="拿货任务读取失败";
      document.getElementById("error").textContent=message;
      document.getElementById("locationGroups").innerHTML=`<div class="message">${escapeHtml(message)}<div style="margin-top:10px"><button id="taskDetailRetryButton" class="primary">重试</button></div></div>`;
      document.getElementById("taskDetailRetryButton").addEventListener("click",loadTask);
    }
    function renderTaskChooser() {
      const chooser=document.getElementById("taskChooser"); const groups=new Map();
      listRows.forEach(row=>{const customer=row.customer_name||"未指定客户";if(!groups.has(customer))groups.set(customer,[]);groups.get(customer).push(row);});
      document.getElementById("taskMeta").textContent=`待拿货任务 ${listTotal} 单${listAsOf?` · 更新 ${listAsOf}`:""}`; document.getElementById("taskDetail").hidden=true;
      const cards=groups.size?[...groups.entries()].map(([customer,tasks])=>`<section><div class="customer">${escapeHtml(customer)}</div>${tasks.map(row=>`<button class="task-card ${row.has_exception||row.status==="exception"?"exception":""}" onclick="selectTask(${Number(row.id)})"><strong>${escapeHtml(taskStatusLabel(row.status))}</strong><div class="task-number">${escapeHtml(row.delivery_number||`任务 ${row.id}`)}${row.assigned_to_name?` · ${escapeHtml(row.assigned_to_name)}`:row.assignment_required?" · 未分配":""}</div></button>`).join("")}</section>`).join(""):'<div class="message">当前没有待拿货任务</div>';
      const footer=listRows.length?`<div class="task-list-footer"><div class="task-list-progress">已显示 ${listRows.length} / ${listTotal} 单</div>${listHasMore?`<button id="loadMoreTasksButton" type="button" ${listLoading?"disabled":""}>${listLoading?"读取中…":"继续加载 20 单"}</button>`:""}</div>`:"";
      chooser.innerHTML=cards+footer; const more=document.getElementById("loadMoreTasksButton"); if(more)more.addEventListener("click",()=>loadTaskList({append:true}));
    }
    async function loadTaskList({append=false}={}) {
      if(append&&(!listHasMore||listLoading))return false;
      const generation=++listGeneration; listController?.abort(); const controller=new AbortController(); listController=controller;
      const chooser=document.getElementById("taskChooser"); chooser.hidden=false; listLoading=true; if(append)renderTaskChooser(); else chooser.innerHTML='<div class="message">正在读取待拿货任务（前 20 单）…</div>'; document.getElementById("error").textContent="";
      try {
        const requestedPage=append?listPage+1:1;
        const body=await request(`/api/delivery-picks?response_mode=summary&include_dispatched=false&page=${requestedPage}&page_size=${listPageSize}`,{signal:controller.signal});
        if(generation!==listGeneration) return false;
        const incoming=body.items||[]; const combined=append?[...listRows,...incoming]:incoming; const seen=new Set(); listRows=combined.filter(row=>{const key=String(row.id);if(seen.has(key))return false;seen.add(key);return true;});
        listPage=Number(body.page||requestedPage); listTotal=Number(body.total||listRows.length); listHasMore=listRows.length<listTotal; listAsOf=String(body.as_of||"");
        listLoading=false; renderTaskChooser();
        return true;
      } catch(error) {
        if(error?.name==="AbortError"||generation!==listGeneration) return false; if(handleAuthError(error)) return false;
        if(append&&listRows.length){renderTaskChooser();toast(error.message||"后续任务读取失败");}else{chooser.innerHTML=`<div class="message">${escapeHtml(error.message||"待拿货任务读取失败")}<div style="margin-top:10px"><button id="taskListRetryButton" class="primary">重试</button></div></div>`;document.getElementById("taskListRetryButton").addEventListener("click",()=>loadTaskList());}
        document.getElementById("error").textContent=error.message; return false;
      } finally { if(generation===listGeneration){listController=null;listLoading=false;if(append&&listRows.length)renderTaskChooser();} }
    }
    async function selectTask(id) {
      closeTaskMap({restoreScroll:false});
      const selectedId=String(id); taskId=selectedId; const url=new URL(location.href); url.searchParams.set("task_id",taskId); history.replaceState(null,"",url);
      const generation=++detailGeneration; detailController?.abort(); const controller=new AbortController(); detailController=controller; task=null; showTaskLoading();
      try {
        const body=await request(`/api/delivery-picks/${encodeURIComponent(selectedId)}`,{signal:controller.signal});
        if(generation!==detailGeneration||taskId!==selectedId) return false;
        task=normalize(body);
        if(expectedPrintVersion && task.print_version !== expectedPrintVersion) {
          task=null;
          showTaskFailure(new Error("纸质拿货单版本已过期，请返回 ERP 重新打印后再回录差异"));
          return false;
        }
        render(); return true;
      } catch(error) {
        if(error?.name==="AbortError"||generation!==detailGeneration||taskId!==selectedId) return false; if(handleAuthError(error)) return false; showTaskFailure(error); return false;
      } finally { if(generation===detailGeneration) detailController=null; }
    }
    async function showTaskList() { if(taskActionBusy||busyItems.size) return; closeTaskMap({restoreScroll:false}); detailGeneration+=1; detailController?.abort(); detailController=null; task=null; taskId=null; const url=new URL(location.href); url.searchParams.delete("task_id"); history.replaceState(null,"",url); await loadTaskList(); }
    function render() {
      if(!task) return;
      document.getElementById("taskMeta").textContent=`${task.delivery_number || "送货单"} · ${taskStatusLabel(task.status)}${task.as_of?` · 更新 ${task.as_of}`:""}`;
      const ready=["driver_confirmed","applied"].includes(task.status);
      document.getElementById("normalAction").hidden=ready;
      document.getElementById("readyBanner").hidden=!ready;
      const completeButton=document.getElementById("completePlannedButton");
      const editable=["pushed","driver_confirmed","exception"].includes(task.status);
      completeButton.disabled=taskActionBusy||busyItems.size>0||task.status!=="pushed"||task.location_plan_complete===false;
      document.getElementById("submitTaskButton").disabled=taskActionBusy||busyItems.size>0||!editable;
      document.getElementById("refreshTaskButton").disabled=taskActionBusy||busyItems.size>0;
      document.getElementById("backToTasksButton").disabled=taskActionBusy||busyItems.size>0;
      document.getElementById("locationGroups").innerHTML=(task.location_groups || []).length ? (task.location_groups || []).map(renderLocationGroup).join("") : '<div class="message">当前没有可用的拿货位置计划，请刷新或登记异常。</div>';
      const rows=task.items || []; const defs=filters();
      document.getElementById("filters").innerHTML=defs.map(([key,label,predicate])=>`<button class="${activeFilter===key?"active":""}" onclick="setFilter('${key}')">${rows.filter(predicate).length} ${label}</button>`).join("");
      const predicate=defs.find(row=>row[0]===activeFilter)[2]; const visible=rows.filter(predicate); const groups=new Map();
      visible.forEach(item=>{ const customer=item.customer_name || task.customer_name || "未指定客户"; if(!groups.has(customer)) groups.set(customer,[]); groups.get(customer).push(item); });
      document.getElementById("groups").innerHTML=groups.size ? [...groups.entries()].map(([customer,items])=>`<section><div class="customer">${escapeHtml(customer)}</div>${items.map(renderItem).join("")}</section>`).join("") : '<div class="message">当前筛选没有待处理明细</div>';
      if(task.has_exception || task.status==="exception") document.getElementById("exceptionTools").open=true;
    }
    function renderLocationGroup(group) {
      const classes=["location-card"]; if(group.source_type==="production_direct") classes.push("direct"); if(group.needs_relocation) classes.push("relocation"); if(group.requires_attention) classes.push("attention");
      const lines=(group.lines || []).map(line=>`<div class="location-line"><div><div class="location-product">${escapeHtml([line.product_code || "-",line.product_name || "未命名产品"].join(" / "))}</div><div class="location-spec">${escapeHtml(line.specification || "-")}${line.lot_number ? ` · 批次 ${escapeHtml(line.lot_number)}` : ""}</div></div><div class="location-qty">${Number(line.pick_quantity || 0)} ${escapeHtml(line.unit || "个")}</div></div>`).join("");
      const sequence=Number(group.recommended_sequence || 0); const hasLocation=group.location_id!=null;
      const mapAction=hasLocation ? `<button class="map-button" onclick="openTaskMap('${escapeHtml(group.key)}')">${group.map_status==="mapped"?"地图定位此位置":"查看文字位置"}</button>` : `<div class="location-meta">此项没有实测库位，只能按文字位置拿货</div>`;
      return `<section class="${classes.join(" ")}"><div class="location-heading"><div class="location-title">${escapeHtml(group.label || group.employee_location_name || group.current_address_name || group.location_name || "拿货位置")}</div>${sequence?`<span class="sequence">第${sequence}站</span>`:""}</div>${lines}${mapAction}</section>`;
    }
    function currentMapFloor() { return mapFloors.find(floor=>floor.floor_code===activeMapFloor) || null; }
    function currentMapAreas() { return currentMapFloor()?.areas || []; }
    function currentMapGroup() { return (mapData?.groups || []).find(group=>group.key===activeMapGroupKey) || null; }
    function renderTaskMapSelectors() {
      document.getElementById("mapFloorTabs").innerHTML=mapFloors.map(floor=>`<button class="${floor.floor_code===activeMapFloor?"active":""}" type="button" onclick="showMapFloor('${escapeHtml(floor.floor_code)}')">${escapeHtml(floor.floor_name || "楼层名称待完善")}</button>`).join("");
      document.getElementById("mapAreaTabs").innerHTML=currentMapAreas().map(area=>`<button class="${area.area_code===activeMapArea?"active":""}" type="button" onclick="showMapArea('${escapeHtml(area.area_code)}')">${escapeHtml(area.area_name || "区域名称待完善")}${area.map_status==="ready"?"":" · 未建图"}</button>`).join("");
    }
    function renderTaskMap() {
      const data=mapData || {}; const groups=Array.isArray(data.groups)?data.groups:[]; if(!groups.some(group=>group.key===activeMapGroupKey))activeMapGroupKey=groups[0]?.key||"";
      const stage=document.getElementById("taskMap"); renderTaskMapSelectors(); document.getElementById("mapGuidance").textContent=data.guidance || "只显示当前拿货任务涉及的实测位置。";
      if(data.map_status!=="ready") {
        stage.innerHTML=`<div class="map-unavailable"><strong>未建立实测地图</strong><span>${escapeHtml(data.guidance || "只能按文字位置核对；系统不会生成假坐标或编号格子。")}</span></div>`;
      } else {
        const bounds=data.bounds_mm||{}; const minX=Number(bounds.min_x),minY=Number(bounds.min_y),width=Number(bounds.max_x)-minX,height=Number(bounds.max_y)-minY;
        const featureSvg=Number.isFinite(width)&&width>0&&Number.isFinite(height)&&height>0?`<svg class="task-map-features" viewBox="${minX} ${minY} ${width} ${height}" preserveAspectRatio="none">${(data.features||[]).filter(feature=>Array.isArray(feature.points)&&feature.points.length>=3).map(feature=>`<polygon class="${feature.feature_kind==="aisle"?"task-map-aisle":"task-map-zone"}" points="${feature.points.map(point=>`${Number(point[0])},${Number(point[1])}`).join(" ")}"></polygon>`).join("")}</svg>`:"";
        const points=groups.filter(group=>group.geometry).map(group=>{const point=group.geometry,active=group.key===activeMapGroupKey;return `<button class="map-point ${active?"active":""}" style="left:${Number(point.left_pct)}%;top:${Number(point.top_pct)}%;width:${Math.max(Number(point.width_pct),7)}%;height:${Math.max(Number(point.height_pct),6)}%;z-index:${active?30:Number(point.z_index||1)}" onclick="focusMapGroup('${escapeHtml(group.key)}')">第${Number(group.recommended_sequence||0)}站<br>${escapeHtml(group.label||group.employee_location_name||group.current_address_name||group.location_name||"位置名称待完善")}</button>`;}).join("");
        stage.innerHTML=featureSvg+points;
      }
      document.getElementById("mapLegend").innerHTML=groups.map(group=>`<div class="map-legend-row"><strong>第${Number(group.recommended_sequence||0)}站 · ${escapeHtml(group.label||group.employee_location_name||group.current_address_name||group.location_name||"位置名称待完善")}</strong>　${Number(group.total_pick_quantity||0)} 个<div class="map-line">${(group.lines||[]).map(line=>`${escapeHtml(line.product_code||"-")} / ${escapeHtml(line.product_name||"未命名")} · ${Number(line.pick_quantity||0)}${escapeHtml(line.unit||"个")}${line.lot_number?` · 批次 ${escapeHtml(line.lot_number)}`:""}`).join("<br>")}</div><div class="map-line">最近更新：${escapeHtml(group.updated_at||data.as_of||"未记录")}</div></div>`).join("") || '<div class="map-legend-row">当前区域没有任务位置。</div>';
      const selected=currentMapGroup(); document.getElementById("mapTitle").textContent=selected?`${data.floor_name || "楼层名称待完善"}｜${data.area_name || "区域名称待完善"}｜${selected.label||selected.employee_location_name||selected.current_address_name||selected.location_name||"文字位置"}`:"本任务实测拿货地图";
    }
    async function loadTaskMapArea() {
      mapController?.abort(); const controller=new AbortController(); mapController=controller; const generation=++mapGeneration; const taskSnapshot=String(task?.id||"");
      document.getElementById("taskMap").innerHTML='<div class="map-unavailable"><strong>正在读取实测地图…</strong><span>只读取本任务涉及的一层一片区域。</span></div>';
      try {
        const data=await request(`/api/delivery-picks/${encodeURIComponent(taskSnapshot)}/measured-map/floors/${encodeURIComponent(activeMapFloor)}?area_code=${encodeURIComponent(activeMapArea)}`,{signal:controller.signal});
        if(generation!==mapGeneration||String(task?.id||"")!==taskSnapshot)return false; mapData=data; renderTaskMap(); return true;
      } catch(error) {
        if(error?.name==="AbortError"||generation!==mapGeneration)return false; mapData={floor_code:activeMapFloor,area_code:activeMapArea,map_status:"unmeasured",guidance:error.message||"实测地图读取失败",groups:[]}; renderTaskMap(); return false;
      } finally { if(generation===mapGeneration)mapController=null; }
    }
    async function openTaskMap(groupKey) {
      if(!task?.id)return; taskScrollY=window.scrollY; activeMapGroupKey=groupKey||""; document.getElementById("mapOverlay").hidden=false; document.getElementById("taskMap").innerHTML='<div class="map-unavailable"><strong>正在读取任务地图…</strong></div>';
      const generation=++mapGeneration; mapController?.abort(); const controller=new AbortController(); mapController=controller; const taskSnapshot=String(task.id);
      try {
        const data=await request(`/api/delivery-picks/${encodeURIComponent(taskSnapshot)}/measured-map/floors`,{signal:controller.signal}); if(generation!==mapGeneration||String(task?.id||"")!==taskSnapshot)return;
        mapFloors=Array.isArray(data.floors)?data.floors:[]; const selected=(task.location_groups||[]).find(group=>group.key===activeMapGroupKey); activeMapFloor=mapFloors.find(floor=>Number(floor.floor_number)===Number(selected?.warehouse_floor))?.floor_code||mapFloors[0]?.floor_code||"";
        const areas=currentMapAreas(); activeMapArea=areas.find(area=>area.area_code===String(selected?.area_code||"").toUpperCase())?.area_code||areas[0]?.area_code||""; mapController=null;
        if(!activeMapFloor||!activeMapArea){mapData={map_status:"unmeasured",guidance:"未建立实测地图，只能按任务中的文字位置核对。",groups:[]};renderTaskMap();return;} await loadTaskMapArea();
      } catch(error) { if(error?.name==="AbortError"||generation!==mapGeneration)return; mapData={map_status:"unmeasured",guidance:error.message||"实测地图读取失败",groups:[]};renderTaskMap(); }
    }
    async function showMapFloor(floor) { activeMapFloor=String(floor); activeMapArea=currentMapAreas()[0]?.area_code||""; if(activeMapArea)await loadTaskMapArea();else renderTaskMap(); }
    async function showMapArea(area) { activeMapArea=String(area); await loadTaskMapArea(); }
    function focusMapGroup(groupKey) { activeMapGroupKey=groupKey; renderTaskMap(); }
    function closeTaskMap({restoreScroll=true}={}) { mapGeneration+=1;mapController?.abort();mapController=null;mapFloors=[];mapData=null;activeMapFloor="";activeMapArea="";activeMapGroupKey="";document.getElementById("mapOverlay").hidden=true; if(restoreScroll)requestAnimationFrame(()=>window.scrollTo(0,taskScrollY)); }
    function renderPickComponents(item) {
      const components=(item.component_lines || []).filter(component=>Number(component.planned_delivery_quantity ?? component.quantity ?? 0)>0);
      if(!components.length) return "";
      return `<section class="pick-components" aria-label="本次随货子件，只读展示"><div class="pick-components-title">本次随货子件（只读，不单独确认）</div>${components.map(component=>{ const quantity=Number(component.planned_delivery_quantity ?? component.quantity ?? 0); const label=[component.product_code || component.component_code || "-",component.product_name || component.component_name || "未命名组件"].join(" / "); return `<div class="pick-component-row"><span class="pick-component-name">${escapeHtml(label)}</span><span class="pick-component-quantity">${quantity}</span></div>`; }).join("")}</section>`;
    }
    function renderItem(item) {
      const status=statusOf(item); const id=Number(item.id); const planned=Number(item.planned_quantity ?? item.delivered_quantity ?? item.quantity ?? 0); const picked=item.picked_quantity ?? item.actual_quantity ?? (status==="picked"?planned:0); const disabled=taskActionBusy||busyItems.has(id)||!["pushed","driver_confirmed","exception"].includes(task.status);
      return `<article class="card ${escapeHtml(status)}" data-item-id="${id}"><div class="name">${escapeHtml(item.product_name||"未命名产品")}</div><div class="spec">规格：${escapeHtml(item.specification||"-")}</div><div class="code">存货编码：${escapeHtml(item.product_code||"-")}</div>${renderPickComponents(item)}<div class="qty-row"><div class="qty-label">计划 ${planned} · 实际拿货</div><input class="picked-qty" type="number" min="0" value="${Number(picked)}" aria-label="实际拿货数量" ${disabled?"disabled":""}/></div><div class="actions"><button class="primary" onclick="updateItem(${id},'picked')" ${disabled?"disabled":""}>拿齐</button><button class="partial" onclick="updateItem(${id},'partial')" ${disabled?"disabled":""}>少拿</button><button class="no-stock" onclick="updateItem(${id},'no_stock')" ${disabled?"disabled":""}>未找到</button></div></article>`;
    }
    async function updateItem(itemId,status) {
      const id=Number(itemId); if(busyItems.has(id)||taskActionBusy) return; const currentTask=task; const card=document.querySelector(`[data-item-id="${id}"]`); const item=currentTask?.items.find(row=>Number(row.id)===id); if(!item||!card) return;
      const planned=Number(item.planned_quantity ?? item.delivered_quantity ?? item.quantity ?? 0); let qty=Number(card.querySelector(".picked-qty").value); if(status==="picked"&&(!Number.isFinite(qty)||qty<=0))qty=planned; if(status==="no_stock")qty=0; if(status==="partial"&&(!Number.isFinite(qty)||qty<=0||qty>=planned))return toast("部分拿货数量必须大于0且小于计划数量"); if(!Number.isFinite(qty)||qty<0)return toast("请输入有效数量");
      busyItems.add(id); render();
      try { const body=await request(`/api/delivery-picks/${encodeURIComponent(currentTask.id)}/items/${encodeURIComponent(id)}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({pick_status:status,picked_quantity:qty})}); if(task!==currentTask)return; Object.assign(item,body.item||body); if(body.task)task={...task,...body.task,items:task.items}; render(); toast("拿货结果已保存"); }
      catch(error) { if(!handleAuthError(error))toast(error.message); }
      finally { busyItems.delete(id); if(task&&Number(task.id)===Number(currentTask.id))render(); }
    }
    async function completePlanned() {
      if(taskActionBusy||busyItems.size) return; const currentTask=task; if(!currentTask)return; taskActionBusy=true; render();
      try { const body=await request(`/api/delivery-picks/${encodeURIComponent(currentTask.id)}/complete-planned`,{method:"POST"}); if(task!==currentTask)return; task=normalize(body); toast("本单已按计划拿齐，可发货打印"); }
      catch(error) { if(!handleAuthError(error)){document.getElementById("error").textContent=error.message;toast(error.message);} }
      finally { taskActionBusy=false; if(task)render(); }
    }
    async function submitTask() {
      if(taskActionBusy||busyItems.size) return; const currentTask=task; if(!currentTask)return; taskActionBusy=true; render();
      try { const body=await request(`/api/delivery-picks/${encodeURIComponent(currentTask.id)}/submit`,{method:"POST"}); if(task!==currentTask)return; task=normalize(body); toast("异常结果已提交"); }
      catch(error) { if(!handleAuthError(error))document.getElementById("error").textContent=error.message; }
      finally { taskActionBusy=false; if(task)render(); }
    }
    async function loadTask() { try { if(taskId) await selectTask(taskId); else await loadTaskList(); } catch(error) { document.getElementById("error").textContent=error.message; } }
    async function login(event) { event.preventDefault(); if(loginBusy)return; loginBusy=true; const button=document.getElementById("loginButton"); button.disabled=true; const error=document.getElementById("loginError"); error.textContent=""; try { await request("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value,remember_me:false})}); await boot(); } catch(exception) { error.textContent=exception.message; } finally { loginBusy=false; button.disabled=false; } }
    async function boot() { try { await request("/api/auth/me"); document.getElementById("loginBox").hidden=true; document.getElementById("app").hidden=false; if(!taskId) await loadTaskList(); else await selectTask(taskId); } catch(error) { if(!handleAuthError(error)){document.getElementById("error").textContent=error.message;document.getElementById("app").hidden=false;} } }
    boot();
  </script>
</body>
</html>
