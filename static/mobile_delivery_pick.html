<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>送货拿货</title>
  <style>
    :root { --ink:#17211b; --muted:#68736c; --paper:#f4f1e8; --green:#197447; --orange:#d8661f; --red:#be3d32; --line:#d9d5c9; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 90% 0,#dcebdc,transparent 35%),var(--paper); font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; }
    header { position:sticky; top:0; z-index:5; padding:10px; color:white; background:#183f2c; box-shadow:0 3px 12px #17372830; }
    header h1 { margin:0; font-size:18px; } header p { margin:3px 0 0; color:#d9eddf; font-size:12px; }
    main { padding:10px 10px 28px; } .message { margin:35px auto; max-width:420px; padding:20px; text-align:center; background:#fffdf8; border:1px solid var(--line); border-radius:12px; }
    .login { display:grid; gap:10px; text-align:left; } label { color:var(--muted); font-size:13px; font-weight:700; } input { width:100%; padding:10px; border:1px solid #bbb7ac; border-radius:8px; font-size:16px; background:white; }
    button { min-height:38px; padding:8px 12px; border:1px solid #c6d2ca; border-radius:8px; color:#204b32; background:white; font-size:14px; font-weight:700; } button.primary { color:white; background:var(--green); border-color:var(--green); } button.partial { color:white; background:var(--orange); border-color:var(--orange); } button.no-stock { color:white; background:var(--red); border-color:var(--red); } button:disabled { opacity:.5; }
    .filters { position:sticky; top:57px; z-index:4; display:flex; gap:6px; overflow:auto; padding:5px 0 8px; scrollbar-width:none; } .filters::-webkit-scrollbar { display:none; } .filters button { flex:0 0 auto; min-width:62px; } .filters button.active { color:white; background:var(--green); }
    .customer { margin:12px 0 6px; font-size:15px; font-weight:800; } .card { margin-bottom:8px; padding:11px; background:#fffdf8; border:1px solid var(--line); border-left:5px solid var(--green); border-radius:11px; box-shadow:0 3px 12px #4b4b3518; } .card.partial { border-left-color:var(--orange); } .card.no_stock { border-left-color:var(--red); } .card.picked { opacity:.72; }
    .task-card { width:100%; margin-bottom:8px; padding:12px; text-align:left; background:#fffdf8; border-left:5px solid var(--green); } .task-card.exception { border-left-color:var(--orange); } .task-number { margin-top:4px; color:var(--muted); font-size:12px; font-weight:400; } .back-row { margin-bottom:8px; }
    .name { font-size:19px; font-weight:800; line-height:1.3; } .spec { margin-top:3px; color:#385545; font-size:15px; } .code { margin-top:3px; color:#8b958e; font-size:11px; } .pick-components { margin-top:8px; padding:7px 8px; border:1px solid #d5e1d7; border-radius:7px; background:#f5faf5; } .pick-components-title { color:#385545; font-size:12px; font-weight:800; } .pick-component-row { display:flex; justify-content:space-between; gap:8px; margin-top:3px; color:#385545; font-size:12px; } .pick-component-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .pick-component-quantity { flex:0 0 auto; color:#17211b; font-weight:800; } .qty-row { display:grid; grid-template-columns:1fr 100px; gap:8px; align-items:center; margin-top:9px; } .qty-label { color:var(--muted); font-size:13px; } .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:9px; } .task-actions { display:flex; gap:8px; margin-top:12px; } .task-actions button { flex:1; }
    .normal-action { margin-bottom:10px; padding:12px; background:#e9f5ec; border:1px solid #bdd9c5; border-radius:11px; } .normal-action button { width:100%; min-height:52px; font-size:18px; } .normal-action p { margin:7px 0 0; color:#45604f; font-size:12px; text-align:center; }
    .location-card { margin-bottom:9px; padding:12px; background:#fffdf8; border:1px solid var(--line); border-left:6px solid var(--green); border-radius:11px; box-shadow:0 3px 12px #4b4b3518; } .location-card.direct { border-left-color:#3974a7; } .location-card.relocation { border-left-color:var(--orange); } .location-card.attention { border-left-color:var(--red); background:#fff5f2; } .location-title { font-size:21px; font-weight:900; line-height:1.25; } .location-meta { margin-top:4px; color:var(--muted); font-size:12px; } .location-line { display:grid; grid-template-columns:1fr auto; gap:9px; align-items:center; padding:9px 0; border-top:1px dashed #ddd7ca; } .location-line:first-of-type { margin-top:8px; } .location-product { font-size:15px; font-weight:800; } .location-spec { margin-top:2px; color:var(--muted); font-size:12px; } .location-qty { color:#143d27; font-size:22px; font-weight:900; white-space:nowrap; }
    .location-heading { display:flex; gap:8px; align-items:center; justify-content:space-between; } .sequence { flex:0 0 auto; min-width:34px; padding:4px 7px; color:white; background:var(--green); border-radius:999px; font-size:12px; text-align:center; } .map-button { margin-top:8px; width:100%; }
    [hidden] { display:none !important; } .map-overlay { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; background:#eef3ec; } .map-header { display:flex; gap:8px; align-items:center; padding:10px; color:white; background:#183f2c; } .map-header strong { flex:1; } .map-header button { color:white; border-color:#ffffff66; background:transparent; } .map-body { flex:1; overflow:auto; padding:10px; } .task-map { position:relative; width:100%; min-height:66vh; overflow:hidden; border:2px solid #8aa18f; border-radius:12px; background-color:#fffdf8; background-image:linear-gradient(#dce5dd 1px,transparent 1px),linear-gradient(90deg,#dce5dd 1px,transparent 1px); background-size:10% 10%; } .map-point { position:absolute; display:flex; align-items:center; justify-content:center; min-width:42px; min-height:36px; padding:4px; transform:translate(-1px,-1px); color:#153d27; background:#aee0bc; border:2px solid #287348; border-radius:7px; font-size:11px; font-weight:900; text-align:center; box-shadow:0 2px 7px #183f2c44; } .map-point.active { z-index:30 !important; color:white; background:#d8661f; border-color:#a53e0c; outline:4px solid #f3b18488; } .map-legend { margin-top:10px; padding:10px; background:white; border-radius:10px; } .map-legend-row { padding:7px 0; border-top:1px dashed var(--line); font-size:13px; } .map-legend-row:first-child { border-top:0; }
    .ready-banner { margin-bottom:10px; padding:13px; color:#145d36; background:#e1f4e8; border:1px solid #aad1b8; border-radius:10px; font-size:16px; font-weight:800; text-align:center; }
    details.exception-tools { margin-top:12px; padding:0 10px 10px; background:#fffdf8; border:1px solid var(--line); border-radius:11px; } details.exception-tools > summary { padding:13px 2px; color:#6c4631; font-weight:800; cursor:pointer; } .exception-help { margin:0 0 8px; color:var(--muted); font-size:12px; }
    .error { color:var(--red); margin-top:8px; font-size:13px; } .toast { position:fixed; left:50%; bottom:20px; z-index:10; transform:translateX(-50%); padding:10px 15px; color:white; background:#17211be8; border-radius:10px; }
  </style>
</head>
<body>
  <header><h1>送货拿货</h1><p id="taskMeta">按客户分组，完成拿货后提交结果</p></header>
  <main>
    <section id="loginBox" class="message" hidden>
      <form class="login" onsubmit="login(event)">
        <strong>请先登录</strong>
        <label>用户名<input id="username" autocomplete="username" required /></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" required /></label>
        <button class="primary" type="submit">登录</button>
        <div id="loginError" class="error"></div>
      </form>
    </section>
    <section id="app" hidden>
      <section id="taskChooser"></section>
      <section id="taskDetail" hidden>
        <div class="back-row"><button onclick="showTaskList()">返回待拿货任务</button></div>
        <div id="normalAction" class="normal-action"><button id="completePlannedButton" class="primary" onclick="completePlanned()">本单全部按计划拿齐</button><p>正常拿齐只点这一个按钮，不会自动发货。</p></div>
        <div id="readyBanner" class="ready-banner" hidden>已拿齐，可回电脑发货打印</div>
        <div id="locationGroups"></div>
        <details id="exceptionTools" class="exception-tools">
          <summary>有缺货或数量不一致时再登记</summary>
          <p class="exception-help">只有实际少拿、没货或多拿时才需要操作下面明细。</p>
          <nav id="filters" class="filters" aria-label="拿货状态筛选"></nav>
          <div id="groups"></div>
          <div class="task-actions"><button class="partial" onclick="submitTask()">提交异常结果</button><button onclick="loadTask()">刷新</button></div>
        </details>
      </section>
      <div id="error" class="error"></div>
    </section>
  </main>
  <section id="mapOverlay" class="map-overlay" hidden aria-label="本次拿货位置地图">
    <div class="map-header"><button onclick="closeTaskMap()">返回拿货任务</button><strong id="mapTitle">三楼拿货位置</strong></div>
    <div class="map-body"><div id="taskMap" class="task-map"></div><div id="mapLegend" class="map-legend"></div></div>
  </section>
  <div id="toast" class="toast" hidden></div>
  <script>
    let taskId = new URLSearchParams(location.search).get("task_id");
    let task = null; let activeFilter = "open"; let taskScrollY = 0; let activeMapGroupKey = "";
    const statusOf = item => item.pick_status || "pending";
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const toast = text => { const node=document.getElementById("toast"); node.textContent=text; node.hidden=false; setTimeout(()=>node.hidden=true,2200); };
    async function request(url, options={}) { const response=await fetch(url,{credentials:"include",...options}); const body=await response.json().catch(()=>({})); if(!response.ok) throw new Error(body.detail || "操作失败"); return body; }
    function normalize(body) { const source=body.task || body; return { ...source, items: body.items || source.items || [] }; }
    function filters() { return [["open","未完成",item=>statusOf(item)!=="picked"],["pending","待拿货",item=>statusOf(item)==="pending"],["partial","部分",item=>statusOf(item)==="partial"],["no_stock","没货",item=>statusOf(item)==="no_stock"],["picked","已拿货",item=>statusOf(item)==="picked"],["all","全部",()=>true]]; }
    function setFilter(key) { activeFilter=key; render(); }
    function taskStatusLabel(value) { return ({pushed:"待拿货",driver_confirmed:"可发货打印",exception:"有异常",applied:"可发货打印",dispatched:"已发货"}[value] || value || "待拿货"); }
    async function loadTaskList() {
      const chooser=document.getElementById("taskChooser"); chooser.hidden=false; chooser.innerHTML='<div class="message">正在读取待拿货任务…</div>'; document.getElementById("error").textContent="";
      let page=1; let rows=[]; let totalPages=1;
      do { const body=await request(`/api/delivery-picks?response_mode=summary&include_dispatched=false&page=${page}&page_size=100`); rows=rows.concat(body.items || []); totalPages=Math.max(Number(body.total_pages || 1),1); page+=1; } while(page<=totalPages);
      const groups=new Map();
      rows.forEach(row=>{ const customer=row.customer_name || "未指定客户"; if(!groups.has(customer)) groups.set(customer,[]); groups.get(customer).push(row); });
      document.getElementById("taskMeta").textContent="按客户查看待拿货任务";
      document.getElementById("taskDetail").hidden=true;
      chooser.innerHTML=groups.size ? [...groups.entries()].map(([customer,tasks])=>`<section><div class="customer">${escapeHtml(customer)}</div>${tasks.map(row=>`<button class="task-card ${row.has_exception||row.status==="exception"?"exception":""}" onclick="selectTask(${Number(row.id)})"><strong>${escapeHtml(taskStatusLabel(row.status))}</strong><div class="task-number">${escapeHtml(row.delivery_number || `任务 ${row.id}`)}</div></button>`).join("")}</section>`).join("") : '<div class="message">当前没有待拿货任务</div>';
    }
    async function selectTask(id) {
      taskId=String(id); const url=new URL(location.href); url.searchParams.set("task_id",taskId); history.replaceState(null,"",url);
      task=normalize(await request(`/api/delivery-picks/${encodeURIComponent(taskId)}`)); document.getElementById("taskChooser").hidden=true; document.getElementById("taskDetail").hidden=false; render();
    }
    async function showTaskList() { task=null; taskId=null; const url=new URL(location.href); url.searchParams.delete("task_id"); history.replaceState(null,"",url); await loadTaskList(); }
    function render() {
      if(!task) return;
      document.getElementById("taskMeta").textContent=`${task.delivery_number || "送货单"} · ${taskStatusLabel(task.status)}`;
      const ready=["driver_confirmed","applied"].includes(task.status);
      document.getElementById("normalAction").hidden=ready;
      document.getElementById("readyBanner").hidden=!ready;
      const completeButton=document.getElementById("completePlannedButton");
      completeButton.disabled=task.status!=="pushed" || task.location_plan_complete===false;
      document.getElementById("locationGroups").innerHTML=(task.location_groups || []).length ? (task.location_groups || []).map(renderLocationGroup).join("") : '<div class="message">当前没有可用的拿货位置计划，请刷新或登记异常。</div>';
      const rows=task.items || []; const defs=filters();
      document.getElementById("filters").innerHTML=defs.map(([key,label,predicate])=>`<button class="${activeFilter===key?"active":""}" onclick="setFilter('${key}')">${rows.filter(predicate).length} ${label}</button>`).join("");
      const predicate=defs.find(row=>row[0]===activeFilter)[2]; const visible=rows.filter(predicate); const groups=new Map();
      visible.forEach(item=>{ const customer=item.customer_name || task.customer_name || "未指定客户"; if(!groups.has(customer)) groups.set(customer,[]); groups.get(customer).push(item); });
      document.getElementById("groups").innerHTML=groups.size ? [...groups.entries()].map(([customer,items])=>`<section><div class="customer">${escapeHtml(customer)}</div>${items.map(renderItem).join("")}</section>`).join("") : '<div class="message">当前筛选没有待处理明细</div>';
      if(task.has_exception || task.status==="exception") document.getElementById("exceptionTools").open=true;
    }
    function renderLocationGroup(group) {
      const classes=["location-card"]; if(group.source_type==="production_direct") classes.push("direct"); if(group.needs_relocation) classes.push("relocation"); if(group.requires_attention) classes.push("attention");
      const pallet=group.pallet_code ? `栈板 ${group.pallet_code}` : (group.source_type==="finished_inventory" ? "未绑定栈板" : "");
      const lines=(group.lines || []).map(line=>`<div class="location-line"><div><div class="location-product">${escapeHtml([line.product_code || "-",line.product_name || "未命名产品"].join(" / "))}</div><div class="location-spec">${escapeHtml(line.specification || "-")}${line.lot_number ? ` · 批次 ${escapeHtml(line.lot_number)}` : ""}</div></div><div class="location-qty">${Number(line.pick_quantity || 0)} ${escapeHtml(line.unit || "个")}</div></div>`).join("");
      const sequence=Number(group.recommended_sequence || 0); const mapped=group.map_status==="mapped" && group.map_point;
      const mapAction=mapped ? `<button class="map-button" onclick="openTaskMap('${escapeHtml(group.key)}')">地图定位此位置</button>` : `<div class="location-meta">${group.map_status==="unmapped"?"此库位尚未录入地图，按上方位置文字拿货":"此项按文字位置拿货"}</div>`;
      return `<section class="${classes.join(" ")}"><div class="location-heading"><div class="location-title">${escapeHtml(group.label || "拿货位置")}</div>${sequence?`<span class="sequence">第${sequence}站</span>`:""}</div>${pallet ? `<div class="location-meta">${escapeHtml(pallet)}</div>` : ""}${lines}${mapAction}</section>`;
    }
    function openTaskMap(groupKey) {
      const mapped=(task?.location_groups || []).filter(group=>group.map_status==="mapped" && group.map_point);
      if(!mapped.length) return toast("本任务没有已录入地图的位置");
      taskScrollY=window.scrollY; activeMapGroupKey=groupKey || mapped[0].key;
      document.getElementById("taskMap").innerHTML=mapped.map(group=>{ const point=group.map_point; const active=group.key===activeMapGroupKey; return `<button class="map-point ${active?"active":""}" style="left:${Number(point.left_pct)}%;top:${Number(point.top_pct)}%;width:${Math.max(Number(point.width_pct),7)}%;height:${Math.max(Number(point.height_pct),6)}%;z-index:${active?30:Number(point.z_index||1)}" onclick="focusMapGroup('${escapeHtml(group.key)}')">${Number(group.recommended_sequence||0)}<br>${escapeHtml(group.location_code || "库位")}</button>`; }).join("");
      document.getElementById("mapLegend").innerHTML=mapped.map(group=>`<div class="map-legend-row"><strong>第${Number(group.recommended_sequence||0)}站 · ${escapeHtml(group.location_code || group.label)}</strong>　${Number(group.total_pick_quantity||0)} 个${group.pallet_code?` · ${escapeHtml(group.pallet_code)}`:""}</div>`).join("");
      const selected=mapped.find(group=>group.key===activeMapGroupKey); document.getElementById("mapTitle").textContent=selected?`三楼地图 · ${selected.location_code}`:"三楼拿货位置";
      document.getElementById("mapOverlay").hidden=false;
    }
    function focusMapGroup(groupKey) { activeMapGroupKey=groupKey; openTaskMap(groupKey); }
    function closeTaskMap() { document.getElementById("mapOverlay").hidden=true; requestAnimationFrame(()=>window.scrollTo(0,taskScrollY)); }
    function renderPickComponents(item) {
      const components=(item.component_lines || []).filter(component=>Number(component.planned_delivery_quantity ?? component.quantity ?? 0)>0);
      if(!components.length) return "";
      return `<section class="pick-components" aria-label="本次随货子件，只读展示"><div class="pick-components-title">本次随货子件（只读，不单独确认）</div>${components.map(component=>{ const quantity=Number(component.planned_delivery_quantity ?? component.quantity ?? 0); const label=[component.product_code || component.component_code || "-",component.product_name || component.component_name || "未命名组件"].join(" / "); return `<div class="pick-component-row"><span class="pick-component-name">${escapeHtml(label)}</span><span class="pick-component-quantity">${quantity}</span></div>`; }).join("")}</section>`;
    }
    function renderItem(item) {
      const status=statusOf(item); const planned=Number(item.planned_quantity ?? item.delivered_quantity ?? item.quantity ?? 0); const picked=item.picked_quantity ?? item.actual_quantity ?? (status==="picked"?planned:0);
      return `<article class="card ${escapeHtml(status)}" data-item-id="${item.id}"><div class="name">${escapeHtml(item.product_name || "未命名产品")}</div><div class="spec">规格：${escapeHtml(item.specification || "-")}</div><div class="code">存货编码：${escapeHtml(item.product_code || "-")}</div>${renderPickComponents(item)}<div class="qty-row"><div class="qty-label">计划 ${planned} · 当前拿货</div><input class="picked-qty" type="number" min="0" value="${Number(picked)}" aria-label="实际拿货数量" /></div><div class="actions"><button class="primary" onclick="updateItem(${item.id},'picked')">已拿货</button><button class="partial" onclick="updateItem(${item.id},'partial')">部分拿货</button><button class="no-stock" onclick="updateItem(${item.id},'no_stock')">没货</button></div></article>`;
    }
    async function updateItem(itemId,status) { const card=document.querySelector(`[data-item-id="${itemId}"]`); const item=task.items.find(row=>Number(row.id)===Number(itemId)); if(!item||!card) return; const planned=Number(item.planned_quantity ?? item.delivered_quantity ?? item.quantity ?? 0); let qty=Number(card.querySelector(".picked-qty").value); if(status==="picked" && (!Number.isFinite(qty)||qty<=0)) qty=planned; if(status==="no_stock") qty=0; if(status==="partial" && (!Number.isFinite(qty)||qty<=0||qty>=planned)) return toast("部分拿货数量必须大于0且小于计划数量"); if(!Number.isFinite(qty)||qty<0) return toast("请输入有效数量"); try { const body=await request(`/api/delivery-picks/${encodeURIComponent(task.id)}/items/${encodeURIComponent(itemId)}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({pick_status:status,picked_quantity:qty})}); Object.assign(item,body.item || body); if(body.task) task={...task,...body.task,items:task.items}; render(); toast("拿货结果已保存"); } catch(error) { toast(error.message); } }
    async function completePlanned() { try { const body=await request(`/api/delivery-picks/${encodeURIComponent(task.id)}/complete-planned`,{method:"POST"}); task=normalize(body); render(); toast("本单已按计划拿齐，可发货打印"); } catch(error) { document.getElementById("error").textContent=error.message; toast(error.message); } }
    async function submitTask() { try { const body=await request(`/api/delivery-picks/${encodeURIComponent(task.id)}/submit`,{method:"POST"}); task=normalize(body); render(); toast("异常结果已提交"); } catch(error) { document.getElementById("error").textContent=error.message; } }
    async function loadTask() { try { if(taskId) await selectTask(taskId); else await loadTaskList(); } catch(error) { document.getElementById("error").textContent=error.message; } }
    async function login(event) { event.preventDefault(); const error=document.getElementById("loginError"); error.textContent=""; try { await request("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value,remember_me:false})}); await boot(); } catch(exception) { error.textContent=exception.message; } }
    async function boot() { try { await request("/api/auth/me"); document.getElementById("loginBox").hidden=true; document.getElementById("app").hidden=false; if(!taskId) await loadTaskList(); else await selectTask(taskId); } catch(error) { if(/401|登录|Unauthorized/i.test(error.message)) { document.getElementById("loginBox").hidden=false; document.getElementById("app").hidden=true; } else { document.getElementById("error").textContent=error.message; document.getElementById("app").hidden=false; } } }
    boot();
  </script>
</body>
</html>
