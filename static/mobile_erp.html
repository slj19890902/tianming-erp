<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>天明 ERP 手机版</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f1;
      --card: #fff;
      --ink: #17231d;
      --muted: #66736d;
      --line: #d4ded9;
      --green: #14734a;
      --green-soft: #e7f5ed;
      --blue: #126aa8;
      --blue-soft: #e8f3fb;
      --orange: #9a5308;
      --orange-soft: #fff1dc;
      --red: #b42318;
      --red-soft: #fff0ee;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; min-width: 0; }
    html, body { width: 100%; margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); }
    body { min-height: 100vh; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #7ab8e5; outline-offset: 2px; }
    [hidden] { display: none !important; }
    .app { width: min(100%, 480px); min-height: 100vh; margin: auto; padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
    .topbar {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
      justify-content: space-between; gap: 10px; padding: 12px 14px;
      border-bottom: 1px solid var(--line); background: rgba(238, 243, 241, .97);
    }
    .brand strong { display: block; font-size: 19px; }
    .brand span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .desktop-link { color: var(--blue); font-size: 12px; font-weight: 800; text-decoration: none; }
    main { padding: 12px 13px 20px; }
    .page-title { margin: 0 0 4px; font-size: 20px; }
    .page-help { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .card {
      margin-bottom: 10px; padding: 12px; border: 1px solid var(--line);
      border-radius: 13px; background: var(--card); box-shadow: 0 3px 12px rgba(34, 57, 46, .05);
    }
    .card h2, .card h3, .card p { margin-top: 0; }
    .card h2 { margin-bottom: 7px; font-size: 17px; }
    .card h3 { margin-bottom: 5px; font-size: 15px; }
    .muted { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .status { padding: 14px; text-align: center; }
    .status.error { border-color: #efb2ad; background: var(--red-soft); color: #861c15; }
    .status.empty { background: #f8faf9; color: var(--muted); }
    .retry, .small-btn {
      min-height: 36px; padding: 6px 10px; border: 1px solid var(--line);
      border-radius: 9px; background: #fff; color: var(--ink); font-weight: 800;
    }
    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .metric { padding: 10px; border-radius: 10px; background: #f3f6f4; }
    .metric strong { display: block; color: var(--green); font-size: 22px; }
    .metric span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .searchbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 10px; }
    .searchbar input { width: 100%; min-height: 46px; padding: 9px 11px; border: 1px solid #aabbb2; border-radius: 10px; background: #fff; }
    .search-btn { min-height: 46px; padding: 8px 14px; border: 0; border-radius: 10px; background: var(--green); color: #fff; font-weight: 900; }
    .search-options { display: flex; justify-content: flex-end; margin: -2px 0 9px; }
    .search-options label { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; color: var(--muted); font-size: 12px; }
    .search-options input { width: 18px; height: 18px; }
    .candidate { display: block; width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: #fff; text-align: left; }
    .candidate + .candidate { margin-top: 8px; }
    .candidate strong, .candidate span { display: block; overflow-wrap: anywhere; }
    .candidate span { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .candidate-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 8px; }
    .candidate-summary span { margin: 0; padding: 6px 3px; border-radius: 7px; background: #f3f6f4; color: var(--ink); text-align: center; font-size: 11px; }
    .candidate-action { margin-top: 8px !important; color: var(--blue) !important; font-weight: 900; }
    .candidate.zero-stock { border-style: dashed; background: #fafcfb; }
    .result-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .result-head .small-btn { flex: 0 0 auto; }
    .result-actions { display: flex; flex: 0 0 auto; gap: 6px; align-items: center; }
    .stock-card.finished { border-left: 5px solid var(--green); }
    .stock-card.semi { border-left: 5px solid var(--blue); }
    .stock-card.raw { border-left: 5px solid var(--orange); background: #fffaf3; }
    .stock-totals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
    .stock-total { padding: 8px 3px; border-radius: 8px; background: #f3f6f4; text-align: center; }
    .stock-total strong { display: block; font-size: 17px; }
    .stock-total span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .location { margin-top: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fafcfb; }
    .location-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 7px; }
    .location strong { overflow-wrap: anywhere; }
    .location p { margin: 5px 0 0; }
    .map-btn { flex: 0 0 auto; min-height: 34px; padding: 5px 8px; border: 1px solid var(--blue); border-radius: 8px; background: var(--blue-soft); color: var(--blue); font-weight: 900; }
    .tag { display: inline-flex; margin-top: 5px; padding: 3px 7px; border-radius: 99px; font-size: 10px; font-weight: 900; }
    .tag.mapped { background: var(--green-soft); color: var(--green); }
    .tag.unplaced { background: var(--orange-soft); color: var(--orange); }
    .tag.ledger_only { background: #edf0ee; color: #54615b; }
    .periods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
    .period-btn { min-height: 38px; padding: 5px 3px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--muted); font-weight: 900; }
    .period-btn.active { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .production-card { border-left: 5px solid var(--blue); }
    .production-card.material-short { border-left-color: var(--orange); }
    .production-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .production-head .tag { flex: 0 0 auto; margin-top: 0; }
    .fact-line { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .task-card { margin-top: 9px; padding: 10px; border-radius: 10px; background: #f3f7f5; }
    .task-card strong { display: block; overflow-wrap: anywhere; }
    .task-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 7px; }
    .task-fact { padding: 7px; border-radius: 8px; background: #fff; }
    .task-fact strong { color: var(--green); font-size: 16px; }
    .task-fact span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .drawing-btn { display: inline-flex; align-items: center; min-height: 34px; margin-top: 8px; padding: 5px 9px; border: 1px solid var(--blue); border-radius: 8px; background: var(--blue-soft); color: var(--blue); font-weight: 900; }
    .bottom-nav {
      position: fixed; right: 0; bottom: 0; left: 0; z-index: 12;
      padding: 7px 10px calc(7px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: rgba(255, 255, 255, .98);
    }
    .bottom-inner { display: grid; grid-template-columns: repeat(var(--nav-count, 2), minmax(0, 1fr)); gap: 7px; width: min(100%, 480px); margin: auto; }
    .nav-btn { min-height: 50px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 900; }
    .nav-btn.active { background: var(--green-soft); color: var(--green); }
    .map-layer { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #fff; }
    .map-layer-head { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-bottom: 1px solid var(--line); }
    .map-layer-head strong { flex: 1; }
    .map-layer iframe { width: 100%; height: 100%; border: 0; }
    .skeleton { height: 82px; overflow: hidden; background: linear-gradient(90deg, #e4eae7, #f8faf9, #e4eae7); background-size: 220% 100%; animation: loading 1.2s linear infinite; }
    @keyframes loading { to { background-position: -220% 0; } }
    @media (max-width: 350px) {
      main { padding-inline: 10px; }
      .topbar { padding-inline: 11px; }
      .stock-totals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><strong>天明 ERP 手机版</strong><span id="userText">正在核对账号…</span></div>
      <a class="desktop-link" href="/">电脑版</a>
    </header>

    <main>
      <section id="homePage">
        <h1 class="page-title">今天先做什么</h1>
        <p class="page-help">按当前账号权限只读显示待办；所有数字仍来自正式 ERP 接口。</p>
        <div id="homeState" class="card status">正在读取首页…</div>
        <div id="homeCards" class="metric-grid" hidden></div>
      </section>

      <section id="searchPage" hidden>
        <h1 class="page-title">查产品和库存位置</h1>
        <p class="page-help">先按客户、存货编码、产品名称或规格找到货物，再看真实库存位置；有多个结果时必须自己点选。原料仓尚未建立时不会显示虚假数量。</p>
        <div class="searchbar">
          <input id="searchInput" maxlength="100" autocomplete="off" placeholder="输入客户、存货编码、产品名称或规格">
          <button id="searchButton" class="search-btn" type="button">查找</button>
        </div>
        <div id="zeroStockControl" class="search-options" hidden>
          <label><input id="includeZeroStock" type="checkbox">包含零库存产品</label>
        </div>
        <div id="searchState" class="card status empty">请输入关键词开始查找。</div>
        <div id="candidateList" hidden></div>
        <div id="productResult" hidden></div>
      </section>

      <section id="productionPage" hidden>
        <h1 class="page-title">近期来料和生产资料</h1>
        <p class="page-help">只显示已经正式收料的订单。这里用于车间查看图纸、尺寸和模具位置，不能收料或确认完工。</p>
        <div class="periods" aria-label="来料日期范围">
          <button class="period-btn" type="button" data-period="today">今天</button>
          <button class="period-btn active" type="button" data-period="3d">近3天</button>
          <button class="period-btn" type="button" data-period="7d">近7天</button>
          <button class="period-btn" type="button" data-period="custom">自选</button>
        </div>
        <div id="customDates" class="card" hidden>
          <label>开始日期 <input id="dateFrom" type="date"></label>
          <label>结束日期 <input id="dateTo" type="date"></label>
          <button id="loadCustom" class="small-btn" type="button">查看</button>
        </div>
        <div id="productionState" class="card status">正在读取近期来料…</div>
        <div id="productionList" hidden></div>
      </section>
    </main>
  </div>

  <nav id="bottomNav" class="bottom-nav" aria-label="手机主导航" hidden>
    <div class="bottom-inner">
      <button class="nav-btn active" type="button" data-page="home">首页</button>
      <button class="nav-btn" type="button" data-page="search">查产品</button>
      <button class="nav-btn" type="button" data-page="production">近期生产</button>
    </div>
  </nav>

  <section id="mapLayer" class="map-layer" hidden aria-label="仓库地图">
    <div class="map-layer-head">
      <button id="closeMap" class="small-btn" type="button">返回产品</button>
      <strong id="mapTitle">仓库位置</strong>
    </div>
    <iframe id="mapFrame" title="只读仓库地图" src="about:blank"></iframe>
  </section>

  <section id="drawingLayer" class="map-layer" hidden aria-label="生产图纸">
    <div class="map-layer-head">
      <button id="closeDrawing" class="small-btn" type="button">返回生产资料</button>
      <strong id="drawingTitle">生产图纸</strong>
    </div>
    <iframe id="drawingFrame" title="生产图纸" src="about:blank"></iframe>
  </section>

  <script>
    (() => {
      "use strict";

      const state = {
        auth: null,
        dashboard: null,
        query: "",
        candidates: [],
        searchMeta: null,
        selectedProductId: null,
        selectedInventory: null,
        searchTimer: null,
        searchController: null,
        detailController: null,
        searchGeneration: 0,
        detailGeneration: 0,
        productionItems: [],
        productionPeriod: "3d",
        productionController: null,
        homeController: null,
        homeGeneration: 0,
        allowedPages: new Set(),
        activePage: "",
        initializing: false,
      };
      const mobilePages = new Set(["home", "search", "production"]);
      const byId = id => document.getElementById(id);

      function node(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = String(text);
        return element;
      }

      async function apiGet(url, options = {}) {
        let response;
        try {
          response = await fetch(url, {
            credentials: "same-origin",
            headers: { Accept: "application/json" },
            signal: options.signal,
          });
        } catch (error) {
          if (error && error.name === "AbortError") throw error;
          throw new Error("无法连接 ERP 服务，请检查网络后重试");
        }
        if (response.status === 401) {
          const loginParams = new URLSearchParams({
            redirect: "/mobile/erp.html",
            mobile_page: state.activePage || safeRequestedPage() || "home",
          });
          window.location.replace(`/?${loginParams.toString()}`);
          throw new Error("登录已失效，正在返回登录页");
        }
        const text = await response.text();
        let payload = null;
        if (text) {
          try { payload = JSON.parse(text); } catch (_error) { payload = null; }
        }
        if (!response.ok) {
          const detail = payload && payload.detail;
          const message = typeof detail === "string"
            ? detail
            : (detail && typeof detail.message === "string" ? detail.message : "");
          throw new Error(message || `读取失败（HTTP ${response.status}）`);
        }
        return payload;
      }

      function safeRequestedPage() {
        const requested = window.location.hash.replace(/^#/, "").trim();
        return mobilePages.has(requested) ? requested : "";
      }

      function setPage(page, { updateLocation = true } = {}) {
        if (!state.allowedPages.has(page)) {
          page = document.querySelector(".nav-btn:not([hidden])")?.dataset.page || "";
        }
        if (!page || !state.allowedPages.has(page)) return;
        state.activePage = page;
        const isHome = page === "home";
        const isSearch = page === "search";
        byId("homePage").hidden = !isHome;
        byId("searchPage").hidden = !isSearch;
        byId("productionPage").hidden = page !== "production";
        document.querySelectorAll(".nav-btn").forEach(button => {
          button.classList.toggle("active", button.dataset.page === page);
        });
        if (updateLocation && window.location.hash !== `#${page}`) {
          window.history.replaceState(null, "", `#${page}`);
        }
        if (isSearch) byId("searchInput").focus();
        if (page === "production" && !state.productionItems.length) loadProduction();
      }

      function showStatus(targetId, message, kind = "empty", retry = null) {
        const target = byId(targetId);
        target.hidden = false;
        target.className = `card status ${kind}`;
        target.replaceChildren(node("div", "", message));
        if (retry) {
          const button = node("button", "retry", "重试");
          button.type = "button";
          button.addEventListener("click", retry);
          target.append(button);
        }
      }

      async function loadHome() {
        state.homeController?.abort();
        const controller = new AbortController();
        state.homeController = controller;
        const generation = ++state.homeGeneration;
        showStatus("homeState", "正在读取首页…", "");
        try {
          state.dashboard = await apiGet("/api/dashboard/overview", { signal: controller.signal });
          if (generation !== state.homeGeneration) return;
          const cards = Array.isArray(state.dashboard.cards) ? state.dashboard.cards : [];
          const container = byId("homeCards");
          container.replaceChildren();
          cards.forEach(item => {
            const card = node("div", "metric");
            const value = item.amount !== undefined && item.amount !== null
              ? `¥${item.amount}`
              : `${item.count || 0}${item.count_unit || ""}`;
            card.append(node("strong", "", value), node("span", "", item.title || "待办"));
            container.append(card);
          });
          if (!cards.length) {
            showStatus("homeState", "当前没有需要显示的待办。", "empty", loadHome);
            container.hidden = true;
            return;
          }
          byId("homeState").hidden = true;
          container.hidden = false;
        } catch (error) {
          if (error.name === "AbortError" || generation !== state.homeGeneration) return;
          showStatus("homeState", error.message || "首页读取失败", "error", loadHome);
        }
      }

      function queueSearch() {
        window.clearTimeout(state.searchTimer);
        const query = byId("searchInput").value.trim();
        if (!query) {
          state.query = "";
          state.candidates = [];
          state.searchMeta = null;
          byId("candidateList").hidden = true;
          byId("productResult").hidden = true;
          showStatus("searchState", "请输入关键词开始查找。", "empty");
          return;
        }
        state.searchTimer = window.setTimeout(runSearch, 280);
      }

      async function runSearch() {
        const query = byId("searchInput").value.trim();
        if (!query) return queueSearch();
        state.searchController?.abort();
        state.searchController = new AbortController();
        const generation = ++state.searchGeneration;
        state.query = query;
        state.selectedProductId = null;
        state.selectedInventory = null;
        byId("candidateList").hidden = true;
        byId("productResult").hidden = true;
        showStatus("searchState", "正在查找产品…", "");
        try {
          const includeZero = byId("includeZeroStock").checked;
          const data = await apiGet(`/api/mobile/erp/products?q=${encodeURIComponent(query)}&limit=20&include_zero=${includeZero}`, {
            signal: state.searchController.signal,
          });
          if (generation !== state.searchGeneration) return;
          state.candidates = Array.isArray(data.items) ? data.items : [];
          state.searchMeta = data;
          renderCandidates(data);
        } catch (error) {
          if (error.name === "AbortError" || generation !== state.searchGeneration) return;
          showStatus("searchState", error.message || "产品查找失败", "error", runSearch);
        }
      }

      function renderCandidates(data) {
        const container = byId("candidateList");
        container.replaceChildren();
        if (!state.candidates.length) {
          container.hidden = true;
          const zeroCount = Number(data.zero_stock_match_count || 0);
          const message = zeroCount > 0 && data.include_zero !== true
            ? `找到 ${zeroCount} 款匹配产品，但当前没有在库数量。管理员可勾选“包含零库存产品”查看。`
            : "没有找到匹配产品，请换一个关键词。";
          showStatus("searchState", message, "empty", runSearch);
          return;
        }
        const note = node(
          "div",
          "card muted",
          data.requires_selection === true ? `找到 ${state.candidates.length} 款，请点选正确产品。` : "找到 1 款，请点开查看库存。"
        );
        container.append(note);
        state.candidates.forEach(product => {
          const summary = product.inventory_summary || {};
          const finished = summary.finished || {};
          const semi = summary.semi_finished || {};
          const button = node("button", `candidate${summary.has_stock === false ? " zero-stock" : ""}`);
          button.type = "button";
          button.append(
            node("strong", "", product.customer_material_code || product.product_code),
            node("span", "", `${product.customer_name}｜${product.product_name}`),
            node("span", "", product.specification || "未填写规格")
          );
          const totals = node("div", "candidate-summary");
          if (summary.has_stock === false) {
            totals.append(node("span", "", "当前无在库数量"));
          } else {
            totals.append(
              node("span", "", `成品 ${Number(finished.quantity_total || 0)}${finished.unit || "只"}`),
              node("span", "", `纸板 ${Number(semi.quantity_total || 0)}${semi.unit || "张"}`),
              node("span", "", `${Number(summary.position_count || 0)} 个位置`)
            );
          }
          button.append(totals, node("span", "candidate-action", "查看位置"));
          button.addEventListener("click", () => loadInventory(product.id));
          container.append(button);
        });
        byId("searchState").hidden = true;
        container.hidden = false;
      }

      async function loadInventory(productId) {
        state.detailController?.abort();
        state.detailController = new AbortController();
        const generation = ++state.detailGeneration;
        state.selectedProductId = productId;
        byId("productResult").hidden = true;
        showStatus("searchState", "正在读取库存和位置…", "");
        try {
          const data = await apiGet(`/api/mobile/erp/products/${productId}/inventory`, {
            signal: state.detailController.signal,
          });
          if (generation !== state.detailGeneration) return;
          state.selectedInventory = data;
          renderInventory();
        } catch (error) {
          if (error.name === "AbortError" || generation !== state.detailGeneration) return;
          showStatus("searchState", error.message || "库存读取失败", "error", () => loadInventory(productId));
        }
      }

      function totalCell(label, value, unit) {
        const cell = node("div", "stock-total");
        cell.append(node("strong", "", `${value || 0}${unit}`), node("span", "", label));
        return cell;
      }

      function locationCard(position) {
        const card = node("div", "location");
        const top = node("div", "location-top");
        top.append(node("strong", "", `${position.location_code}｜${position.quantity_available}${position.unit}可用`));
        if (position.map_url) {
          const button = node("button", "map-btn", "地图定位");
          button.type = "button";
          button.addEventListener("click", () => openMap(position));
          top.append(button);
        }
        card.append(top);
        const facts = [
          position.location_name && position.location_name !== position.location_code ? position.location_name : "",
          position.area_code ? `${position.area_code} 区` : "",
          position.pallet_code ? `栈板 ${position.pallet_code}` : "",
          position.quantity_reserved ? `已预留 ${position.quantity_reserved}${position.unit}` : "",
        ].filter(Boolean).join("｜");
        if (facts) card.append(node("p", "muted", facts));
        card.append(node("span", `tag ${position.map_status}`, position.map_status_text));
        return card;
      }

      function stockCard(title, className, data) {
        const card = node("section", `card stock-card ${className}`);
        card.append(node("h2", "", title));
        const totals = node("div", "stock-totals");
        totals.append(
          totalCell("在库合计", data.quantity_total, data.unit),
          totalCell("现在可用", data.quantity_available, data.unit),
          totalCell("已经预留", data.quantity_reserved, data.unit),
          totalCell("等待拿货", data.quantity_pending_pick, data.unit)
        );
        card.append(totals);
        if (!data.positions.length) {
          card.append(node("p", "muted", "当前没有正式在库记录。"));
        } else {
          data.positions.forEach(position => card.append(locationCard(position)));
        }
        return card;
      }

      function renderInventory() {
        const data = state.selectedInventory;
        const product = data.product;
        const result = byId("productResult");
        result.replaceChildren();
        const header = node("section", "card");
        const headerRow = node("div", "result-head");
        const title = node("div");
        title.append(
          node("h2", "", product.customer_material_code || product.product_code),
          node("p", "muted", `${product.customer_name}｜${product.product_name}｜${product.specification || "未填写规格"}`)
        );
        const refresh = node("button", "small-btn", "刷新");
        refresh.type = "button";
        refresh.addEventListener("click", () => loadInventory(product.id));
        const actions = node("div", "result-actions");
        if (data.map_url) {
          const locateAll = node("button", "map-btn", "地图定位全部");
          locateAll.type = "button";
          locateAll.addEventListener("click", () => openProductMap(data));
          actions.append(locateAll);
        }
        actions.append(refresh);
        headerRow.append(title, actions);
        header.append(headerRow, node("p", "muted", `数据时间：${data.as_of || data.last_updated_at || "刚刚"}`));
        result.append(
          header,
          stockCard("成品库存", "finished", data.inventory.finished),
          stockCard("客户专用纸板备料", "semi", data.inventory.semi_finished)
        );
        const raw = node("section", "card stock-card raw");
        raw.append(
          node("h2", "", data.inventory.raw_material.label),
          node("p", "muted", data.inventory.raw_material.message)
        );
        result.append(raw);
        byId("searchState").hidden = true;
        byId("candidateList").hidden = true;
        result.hidden = false;
      }

      function openMap(position) {
        byId("mapTitle").textContent = `${position.location_code}｜只读地图`;
        byId("mapFrame").src = position.map_url;
        byId("mapLayer").hidden = false;
      }

      function openProductMap(data) {
        const product = data.product || {};
        byId("mapTitle").textContent = `${product.customer_material_code || product.product_code || "当前产品"}｜全部位置`;
        byId("mapFrame").src = data.map_url;
        byId("mapLayer").hidden = false;
      }

      function closeMap() {
        byId("mapLayer").hidden = true;
        byId("mapFrame").src = "about:blank";
        // Search text, candidates and selected product remain in memory.
      }

      function productionTaskCard(task) {
        const card = node("div", "task-card");
        const title = `${task.product_code || "无存货编码"}｜${task.product_name || "未填写产品名称"}`;
        card.append(node("strong", "", title));
        card.append(node("p", "fact-line", [
          task.carton_specification,
          task.flute_type ? `${task.flute_type}楞` : "",
          task.cutting_mode,
        ].filter(Boolean).join("｜") || "规格资料未填写"));
        const metrics = node("div", "task-grid");
        const facts = [
          ["订单要做", task.order_quantity, "只"],
          ["现在可生产", task.current_producible_quantity, "只"],
          ["纸板已收", task.received_material_quantity, "张"],
          ["任务状态", task.status_text, ""],
        ];
        facts.forEach(([label, value, unit]) => {
          const fact = node("div", "task-fact");
          fact.append(node("strong", "", `${value ?? 0}${unit}`), node("span", "", label));
          metrics.append(fact);
        });
        card.append(metrics);
        if (task.production_process || task.production_notes) {
          card.append(node("p", "fact-line", `生产要求：${task.production_process || task.production_notes}`));
        }
        if (task.mold_name || task.mold_location) {
          card.append(node("p", "fact-line", `模具：${task.mold_name || "未命名"}｜位置 ${task.mold_location || "未登记"}`));
        }
        if (task.printing_plate_mode === "plate") {
          const machine = [task.machine_set_length_mm, task.machine_set_width_mm, task.machine_set_height_mm]
            .map(value => value ?? "-").join("×");
          const plates = Array.isArray(task.printing_plates) && task.printing_plates.length
            ? task.printing_plates.map(item => `${item.color_name || "颜色未填"} ${item.plate_code}`).join(" / ")
            : (task.printing_plate_codes || []).join(" / ");
          card.append(node("p", "fact-line", `挂板：${plates || "未登记"}｜对版 ${task.plate_alignment_value_mm ?? "-"}｜挂版 ${task.plate_mount_value_mm ?? "-"}｜机设 ${machine}mm`));
        } else if (task.printing_instruction) {
          card.append(node("p", "fact-line", task.printing_instruction));
        }
        if (task.drawing_path) {
          const drawing = node("button", "drawing-btn", "查看图纸");
          drawing.type = "button";
          drawing.addEventListener("click", () => openDrawing(task));
          card.append(drawing);
        }
        return card;
      }

      function productionReceiptCard(item) {
        const card = node("section", `card production-card ${item.material_state === "材料未齐" ? "material-short" : ""}`);
        const head = node("div", "production-head");
        const title = node("div");
        title.append(
          node("h2", "", `${item.product_code || "无存货编码"}｜${item.product_name || "未填写产品名称"}`),
          node("p", "fact-line", `${item.customer_name || "未填写客户"}｜订单 ${item.order_number || "-"}`)
        );
        head.append(title, node("span", `tag ${item.material_state === "材料未齐" ? "unplaced" : "mapped"}`, item.material_state));
        card.append(head);
        const boardSize = item.board_length_mm && item.board_width_mm
          ? `${item.board_length_mm}×${item.board_width_mm}mm`
          : "纸板尺寸未填写";
        card.append(node("p", "fact-line", `${boardSize}｜本次收 ${item.received_quantity} 张｜累计 ${item.cumulative_received_quantity} 张｜还差 ${item.remaining_quantity} 张`));
        card.append(node("p", "fact-line", `收料：${item.received_by_name}｜${item.received_at || "时间未记录"}${item.supplier_document_number ? `｜供应商单号 ${item.supplier_document_number}` : ""}`));
        if (item.crease_type || (item.crease_values_mm || []).length) {
          card.append(node("p", "fact-line", `压线：${item.crease_type || "未填写"}${item.crease_values_mm.length ? `｜${item.crease_values_mm.join(" / ")}mm` : ""}`));
        }
        if (item.board_direction_note) card.append(node("p", "fact-line", `纸板方向/报料提醒：${item.board_direction_note}`));
        if (item.delivery_date) card.append(node("p", "fact-line", `交货日期：${item.delivery_date}`));
        if (!item.production_tasks.length) {
          card.append(node("p", "muted", "已经收料，当前没有可显示的生产任务。"));
        } else {
          item.production_tasks.forEach(task => card.append(productionTaskCard(task)));
        }
        return card;
      }

      function renderProduction() {
        const container = byId("productionList");
        container.replaceChildren();
        if (!state.productionItems.length) {
          container.hidden = true;
          showStatus("productionState", "这个日期范围内没有正式收料记录。", "empty", loadProduction);
          return;
        }
        state.productionItems.forEach(item => container.append(productionReceiptCard(item)));
        byId("productionState").hidden = true;
        container.hidden = false;
      }

      async function loadProduction() {
        state.productionController?.abort();
        state.productionController = new AbortController();
        const params = new URLSearchParams({ period: state.productionPeriod });
        if (state.productionPeriod === "custom") {
          const dateFrom = byId("dateFrom").value;
          const dateTo = byId("dateTo").value;
          if (!dateFrom || !dateTo) {
            showStatus("productionState", "请选择开始和结束日期。", "empty");
            return;
          }
          params.set("date_from", dateFrom);
          params.set("date_to", dateTo);
        }
        byId("productionList").hidden = true;
        showStatus("productionState", "正在读取近期来料和生产资料…", "");
        try {
          const data = await apiGet(`/api/mobile/erp/production/recent?${params}`, {
            signal: state.productionController.signal,
          });
          state.productionItems = Array.isArray(data.items) ? data.items : [];
          renderProduction();
        } catch (error) {
          if (error.name === "AbortError") return;
          showStatus("productionState", error.message || "生产资料读取失败", "error", loadProduction);
        }
      }

      function openDrawing(task) {
        byId("drawingTitle").textContent = `${task.product_code || "当前产品"}｜生产图纸`;
        byId("drawingFrame").src = task.drawing_path;
        byId("drawingLayer").hidden = false;
      }

      function closeDrawing() {
        byId("drawingLayer").hidden = true;
        byId("drawingFrame").src = "about:blank";
        // Production cards and scroll position remain untouched behind the overlay.
      }

      async function initialize() {
        if (state.initializing) return;
        state.initializing = true;
        byId("bottomNav").hidden = true;
        try {
          state.auth = await apiGet("/api/auth/me");
          const user = state.auth.user || {};
          byId("userText").textContent = `${user.display_name || user.real_name || user.username || "当前账号"}｜只读`;
          const permissions = Array.isArray(state.auth.permissions) ? state.auth.permissions : [];
          const canSearch = permissions.includes("warehouse.view");
          const canProduction = permissions.includes("orders.view") && permissions.includes("incoming.view");
          const canHome = permissions.includes("dashboard.view");
          document.querySelector('[data-page="home"]').hidden = !canHome;
          document.querySelector('[data-page="search"]').hidden = !canSearch;
          byId("zeroStockControl").hidden = !canSearch || user.role !== "admin";
          document.querySelector('[data-page="production"]').hidden = !canProduction;
          const visibleNav = [...document.querySelectorAll(".nav-btn")].filter(button => !button.hidden);
          state.allowedPages = new Set(visibleNav.map(button => button.dataset.page));
          document.querySelector(".bottom-inner").style.setProperty("--nav-count", visibleNav.length || 1);
          if (!visibleNav.length) {
            document.querySelector("main").replaceChildren(
              node("div", "card status error", "当前账号没有可用的手机只读入口，请联系管理员。")
            );
            byId("bottomNav").hidden = true;
            return;
          }
          byId("bottomNav").hidden = false;
          const requestedPage = safeRequestedPage();
          const firstPage = state.allowedPages.has(requestedPage) ? requestedPage : visibleNav[0].dataset.page;
          setPage(firstPage);
          if (firstPage === "home") await loadHome();
        } catch (error) {
          byId("bottomNav").hidden = true;
          showStatus("homeState", error.message || "手机版初始化失败", "error", initialize);
        } finally {
          state.initializing = false;
        }
      }

      document.querySelectorAll(".nav-btn").forEach(button => {
        button.addEventListener("click", () => setPage(button.dataset.page));
      });
      byId("searchInput").addEventListener("input", queueSearch);
      byId("searchInput").addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          window.clearTimeout(state.searchTimer);
          runSearch();
        }
      });
      byId("searchButton").addEventListener("click", () => {
        window.clearTimeout(state.searchTimer);
        runSearch();
      });
      byId("includeZeroStock").addEventListener("change", () => {
        if (byId("searchInput").value.trim()) runSearch();
      });
      byId("closeMap").addEventListener("click", closeMap);
      byId("closeDrawing").addEventListener("click", closeDrawing);
      document.querySelectorAll(".period-btn").forEach(button => {
        button.addEventListener("click", () => {
          state.productionPeriod = button.dataset.period;
          state.productionItems = [];
          document.querySelectorAll(".period-btn").forEach(item => item.classList.toggle("active", item === button));
          byId("customDates").hidden = state.productionPeriod !== "custom";
          if (state.productionPeriod !== "custom") loadProduction();
        });
      });
      byId("loadCustom").addEventListener("click", loadProduction);
      window.addEventListener("hashchange", () => {
        const requestedPage = safeRequestedPage();
        if (requestedPage) {
          setPage(requestedPage);
        } else if (state.activePage) {
          window.history.replaceState(null, "", `#${state.activePage}`);
        }
      });
      initialize();
    })();
  </script>
</body>
</html>
