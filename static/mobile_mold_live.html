<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>模具实时信息 - 天明ERP</title>
  <style>
    :root{--blue:#1d4ed8;--green:#15803d;--orange:#9a4d00;--red:#b91c1c;--line:#dbe3ef;--bg:#f3f6fb;--text:#172033;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Arial,"Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px}.head{max-width:780px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:20px;margin:0}.refresh{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:9px 14px;font-weight:800}.refresh:disabled{opacity:.5}main{max-width:780px;margin:auto;padding:12px}.message,.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.message{padding:14px}.error{background:#fee2e2;color:#991b1b}.muted{color:var(--muted);font-size:13px}.card-head{padding:13px 14px;border-bottom:1px solid var(--line)}.identity{font-size:24px;font-weight:900;overflow-wrap:anywhere}.location{margin-top:6px;font-size:18px;font-weight:800;color:var(--orange)}.body{padding:12px 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}.field{min-width:0}.key{display:block;color:var(--muted);font-size:12px}.value{font-weight:800;overflow-wrap:anywhere}.binding,.task{border-top:1px dashed var(--line);padding:10px 0}.binding:first-child,.task:first-child{border-top:0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:900}.tag{flex:0 0 auto;border-radius:99px;padding:2px 8px;background:#e8efff;color:var(--blue);font-size:12px;font-weight:800}.tag.green{background:#dcfce7;color:var(--green)}.tag.orange{background:#fff7dc;color:var(--orange)}.material{margin-top:8px;border-radius:9px;background:#f8fafc;padding:9px}.location-item{margin-top:6px;padding:7px;border-left:3px solid var(--blue);background:#fff}.warning{border-left:4px solid #f59e0b;background:#fffbeb;padding:9px;margin-top:8px}.empty{text-align:center;color:var(--muted);padding:14px}.hidden{display:none!important}@media(max-width:520px){.grid{grid-template-columns:1fr}.identity{font-size:21px}}
  </style>
</head>
<body>
  <header><div class="head"><h1>模具实时信息</h1><button id="refresh" class="refresh" type="button">刷新</button></div></header>
  <main><div id="message" class="message">正在从 ERP 读取最新信息…</div><div id="content"></div></main>
  <script>
    const $=id=>document.getElementById(id);const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    const parts=location.pathname.split("/").filter(Boolean),moldId=parts[0]==="M"&&/^\d+$/.test(parts[1]||"")&&Number(parts[1])>0?Number(parts[1]):null;
    function loginNext(){location.href=`/?next=${encodeURIComponent(location.pathname)}`}
    async function api(url){let response;try{response=await fetch(url,{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json"}})}catch{throw new Error("连接 ERP 失败，请检查网络后重试")}let body={};try{body=await response.json()}catch{}if(response.status===401){loginNext();throw new Error("登录已失效")}if(!response.ok)throw new Error(typeof body.detail==="string"?body.detail:`读取失败（HTTP ${response.status}）`);return body}
    function field(key,value){return `<div class="field"><span class="key">${h(key)}</span><span class="value">${h(value||"待完善")}</span></div>`}
    function binding(row){const material=[row.material_code,row.material_composition].filter(Boolean).join(" / ");return `<div class="binding"><div class="row"><div class="title">${h(row.product_name||row.product_code||"未命名产品")}</div><span class="tag">${h(row.customer_short_name||row.customer_name||row.customer_code||"客户待完善")}</span></div><div class="muted">存货 ${h(row.product_code||"待完善")}</div><div class="grid">${field("产品尺寸",row.specification)}${field("片料尺寸",row.report_specification)}${field("材质",material)}${field("楞型",row.flute_type)}${field("层数",row.layer_count?`${row.layer_count}层`:null)}</div></div>`}
    function materialBlock(material){if(material.visibility!=="visible")return '<div class="material muted">当前账号无收料详情查看权限</div>';const progress=material.received_quantity!=null&&material.planned_quantity!=null?`已收 ${material.received_quantity} 张 / 计划 ${material.planned_quantity} 张`:material.legacy_received_quantity!=null?`历史实收 ${material.legacy_received_quantity} 张，原计划未记录`:material.state==="source_conflict"?"数量待人工核对":"数量未记录";const locations=(material.locations||[]).map(row=>`<div class="location-item"><strong>${h(row.location_code)} ${h(row.location_name)}</strong>${row.availability_state==="frozen"?' <span class="tag orange">冻结</span>':""}</div>`).join("");return `<div class="material"><div class="row"><strong>材料：${h(material.state_label)}</strong><span class="tag ${["received","received_accept_short","legacy_received"].includes(material.state)?"green":"orange"}">${h(progress)}</span></div>${locations||`<div class="muted" style="margin-top:5px">${h(material.location_display||"当前没有可显示的材料库位")}</div>`}${material.warning?`<div class="warning">${h(material.warning)}</div>`:""}</div>`}
    function task(row){const quantity=row.is_component_task?`${row.order_quantity} 片（父单 ${row.parent_order_quantity} 套）`:`${row.order_quantity} 只`;return `<div class="task"><div class="row"><div class="title">${h(row.order_number)}</div><span class="tag ${row.task_status==="completed"?"green":""}">${h(row.task_status_label)}</span></div><div class="muted">${h(row.product_name||row.product_code||"")} · ${h(row.order_status_label)}${row.delivery_date?` · 交期 ${h(row.delivery_date)}`:""}</div><div class="grid">${field("订单生产数量",quantity)}${field("计划生产",row.planned_quantity)}${field("已完成",row.actual_output_quantity)}</div>${materialBlock(row.material)}</div>`}
    function render(data){const mold=data.mold||{},bindings=data.bindings?.items||[],orders=data.current_orders?.items||[],warnings=data.warnings||[];$("content").innerHTML=`<section class="card"><div class="card-head"><div class="identity">${h(mold.label_identity||mold.mold_code)}</div><div class="location">${h(mold.location_guide?.prompt||mold.rack_location||"位置待完善")}</div></div><div class="body"><div class="muted">更新时间 ${h(data.as_of)} · 实时只读</div>${mold.is_active===false?'<div class="warning">该模具已停用，请勿直接领用。</div>':""}</div></section><section class="card"><div class="card-head"><strong>当前订单与生产任务</strong></div><div class="body">${data.task_visibility==="hidden_by_permission"?'<div class="empty">当前账号无订单与模切任务查看权限</div>':orders.length?orders.map(task).join(""):'<div class="empty">当前没有关联的生产订单，以下显示模具基本资料。</div>'}</div></section><section class="card"><div class="card-head"><strong>模具对应产品</strong></div><div class="body">${bindings.length?bindings.map(binding).join(""):'<div class="empty">尚未绑定常用箱</div>'}${warnings.map(value=>`<div class="warning">${h(value)}</div>`).join("")}</div></section>`;$("message").classList.add("hidden")}
    async function load(){if(!moldId){$("message").className="message error";$("message").textContent="二维码中的模具身份无效";return}$("refresh").disabled=true;try{const auth=await api("/api/auth/me");if(!(auth.permissions||[]).includes("warehouse.view"))throw new Error("当前账号无模具查看权限");render(await api(`/api/warehouse/molds/live/${moldId}?ts=${Date.now()}`))}catch(error){if(error.message!=="登录已失效"){$("message").className="message error";$("message").textContent=error.message}}finally{$("refresh").disabled=false}}
    $("refresh").onclick=load;window.addEventListener("pageshow",event=>{if(event.persisted)load()});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});load();
  </script>
</body>
</html>
