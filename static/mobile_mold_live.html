<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>模具实时信息 - 天明ERP</title>
  <style>
    :root{--blue:#1d4ed8;--green:#15803d;--orange:#9a4d00;--red:#b91c1c;--line:#dbe3ef;--bg:#f3f6fb;--text:#172033;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Arial,"Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px}.head{max-width:780px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:20px;margin:0}.refresh,.scan-button{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:9px 14px;font-weight:800}.refresh:disabled,.scan-button:disabled{opacity:.5}main{max-width:780px;margin:auto;padding:12px}.message,.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.message{padding:14px}.error{background:#fee2e2;color:#991b1b}.success{border:2px solid var(--green);background:#f0fdf4;color:#14532d}.repair-alert{margin-top:10px;border:3px solid var(--red);border-radius:10px;background:#fee2e2;color:#7f1d1d;padding:12px;font-size:20px;font-weight:900;text-align:center}.muted{color:var(--muted);font-size:13px}.card-head{padding:13px 14px;border-bottom:1px solid var(--line)}.identity{font-size:24px;font-weight:900;overflow-wrap:anywhere}.location{margin-top:6px;font-size:18px;font-weight:800;color:var(--orange)}.body{padding:12px 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}.field{min-width:0}.key{display:block;color:var(--muted);font-size:12px}.value{font-weight:800;overflow-wrap:anywhere}.binding,.task,.history-item{border-top:1px dashed var(--line);padding:10px 0}.binding:first-child,.task:first-child,.history-item:first-child{border-top:0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:900}.task-overview{margin-top:8px;padding:10px;border-radius:10px;background:#f8fafc}.task-overview .field:last-child{grid-column:1/-1}.tag{flex:0 0 auto;border-radius:99px;padding:2px 8px;background:#e8efff;color:var(--blue);font-size:12px;font-weight:800}.tag.green{background:#dcfce7;color:var(--green)}.tag.orange{background:#fff7dc;color:var(--orange)}.material{margin-top:8px;border-radius:9px;background:#f8fafc;padding:9px}.location-item{margin-top:6px;padding:7px;border-left:3px solid var(--blue);background:#fff}.warning{border-left:4px solid #f59e0b;background:#fffbeb;padding:9px;margin-top:8px}.empty{text-align:center;color:var(--muted);padding:14px}.task-actions{margin-top:10px;display:flex;justify-content:flex-end}.task-detail{margin-top:9px;border:1px solid var(--line);border-radius:9px;background:#fbfdff}.task-detail summary{cursor:pointer;padding:9px 11px;font-weight:800}.task-detail .grid{padding:0 11px 11px}.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit}.hidden{display:none!important}@media(max-width:520px){.grid{grid-template-columns:1fr}.task-overview .field:last-child{grid-column:auto}.identity{font-size:21px}.row{align-items:flex-start}.task-actions{justify-content:stretch}.scan-button{width:100%}}
  </style>
</head>
<body>
  <header><div class="head"><h1>模具实时信息</h1><button id="refresh" class="refresh" type="button">刷新</button></div></header>
  <main><div id="message" class="message">正在从 ERP 读取最新信息…</div><div id="content"></div></main>
  <script>
    const $=id=>document.getElementById(id);
    const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    const parts=location.pathname.split("/").filter(Boolean);
    const moldId=parts[0]==="M"&&/^\d+$/.test(parts[1]||"")&&Number(parts[1])>0?Number(parts[1]):null;
    const requestedTaskText=new URLSearchParams(location.search).get("production_task_id")||"";
    const requestedTaskId=/^\d+$/.test(requestedTaskText)&&Number(requestedTaskText)>0?Number(requestedTaskText):null;
    const scanSessionKey=`mold-scan-${globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(16).slice(2)}`}`;
    let latestData=null;
    let scanEvent=null;
    let scanPending=false;
    let selectedTaskId=requestedTaskId;

    function formatDateTime(value){
      if(!value)return "-";
      const date=new Date(value);
      if(!Number.isNaN(date.getTime())){
        const parts=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(date);
        const part=type=>parts.find(item=>item.type===type)?.value||"";
        return `${part("year")}-${part("month")}-${part("day")} ${part("hour")}:${part("minute")}`;
      }
      return String(value).replace("T"," ").replace(/(\.\d+)?(?:Z|[+-]\d\d:\d\d)$/," ").trim().slice(0,16);
    }
    function materialCode(value){
      const text=String(value??"").trim();
      return text?text.split("/")[0].trim():"";
    }

    function loginNext(){location.href=`/?next=${encodeURIComponent(location.pathname+location.search)}`}
    async function api(url,options={}){
      let response;
      try{
        response=await fetch(url,{...options,credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json",...(options.headers||{})}});
      }catch{throw new Error("连接 ERP 失败，请检查网络后重试")}
      let body={};try{body=await response.json()}catch{}
      if(response.status===401){loginNext();throw new Error("登录已失效")}
      if(!response.ok)throw new Error(typeof body.detail==="string"?body.detail:`操作失败（HTTP ${response.status}）`);
      return body;
    }
    function field(key,value){const shown=value===null||value===undefined||value===""?"待完善":value;return `<div class="field"><span class="key">${h(key)}</span><span class="value">${h(shown)}</span></div>`}
    function binding(row){
      const material=materialCode(row.material_code)||materialCode(row.material_composition);
      return `<div class="binding"><div class="row"><div class="title">${h(row.product_name||row.product_code||"未命名产品")}</div><span class="tag">${h(row.customer_short_name||row.customer_name||row.customer_code||"客户待完善")}</span></div><div class="muted">存货 ${h(row.product_code||"待完善")}</div><div class="grid">${field("产品尺寸",row.specification)}${field("片料尺寸",row.report_specification)}${field("材质",material)}${field("楞型",row.flute_type)}${field("层数",row.layer_count?`${row.layer_count}层`:null)}</div></div>`;
    }
    function materialBlock(material){
      if(material.visibility!=="visible")return '<div class="material muted">当前账号无收料详情查看权限</div>';
      const progress=material.received_quantity!=null&&material.planned_quantity!=null?`已收 ${material.received_quantity} 张 / 计划 ${material.planned_quantity} 张`:material.legacy_received_quantity!=null?`历史实收 ${material.legacy_received_quantity} 张，原计划未记录`:material.state==="source_conflict"?"数量待人工核对":"数量未记录";
      const locations=(material.locations||[]).map(row=>`<div class="location-item"><strong>${h(row.employee_location_name||row.current_address_name||row.location_name||"位置名称待完善")}</strong>${row.availability_state==="frozen"?' <span class="tag orange">冻结</span>':""}</div>`).join("");
      return `<div class="material"><div class="row"><strong>材料：${h(material.state_label)}</strong><span class="tag ${["received","received_accept_short","legacy_received"].includes(material.state)?"green":"orange"}">${h(progress)}</span></div>${locations||`<div class="muted" style="margin-top:5px">${h(material.location_display||"当前没有可显示的材料库位")}</div>`}${material.warning?`<div class="warning">${h(material.warning)}</div>`:""}</div>`;
    }
    function printingText(row){
      const colors=Array.isArray(row.printing_colors)&&row.printing_colors.length?` · ${row.printing_colors.join("＋")}`:"";
      const plates=Array.isArray(row.printing_plates)?row.printing_plates.map(item=>item.plate_code).filter(Boolean).join("、"):"";
      return [row.printing_situation||"无印刷",colors,plates?`挂板 ${plates}`:""].filter(Boolean).join(" ");
    }
    function taskDetail(row){
      return `<details class="task-detail"><summary>查看待来料任务单其余信息</summary><div class="grid">${field("存货编码",row.product_code)}${field("产品名称",row.product_name)}${field("成品内尺寸",row.specification)}${field("材质",row.material_specification)}${field("楞型",row.flute_type)}${field("开料/特殊工艺",row.special_process)}${field("生产工艺",row.production_process)}${field("印刷",printingText(row))}${field("生产备注说明",row.production_notes)}</div></details>`;
    }
    function taskProgress(row){
      const status=row.task_status_label||row.order_status_label||"状态待完善";
      if(row.actual_output_quantity!=null&&row.planned_quantity!=null)return `${status} · 已完成 ${row.actual_output_quantity} / 计划 ${row.planned_quantity}`;
      if(row.actual_output_quantity!=null)return `${status} · 已完成 ${row.actual_output_quantity}`;
      return status;
    }
    function task(row,allowChoice){
      const quantity=row.is_component_task?`${row.order_quantity} 片（父单 ${row.parent_order_quantity} 套）`:`${row.order_quantity} 只`;
      const action=allowChoice&&!scanEvent?`<div class="task-actions"><button class="scan-button" type="button" data-scan-task="${h(row.production_task_id)}" ${scanPending?"disabled":""}>登记本次扫码到该任务</button></div>`:"";
      return `<div class="task"><div class="row"><div class="title">${h(row.customer_name||"客户待完善")}</div><span class="tag ${row.task_status==="completed"?"green":""}">${h(row.task_status_label)}</span></div><div class="muted">${h(row.product_name||row.product_code||"")}${row.delivery_date?` · 交期 ${h(row.delivery_date)}`:""}</div><div class="grid task-overview">${field("客户订单号",row.order_number)}${field("存货编码",row.product_code)}${field("该存货编码订单数量",quantity)}${field("具体进度状态",taskProgress(row))}</div>${taskDetail(row)}${materialBlock(row.material)}${action}</div>`;
    }
    function historyItem(row){return `<div class="history-item" data-history-text="${h([row.order_number,row.product_code,row.product_name,row.scanned_by].filter(Boolean).join(" ").toLowerCase())}"><div class="row"><strong>${h(row.order_number)}</strong><span class="tag green">${h(formatDateTime(row.scanned_at))}</span></div><div>${h(row.product_code||"-")} · ${h(row.product_name||"-")}</div><div class="muted">扫码人 ${h(row.scanned_by)} · 模具位置 ${h(row.mold_location)} · 任务 #${h(row.production_task_id)}</div></div>`}
    function scanStatus(orders){
      if(scanEvent)return "";
      if(scanPending)return '<div class="message">正在登记本次模具扫码时间…</div>';
      if(orders.length>1)return '<div class="message warning"><strong>该模具同时关联多笔任务</strong><div>请在下方选择本次实际对应的订单后登记，系统不会猜测。</div></div>';
      if(!orders.length)return '<div class="message"><strong>本次未登记订单扫码历史</strong><div class="muted">当前没有可证明关联的生产任务，只显示模具基本资料。</div></div>';
      return '<div class="message">已识别唯一任务，准备登记本次扫码时间…</div>';
    }
    function liveDataUrl(){
      const taskQuery=selectedTaskId?`&production_task_id=${encodeURIComponent(selectedTaskId)}`:"";
      return `/api/warehouse/molds/live/${moldId}?ts=${Date.now()}${taskQuery}`;
    }
    function focusTaskData(data,event){
      const taskId=Number(event.production_task_id);
      const orders=(data.current_orders?.items||[]).filter(row=>Number(row.production_task_id)===taskId);
      const selected=orders[0]||null;
      const bindings=(data.bindings?.items||[]).filter(row=>selected&&Number(row.product_id)===Number(selected.product_id));
      const priorHistory=(data.scan_history?.items||[]).filter(row=>Number(row.production_task_id)===taskId&&Number(row.id)!==Number(event.id));
      const history=[event,...priorHistory];
      return {...data,schema_version:"mold-live-v4",mode:"task_context",task_context:{production_task_id:taskId,product_id:selected?.product_id??null,product_code:selected?.product_code||event.product_code||null},bindings:{total:bindings.length,items:bindings},current_orders:{total:orders.length,items:orders},scan_history:{total:history.length,items:history},warnings:[]};
    }
    function render(data){
      latestData=data;
      const mold=data.mold||{},bindings=data.bindings?.items||[],orders=data.current_orders?.items||[],warnings=data.warnings||[],history=data.scan_history?.items||[];
      const focused=Boolean(data.task_context);
      const contextNotice=focused?'<div class="message success"><strong>当前订单存货已锁定，其他共用产品已隐藏</strong><div class="muted">以下只显示本次生产任务、实际存货编码及对应产品。</div></div>':"";
      $("content").innerHTML=`<section class="card"><div class="card-head"><div class="identity">${h(mold.label_identity||mold.display_name||"模具名称待完善")}</div><div class="location">${h(mold.location_guide?.prompt||mold.rack_location||"位置待完善")}</div></div><div class="body"><div class="muted">更新时间 ${h(formatDateTime(data.as_of))} · 实时读取 ERP</div>${mold.repair_status==="needs_repair"?'<div class="repair-alert">待维修｜请先联系维修人员核对</div>':""}${mold.is_active===false?'<div class="warning">该模具已停用，请勿直接领用。</div>':""}</div></section>${contextNotice}${data.task_visibility==="visible"?scanStatus(orders):""}<section class="card"><div class="card-head"><strong>当前订单与生产任务</strong></div><div class="body">${data.task_visibility==="hidden_by_permission"?'<div class="empty">当前账号无订单与模切任务查看权限</div>':orders.length?orders.map(row=>task(row,!focused&&orders.length>1)).join(""):'<div class="empty">当前没有关联的生产订单，以下显示模具基本资料。</div>'}</div></section><section class="card"><div class="card-head"><strong>${focused?"当前订单对应产品":"模具对应产品"}</strong></div><div class="body">${bindings.length?bindings.map(binding).join(""):'<div class="empty">尚未绑定常用箱</div>'}${warnings.map(value=>`<div class="warning">${h(value)}</div>`).join("")}</div></section>${data.task_visibility==="visible"?`<section class="card"><div class="card-head"><strong>扫码生产历史（最近 50 条 / 共 ${h(data.scan_history?.total||0)} 条）</strong><div class="muted">该记录只表示领模/核对，不会自动开工。</div></div><div class="body"><input id="historySearch" class="search" type="search" placeholder="按订单、存货编码、产品或扫码人查找">${history.length?`<div id="historyList">${history.map(historyItem).join("")}</div>`:'<div class="empty">尚无扫码历史</div>'}</div></section>`:""}`;
      $("message").classList.add("hidden");
      document.querySelectorAll("[data-scan-task]").forEach(button=>button.addEventListener("click",()=>recordScan(Number(button.dataset.scanTask))));
      const search=$("historySearch");
      if(search)search.addEventListener("input",()=>{const keyword=search.value.trim().toLowerCase();document.querySelectorAll("[data-history-text]").forEach(row=>row.classList.toggle("hidden",keyword&&!row.dataset.historyText.includes(keyword)))});
    }
    async function recordScan(productionTaskId){
      if(scanEvent||scanPending)return;
      scanPending=true;if(latestData)render(latestData);
      let failure=null,refreshFailure=null;
      try{
        const result=await api(`/api/warehouse/molds/live/${moldId}/scan-events`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({production_task_id:productionTaskId,expected_mold_location_version:latestData.mold.location_version,idempotency_key:scanSessionKey})});
        scanEvent=result.event;
        selectedTaskId=Number(scanEvent.production_task_id);
        if(latestData)latestData=focusTaskData(latestData,scanEvent);
        const pageUrl=new URL(location.href);pageUrl.searchParams.set("production_task_id",String(selectedTaskId));history.replaceState(null,"",pageUrl);
        try{latestData=await api(liveDataUrl())}catch{refreshFailure="扫码记录已经写入；定向信息刷新失败，当前页已只保留本次任务，请稍后刷新。"}
      }catch(error){failure=error.message}
      finally{scanPending=false;if(latestData)render(latestData);if(failure){$("message").className="message error";$("message").textContent=failure}else if(refreshFailure){$("message").className="message warning";$("message").textContent=refreshFailure}}
    }
    async function load(){
      if(!moldId){$("message").className="message error";$("message").textContent="二维码中的模具身份无效";return}
      $("refresh").disabled=true;
      try{
        const auth=await api("/api/auth/me");
        if(!(auth.permissions||[]).includes("warehouse.view"))throw new Error("当前账号无模具查看权限");
        const data=await api(liveDataUrl());
        if(data.task_context)selectedTaskId=Number(data.task_context.production_task_id);
        render(data);
        const orders=data.current_orders?.items||[];
        if(data.scan_recording_allowed&&orders.length===1&&!scanEvent)await recordScan(orders[0].production_task_id);
      }catch(error){if(error.message!=="登录已失效"){$("message").className="message error";$("message").textContent=error.message}}
      finally{$("refresh").disabled=false}
    }
    $("refresh").onclick=load;
    window.addEventListener("pageshow",event=>{if(event.persisted)load()});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
    load();
  </script>
</body>
</html>
