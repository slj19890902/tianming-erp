<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <title>模具位置查询 - 天明ERP</title>
  <style>
    :root{--blue:#2563eb;--green:#15803d;--line:#dbe3ef;--bg:#f3f6fb;--text:#172033;--muted:#64748b;--orange:#9a4d00}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Arial,"Microsoft YaHei",sans-serif}
    header{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px}h1{font-size:20px;margin:0 0 8px}.header-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.quick-links{display:flex;gap:6px}.quick-links a{display:none;border-radius:8px;background:#e8efff;color:#1d4ed8;padding:6px 9px;font-size:13px;font-weight:700;text-decoration:none}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;border:1px solid #b8c5d8;border-radius:9px;padding:11px;font-size:16px}.search button{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:0 18px;font-weight:700}
    main{max-width:760px;margin:0 auto;padding:12px}.hint,.error,.success,.empty{border-radius:10px;padding:12px;margin-bottom:10px}.hint{background:#eff6ff;color:#1e3a8a}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.empty{background:#fff;color:var(--muted);text-align:center}
    .card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}.card-head{padding:12px 14px;border-bottom:1px solid var(--line)}.code{font-size:13px;color:var(--muted);font-weight:400}.name{font-size:20px;font-weight:800}.location{margin:12px 14px;border:2px solid #f2c66d;background:#fff7dc;border-radius:10px;padding:12px;color:#713f12}.location-code{font-size:22px;font-weight:900;color:var(--orange);letter-spacing:.5px}.prompt{font-weight:700;margin-top:5px}
    .products{padding:0 14px 12px}.product{border-top:1px dashed var(--line);padding:10px 0}.product:first-child{border-top:0}.product-name{font-weight:800;font-size:17px}.product-code{font-size:13px;color:var(--muted)}.meta{font-size:14px;margin-top:3px}.direction{margin-top:5px;background:#fff3cd;color:#7c4a03;border-radius:6px;padding:6px 8px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.tag{font-size:12px;border-radius:99px;padding:2px 8px;background:#e8efff;color:#1d4ed8}.label-link{font-size:13px;color:var(--blue);text-decoration:none}
    .move-panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.move-panel h2{font-size:18px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.move-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}.field input{width:100%;border:1px solid #b8c5d8;border-radius:9px;padding:11px;font-size:16px}.move-actions{display:flex;gap:8px;margin-top:10px}.move-actions button{flex:1;border:0;border-radius:9px;padding:11px;font-size:16px;font-weight:800;color:#fff;background:var(--blue)}.move-actions .confirm{background:var(--green)}.move-actions button:disabled{background:#94a3b8}.preview{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:11px}.preview-line{display:grid;grid-template-columns:90px 1fr;gap:8px;margin:5px 0}.preview-code{font-weight:900;word-break:break-all}.conflict{color:#991b1b;font-weight:700}@media(max-width:520px){.move-grid{grid-template-columns:1fr}.preview-line{grid-template-columns:76px 1fr}}
  </style>
</head>
<body>
  <header>
    <div class="header-row"><h1>模具位置查询</h1><nav class="quick-links"><a id="warehouseLink" href="/warehouse.html">返回仓库</a><a id="productionLink" href="/production">生产确认</a></nav></div>
    <div class="search"><input id="keyword" inputmode="search" placeholder="输入模具编号、存货编码、客户或产品名称"><button id="searchButton" type="button">查询</button></div>
  </header>
  <main>
    <section class="move-panel">
      <h2>模具双码移动确认</h2>
      <div class="muted">扫描结果可直接粘贴，也可手动输入。先预览当前与目标位置，再确认移动。</div>
      <div class="move-grid">
        <div class="field"><label for="moveMoldCode">模具码</label><input id="moveMoldCode" autocomplete="off" placeholder="例如 MJ-A1-001"></div>
        <div class="field"><label for="moveLocationCode">3F-M 位置码</label><input id="moveLocationCode" autocomplete="off" autocapitalize="characters" placeholder="例如 3F-M-R02-L2-D03-P08"></div>
      </div>
      <div class="field" style="margin-top:10px"><label for="moveNote">备注（可选）</label><input id="moveNote" maxlength="500" placeholder="例如 现场整理后归位"></div>
      <div class="move-actions"><button id="previewButton" type="button">预览移动</button><button id="confirmButton" class="confirm" type="button" disabled>确认移动</button></div>
      <div id="moveMessage"></div><div id="movePreview"></div>
    </section>
    <div class="hint">先看醒目的位置提示，再核对模具编号、存货编码和产品尺寸。大模具请按现场要求两人搬运。</div>
    <div id="message"></div>
    <div id="results"></div>
  </main>
  <script>
    const $=id=>document.getElementById(id);
    const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    let canMove=false,movePreview=null,moveIdempotencyKey=null,moveSource="manual_input";
    let searchRequestId=0,movePreviewRequestId=0;
    function errorMessage(body,status){const detail=body?.detail;if(typeof detail==="string"&&detail.trim())return detail;if(detail&&typeof detail==="object"&&!Array.isArray(detail)){const message=detail.message||detail.detail||detail.msg,code=detail.code;if(typeof message==="string"&&message.trim())return code?`${message}（${code}）`:message}if(Array.isArray(detail)&&detail[0]?.msg)return detail[0].msg;if(typeof body?.message==="string"&&body.message.trim())return body.message;return `请求失败（HTTP ${status}）`}
    async function api(url,options={}){let response;try{response=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options})}catch{const error=new Error("连接 ERP 失败，请检查网络后重试");error.code="NETWORK_ERROR";throw error}let body={};try{body=await response.json()}catch{}if(!response.ok){const error=new Error(errorMessage(body,response.status));error.status=response.status;error.code=body?.detail?.code||body?.code||null;throw error}return body}
    function createIdempotencyKey(){if(globalThis.crypto?.randomUUID)return crypto.randomUUID();if(globalThis.crypto?.getRandomValues){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);return [...bytes].map(value=>value.toString(16).padStart(2,"0")).join("")}return `${Date.now()}-${Math.random().toString(16).slice(2)}`}
    function loginNext(){const next=location.pathname+location.search;location.href=`/?next=${encodeURIComponent(next)}`}
    function productHtml(row){
      const report=row.report_specification?`报料尺寸 ${h(row.report_specification)} mm`:"";
      const direction=row.direction_note?`<div class="direction">方向/报料提醒：${h(row.direction_note)}</div>`:"";
      return `<div class="product"><div class="product-name">${h(row.product_name)}</div><div class="product-code">${h(row.customer_name||"-")}｜存货编码 ${h(row.product_code||"-")}</div><div class="meta">产品规格 ${h(row.specification||"未登记")} ${report?`｜${report}`:""}</div>${direction}</div>`
    }
    function render(items){
      $("results").innerHTML=items.map(row=>`<article class="card"><div class="card-head"><div class="name">${h(row.mold_name)}</div><div class="toolbar"><span class="code">模具编号 ${h(row.mold_code)}</span><span class="tag">关联 ${row.product_count} 款</span></div></div><div class="location"><div class="location-code">${h(row.rack_location)}</div><div class="prompt">${h(row.location_guide?.prompt||"")}</div></div><div class="products">${(row.products||[]).map(productHtml).join("")||'<div class="empty">该模具尚未绑定常用箱，请先联系管理员维护。</div>'}<a class="label-link" href="/mold-label.html?mold_id=${row.id}" target="_blank">查看/打印模具标签</a></div></article>`).join("")||'<div class="empty">没有找到模具。请检查编号，或让管理员先维护模具与常用箱绑定。</div>';
    }
    function setSearchLoading(loading){$("searchButton").disabled=loading;$("searchButton").textContent=loading?"查询中…":"查询"}
    function invalidateSearch(){searchRequestId+=1;setSearchLoading(false);$("message").innerHTML="";$("results").innerHTML=""}
    async function search(){
      const requestId=++searchRequestId,keyword=$("keyword").value.trim();if(!keyword){$("results").innerHTML="";$("message").innerHTML='<div class="error">请输入模具编号、存货编码、客户或产品名称。</div>';setSearchLoading(false);return}
      setSearchLoading(true);$("message").innerHTML='<div class="hint">正在查询模具，请稍候…</div>';$("results").innerHTML="";
      try{const data=await api(`/api/warehouse/molds?q=${encodeURIComponent(keyword)}&limit=50`);if(requestId!==searchRequestId)return;const items=data.items||[];render(items);$("message").innerHTML=items.length?`<div class="success">找到 ${items.length} 个模具</div>`:""}catch(error){if(requestId!==searchRequestId)return;if(error.status===401){loginNext();return}$("message").innerHTML=`<div class="error">${h(error.message)}</div>`}finally{if(requestId===searchRequestId)setSearchLoading(false)}
    }
    function renderMovePreview(){
      const row=movePreview;if(!row){$("movePreview").innerHTML="";$("confirmButton").disabled=true;return}
      const conflict=row.occupancy_conflict?`<div class="conflict">目标位置已被模具 ${h(row.occupancy_conflict.mold_code)} 占用，不能确认。</div>`:"";
      const same=row.same_location?'<div class="muted">当前位置与目标位置相同；确认后不会新增移动流水。</div>':"";
      $("movePreview").innerHTML=`<div class="preview"><div class="preview-line"><span>模具</span><span class="preview-code">${h(row.mold.mold_code)}｜${h(row.mold.mold_name)}</span></div><div class="preview-line"><span>当前位置</span><span class="preview-code">${h(row.mold.rack_location)}</span></div><div class="preview-line"><span>目标位置</span><span class="preview-code">${h(row.target_location)}</span></div><div class="preview-line"><span>位置版本</span><span>${h(row.expected_version)}</span></div>${conflict}${same}</div>`;
      $("confirmButton").disabled=!canMove||!row.can_confirm;
      if(!canMove)$("moveMessage").innerHTML='<div class="hint">当前账号可预览，但没有仓库操作权限，不能确认移动。</div>';
    }
    function invalidateMovePreview(){movePreviewRequestId+=1;movePreview=null;moveIdempotencyKey=null;$("previewButton").disabled=false;$("moveMessage").innerHTML="";renderMovePreview()}
    async function previewMove(){
      const requestId=++movePreviewRequestId,moldCode=$("moveMoldCode").value.trim(),targetLocation=$("moveLocationCode").value.trim();
      if(!moldCode||!targetLocation){movePreview=null;moveIdempotencyKey=null;renderMovePreview();$("moveMessage").innerHTML='<div class="error">请同时输入模具码和 3F-M 位置码。</div>';return}
      $("moveMessage").innerHTML="";$("previewButton").disabled=true;$("confirmButton").disabled=true;
      try{const preview=await api("/api/warehouse/molds/location-movement/preview",{method:"POST",body:JSON.stringify({mold_code:moldCode,target_location:targetLocation})});if(requestId!==movePreviewRequestId)return;movePreview=preview;moveIdempotencyKey=createIdempotencyKey();renderMovePreview()}catch(error){if(requestId!==movePreviewRequestId)return;movePreview=null;moveIdempotencyKey=null;renderMovePreview();if(error.status===401){loginNext();return}$("moveMessage").innerHTML=`<div class="error">${h(error.message)}</div>`}finally{if(requestId===movePreviewRequestId)$("previewButton").disabled=false}
    }
    async function confirmMove(){
      if(!canMove||!movePreview||!moveIdempotencyKey)return;
      $("confirmButton").disabled=true;$("previewButton").disabled=true;$("moveMessage").innerHTML="";
      try{const data=await api("/api/warehouse/molds/location-movement/confirm",{method:"POST",body:JSON.stringify({mold_code:movePreview.mold.mold_code,target_location:movePreview.target_location,expected_version:movePreview.expected_version,idempotency_key:moveIdempotencyKey,source:moveSource,note:$("moveNote").value.trim()||null})});$("moveMessage").innerHTML=`<div class="success">${h(data.message)}：${h(data.mold.rack_location)}${data.idempotent_replay?"（幂等重放）":""}</div>`;$("keyword").value=data.mold.mold_code;await search();movePreview=null;moveIdempotencyKey=null;renderMovePreview()}catch(error){if(error.status===401){loginNext();return}if(error.status===409){movePreview=null;moveIdempotencyKey=null;renderMovePreview()}$("moveMessage").innerHTML=`<div class="error">${h(error.message)}${error.status===409?" 请重新预览。":""}</div>`}finally{$("previewButton").disabled=false;if(movePreview)renderMovePreview()}
    }
    async function init(){
      let auth;try{auth=await api("/api/auth/me")}catch(error){if(error.status===401){loginNext();return}$("message").innerHTML=`<div class="error">${h(error.message)}</div>`;return}
      const permissions=auth.permissions||[];canMove=permissions.includes("warehouse.execute");$("warehouseLink").style.display=permissions.includes("warehouse.view")?"inline-block":"none";$("productionLink").style.display=permissions.includes("orders.view")?"inline-block":"none";
      const params=new URLSearchParams(location.search),preset=params.get("mold")||params.get("q")||"",target=params.get("location")||params.get("target")||params.get("to")||"";$("keyword").value=preset;$("moveMoldCode").value=params.get("move_mold")||preset;$("moveLocationCode").value=target;if(target)moveSource="url_parameter";if(preset)await search();if($("moveMoldCode").value&&target)await previewMove()
    }
    $("searchButton").onclick=search;$("keyword").oninput=invalidateSearch;$("keyword").onkeydown=event=>{if(event.key==="Enter")search()};$("previewButton").onclick=previewMove;$("confirmButton").onclick=confirmMove;$("moveMoldCode").onpaste=$("moveLocationCode").onpaste=()=>{moveSource="scanner_paste"};$("moveMoldCode").oninput=$("moveLocationCode").oninput=invalidateMovePreview;$("moveLocationCode").onkeydown=event=>{if(event.key==="Enter")previewMove()};init();
  </script>
</body>
</html>
