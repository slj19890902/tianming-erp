<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模具格位</title><style>
*{box-sizing:border-box}body{margin:0;color:#172033;background:#f1f5f9;font:16px/1.5 Arial,"Microsoft YaHei",sans-serif}header,main{max-width:780px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;gap:12px;background:#fff}h1{font-size:24px;margin:0}h2{font-size:19px}a{color:#1d4ed8}button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:inherit}button:disabled{opacity:.5}input,select{font:inherit;width:100%;padding:10px;border:1px solid #94a3b8;border-radius:7px}section,article{background:#fff;padding:12px;margin-bottom:12px;border:1px solid #cbd5e1;border-radius:9px}.levels{display:flex;flex-direction:column-reverse;gap:8px}.level{display:grid;gap:6px}.cell{background:#f8fafc;color:#172033;border:2px solid #cbd5e1;padding:10px 3px;min-width:0;overflow-wrap:anywhere}.cell b{display:block;font-size:28px}.cell small{display:block}.cell.selected{border-color:#eab308;box-shadow:0 0 0 2px #facc15}.muted,small{color:#64748b}.result{display:flex;gap:8px;align-items:flex-start;padding:8px;border-bottom:1px solid #cbd5e1}.result input{width:22px;height:22px}.result span{display:flex;flex-direction:column}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.error{color:#991b1b}.hidden{display:none!important}.mold-name{font-weight:800;font-size:19px}.location{font-weight:700;color:#92400e}form{display:flex;gap:8px}form input{min-width:0}#message{margin-bottom:10px}</style></head><body>
<header><h1 id="title">模具格位</h1><a id="back" href="/mobile_mold_lookup.html">返回</a></header><main><div id="message" role="status">正在读取…</div><section id="rack"><div id="levels" class="levels"></div></section><section id="cellDetail"></section><section id="putaway" hidden><h2>放入模具</h2><form id="searchForm"><input id="search" placeholder="编码、名称或模具二维码" aria-label="搜索或扫描模具"><button id="find">查询</button></form><div id="results"></div><div id="chosen"></div><div class="actions"><button id="save" disabled>实物已放好，保存归位</button><button id="cancel">取消</button></div></section></main>
<script>
const $=id=>document.getElementById(id),h=value=>String(value??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),params=new URLSearchParams(location.search);
let data=null,cell=null,selected=new Map(),candidates=[],attempt=null,busy=false,uncertain=false,canMove=false,requestSequence=0;
function safeReturn(value,fallback){try{const url=new URL(value,location.origin);return url.origin===location.origin&&url.pathname.startsWith('/')?url.pathname+url.search+url.hash:fallback}catch{return fallback}}
$("back").href=safeReturn(params.get('return_to'),'/mobile_mold_lookup.html');
async function api(url,body){const response=await fetch(url,{credentials:'same-origin',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})});const data=await response.json().catch(()=>({}));if(!response.ok){if(response.status===401)location.assign('/?next='+encodeURIComponent(location.pathname+location.search));throw Object.assign(new Error(typeof data.detail==='string'?data.detail:data.detail?.message||data.message||'请求失败'),{status:response.status})}return data}
function display(mold){return mold.display_name||mold.mold_name||'名称待完善'}
function position(mold){return mold.location_guide?.prompt||'位置待完善'}
function chooseCell(id){if(busy||uncertain)return;cell=(data.rack.cells||[]).find(row=>row.id===id);params.set('cell_id',id);history.replaceState(null,'',location.pathname+'?'+params);render()}
function render(){const rack=data.rack,cells=rack.cells||[];$("title").textContent=cell?.alias||rack.name||'模具货架';const levels=[...new Set(cells.map(row=>row.level))].sort((a,b)=>a-b);$("levels").innerHTML=levels.map(level=>{const rows=cells.filter(row=>row.level===level).sort((a,b)=>a.grid-b.grid);return `<div class="level" style="grid-template-columns:repeat(${rows.length},minmax(0,1fr))">${rows.map(row=>{const items=data.items.filter(mold=>mold.rack_location===row.location_code||mold.location_guide?.cell_id===row.id);return `<button class="cell ${cell?.id===row.id?'selected':''}" data-cell="${h(row.id)}"><b>${h(row.alias)}</b><small>${data.truncated?'可见 '+items.length+' 块':items.length?'有模具 · '+items.length+' 块':'空格'}</small><small>${items.slice(0,2).map(mold=>h(mold.products?.[0]?.product_code||display(mold))).join(' · ')}</small>${items.length>2?'<small>查看全部</small>':''}</button>`}).join('')}</div>`}).join('');document.querySelectorAll('[data-cell]').forEach(button=>button.onclick=()=>chooseCell(button.dataset.cell));const items=cell?data.items.filter(mold=>mold.rack_location===cell.location_code||mold.location_guide?.cell_id===cell.id):data.items;const map='/warehouse.html?floor='+encodeURIComponent(data.floor_code)+'&mold_rack_id='+encodeURIComponent(rack.rack_id||rack.id)+(cell?'&mold_cell_id='+encodeURIComponent(cell.id):'');$("cellDetail").innerHTML=`<h2>${h(cell?.alias||'整架目录')} · 当前可见 ${items.length} 块</h2><div class="actions"><a href="${h(map)}">查看地图/正视图</a>${cell&&canMove?'<button id="openPutaway">＋ 放入模具</button>':''}</div><small>目录排序</small>${items.map(mold=>`<article><div class="mold-name">${h(display(mold))}</div><div>${(mold.products||[]).map(product=>h([product.product_code,product.customer_name].filter(Boolean).join(' '))).join(' · ')}</div><div class="location">${h(position(mold))}</div><div>${h(mold.remarks||'')}</div><small>${mold.is_active===false?'停用':mold.repair_status==='needs_repair'?'待维修':'正常'}</small><div class="actions"><a href="/M/${Number(mold.id)}?return_to=${encodeURIComponent(location.pathname+location.search)}">模具资料</a>${canMove?`<a href="/mobile_mold_lookup.html?mold_id=${Number(mold.id)}&return_to=${encodeURIComponent(location.pathname+location.search)}">移动模具</a>`:''}</div></article>`).join('')}`;if($("openPutaway"))$("openPutaway").onclick=()=>{$("putaway").hidden=false;$("search").focus()};$("message").textContent=data.truncated?'整架目录尚未完整显示，请按编码查询定位。':'';}
async function load(){try{const me=await api('/api/auth/me'),permissions=me.permissions||me.user?.permissions||[];canMove=permissions.includes('warehouse.execute');if(params.get('cell_id')){data=await api('/api/warehouse/molds/cell?cell_id='+encodeURIComponent(params.get('cell_id')));cell=data.cell;const whole=await api('/api/warehouse/molds/by-map-rack?floor_code='+encodeURIComponent(data.floor_code)+'&rack_id='+encodeURIComponent(data.rack.rack_id||data.rack.id));data=whole}else{data=await api('/api/warehouse/molds/by-map-rack?floor_code='+encodeURIComponent(params.get('floor_code')||'1F')+'&rack_id='+encodeURIComponent(params.get('rack_id')||''))}render()}catch(error){$("message").textContent=error.message;$("message").className='error'}}
function controls(){document.querySelectorAll('button,input').forEach(node=>node.disabled=busy||uncertain);$("save").disabled=busy||!selected.size||!cell;$("save").textContent=uncertain?'用原凭证核对结果':'实物已放好，保存归位';$("chosen").textContent='已选 '+selected.size+' 块'}
$("searchForm").onsubmit=async event=>{event.preventDefault();const sequence=++requestSequence;busy=true;controls();try{const text=$("search").value,scan=text.match(/(?:mold_id=|\/M\/)(\d+)/);const result=scan?{items:[await api('/api/warehouse/molds/'+scan[1]+'/detail')]}:await api('/api/warehouse/molds?q='+encodeURIComponent(text)+'&limit=100');if(sequence!==requestSequence)return;candidates=result.items;$("results").innerHTML=candidates.map(mold=>`<label class="result"><input type="checkbox" data-mold="${Number(mold.id)}" ${selected.has(mold.id)?'checked':''}><span><b>${h(display(mold))}</b><small>${h(position(mold))} · ${(mold.products||[]).map(product=>h(product.product_code||'')).join(' / ')}</small></span></label>`).join('');document.querySelectorAll('[data-mold]').forEach(input=>input.onchange=()=>{const mold=candidates.find(row=>row.id===Number(input.dataset.mold));if(input.checked)selected.set(mold.id,mold);else selected.delete(mold.id);attempt=null;controls()})}catch(error){$("message").textContent=error.message}finally{busy=false;controls()}};
$("save").onclick=async()=>{if(!cell||!selected.size||busy)return;if(!attempt)attempt={target_location:cell.location_code||'MCELL-'+cell.id,items:[...selected.values()].map(mold=>({mold_code:mold.mold_code,expected_version:mold.location_version})),idempotency_key:'mobile-mold-putaway-'+(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random()),source:'manual_input'};busy=true;controls();try{await api('/api/warehouse/molds/location-movement/batch',attempt);uncertain=false;attempt=null;selected.clear();$("putaway").hidden=true;await load();$("message").textContent='归位已保存'}catch(error){if(error.status&&error.status<500){attempt=null;uncertain=false}else uncertain=true;$("message").textContent=error.message+(uncertain?'；结果未确认，请用原凭证重试。':'；请重新查询模具。')}finally{busy=false;controls()}};
$("cancel").onclick=()=>{$("putaway").hidden=true;selected.clear();attempt=null;controls()};window.addEventListener('beforeunload',event=>{if(busy||uncertain){event.preventDefault();event.returnValue=''}});load();
</script></body></html>
