<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>产品当前资料 - 天明ERP</title>
  <style>
    :root{--blue:#1d4ed8;--green:#15803d;--orange:#9a4d00;--red:#b91c1c;--line:#dbe3ef;--bg:#f3f6fb;--text:#172033;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Arial,"Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px}.head{max-width:780px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:20px;margin:0}.refresh{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:9px 14px;font-weight:800}.refresh:disabled{opacity:.5}main{max-width:780px;margin:auto;padding:12px}.message,.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.message{padding:14px}.error{background:#fee2e2;color:#991b1b}.muted{color:var(--muted);font-size:13px}.card-head{padding:13px 14px;border-bottom:1px solid var(--line)}.identity{font-size:24px;font-weight:900;overflow-wrap:anywhere}.subtitle{margin-top:4px;font-weight:800;color:var(--blue);overflow-wrap:anywhere}.body{padding:12px 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px}.field{min-width:0}.key{display:block;color:var(--muted);font-size:12px}.value{font-weight:800;overflow-wrap:anywhere;white-space:normal}.tag{display:inline-flex;border-radius:99px;padding:2px 8px;background:#e8efff;color:var(--blue);font-size:12px;font-weight:800}.tag.orange{background:#fff7dc;color:var(--orange)}.warning{border-left:4px solid #f59e0b;background:#fffbeb;padding:9px;margin-top:10px}.task{border-top:1px dashed var(--line);padding:10px 0}.task:first-child{border-top:0}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.task-title{font-size:18px;font-weight:900;overflow-wrap:anywhere}.drawing{display:inline-flex;margin-top:10px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;padding:8px 12px;font-weight:800}.plate{margin-top:6px;padding:7px 9px;background:#f8fafc;border-radius:8px;overflow-wrap:anywhere}.empty{text-align:center;color:var(--muted);padding:14px}.hidden{display:none!important}@media(max-width:520px){.grid{grid-template-columns:1fr}.identity{font-size:21px}.drawing{display:flex;justify-content:center}.row{gap:5px}}
  </style>
<link rel="stylesheet" href="/static/ui/order-reference.css?v=423" /><script src="/static/ui/order-reference.js?v=423"></script></head>
<body>
  <header><div class="head"><h1>产品当前资料</h1><button id="refresh" class="refresh" type="button">刷新</button></div></header>
  <main><div id="message" class="message">正在从 ERP 读取当前产品资料…</div><div id="content"></div></main>
  <script>
    const $=id=>document.getElementById(id);
    const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    const parts=location.pathname.split("/").filter(Boolean);
    const productId=parts[0]==="P"&&/^\d+$/.test(parts[1]||"")&&Number(parts[1])>0?Number(parts[1]):null;
    function loginNext(){location.href=`/?redirect=${encodeURIComponent(location.pathname+location.search+location.hash)}`}
    async function api(url){let response;try{response=await fetch(url,{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json"}})}catch{throw new Error("连接 ERP 失败，请检查网络后重试")}let body={};try{body=await response.json()}catch{}if(response.status===401){loginNext();throw new Error("登录已失效")}if(!response.ok)throw new Error(typeof body.detail==="string"?body.detail:`读取失败（HTTP ${response.status}）`);return body}
    function shown(value){return value===null||value===undefined||value===""?"待完善":value}
    function field(key,value){return `<div class="field"><span class="key">${h(key)}</span><span class="value">${h(shown(value))}</span></div>`}
    function colors(row){const list=Array.isArray(row.printing_colors)?row.printing_colors:[];return list.length?list.join("＋"):(row.print_content&&row.print_content!=="无印刷"?"历史颜色未冻结":"无印刷")}
    function plates(row){const items=Array.isArray(row.printing_plates)?row.printing_plates:[];if(!items.length)return "";return `<div>${items.map((item,index)=>`<div class="plate"><strong>第${index+1}色 ${h(item.color_name||"颜色待完善")}</strong>｜${h(item.plate_code||"挂板编号待完善")}｜${h(item.plate_name||"挂板内容待完善")}${item.current_location?`｜当前位置 ${h(item.current_location)}`:""}</div>`).join("")}</div>`}
    function task(row){return `<div class="task"><div class="row"><div class="task-title">${TMOrderReference.html(row)}</div><span class="tag ${row.status==="waiting_material"?"orange":""}">${h(row.status_label||row.status||"状态待完善")}</span></div><div class="muted">任务 #${h(row.production_task_id)} · 版本 ${h(row.production_task_version)}</div><div class="grid" style="margin-top:8px"><small class="erp-order-no">${h(row.item_order_number||"")}</small>${field("计划数量",`${Number(row.planned_quantity||0)} ${row.output_unit||"单位待完善"}`)}${field("已完成",`${Number(row.actual_output_quantity||0)} ${row.output_unit||"单位待完善"}`)}</div></div>`}
    function render(data){const row=data.product||{},mold=row.mold,tasks=data.current_tasks?.items||[];const crease=(row.crease_values_mm||[]).length?`${row.crease_type||"压线"} ${row.crease_values_mm.join("＋")} mm`:row.crease_type||"无";const moldText=mold?.visibility==="hidden_by_permission"?"当前账号无模具位置查看权限":mold?`${mold.display_name||mold.mold_name||"模具名称待完善"}｜${mold.current_location_display||mold.current_location||"位置待完善"}`:"未绑定模具";$("content").innerHTML=`<section class="card"><div class="card-head"><div class="identity">${h(row.product_code||row.customer_material_code||"产品编码待完善")}</div><div class="subtitle">${h(row.customer_name||"客户待完善")}｜${h(row.product_name||"产品名称待完善")}</div></div><div class="body"><div class="muted">${h(data.view_label||"当前资料")} · 更新时间 ${h(String(data.as_of||"").replace("T"," ").slice(0,16))} · 刷新后读取最新主档，不覆盖历史任务纸面</div><div class="grid" style="margin-top:10px">${field("客户料号",row.customer_material_code)}${field("产品尺寸",row.specification)}${field("片料尺寸",row.report_specification)}${field("材质",row.material_code)}${field("楞型",row.flute_type)}${field("箱型",row.box_style)}${field("压线",crease)}${field("印刷情况",row.print_content)}${field("印刷颜色",colors(row))}${field("结合方式",row.joining_method)}${field("模具与位置",moldText)}</div>${plates(row)}${row.joining_warning?`<div class="warning">${h(row.joining_warning)}</div>`:""}${row.drawing_url?`<a class="drawing" href="${h(row.drawing_url)}" target="_blank" rel="noopener">查看当前产品图纸</a>`:""}</div></section><section class="card"><div class="card-head"><strong>当前相关任务摘要</strong></div><div class="body">${tasks.length?tasks.map(task).join(""):"<div class=\"empty\">当前没有待收料或待生产任务</div>"}${data.current_tasks?.has_more?'<div class="warning">当前任务较多，仅显示最近 20 项；请回 ERP 桌面端完整查询。</div>':""}</div></section>`;$("message").classList.add("hidden")}
    async function load(){if(!productId){$("message").className="message error";$("message").textContent="二维码中的正式产品身份无效";return}$("refresh").disabled=true;try{const data=await api(`/api/mobile/erp/products/${productId}/production-overview?ts=${Date.now()}`);render(data)}catch(error){if(error.message!=="登录已失效"){$("message").className="message error";$("message").textContent=error.message}}finally{$("refresh").disabled=false}}
    $("refresh").onclick=load;
    window.addEventListener("pageshow",event=>{if(event.persisted)load()});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
    load();
  </script>
</body>
</html>
