<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
  <title>手机盘点 - 天明ERP</title>
  <style>
    :root{--blue:#2563eb;--green:#15803d;--red:#b91c1c;--orange:#9a3412;--line:#dbe3ef;--bg:#f3f6fb;--text:#172033;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Microsoft YaHei","PingFang SC",Arial,sans-serif}
    header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 12px 10px}h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:2px}.header-link{color:#0f766e;text-decoration:none;font-weight:800;white-space:nowrap}
    main{max-width:760px;margin:0 auto;padding:10px 10px calc(12px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:12px}.card h2{font-size:17px;margin:0 0 8px}.muted{color:var(--muted);font-size:12px}.hidden{display:none!important}
    .notice,.error,.success{border-radius:10px;padding:11px 12px;margin-bottom:10px}.notice{background:#eff6ff;color:#1e3a8a}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
    .field{margin-bottom:10px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}input,select{width:100%;border:1px solid #b8c5d8;border-radius:9px;background:#fff;padding:11px;font:inherit;min-height:46px}input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 14px;background:#e5e7eb;color:#172033;font:inherit;font-weight:800;cursor:pointer;min-height:46px}.btn.primary{background:var(--blue);color:#fff}.btn.success{background:var(--green);color:#fff}.btn:disabled{background:#94a3b8;color:#fff;cursor:not-allowed}
    .location-list{display:grid;gap:9px}.location-button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid #bfcee0;border-radius:10px;background:#fff;padding:12px;min-height:58px;font:inherit;cursor:pointer}.location-button strong{font-size:17px}.location-button small{display:block;color:var(--muted);margin-top:2px}.location-button.temporary{border-color:#f59e0b;background:#fff7ed}.location-button .arrow{font-size:22px;color:var(--blue)}
    .location-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.location-code{font-size:23px;font-weight:900}.temporary-tag{display:inline-block;border-radius:99px;background:#ffedd5;color:var(--orange);font-size:12px;font-weight:800;padding:3px 8px;white-space:nowrap}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0;color:var(--muted);font-size:13px}.summary strong{color:var(--text);font-size:18px;margin-left:3px}
    .lot-list{display:grid;gap:9px}.lot-row{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfdff}.lot-row.difference{border-color:#f87171;background:#fff7f7}.lot-main{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:start}.lot-title{font-weight:800;font-size:17px;overflow-wrap:anywhere}.lot-meta{color:#475569;font-size:13px;overflow-wrap:anywhere}.lot-system{margin-top:5px;font-size:14px}.lot-system strong{font-size:19px;font-variant-numeric:tabular-nums}.count-field{margin:0}.count-field label{font-size:12px;color:var(--muted)}.count-field input{font-size:20px;font-weight:800;padding:8px 9px;min-height:50px}.same-hint{font-size:12px;color:var(--green);margin-top:3px}.locked .lot-row{opacity:.92}.locked input{background:#f1f5f9}
    .lot-actions{display:flex;gap:6px;margin-top:8px}.lot-actions .btn{min-height:38px;padding:7px 10px;font-size:13px;flex:1}.lot-actions .correct{background:#dcfce7;color:#166534}.lot-actions .relocate{background:#fff7ed;color:#9a3412}.empty-actions{display:grid;gap:8px;margin-top:10px}.identity-line{margin-top:3px;color:#0f766e;font-size:12px;font-weight:800}
    .sticky-submit{position:static;background:#ffffffed;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:12px;backdrop-filter:blur(5px)}.sticky-submit .btn{width:100%;font-size:18px}
    .number{font-size:25px;font-weight:900;color:var(--green);word-break:break-all}.login-box{max-width:460px;margin:20px auto}.login-box .btn{width:100%}
    @media(max-width:420px){main{padding:8px}.card{padding:11px}.lot-main{grid-template-columns:minmax(0,1fr) 106px}.location-code{font-size:20px}.btn{padding-left:11px;padding-right:11px}}
    .lot-title{font-size:20px;line-height:1.4}.lot-specification{font-size:18px;font-weight:700;margin:5px 0 9px;overflow-wrap:anywhere}.lot-meta{font-size:12px}.count-field label{font-size:14px;color:var(--text);font-weight:800}.count-field input{font-size:24px}.lot-system{color:var(--muted)}
  </style>
</head>
<body>
  <header><div><h1>手机盘点</h1><div class="sub">按实际货位核数量，位置不对直接回地图纠正</div></div><a class="header-link" href="/mobile/#warehouse">仓库地图</a></header>
  <main>
    <section id="loginPanel" class="card login-box">
      <h2>请先登录</h2><div class="muted" style="margin-bottom:10px">使用 ERP 账号登录，不在页面保存密码。</div>
      <form id="loginForm"><div class="field"><label for="loginUsername">用户名</label><input id="loginUsername" autocomplete="username" required></div><div class="field"><label for="loginPassword">密码</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button id="loginButton" class="btn primary" type="submit">登录</button></form>
    </section>
    <div id="message" aria-live="polite"></div>
    <section id="locationPanel" class="card hidden">
      <div class="location-head"><h2 style="margin:0">1. 选择楼层 / 区域 / 库位</h2><button id="retryLocations" class="btn" type="button">重新读取</button></div>
      <div id="locationLoadState" class="muted" aria-live="polite" style="margin:10px 0"></div>
      <div class="field"><label for="floorFilter">楼层</label><select id="floorFilter"><option value="">请选择楼层</option></select></div>
      <div class="field"><label for="areaFilter">区域</label><select id="areaFilter"><option value="">请选择区域</option></select></div>
      <div class="field"><label for="locationSearch">搜索库位</label><input id="locationSearch" inputmode="search" placeholder="输入中文位置名称"></div>
      <div id="locationList" class="location-list"></div>
    </section>
    <section id="stocktakePanel" class="card hidden">
      <div class="location-head"><div><div class="muted">2. 当前库位</div><div id="selectedLocationCode" class="location-code"></div><div id="selectedLocationName" class="muted"></div><div id="selectedRackIdentity" class="identity-line"></div></div><div class="actions"><button id="openCurrentMap" class="btn" type="button">看地图</button><button id="backToLocations" class="btn" type="button">换库位</button></div></div>
      <div id="locationNotice" class="notice hidden" style="margin-top:10px"></div>
      <div id="lotSummary" class="summary"></div>
      <div id="lotList" class="lot-list"></div>
      <section id="initialInbound" class="card hidden" style="margin-top:12px">
        <h2>现场盘点 / 添加货物（可混放）</h2>
        <p class="muted">管理员补录尚未登记的成品。已有系统批次请先核数或移货，避免重复入库。</p>
        <fieldset id="inboundFields" style="border:0;padding:0;margin:0">
          <div class="field"><label for="inboundCustomerQuery">客户</label><input id="inboundCustomerQuery" placeholder="客户名称 / 简称"><button id="inboundFindCustomer" class="btn" type="button">搜索客户</button><select id="inboundCustomer"><option value="">请选择客户</option></select></div>
          <div class="field"><label for="inboundProductQuery">存货编码 / 产品名称</label><input id="inboundProductQuery" placeholder="输入编码或名称"><button id="inboundFindProduct" class="btn" type="button">搜索产品</button><select id="inboundProduct"><option value="">请先选客户</option></select></div>
          <details id="inboundNewProduct"><summary class="btn">ERP 没有此产品，管理员新增</summary>
            <div class="field"><label for="inboundCode">存货编码</label><input id="inboundCode" maxlength="150"></div>
            <div class="field"><label for="inboundName">产品名称</label><input id="inboundName" maxlength="250"></div>
            <div class="field"><label for="inboundCategory">箱型类别</label><select id="inboundCategory"><option value="normal">普通箱</option><option value="die_cut">模切箱</option></select></div>
            <div class="field"><label>实际尺寸（毫米，选填）</label><input id="inboundLength" type="number" min="1" step="1" placeholder="长"><input id="inboundWidth" type="number" min="1" step="1" placeholder="宽"><input id="inboundHeight" type="number" min="1" step="1" placeholder="高"></div>
            <button id="inboundCreateProduct" class="btn" type="button">保存产品并选用</button>
          </details>
          <div id="inboundContext" class="notice" aria-live="polite">请选择客户和产品，核对系统现存数量。</div>
          <label id="inboundExistingLabel" class="hidden"><input id="inboundExistingAcknowledged" type="checkbox" style="width:auto;min-height:24px"> 已核对：本次数量是尚未登记的实物，不是上述系统库存移位</label>
          <div class="field"><label for="inboundQuantity">本货位尚未登记的实际成品数量（只）</label><input id="inboundQuantity" type="number" min="1" step="1" inputmode="numeric"></div>
          <div class="field"><label for="inboundDate">盘点入库日期</label><input id="inboundDate" type="date"></div>
        </fieldset>
        <button id="inboundSave" class="btn primary" type="button" disabled>保存入库</button><button id="inboundCancel" class="btn" type="button">取消添加，返回盘点</button>
        <button id="inboundRefresh" class="btn" type="button">重新核对系统库存</button>
        <div id="inboundResult" aria-live="polite"></div>
      </section>
      <div id="submitArea" class="sticky-submit hidden"><button id="fillAllButton" class="btn" type="button">全部与系统一致</button><button id="submitButton" class="btn primary" type="button" style="margin-top:8px">提交盘点</button></div>
      <div id="lockedResult" class="success hidden" style="margin-top:12px"><div>盘点已提交并锁定</div><div class="number" id="stocktakeNumber"></div><div class="muted" style="margin-top:4px">如需更正，请由仓库审核人员处理。</div></div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id);
    const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    const pick=(row,keys,fallback=null)=>{for(const key of keys){if(row&&row[key]!==undefined&&row[key]!==null)return row[key]}return fallback};
    const numberValue=(row,keys)=>{const value=Number(pick(row,keys,0));return Number.isFinite(value)?value:0};
    const state={user:null,locations:[],selectedLocation:null,lots:[],locked:false,submitting:false,clientLineIds:{},lotSnapshots:{},submitIdempotencyKey:null};
    let locationListGeneration=0,locationListController=null,locationDetailGeneration=0,locationDetailController=null;
    function idempotencyKey(){if(globalThis.crypto?.randomUUID)return crypto.randomUUID();if(globalThis.crypto?.getRandomValues){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);return [...bytes].map(x=>x.toString(16).padStart(2,"0")).join("")}return `stocktake-${Date.now()}-${Math.random().toString(16).slice(2)}`}
    function resetMobileSubmitAttempt(){state.submitIdempotencyKey=null}
    function mobileSubmitIdempotencyKey(){if(!state.submitIdempotencyKey)state.submitIdempotencyKey=idempotencyKey();return state.submitIdempotencyKey}
    function captureLotSnapshots(lots){state.lotSnapshots={};lots.forEach(lot=>{state.lotSnapshots[String(lotId(lot))]={expected_version:Number(pick(lot,["version"],0)),expected_available:Number(pick(lot,["quantity_available","available_quantity","available"],0)),expected_reserved:Number(pick(lot,["quantity_reserved","reserved_quantity","reserved"],0))}})}
    function lotSnapshot(id){return state.lotSnapshots[String(id)]||{expected_version:0,expected_available:0,expected_reserved:0}}
    function apiErrorCode(body){const detail=body?.detail;return(detail&&typeof detail==="object"&&!Array.isArray(detail)?detail.code:null)||body?.code||null}
    function errorText(body,status){const detail=body?.detail;if(typeof detail==="string"&&detail.trim())return detail;if(detail&&typeof detail==="object"&&!Array.isArray(detail)){const message=detail.message||detail.detail||detail.msg;if(typeof message==="string"&&message.trim())return message}if(Array.isArray(detail)&&detail[0]?.msg)return detail[0].msg;if(typeof body?.message==="string"&&body.message.trim())return body.message;return `请求失败（HTTP ${status}）`}
    function isAbortError(error){return error?.name==="AbortError"||error?.code==="ABORT_ERR"}
    async function api(url,options={}){let response;try{response=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options})}catch(error){if(isAbortError(error))throw error;const networkError=new Error("无法连接 ERP 服务，请检查网络后重试");networkError.code="NETWORK_ERROR";throw networkError}let body={};try{if(typeof response.text==="function"){const raw=await response.text();body=raw?JSON.parse(raw):{}}else body=await response.json()}catch{}if(!response.ok){const error=new Error(errorText(body,response.status));error.status=response.status;error.code=apiErrorCode(body);throw error}return body}
    function isStocktakeDrift(error){return ["STOCKTAKE_DRIFT","STOCKTAKE_LOCATION_CHANGED"].includes(error?.code)}
    function isStocktakePending(error){return error?.code==="STOCKTAKE_PENDING_REVIEW"}
    function showMessage(text,type="error"){$("message").innerHTML=text?`<div class="${type}">${h(text)}</div>`:""}
    function isTemporary(location){const code=String(pick(location,["location_code","code"],"")).toUpperCase(),areaCode=String(pick(location,["area_code"],"")).toUpperCase(),flagged=location?.is_temporary===true||location?.is_temporary===1||location?.is_temporary==="true";return flagged||areaCode==="F12"||areaCode==="F34"||code==="F12"||code==="F34"||code.startsWith("F12-")||code.startsWith("F34-")||code.endsWith("-F12")||code.endsWith("-F34")}
    function locationName(location){const name=pick(location,["employee_location_name","current_address_name","location_name","name"],"位置名称待完善");return isTemporary(location)?`${name}（过道临放）`:String(name)}
    function locationArea(location){const projected=String(pick(location,["employee_area_name","area_name"],"")).trim();if(projected)return projected;const zone=pick(location,["address_zone_code"],""),subzone=Number(pick(location,["address_subzone_no"],0));if(zone&&subzone)return `${zone}${subzone}区`;const name=String(pick(location,["area","region","zone"],"")).trim(),code=String(pick(location,["area_code"],"")).trim();return name&&name.toUpperCase()!==code.toUpperCase()?name:"区域名称待完善"}
    function locationFloor(location){const value=Number(pick(location,["warehouse_floor","floor_number"],0));return Number.isInteger(value)&&value>0?value:null}
    function locationFloorLabel(location){const floor=locationFloor(location),name=pick(location,["floor_name"],"");return name?`${name}（${floor} 楼）`:(floor?`${floor} 楼`:"未登记楼层")}
    function warehouseMapHref(lotId=null){const location=state.selectedLocation||{},params=new URLSearchParams({warehouse_map:"1"});const floorCode=String(pick(location,["floor_code"],"")).trim(),areaCode=String(pick(location,["area_code"],"")).trim(),locationId=pick(location,["id","location_id"],null);if(floorCode)params.set("floor_code",floorCode);if(areaCode)params.set("area_code",areaCode);if(locationId)params.set("location_id",String(locationId));if(lotId)params.set("lot_id",String(lotId));return `/mobile/?${params.toString()}#warehouse`}
    function openWarehouseMap(lotId=null){window.location.assign(warehouseMapHref(lotId))}
    function renderSelectedLocationIdentity(){const location=state.selectedLocation||{},rack=String(pick(location,["rack_display_name"],"")).trim(),level=Number(pick(location,["level_no"],0)),slot=Number(pick(location,["slot_no"],0));$("selectedRackIdentity").textContent=rack&&level&&slot?`${rack} · 第 ${level} 层 · 第 ${slot} 格`:"地图位置与当前货位使用同一条库存台账"}
    function listItems(data,keys=["items","locations","results"]){for(const key of keys)if(Array.isArray(data?.[key]))return data[key];return Array.isArray(data)?data:[]}
    function renderFloors(){const rows=new Map();state.locations.forEach(location=>{const floor=locationFloor(location);if(floor)rows.set(floor,locationFloorLabel(location))});const previous=$("floorFilter").value;$("floorFilter").innerHTML='<option value="">请选择楼层</option>'+[...rows].sort((a,b)=>a[0]-b[0]).map(([value,label])=>`<option value="${h(value)}">${h(label)}</option>`).join("");if(rows.has(Number(previous)))$("floorFilter").value=previous;else if(rows.size===1)$("floorFilter").value=String([...rows.keys()][0])}
    function renderAreas(){const floor=Number($("floorFilter").value),values=[...new Set(state.locations.filter(location=>!floor||locationFloor(location)===floor).map(locationArea))].sort((a,b)=>a.localeCompare(b,"zh-CN",{numeric:true})),previous=$("areaFilter").value;$("areaFilter").innerHTML='<option value="">'+(floor?"请选择区域":"请先选择楼层")+'</option>'+values.map(value=>`<option value="${h(value)}">${h(value)}</option>`).join("");if(values.includes(previous))$("areaFilter").value=previous;$("areaFilter").disabled=!floor||!values.length}
    function renderLocations(){const floorNode=$("floorFilter"),floor=floorNode?Number(floorNode.value):null,area=$("areaFilter").value.trim().toLowerCase(),query=$("locationSearch").value.trim().toLowerCase();if(!state.locations.length){$("locationList").innerHTML='<div class="muted">当前没有可盘点库位</div>';return}if(floorNode&&!floor){$("locationList").innerHTML='<div class="muted">请先选择楼层</div>';return}if(!area&&!query){$("locationList").innerHTML='<div class="muted">请先选择区域或输入中文位置名称</div>';return}const rows=state.locations.filter(location=>{const internalCode=String(pick(location,["location_code","code"],"")).toLowerCase(),name=locationName(location).toLowerCase(),legacyName=String(pick(location,["location_name","name"],"")).toLowerCase(),rowFloor=Number(pick(location,["warehouse_floor","floor_number"],0));return(!floor||rowFloor===floor)&&(!area||locationArea(location).toLowerCase()===area)&&(!query||internalCode.includes(query)||name.includes(query)||legacyName.includes(query))});$("locationList").innerHTML=rows.map(location=>{const rowFloor=Number(pick(location,["warehouse_floor","floor_number"],0)),floorName=pick(location,["floor_name"],""),floorText=floorNode?(floorName?`${floorName}（${rowFloor} 楼）`:(rowFloor?`${rowFloor} 楼`:"未登记楼层")):"",lotCount=numberValue(location,["lot_count"]),onHand=numberValue(location,["current_on_hand"]);return `<button class="location-button ${isTemporary(location)?"temporary":""}" type="button" data-location-id="${h(pick(location,["id","location_id"]))}"><span><strong>${h(locationName(location))}</strong><small>${floorText?`${h(floorText)} · `:""}${h(locationArea(location))}<br>${h(lotCount)} 个批次 · 系统数量 ${h(onHand)}</small></span><span class="arrow">›</span></button>`}).join("")||'<div class="muted">没有匹配的启用库位。</div>';document.querySelectorAll("[data-location-id]").forEach(button=>button.onclick=()=>openLocation(button.dataset.locationId))}
    function lotId(lot){return pick(lot,["inventory_lot_id","lot_id","id"])}
    function systemQuantity(lot){return numberValue(lot,["system_quantity","quantity_system"])||numberValue(lot,["quantity_available","available_quantity","available"]) + numberValue(lot,["quantity_reserved","reserved_quantity","reserved"])}
    function lotNumber(lot){return pick(lot,["batch_number","lot_number","batch_no","number"],"-")}
    function renderLots(){const total=state.lots.reduce((sum,lot)=>sum+systemQuantity(lot),0);$("lotSummary").innerHTML=`<span>批次 <strong>${state.lots.length}</strong></span><span>系统合计 <strong>${total}</strong></span>`;$("lotList").innerHTML=state.lots.map((lot,index)=>{const id=lotId(lot),system=systemQuantity(lot);if(!state.clientLineIds[id])state.clientLineIds[id]=`line-${id}-${index}`;const code=pick(lot,["inventory_code","product_code","customer_material_code"],"-"),product=pick(lot,["product_name","name"],"未登记产品"),customer=pick(lot,["customer_name","owner_customer_name","customer"],"未指定客户"),counted=pick(lot,["counted_quantity","counted_qty"],""),specification=pick(lot,["specification_snapshot","specification","规格"],"");return `<div class="lot-row"><div class="lot-main"><div><div class="lot-title">${h(product)}</div><div class="lot-specification">${h(specification || "规格待补充")}</div><div class="lot-meta">客户：${h(customer)} · 存货编码：${h(code)}<br>批次：${h(lotNumber(lot))}</div><div class="lot-system">系统数：<strong>${h(system)}</strong><span class="muted">（可用 ${h(numberValue(lot,["quantity_available","available_quantity","available"]))} + 预占 ${h(numberValue(lot,["quantity_reserved","reserved_quantity","reserved"]))}）</span></div></div><div class="count-field"><label for="count-${h(id)}">实盘数量</label><input id="count-${h(id)}" class="count-input" data-lot-id="${h(id)}" type="number" min="0" step="1" inputmode="numeric" value="${h(counted)}" ${state.locked?"disabled":""}><div class="same-hint" data-same-hint="${h(id)}"></div></div></div><div class="lot-actions"><button class="btn correct" type="button" data-confirm-lot-id="${h(id)}" ${state.locked?"disabled":""}>数量正确</button><button class="btn relocate" type="button" data-relocate-lot-id="${h(id)}">位置不对</button></div></div>`}).join("")||'<div class="muted">该货位系统库存为空。</div><div class="empty-actions"><button id="emptyLocationMapButton" class="btn" type="button">现场有货或位置不对，回地图处理</button></div>';document.querySelectorAll(".count-input").forEach(input=>input.oninput=()=>{resetMobileSubmitAttempt();updateSameHint(input);updateSubmitState()});document.querySelectorAll("[data-confirm-lot-id]").forEach(button=>button.onclick=()=>{const input=document.querySelector(`[data-lot-id="${CSS.escape(button.dataset.confirmLotId)}"]`),lot=state.lots.find(row=>String(lotId(row))===String(button.dataset.confirmLotId));if(input&&lot){input.value=String(systemQuantity(lot));resetMobileSubmitAttempt();updateSameHint(input);updateSubmitState()}});document.querySelectorAll("[data-relocate-lot-id]").forEach(button=>button.onclick=()=>openWarehouseMap(button.dataset.relocateLotId));const emptyMapButton=$("emptyLocationMapButton"),fillAllButton=$("fillAllButton"),submitButton=$("submitButton");if(emptyMapButton)emptyMapButton.onclick=()=>openWarehouseMap();if(fillAllButton)fillAllButton.classList.toggle('hidden',!state.lots.length);if(submitButton)submitButton.textContent=state.lots.length?(state.user?.role==='admin'?'确认盘点并更新库存':'提交盘点'):'确认现场为空';$('submitArea').classList.toggle('hidden',state.locked);document.querySelectorAll("[data-same-hint]").forEach(hint=>{const input=document.querySelector(`[data-lot-id="${CSS.escape(hint.dataset.sameHint)}"]`);if(input)updateSameHint(input)})}
    function updateSameHint(input){const lot=state.lots.find(row=>String(lotId(row))===String(input.dataset.lotId));if(!lot)return;const same=input.value!==""&&Number(input.value)===systemQuantity(lot);const hint=document.querySelector(`[data-same-hint="${CSS.escape(input.dataset.lotId)}"]`);if(hint)hint.textContent=same?"与系统一致":""}
    function allCounted(){return [...document.querySelectorAll(".count-input")].every(input=>{const value=Number(input.value);return input.value.trim()!==""&&Number.isFinite(value)&&Number.isInteger(value)&&value>=0})}
    function updateSubmitState(){const adding=state.user?.role==='admin'&&Boolean($("inboundProduct")?.value||$("inboundQuantity")?.value?.trim()||(typeof inbound!=="undefined"&&(inbound.busy||inbound.attempt)));$("submitArea").classList.toggle("hidden",state.locked||adding);$("submitButton").disabled=state.submitting||state.locked||adding||!allCounted();$("submitButton").textContent=state.submitting?"提交中…":state.lots.length?(state.user?.role==="admin"?"确认盘点并更新库存":"提交盘点"):"确认现场为空";}
    function invalidateLocationList(){locationListGeneration+=1;locationListController?.abort();locationListController=null}
    function invalidateLocationDetail(){locationDetailGeneration+=1;locationDetailController?.abort();locationDetailController=null}
    function handleStocktakeAuth(error){if(error?.status!==401)return false;showLogin();showMessage("登录已失效，请重新登录");return true}
    function resetToLocations(message){if(typeof inbound!=="undefined"&&(inbound.busy||inbound.attempt))return;if(typeof resetInitialInbound==="function")resetInitialInbound();invalidateLocationDetail();state.selectedLocation=null;state.lots=[];state.locked=false;state.submitting=false;state.clientLineIds={};state.lotSnapshots={};resetMobileSubmitAttempt();$('stocktakePanel').classList.add('hidden');$('locationPanel').classList.remove('hidden');renderLocations();if(message)showMessage(message,"error")}
    function setLocationLoading(loading,text="",isError=false){$("locationPanel").classList.remove("hidden");$("floorFilter").disabled=loading;$("locationSearch").disabled=loading;$("areaFilter").disabled=loading||!Number($("floorFilter").value)||!$("areaFilter").options.length;$("retryLocations").disabled=loading;$("retryLocations").textContent=loading?"读取中…":"重新读取";$("locationLoadState").innerHTML=text?`<div class="${isError?"error":"muted"}">${h(text)}</div>`:""}
    function renderLocationLoadError(error,id){state.lots=[];$("lotSummary").innerHTML="";$("submitArea").classList.add("hidden");$("lotList").innerHTML=`<div class="error">库位批次加载失败：${h(error.message)}</div><button id="retryLocationDetail" class="btn" type="button" style="margin-top:10px">重新加载当前库位</button>`;$("retryLocationDetail").onclick=()=>openLocation(id)}
    async function loadLocations(){const generation=++locationListGeneration;locationListController?.abort();const controller=new AbortController();locationListController=controller;invalidateLocationDetail();setLocationLoading(true,"正在读取楼层、区域和库位，请稍候…");showMessage("");try{const data=await api("/api/warehouse/stocktake/locations",{signal:controller.signal});if(generation!==locationListGeneration)return;state.locations=listItems(data);renderFloors();renderAreas();renderLocations();setLocationLoading(false,state.locations.length?`已读取 ${state.locations.length} 个可盘点库位`:"当前没有可盘点库位");const params=typeof window!=="undefined"?new URLSearchParams(window.location.search):new URLSearchParams(),requestedLocationId=params.get("location_id");if(requestedLocationId&&state.locations.some(row=>String(pick(row,["id","location_id"]))===String(requestedLocationId)))await openLocation(requestedLocationId)}catch(error){if(isAbortError(error)||generation!==locationListGeneration)return;if(handleStocktakeAuth(error))return;state.locations=[];renderFloors();renderAreas();renderLocations();setLocationLoading(false,`库位加载失败：${error.message}，请点击重新读取`,true)}finally{if(generation===locationListGeneration)locationListController=null}}
    async function openLocation(id){if(typeof inbound!=="undefined"&&(inbound.busy||inbound.attempt))return;if(typeof resetInitialInbound==="function")resetInitialInbound();const selectedId=String(id),generation=++locationDetailGeneration;locationDetailController?.abort();const controller=new AbortController();locationDetailController=controller;const location=state.locations.find(row=>String(pick(row,["id","location_id"]))===selectedId)||{id};state.selectedLocation=location;state.locked=false;state.clientLineIds={};state.lotSnapshots={};resetMobileSubmitAttempt();showMessage("");$("locationPanel").classList.add("hidden");$("stocktakePanel").classList.remove("hidden");$("selectedLocationCode").textContent=locationName(location);$("selectedLocationName").textContent=`${locationFloorLabel(location)} · ${locationArea(location)}`;if(typeof renderSelectedLocationIdentity==="function")renderSelectedLocationIdentity();$("locationNotice").classList.toggle("hidden",!isTemporary(location));$("locationNotice").textContent=isTemporary(location)?"过道临放：请按现场实际位置核对，盘点提交后仍需仓库审核。":"";$('lockedResult').classList.add('hidden');$('stocktakeNumber').textContent='';$('lotSummary').innerHTML='';$('lotList').innerHTML='<div class="muted">正在加载该库位全部批次…</div>';$('submitArea').classList.add('hidden');try{const data=await api(`/api/warehouse/stocktake/locations/${encodeURIComponent(pick(location,["id","location_id"]))}`,{signal:controller.signal});if(generation!==locationDetailGeneration||String(pick(state.selectedLocation,["id","location_id"]))!==selectedId)return;state.selectedLocation={...state.selectedLocation,...data};$("selectedLocationCode").textContent=locationName(state.selectedLocation);$("selectedLocationName").textContent=`${locationFloorLabel(state.selectedLocation)} · ${locationArea(state.selectedLocation)}`;if(typeof renderSelectedLocationIdentity==="function")renderSelectedLocationIdentity();const pending=pick(data,["pending_stocktake"],null),pendingCounts=new Map(listItems(pending,["items","lines"]).map(item=>[String(pick(item,["inventory_lot_id","lot_id"])),numberValue(item,["counted_quantity","counted_qty"])]));state.lots=listItems(data,["items","lots","stocktake_items","inventory_lots"]).map(lot=>pendingCounts.has(String(lotId(lot)))?{...lot,counted_quantity:pendingCounts.get(String(lotId(lot)))}:lot);state.locked=Boolean(pending);captureLotSnapshots(state.lots);resetMobileSubmitAttempt();renderLots();if(typeof renderInitialInbound==="function")renderInitialInbound();if(pending){$('stocktakeNumber').textContent=`盘点单号：${pick(pending,["order_number","stocktake_number","number","id"],"已生成")}`;$('lockedResult').classList.remove('hidden');resetLockedInputs();showMessage('该库位盘点已提交，正在等待电脑端审核','success')}updateSubmitState()}catch(error){if(isAbortError(error)||generation!==locationDetailGeneration)return;if(handleStocktakeAuth(error))return;if(isStocktakeDrift(error)){resetToLocations("库存已变化，请重新加载库位后发起盘点");return}renderLocationLoadError(error,pick(location,["id","location_id"]))}finally{if(generation===locationDetailGeneration)locationDetailController=null}}
    function fillAll(){if(state.locked)return;let changed=false;document.querySelectorAll(".count-input").forEach(input=>{const lot=state.lots.find(row=>String(lotId(row))===String(input.dataset.lotId));if(lot){const next=String(systemQuantity(lot));if(input.value!==next){input.value=next;changed=true}updateSameHint(input)}});if(changed)resetMobileSubmitAttempt();updateSubmitState()}
    function resetLockedInputs(){state.locked=true;document.querySelectorAll('.count-input').forEach(input=>input.disabled=true);$('submitArea').classList.add('hidden')}
    async function submitStocktake(){if(state.submitting||state.locked)return;if(!allCounted()){showMessage("请先填完全部批次的实盘数量，且必须是非负整数", "error");return}const emptyLocation=Array.isArray(state.lots)&&state.lots.length===0;const items=[...document.querySelectorAll('.count-input')].map(input=>{const snapshot=lotSnapshot(input.dataset.lotId);return {inventory_lot_id:Number(input.dataset.lotId),counted_quantity:Number(input.value),client_line_id:state.clientLineIds[input.dataset.lotId],expected_version:snapshot.expected_version,expected_available:snapshot.expected_available,expected_reserved:snapshot.expected_reserved}});state.submitting=true;updateSubmitState();$('submitButton').textContent='提交中…';try{const immediate=state.user?.role==='admin';const data=await api(immediate?'/api/warehouse/stocktakes/confirm':'/api/warehouse/stocktakes',{method:'POST',body:JSON.stringify({location_id:Number(pick(state.selectedLocation,["id","location_id"])),location_layout_version:pick(state.selectedLocation,["layout_version","location_layout_version"],null),location_address_version:Number(pick(state.selectedLocation,["address_version"],0)),location_position_status:String(pick(state.selectedLocation,["position_status"],"")),published_map_revision:pick(state.selectedLocation,["published_map_revision"],null),items,idempotency_key:mobileSubmitIdempotencyKey()})});const number=pick(data,["stocktake_number","stocktake_no","number","id"],"已生成");$('stocktakeNumber').textContent=`盘点单号：${number}`;$('lockedResult').classList.remove('hidden');showMessage(emptyLocation?'空货位核对已提交，等待电脑端审核':'盘点提交成功，已锁定并等待电脑端审核','success');resetMobileSubmitAttempt();if(immediate){await openLocation(pick(state.selectedLocation,["id","location_id"]));showMessage('管理员盘点已确认，ERP库存已按实盘数量更新','success')}else{resetLockedInputs()}}catch(error){if(handleStocktakeAuth(error))return;if(isStocktakeDrift(error)){resetToLocations('库存已变化，请重新加载库位后发起盘点');return}if(isStocktakePending(error)){await openLocation(pick(state.selectedLocation,["id","location_id"]));return}showMessage(`盘点提交失败：${error.message}`)}finally{state.submitting=false;updateSubmitState()}}
    function showLogin(){invalidateLocationList();invalidateLocationDetail();state.user=null;state.selectedLocation=null;state.lots=[];state.locked=false;resetMobileSubmitAttempt();$('loginPanel').classList.remove('hidden');$('locationPanel').classList.add('hidden');$('stocktakePanel').classList.add('hidden')}
    async function login(event){event.preventDefault();if($('loginButton').disabled)return;$('loginButton').disabled=true;$('loginButton').textContent='登录中…';showMessage('');try{const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('loginUsername').value.trim(),password:$('loginPassword').value})});state.user=data.user||data;$('loginPassword').value='';$('loginPanel').classList.add('hidden');showMessage('登录成功','success');await loadLocations()}catch(error){showMessage(`登录失败：${error.message}`)}finally{$('loginButton').disabled=false;$('loginButton').textContent='登录'}}
    function restoreWarehouseAreaReturn(){
      const params=new URLSearchParams(window.location.search),floor=params.get('return_floor'),area=params.get('return_area');
      if(!floor||!area)return;
      const returnParams=new URLSearchParams({warehouse_map:'1',floor_code:floor,area_code:area});
      const locationId=Number(params.get('location_id')||0);
      if(Number.isSafeInteger(locationId)&&locationId>0)returnParams.set('location_id',String(locationId));
      const target='/mobile/?'+returnParams+'#warehouse';
      const link=document.querySelector('.header-link');link.href=target;link.textContent='返回原区域';
      $('backToLocations').textContent='返回原区域';
      $('backToLocations').addEventListener('click',event=>{event.preventDefault();event.stopImmediatePropagation();if(state.submitting||(typeof inbound!=='undefined'&&inbound.busy))return;window.location.assign(target)},true);
    }
    async function init(){restoreWarehouseAreaReturn();try{const data=await api('/api/auth/me');state.user=data.user||data;$('loginPanel').classList.add('hidden');await loadLocations()}catch(error){if(error.status===401){showLogin();return}showMessage(`登录状态检查失败：${error.message}`)}}
    $('loginForm').onsubmit=login;$('floorFilter').onchange=()=>{renderAreas();renderLocations()};$('areaFilter').onchange=renderLocations;$('locationSearch').oninput=renderLocations;$('retryLocations').onclick=loadLocations;$('openCurrentMap').onclick=()=>openWarehouseMap();$('backToLocations').onclick=()=>resetToLocations('');$('fillAllButton').onclick=fillAll;$('submitButton').onclick=submitStocktake;init();
