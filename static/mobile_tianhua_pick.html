<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>天华预送货拿货</title>
    <style>
      :root {
        --ink: #17211b;
        --muted: #68736c;
        --paper: #f4f1e8;
        --green: #197447;
        --yellow: #d99a16;
        --orange: #d8661f;
        --red: #be3d32;
        --line: #d9d5c9;
      }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: radial-gradient(circle at 90% 0, #dcebdc, transparent 35%), var(--paper); font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .stats { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px; background: #183f2c; box-shadow: 0 4px 16px #17372838; }
      .stat { min-height: 44px; padding: 6px 3px; text-align: center; color: #d8e9de; background: #214c35; border: 1px solid #416a51; border-radius: 8px; font-size: 11px; }
      .stat.active { color: #183f2c; background: #fffdf8; border-color: #fffdf8; }
      .stat strong { display: block; margin-bottom: 1px; font-size: 17px; }
      main { padding: 8px 8px 26px; }
      .card { margin-bottom: 8px; padding: 10px; background: #fffdf8; border: 1px solid var(--line); border-left: 5px solid var(--green); border-radius: 10px; box-shadow: 0 3px 10px #4b4b3518; }
      .card.duplicate_warning { border-left-color: var(--yellow); }
      .card.qty_mismatch, .card.partial { border-left-color: var(--orange); }
      .card.stock_shortage, .card.no_stock { border-left-color: var(--red); }
      .card.picked { opacity: .78; box-shadow: none; }
      .name { color: var(--ink); font-size: 17px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
      .spec { margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.25; }
      .qty-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; margin-top: 8px; }
      label { font-size: 12px; color: var(--muted); }
      .need { margin-top: 3px; color: var(--ink); font-size: 22px; font-weight: 800; line-height: 34px; }
      input { width: 100%; margin-top: 3px; padding: 7px 8px; font-size: 19px; border: 1px solid #bbb7ac; border-radius: 8px; background: white; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
      button { min-height: 40px; border: 0; border-radius: 8px; color: white; font-size: 15px; font-weight: 700; }
      button:disabled { opacity: .55; }
      .picked-btn { background: var(--green); }
      .stock-btn { background: var(--red); }
      .empty { margin: 20px 0; padding: 20px; text-align: center; color: var(--muted); background: #fffdf8; border: 1px solid var(--line); border-radius: 10px; }
      .message { margin: 40px 18px; padding: 22px; text-align: center; background: white; border-radius: 14px; }
      .toast { position: fixed; left: 50%; bottom: 20px; z-index: 10; transform: translateX(-50%); padding: 12px 18px; color: white; background: #17211be8; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="loading" class="message">正在加载拿货明细...</div>
    <div id="error" class="message" hidden></div>
    <div id="app" hidden>
      <div id="stats" class="stats"></div>
      <main id="items"></main>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script>
      const token = new URLSearchParams(location.search).get("token") || "";
      let data = null;
      let currentFilter = "open";
      const filterLabels = {open:"待拿",picked:"已拿",no_stock:"没货",partial:"部分",all:"全部"};
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
      const toast = (text) => {
        const node = document.getElementById("toast");
        node.textContent = text; node.hidden = false;
        setTimeout(() => node.hidden = true, 2200);
      };
      const counts = () => {
        const result = {picked:0,no_stock:0,partial:0,pending:0};
        data.items.forEach(item => result[item.mobile_pick_status || "pending"]++);
        return result;
      };
      function render() {
        const count = counts();
        const openCount = count.pending + count.no_stock + count.partial;
        const filters = [["open",openCount],["picked",count.picked],["no_stock",count.no_stock],["partial",count.partial],["all",data.items.length]];
        document.getElementById("stats").innerHTML = filters.map(([filter,value]) => `<button class="stat ${currentFilter === filter ? "active" : ""}" type="button" data-filter="${filter}" onclick="setFilter('${filter}')"><strong>${value}</strong>${filterLabels[filter]}</button>`).join("");
        const visible = data.items.filter(item => {
          const pickStatus = item.mobile_pick_status || "pending";
          if (currentFilter === "all") return true;
          if (currentFilter === "open") return pickStatus !== "picked";
          return pickStatus === currentFilter;
        });
        document.getElementById("items").innerHTML = visible.map(item => {
          const pickStatus=item.mobile_pick_status || "pending";
          const qty=item.mobile_picked_qty ?? item.final_delivery_qty ?? item.suggested_qty ?? 0;
          return `<article class="card ${escapeHtml(item.status)} ${escapeHtml(pickStatus)}" data-id="${item.item_id}">
            <div class="name">${escapeHtml(item.product_name || "-")}</div>
            <div class="spec">${escapeHtml(item.product_spec || "规格未填写")}</div>
            <div class="qty-row"><label>数量<div class="need">${escapeHtml(item.final_delivery_qty ?? item.suggested_qty ?? 0)}</div></label><label>实拿<input class="qty" type="number" min="0" inputmode="numeric" value="${qty}" aria-label="实际拿货数量" /></label></div>
            <div class="actions"><button class="picked-btn" onclick="saveItem(${item.item_id},'picked')">√ 已拿货</button><button class="stock-btn" onclick="saveItem(${item.item_id},'no_stock')">× 没货</button></div>
          </article>`;
        }).join("") || `<div class="empty">当前筛选下没有明细</div>`;
      }
      function setFilter(filter) {
        currentFilter = filter;
        render();
      }
      async function request(url, options={}) {
        const response=await fetch(url,options);
        const body=await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.detail || "操作失败");
        return body;
      }
      async function saveItem(id,status) {
        const card=document.querySelector(`[data-id="${id}"]`);
        const qty=Number(card.querySelector(".qty").value);
        if (status !== "no_stock" && (!Number.isFinite(qty) || qty < 0)) return toast("请输入正确的实际数量");
        const current=data.items.find(item => item.item_id===id);
        if (status !== "no_stock" && qty > Number(current.suggested_qty || 0) && !confirm("实际拿货数量大于建议数量，请确认是否保存？")) return;
        card.querySelectorAll("button").forEach(button => button.disabled=true);
        try {
          const result=await request(`/api/mobile/tianhua-pick/items/${id}`,{
            method:"PUT",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({token,mobile_pick_status:status,mobile_picked_qty:status==="no_stock"?0:qty,mobile_pick_note:current.mobile_pick_note || ""})
          });
          Object.assign(current,result.item);
          render();
          toast(result.item.mobile_pick_status==="partial" ? "已记录部分拿货" : "拿货状态已保存");
        } catch (error) {
          toast(error.message);
          card.querySelectorAll("button").forEach(button => button.disabled=false);
        }
      }
      (async () => {
        try {
          if (!token) throw new Error("无权限访问该拿货单");
          data=await request(`/api/mobile/tianhua-pick?token=${encodeURIComponent(token)}`);
          document.getElementById("loading").hidden=true;
          document.getElementById("app").hidden=false;
          render();
        } catch (error) {
          document.getElementById("loading").hidden=true;
          const node=document.getElementById("error");
          node.textContent=error.message;
          node.hidden=false;
        }
      })();
    </script>
  </body>
</html>
