<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>天华预送货拿货</title>
    <style>
      :root {
        --ink: #17211b;
        --muted: #68736c;
        --paper: #f4f1e8;
        --green: #197447;
        --yellow: #d99a16;
        --orange: #d8661f;
        --red: #be3d32;
        --line: #d9d5c9;
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; color: var(--ink); background: radial-gradient(circle at 90% 0, #dcebdc, transparent 35%), var(--paper); font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .stats { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; background: #183f2cf2; box-shadow: 0 3px 12px #17372830; scrollbar-width: none; }
      .stats::-webkit-scrollbar { display: none; }
      .stat { flex: 0 0 auto; min-width: 68px; min-height: 38px; padding: 5px 9px; color: #244432; background: #fffdf8; border: 1px solid #d8e4dc; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
      .stat strong { margin-right: 4px; font-size: 15px; }
      .stat.active { color: white; background: var(--green); border-color: #74bd96; }
      main { padding: 8px 10px 24px; }
      .card { margin-bottom: 8px; padding: 11px 12px; background: #fffdf8; border: 1px solid var(--line); border-left: 5px solid var(--green); border-radius: 11px; box-shadow: 0 3px 12px #4b4b3518; }
      .card.duplicate_warning { border-left-color: var(--yellow); }
      .card.qty_mismatch, .card.partial { border-left-color: var(--orange); }
      .card.stock_shortage, .card.no_stock { border-left-color: var(--red); }
      .card.picked { border-left-color: var(--green); box-shadow: none; }
      .name { color: #13271c; font-size: 19px; font-weight: 800; line-height: 1.3; }
      .spec { margin-top: 3px; color: var(--muted); font-size: 14px; line-height: 1.35; }
      .locations { display: grid; gap: 3px; margin-top: 7px; padding: 7px 9px; color: #31553e; background: #edf7f0; border-radius: 8px; font-size: 13px; }
      .pick-row { display: grid; grid-template-columns: auto minmax(88px, 132px); gap: 8px; align-items: center; margin-top: 8px; }
      .pick-row label { color: var(--muted); font-size: 13px; font-weight: 700; }
      input { width: 100%; padding: 7px 9px; font-size: 17px; text-align: center; border: 1px solid #bbb7ac; border-radius: 8px; background: white; }
      .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
      .action { min-height: 40px; border: 0; border-radius: 9px; color: white; font-size: 15px; font-weight: 700; }
      button:disabled { opacity: .55; }
      .picked-btn { background: var(--green); }
      .partial-btn { background: var(--orange); }
      .stock-btn { background: var(--red); }
      .message { margin: 40px 18px; padding: 22px; text-align: center; background: white; border-radius: 14px; }
      .retry { margin-top: 12px; min-height: 40px; padding: 0 18px; color: white; background: var(--green); border: 0; border-radius: 9px; font-size: 15px; font-weight: 700; }
      .empty { padding: 36px 12px; color: var(--muted); text-align: center; }
      .toast { position: fixed; left: 50%; bottom: 20px; z-index: 10; transform: translateX(-50%); padding: 12px 18px; color: white; background: #17211be8; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="loading" class="message">正在加载拿货明细...</div>
    <div id="error" class="message" hidden><div id="errorText"></div><button id="retry" class="retry" type="button">重新加载</button></div>
    <div id="app" hidden>
      <nav id="stats" class="stats" aria-label="拿货状态筛选"></nav>
      <main id="items"></main>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script>
      const token = new URLSearchParams(location.search).get("token") || "";
      let data = null;
      let activeFilter = "open";
      let loadGeneration = 0;
      let loadController = null;
      const busyItems = new Set();
      const statusOf = (item) => item.mobile_pick_status || "pending";
      const filters = [
        ["open","未完成",item => statusOf(item) !== "picked"],
        ["pending","待拿货",item => statusOf(item) === "pending"],
        ["partial","部分",item => statusOf(item) === "partial"],
        ["no_stock","没货",item => statusOf(item) === "no_stock"],
        ["picked","已拿货",item => statusOf(item) === "picked"],
        ["all","全部",() => true],
      ];
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
      const toast = (text) => {
        const node = document.getElementById("toast");
        node.textContent = text; node.hidden = false;
        setTimeout(() => node.hidden = true, 2200);
      };
      const filterCount = (key) => {
        const row=filters.find(candidate => candidate[0] === key);
        return row ? data.items.filter(row[2]).length : 0;
      };
      function setFilter(key) {
        if (!filters.some(row => row[0] === key)) return;
        activeFilter=key;
        render();
      }
      function render() {
        document.getElementById("stats").innerHTML = filters.map(([key,label]) =>
          `<button type="button" class="stat ${activeFilter===key?"active":""}" data-filter="${key}" aria-pressed="${activeFilter===key}" onclick="setFilter('${key}')"><strong>${filterCount(key)}</strong>${label}</button>`
        ).join("") + '<button type="button" class="stat" onclick="loadData()">刷新</button>';
        const predicate=filters.find(row => row[0] === activeFilter)[2];
        const visibleItems=data.items.filter(predicate);
        document.getElementById("items").innerHTML = visibleItems.length ? visibleItems.map(item => {
          const pickStatus=statusOf(item);
          const qty=item.mobile_picked_qty ?? item.final_delivery_qty ?? item.suggested_qty ?? 0;
          const disabled=busyItems.has(item.item_id) ? " disabled" : "";
          const locations=(item.finished_inventory_sources || []).map(source => {
            const location=source.employee_location_name || source.current_address_name || source.location_name || "库位未标定";
            const amount=source.quantity_to_pick_stock ?? 0;
            return `<div>成品库位：<strong>${escapeHtml(location)}</strong> · 拿取 ${escapeHtml(amount)}</div>`;
          }).join("");
          return `<article class="card ${escapeHtml(item.status)} ${escapeHtml(pickStatus)}" data-id="${item.item_id}">
            <div class="name">${escapeHtml(item.product_name || "未命名产品")}</div>
            <div class="spec">规格：${escapeHtml(item.specification || "-")}</div>
            ${locations ? `<div class="locations">${locations}</div>` : ""}
            <div class="pick-row"><label for="qty-${item.item_id}">拿货数量</label><input id="qty-${item.item_id}" class="qty" type="number" min="0" inputmode="numeric" value="${qty}" /></div>
            <div class="actions"><button class="action picked-btn"${disabled} onclick="saveItem(${item.item_id},'picked')">已拿货</button><button class="action partial-btn"${disabled} onclick="saveItem(${item.item_id},'partial')">部分拿货</button><button class="action stock-btn"${disabled} onclick="saveItem(${item.item_id},'no_stock')">没货</button></div>
          </article>`;
        }).join("") : '<div class="empty">当前筛选暂无拿货明细</div>';
      }
      async function request(url, options={}) {
        let response;
        try {
          response=await fetch(url,{credentials:"same-origin",...options});
        } catch (error) {
          if (error?.name === "AbortError") throw error;
          throw new Error("无法连接 ERP 服务，请检查网络后重试");
        }
        const text=await response.text();
        let body={};
        if (text) {
          try { body=JSON.parse(text); } catch (_error) { body={}; }
        }
        if (!response.ok) {
          const detail=body?.detail;
          const message=typeof detail === "string"
            ? detail
            : (detail && typeof detail.message === "string" ? detail.message : "");
          throw new Error(message || `操作失败（HTTP ${response.status}）`);
        }
        return body;
      }
      async function saveItem(id,status) {
        if (busyItems.has(id)) return;
        const card=document.querySelector(`[data-id="${id}"]`);
        const current=data.items.find(item => item.item_id===id);
        if (!card || !current) return toast("拿货明细已刷新，请重新选择");
        const target=Number(current.final_delivery_qty ?? current.suggested_qty ?? 0);
        let qty=Number(card.querySelector(".qty").value);
        if (status === "picked") {
          if (!Number.isFinite(target) || target <= 0) return toast("本单拿货数量无效，请联系电脑端确认");
          qty=target;
          card.querySelector(".qty").value=target;
        } else if (status === "no_stock") {
          qty=0;
        } else {
          if (!Number.isFinite(qty) || qty <= 0) return toast("部分拿货数量必须大于 0");
          if (qty >= target) return toast("已全部拿齐，请点击“已拿货”");
        }
        busyItems.add(id);
        card.querySelectorAll("button.action").forEach(button => button.disabled=true);
        try {
          const result=await request(`/api/mobile/tianhua-pick/items/${id}`,{
            method:"PUT",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({token,mobile_pick_status:status,mobile_picked_qty:status==="no_stock"?0:qty,mobile_pick_note:current.mobile_pick_note || ""})
          });
          Object.assign(current,result.item);
          busyItems.delete(id);
          render();
          const messages={picked:"已转入“已拿货”",partial:"已记录部分拿货",no_stock:"已记录没货"};
          toast(messages[result.item.mobile_pick_status] || "拿货状态已保存");
        } catch (error) {
          toast(error.message);
          busyItems.delete(id);
          if (card.isConnected) {
            card.querySelectorAll("button.action").forEach(button => button.disabled=false);
          } else {
            render();
          }
        }
      }
      async function loadData() {
        loadController?.abort();
        const controller=new AbortController();
        loadController=controller;
        const generation=++loadGeneration;
        const loading=document.getElementById("loading");
        loading.textContent=data ? "正在刷新拿货明细..." : "正在加载拿货明细...";
        loading.hidden=false;
        document.getElementById("error").hidden=true;
        if (!data) document.getElementById("app").hidden=true;
        try {
          if (!token) throw new Error("无权限访问该拿货单");
          const result=await request(`/api/mobile/tianhua-pick?token=${encodeURIComponent(token)}`,{signal:controller.signal});
          if (generation !== loadGeneration) return;
          data=result;
          loading.hidden=true;
          document.getElementById("app").hidden=false;
          render();
        } catch (error) {
          if (error?.name === "AbortError" || generation !== loadGeneration) return;
          loading.hidden=true;
          document.getElementById("errorText").textContent=error.message;
          document.getElementById("retry").hidden=!token;
          document.getElementById("error").hidden=false;
        }
      }
      document.getElementById("retry").addEventListener("click",loadData);
      loadData();
    </script>
  </body>
</html>
