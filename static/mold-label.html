    async function refreshRenderedLabels(){const generation=++renderGeneration;$("printButton").disabled=true;if(!labelDataReady||!sourceRows.length)return;rebuildLabelRows();try{await waitForQrImages();const overflowFields=wideTemplate?TmMoldLabelLayout.fitAndValidate($("labels")):[];if(overflowFields.length)throw new Error(`${overflowFields.join("、")}在当前已发布布局中仍无法完整显示，请由管理员调整布局后重新登记打印。`);if(generation===renderGeneration&&labelDataReady){$("errorBox").hidden=true;$("printButton").disabled=false}}catch(error){if(generation===renderGeneration){$("errorBox").textContent=error?.message||"二维码或标签正文加载失败，请重新读取后再打印。";$("errorBox").hidden=false;$("printButton").disabled=true}throw error}}

    const frozenJobQuery=printJobId?`&print_job_id=${encodeURIComponent(printJobId)}`:"",moldLabelPrintPage=TmPrintRecovery.createPrintPage({id:prototypeMode?"1":batchMode?(batchSelectionValid?batchIds[0]:null):params.get("mold_id"),url:id=>prototypeMode?"/api/auth/me":batchMode?`/api/warehouse/molds/labels?mold_ids=${encodeURIComponent(batchIds.join(","))}&template_version=${encodeURIComponent(templateVersion)}${frozenJobQuery}`:`/api/warehouse/molds/${id}/label?template_version=${encodeURIComponent(templateVersion)}${frozenJobQuery}`,printButton:$("printButton"),retryButton:$("retryButton"),loadState:$("loadState"),errorBox:$("errorBox"),content:$("previewContent"),loadingMessage:batchMode?"正在读取整批模具标签，请稍候…":"正在读取模具标签，请稍候…",invalidMessage:batchMode?"批量标签选择无效，请返回模具列表重新选择。":"模具 ID 无效，请从模具列表重新打开，或进入匿名样式预览。",authMessage:"登录已失效，正在返回 ERP 登录。",failureMessage:batchMode?"整批模具标签读取失败":"模具标签读取失败",render:renderMoldLabel,print:()=>window.print(),onUnauthorized:loginNext});
    async function loadMoldLabel(){labelDataReady=false;$("batchSort").disabled=true;$("copyCount").disabled=true;return moldLabelPrintPage.load()}
    function refreshFromControls(){void refreshRenderedLabels().catch(()=>{})}$("batchControls").classList.toggle("hidden",!batchMode);$("batchSort").onchange=refreshFromControls;$("copyCount").oninput=refreshFromControls;loadMoldLabel();
