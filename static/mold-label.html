<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>模具标签 - 天明ERP</title>
  <style id="pageStyle">@page{size:40mm 30mm;margin:0}</style>
  <style>
    :root{--paper-width:40mm;--paper-height:30mm;--print-x-compensation:2mm;--blue:#2563eb;--line:#cbd5e1;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111827;font:14px/1.35 Arial,"Microsoft YaHei",sans-serif}
    .toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:end;justify-content:center;gap:10px;flex-wrap:wrap}.paper-fixed{height:36px;display:flex;align-items:center;border:1px solid #94a3b8;border-radius:7px;background:#f8fafc;padding:0 12px;font-weight:900}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:3px}.field select,.field input{height:36px;border:1px solid #94a3b8;border-radius:7px;background:#fff;padding:0 9px;font-size:14px}.field input{width:86px}.actions{display:flex;gap:8px}.button{height:36px;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:0 16px;font-weight:800;cursor:pointer}.button.secondary{background:#475569}.button:disabled{cursor:not-allowed;opacity:.45}.button.link{display:inline-flex;align-items:center;text-decoration:none;background:#e2e8f0;color:#1e293b}.batch-fields{display:flex;gap:8px}.hidden,[hidden]{display:none!important}
    .notice,.error,.load-state{max-width:860px;margin:12px auto;padding:10px 12px;border-radius:8px}.notice,.load-state{background:#eff6ff;color:#1e3a8a}.error{background:#fee2e2;color:#991b1b}.preview-summary{max-width:860px;margin:12px auto 8px;color:#475569;text-align:center}
    .labels{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 12px 24px}.label{position:relative;width:var(--paper-width);height:var(--paper-height);background:#fff;border:0;padding:.8mm 1.5mm .8mm 2.5mm;display:grid;grid-template-columns:minmax(0,1fr) 13.9mm;grid-template-rows:5.2mm 5.2mm minmax(0,1fr);column-gap:.8mm;row-gap:.25mm;overflow:hidden;page-break-after:always;break-after:page}.label:last-child{page-break-after:auto;break-after:auto}.fact-row{grid-column:1;min-width:0;display:flex;align-items:baseline;gap:.7mm}.board-row{grid-row:1}.fact-key{flex:0 0 auto;font-size:2mm;line-height:1;font-weight:700;color:#374151}.fact-value{min-width:0;font-size:3.35mm;line-height:1;font-weight:900;white-space:nowrap}.fact-value.long{font-size:2.65mm}.product-flute-row{grid-column:1;grid-row:2;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 6.4mm;align-items:baseline;column-gap:.15mm}.inline-fact{min-width:0;display:flex;align-items:baseline;gap:.12mm;white-space:nowrap}.inline-fact .fact-key{font-size:1.35mm}.inline-fact .fact-value{font-size:2mm;letter-spacing:-.05mm}.inline-fact .fact-value.long{font-size:1.75mm}.flute-fact{justify-self:end}.inline-fact .fact-value.flute{font-size:2.35mm;letter-spacing:0}.identity{grid-column:1;grid-row:3;min-width:0;align-self:end;padding-bottom:.35mm}.customer-name{font-size:3.05mm;line-height:.95;font-weight:900;letter-spacing:-.03mm;white-space:nowrap}.customer-name.long{font-size:2.55mm}.customer-name.xlong{font-size:2.15mm}.mold-number{margin-top:.4mm;max-width:100%;font-family:"Arial Narrow",Arial,"Microsoft YaHei",sans-serif;font-size:4.3mm;line-height:.94;font-weight:900;letter-spacing:-.05mm;white-space:nowrap}.mold-number.compact{font-size:3.85mm;letter-spacing:-.12mm}.mold-number.long{font-size:3.25mm;letter-spacing:-.18mm}.mold-number.xlong{font-size:2.7mm;letter-spacing:-.22mm}.mold-number.xxlong{font-size:2.2mm;letter-spacing:-.25mm}.label>.fact-row,.label>.product-flute-row,.label>.identity{transform:translateX(calc(0mm - var(--print-x-compensation)))}.qr{grid-column:2;grid-row:1/4;width:13.9mm;height:13.9mm;display:block;align-self:end;justify-self:end;margin-bottom:2.2mm;transform:translate(calc(0mm - var(--print-x-compensation)),2mm);object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}.qr-missing{border:.18mm solid #111;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.45mm;font-weight:900}.missing{color:#5f6368}.prototype-mark{position:absolute;right:2mm;top:.5mm;font-size:1.15mm;color:#5f6368}
    @media print{body,html{width:40mm;height:auto;margin:0;background:#fff;overflow:visible}body>*:not(#previewContent){display:none!important}#previewContent,#labels{display:block!important;margin:0!important;padding:0!important}#previewContent,#labels{width:40mm!important}.notice,.error,.load-state,.preview-summary{display:none!important}.label{display:grid!important;width:40mm!important;height:30mm!important;margin:0!important;padding:.8mm 1.5mm .8mm 2.5mm!important;border:0!important}.fact-row,.identity{display:flex!important}.identity{display:block!important}.qr{display:block!important}}
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="field"><label>标签纸</label><div class="paper-fixed">40 × 30 mm（固定）</div></div>
    <div id="batchControls" class="batch-fields hidden">
      <div class="field"><label for="batchSort">打印顺序</label><select id="batchSort" disabled><option value="selected">选择顺序</option><option value="code">模具编号</option><option value="location">货架位置</option></select></div>
      <div class="field"><label for="copyCount">每件份数</label><input id="copyCount" type="number" min="1" max="10" step="1" value="1" disabled></div>
    </div>
    <div class="actions"><button id="printButton" disabled class="button" type="button">打印当前标签</button><button id="retryButton" class="button secondary hidden" type="button" hidden>重新读取</button><a class="button link" href="/warehouse.html">返回仓库</a><a id="prototypeLink" class="button secondary link" href="/mold-label.html?prototype=1">匿名样式预览</a></div>
  </div>
  <div id="loadState" class="load-state">正在读取模具标签，请稍候…</div>
  <div id="errorBox" class="error" role="alert" hidden></div>
  <section id="previewContent" hidden><div id="notice"></div><div id="summary" class="preview-summary"></div><main id="labels" class="labels"></main></section>
  <script src="/static/assets/print-recovery.js"></script>
  <script>
    const $=id=>document.getElementById(id);const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    const params=new URLSearchParams(location.search);const prototypeMode=params.get("prototype")==="1";const rawBatchIds=params.get("mold_ids")||"",batchParts=rawBatchIds.split(",").map(value=>value.trim()).filter(Boolean),batchIds=batchParts.filter((value,index,rows)=>/^\d+$/.test(value)&&Number(value)>0&&rows.indexOf(value)===index),batchMode=!prototypeMode&&rawBatchIds!=="",batchSelectionValid=batchParts.length>0&&batchIds.length===batchParts.length&&batchIds.length<=100;let sourceRows=[],labelRows=[],labelDataReady=false;
    function loginNext(){location.href=`/?next=${encodeURIComponent(location.pathname+location.search)}`}
    function demoProduct(customerShortName,customerCode,code,name,specification,reportSpecification,fluteType){return {customer_short_name:customerShortName,customer_code:customerCode,product_code:code,product_name:name,specification,report_specification:reportSpecification,flute_type:fluteType}}
    const prototypeQr="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGMAAABjAQAAAACnQIM4AAABIklEQVR4nNVUMU7DQBCcvTNyZ9wiOXIkXkDnIpLp+AcvsEyTyjEPCIEPhHekcyTE8QJqB5Dc+pImlo4sIg1UXpewxUorjeZ2ZkdHjJ/aqF8D8LcmS5S/UL4mJSGJHU916HMrvrAeozs7gMp+pPfdApjgddDWu8VkKSoCW3YF2Bq2XPdzMnk7Myo7CiXOY8XH3ssJtnvQ3iGNSEK2qbYmyoCZhDykUZG4II1FRXTbKOib1dNScn6L7uR583lpROd51synk60/Eu4Obn0X+I4qJyhSIHueJ16WNEq+Jk6ruIXkp0IAfkP9wM1B3BPIfJCByEnscPFeJlExIPNUgenjfkCS+Wqcpe56ADLo6seVDgdlXnMVL8TUAVmi78R80j/5wb4A8WaPfe2cmwoAAAAASUVORK5CYII=";
    function prototypeRows(){return [
      {mold_code:"JCD-61452621",label_identity:"聚晟达61452621",label_customer_name:"聚晟达",label_mold_number:"61452621",label_product_specification:"430 × 68",label_report_specification:"880 × 425",label_flute_type:"AB",mold_name:"聚晟达61452621",is_active:true,product_count:1,qr_data_url:prototypeQr,products:[demoProduct("聚晟达","JSD","61452621R1F","模切内盒","430 × 68","880 × 425","AB")]},
      {mold_code:"SME-CPN087075",label_identity:"思迈尔CPN087075",label_customer_name:"思迈尔",label_mold_number:"CPN087075",label_product_specification:"多款见扫码",label_report_specification:"多款见扫码",label_flute_type:"E",mold_name:"思迈尔CPN087075",is_active:true,product_count:3,qr_data_url:prototypeQr,products:[demoProduct("思迈尔","SME","CPN087075","天地盖内盒","420 × 300 × 55","962 × 1037","E"),demoProduct("思迈尔","SME","CPN087076","配套内盒B","350 × 260 × 45","600 × 550","E"),demoProduct("思迈尔","SME","CPN087077","配套内盒C","360 × 270 × 45","610 × 550","E")]},
      {mold_code:"YY-Z.001.000093",label_identity:"仪元Z.001.000093",label_customer_name:"仪元",label_mold_number:"Z.001.000093",label_product_specification:"待完善",label_report_specification:"待完善",label_flute_type:"待完善",mold_name:"资料待完善",is_active:true,product_count:1,qr_data_url:prototypeQr,products:[demoProduct("仪元","YY","Z.001.000093","仪元模切件","","","")]}
    ]}
    function textClass(value,medium,long){const length=String(value||"").length;return length>long?"xlong":length>medium?"long":""}
    function numberClass(value){const length=String(value||"").length;return length>19?"xxlong":length>15?"xlong":length>11?"long":length>8?"compact":""}
    function factRow(label,value,extraClass="",rowClass=""){const text=String(value||"").trim()||"待完善";return `<div class="fact-row ${rowClass} ${text==="待完善"?"missing":""}"><span class="fact-key">${h(label)}</span><strong class="fact-value ${extraClass} ${text.length>14?"long":""}">${h(text)}</strong></div>`}
    function inlineFact(label,value,extraClass=""){const text=String(value||"").trim()||"待完善",longText=text.length>(extraClass==="flute"?3:12);return `<div class="inline-fact ${extraClass==="flute"?"flute-fact":""} ${text==="待完善"?"missing":""}"><span class="fact-key">${h(label)}</span><strong class="fact-value ${extraClass} ${longText?"long":""}">${h(text)}</strong></div>`}
    function labelHtml(row){const products=row.products||[],product=products[0]||null,identity=String(row.label_identity||row.mold_code||"待完善"),customer=String(row.label_customer_name||product?.customer_short_name||"待完善"),number=String(row.label_mold_number||identity.slice(customer.length)||row.mold_code||"待完善"),productSize=String(row.label_product_specification??product?.specification??"").trim(),board=String(row.label_report_specification??product?.report_specification??"").trim(),flute=String(row.label_flute_type??product?.flute_type??"").trim(),qr=row.qr_data_url?`<img class="qr" src="${h(row.qr_data_url)}" alt="扫码查看模具实时信息">`:'<div class="qr qr-missing">二维码<br>待生成</div>';return `<article class="label">${factRow("片料",board,"","board-row")}<div class="product-flute-row">${inlineFact("产品",productSize)}${inlineFact("楞型",flute,"flute")}</div><div class="identity"><div class="customer-name ${textClass(customer,5,8)}">${h(customer)}</div><div class="mold-number ${numberClass(number)}">${h(number)}</div></div>${qr}${prototypeMode?'<span class="prototype-mark">样例</span>':""}</article>`}
    function renderLabels(){$("labels").innerHTML=labelRows.map(labelHtml).join("")}
    async function waitForQrImages(){const images=[...document.querySelectorAll("#labels img.qr")];await Promise.all(images.map(image=>image.decode?image.decode():image.complete&&image.naturalWidth>0?Promise.resolve():new Promise((resolve,reject)=>{image.addEventListener("load",resolve,{once:true});image.addEventListener("error",()=>reject(new Error("二维码图片加载失败")),{once:true})})));if(images.some(image=>!image.complete||!image.naturalWidth))throw new Error("二维码图片尚未完整加载")}
    let renderGeneration=0;
    function rebuildLabelRows(){let rows=[...sourceRows];if(batchMode&&$("batchSort").value==="code")rows.sort((a,b)=>String(a.mold_code||"").localeCompare(String(b.mold_code||""),"zh-CN",{numeric:true}));if(batchMode&&$("batchSort").value==="location")rows.sort((a,b)=>String(a.rack_location||"").localeCompare(String(b.rack_location||""),"zh-CN",{numeric:true})||String(a.mold_code||"").localeCompare(String(b.mold_code||""),"zh-CN",{numeric:true}));const copies=batchMode?Math.max(1,Math.min(10,Number($("copyCount").value)||1)):1;labelRows=rows.flatMap(row=>Array.from({length:copies},()=>row));$("summary").textContent=`当前预览：40 × 30 mm · ${sourceRows.length} 件模具 · ${labelRows.length} 张标签`;renderLabels()}
    async function refreshRenderedLabels(){const generation=++renderGeneration;$("printButton").disabled=true;if(!labelDataReady||!sourceRows.length)return;rebuildLabelRows();try{await waitForQrImages();if(generation===renderGeneration&&labelDataReady){$("errorBox").hidden=true;$("printButton").disabled=false}}catch(error){if(generation===renderGeneration){$("errorBox").textContent="二维码加载失败，请重新读取后再打印。";$("errorBox").hidden=false;$("printButton").disabled=true}throw error}}
    async function renderMoldLabel(data){labelDataReady=false;$("batchSort").disabled=true;$("copyCount").disabled=true;if(prototypeMode){sourceRows=prototypeRows();$("notice").innerHTML='<div class="notice">40×30 mm 模具侧面标签：第一排单独显示片料尺寸，第二排并列显示产品尺寸与楞型；客户中文简称放大，模具编号按长度自动紧排缩小。二维码下移贴近标签底部；不打印位置和外围边框。扫码后登录 ERP 查看实时订单、收料和材料位置。</div>';$("prototypeLink").classList.add("hidden");$("printButton").textContent="打印匿名测试标签"}else{sourceRows=batchMode?(data.items||[]):[data];if(!sourceRows.length)throw new Error("没有可打印的模具标签");$("notice").innerHTML=batchMode?'<div class="notice">请核对模具、顺序和份数。每件模具的多份 40×30 mm 标签连续排列。</div>':"";$("prototypeLink").classList.remove("hidden");$("printButton").textContent=batchMode?"打印整批标签":"打印当前标签"}labelDataReady=true;await refreshRenderedLabels();if(batchMode){$("batchSort").disabled=false;$("copyCount").disabled=false}}
    const moldLabelPrintPage=TmPrintRecovery.createPrintPage({id:prototypeMode?"1":batchMode?(batchSelectionValid?batchIds[0]:null):params.get("mold_id"),url:id=>prototypeMode?"/api/auth/me":batchMode?`/api/warehouse/molds/labels?mold_ids=${encodeURIComponent(batchIds.join(","))}`:`/api/warehouse/molds/${id}/label`,printButton:$("printButton"),retryButton:$("retryButton"),loadState:$("loadState"),errorBox:$("errorBox"),content:$("previewContent"),loadingMessage:batchMode?"正在读取整批模具标签，请稍候…":"正在读取模具标签，请稍候…",invalidMessage:batchMode?"批量标签选择无效，请返回模具列表重新选择。":"模具 ID 无效，请从模具列表重新打开，或进入匿名样式预览。",authMessage:"登录已失效，正在返回 ERP 登录。",failureMessage:batchMode?"整批模具标签读取失败":"模具标签读取失败",render:renderMoldLabel,print:()=>window.print(),onUnauthorized:loginNext});
    async function loadMoldLabel(){labelDataReady=false;$("batchSort").disabled=true;$("copyCount").disabled=true;return moldLabelPrintPage.load()}
    function refreshFromControls(){void refreshRenderedLabels().catch(()=>{})}$("batchControls").classList.toggle("hidden",!batchMode);$("batchSort").onchange=refreshFromControls;$("copyCount").oninput=refreshFromControls;loadMoldLabel();
  </script>
