<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>模具标签 - 天明ERP</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111827;font:14px/1.4 Arial,"Microsoft YaHei",sans-serif}.toolbar{padding:12px;text-align:center}.toolbar button{border:0;border-radius:8px;background:#2563eb;color:#fff;padding:9px 24px;font-weight:700}.label{width:140mm;min-height:90mm;margin:0 auto 18px;background:#fff;border:1px solid #111;padding:6mm;display:grid;grid-template-columns:1fr 36mm;gap:5mm}.title{font-size:26px;font-weight:900}.mold-code{font-size:18px;font-weight:800;margin-top:2mm}.location{border:2px solid #111;padding:3mm;margin:4mm 0}.location-code{font-size:26px;font-weight:900}.prompt{font-size:15px;font-weight:700}.products{font-size:12px}.product{border-top:1px solid #aaa;padding:1.5mm 0}.product:first-child{border-top:0}.qr{text-align:center}.qr img{width:34mm;height:34mm}.qr small{display:block;word-break:break-all;margin-top:2mm}.error{max-width:700px;margin:20px auto;background:#fee2e2;color:#991b1b;padding:15px;border-radius:8px}@page{size:A6 landscape;margin:4mm}@media print{body{background:#fff}.toolbar{display:none}.label{margin:0;width:100%;min-height:0;border:1px solid #000;page-break-inside:avoid}}
  </style>
</head>
<body>
  <div class="toolbar" id="printToolbar"><button id="printButton" type="button" data-print-action="print">打印标签</button></div>
  <div id="message"></div>
  <article id="label" class="label" style="display:none">
    <div>
      <div class="title" id="moldName"></div>
      <div class="mold-code"><span data-print-edit-key="mold_number_label" data-print-edit-label="模具编号标签">模具编号：</span><span id="moldCode"></span></div>
      <div class="location"><div class="location-code" id="rackLocation"></div><div class="prompt" id="positionPrompt"></div></div>
      <div class="products" id="products"></div>
      <div id="additionalProducts" style="display:none"><span data-print-edit-key="additional_products_prefix" data-print-edit-label="其余产品前缀">另有 </span><span id="additionalProductsCount"></span><span data-print-edit-key="additional_products_suffix" data-print-edit-label="其余产品后缀"> 款，请扫码查看。</span></div>
    </div>
    <div class="qr"><img id="qr" alt="模具查询二维码"><div data-print-edit-key="qr_prompt" data-print-edit-label="二维码提示">扫码查询模具</div><small id="lookupUrl"></small></div>
  </article>
  <script type="text/javascript" src="/static/assets/print-template-editor.js"></script>
  <script>
    const $=id=>document.getElementById(id);const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    async function api(url){const response=await fetch(url,{credentials:"same-origin"});let body={};try{body=await response.json()}catch{}if(!response.ok){const error=new Error(typeof body.detail==="string"?body.detail:`请求失败（HTTP ${response.status}）`);error.status=response.status;throw error}return body}
    function loginNext(){location.href=`/?next=${encodeURIComponent(location.pathname+location.search)}`}
    const templateEditor=PrintTemplateEditor.create({templateKey:"mold_label",root:document,toolbar:$("printToolbar"),printButton:$("printButton"),onPrint:()=>window.print()});
    function renderProducts(data){
      const container=$("products");container.textContent="";
      const shown=(data.products||[]).slice(0,8);
      shown.forEach(row=>{
        const product=document.createElement("div");product.className="product";
        const name=document.createElement("b");name.textContent=`${row.customer_name||"-"}｜${row.product_name||""}`;product.appendChild(name);product.appendChild(document.createElement("br"));
        const codeLabel=document.createElement("span");codeLabel.dataset.printEditKey="product_code_label";codeLabel.dataset.printEditLabel="存货编码标签";codeLabel.textContent="存货编码";product.appendChild(codeLabel);product.appendChild(document.createTextNode(" "));
        const code=document.createElement("span");code.textContent=row.product_code||"";product.appendChild(code);product.appendChild(document.createTextNode("｜"));
        const specificationLabel=document.createElement("span");specificationLabel.dataset.printEditKey="specification_label";specificationLabel.dataset.printEditLabel="规格标签";specificationLabel.textContent="规格";product.appendChild(specificationLabel);product.appendChild(document.createTextNode(" "));
        const specification=document.createElement("span");specification.textContent=row.specification||"未登记";product.appendChild(specification);container.appendChild(product);
      });
      const extra=Math.max(Number(data.product_count||0)-shown.length,0);$("additionalProducts").style.display=extra?"block":"none";$("additionalProductsCount").textContent=extra?String(extra):"";
      templateEditor.applyTo(container);templateEditor.applyTo($("additionalProducts"));
    }
    async function init(){
      const id=Number.parseInt(new URLSearchParams(location.search).get("mold_id"),10);if(!Number.isInteger(id)||id<=0){$("message").innerHTML='<div class="error">模具ID无效，请从模具列表重新打开。</div>';return}
      try{
        await api("/api/auth/me");const data=await api(`/api/warehouse/molds/${id}/label`);
        $("moldName").textContent=data.mold_name;$("moldCode").textContent=data.mold_code;$("rackLocation").textContent=data.rack_location;$("positionPrompt").textContent=data.location_guide.prompt;$("qr").src=data.qr_data_url;$("lookupUrl").textContent=data.lookup_url;renderProducts(data);$("label").style.display="grid";await templateEditor.ready;
      }catch(error){if(error.status===401){loginNext();return}$("message").innerHTML=`<div class="error">${h(error.message)}</div>`}
    }init();
  </script>
</body>
</html>
