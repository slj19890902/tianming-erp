    async function waitForQrImages(){const images=[...document.querySelectorAll("#labels img.qr")];await Promise.all(images.map(image=>image.decode?image.decode():image.complete&&image.naturalWidth>0?Promise.resolve():new Promise((resolve,reject)=>{image.addEventListener("load",resolve,{once:true});image.addEventListener("error",()=>reject(new Error("二维码图片加载失败")),{once:true})})));if(images.some(image=>!image.complete||!image.naturalWidth))throw new Error("二维码图片尚未完整加载")}
    let renderGeneration=0;
    function rebuildLabelRows(){let rows=[...sourceRows];if(batchMode&&$("batchSort").value==="name")rows.sort((a,b)=>String(a.label_identity||a.mold_name||"").localeCompare(String(b.label_identity||b.mold_name||""),"zh-CN",{numeric:true}));if(batchMode&&$("batchSort").value==="location")rows.sort((a,b)=>String(a.rack_location||"").localeCompare(String(b.rack_location||""),"zh-CN",{numeric:true})||String(a.label_identity||a.mold_name||"").localeCompare(String(b.label_identity||b.mold_name||""),"zh-CN",{numeric:true}));const copies=batchMode?Math.max(1,Math.min(10,Number($("copyCount").value)||1)):1;labelRows=rows.flatMap(row=>Array.from({length:copies},()=>row));$("summary").textContent=`当前预览：${wideTemplate?"40 × 80 mm 物理页 · 内容沿 80mm 走纸方向":"40 × 30 mm"} · ${sourceRows.length} 件模具 · ${labelRows.length} 张标签`;renderLabels()}
    async function refreshRenderedLabels(){const generation=++renderGeneration;$("printButton").disabled=true;if(!labelDataReady||!sourceRows.length)return;rebuildLabelRows();try{await waitForQrImages();if(generation===renderGeneration&&labelDataReady){$("errorBox").hidden=true;$("printButton").disabled=false}}catch(error){if(generation===renderGeneration){$("errorBox").textContent="二维码加载失败，请重新读取后再打印。";$("errorBox").hidden=false;$("printButton").disabled=true}throw error}}
    async function renderMoldLabel(data){labelDataReady=false;$("batchSort").disabled=true;$("copyCount").disabled=true;if(prototypeMode){sourceRows=wideTemplate?prototypeRows().slice(0,1):prototypeRows();$("notice").innerHTML=wideTemplate?`<div class="notice">40×80 mm 实体标签：打印窗口必须选择新队列“${h(WIDE_PRINTER_QUEUE)}”。该队列是驱动中的真实 40×80 纵向纸型，不再使用旧队列缓存的 80×40 横纸。缩放保持 100%，不要手工改变方向。</div>`:'<div class="notice">40×30 mm 模具侧面标签：第一排单独显示片料尺寸，第二排并列显示产品尺寸与楞型；客户中文简称放大，模具标签名称按长度自动紧排缩小。二维码下移贴近标签底部；不打印位置和外围边框。扫码后登录 ERP 查看实时订单、收料和材料位置。</div>';$("prototypeLink").classList.add("hidden");$("printButton").textContent="打印匿名测试标签"}else{sourceRows=batchMode?(data.items||[]):[data];if(!sourceRows.length)throw new Error("没有可打印的模具标签");$("notice").innerHTML=batchMode?`<div class="notice">请核对模具、顺序和份数。${wideTemplate?`打印窗口必须选择新队列“${h(WIDE_PRINTER_QUEUE)}”（真实 40×80 纵向纸型）`:`整批统一使用 40×30 纸型`}；失败重试不会改换纸型。</div>`:"";$("prototypeLink").href=`/mold-label.html?prototype=1&template_version=${encodeURIComponent(templateVersion)}`;$("prototypeLink").classList.remove("hidden");$("printButton").textContent=batchMode?"打印整批标签":"打印当前标签"}labelDataReady=true;await refreshRenderedLabels();if(batchMode){$("batchSort").disabled=false;$("copyCount").disabled=false}}
    const moldLabelPrintPage=TmPrintRecovery.createPrintPage({id:prototypeMode?"1":batchMode?(batchSelectionValid?batchIds[0]:null):params.get("mold_id"),url:id=>prototypeMode?"/api/auth/me":batchMode?`/api/warehouse/molds/labels?mold_ids=${encodeURIComponent(batchIds.join(","))}&template_version=${encodeURIComponent(templateVersion)}`:`/api/warehouse/molds/${id}/label?template_version=${encodeURIComponent(templateVersion)}`,printButton:$("printButton"),retryButton:$("retryButton"),loadState:$("loadState"),errorBox:$("errorBox"),content:$("previewContent"),loadingMessage:batchMode?"正在读取整批模具标签，请稍候…":"正在读取模具标签，请稍候…",invalidMessage:batchMode?"批量标签选择无效，请返回模具列表重新选择。":"模具 ID 无效，请从模具列表重新打开，或进入匿名样式预览。",authMessage:"登录已失效，正在返回 ERP 登录。",failureMessage:batchMode?"整批模具标签读取失败":"模具标签读取失败",render:renderMoldLabel,print:()=>window.print(),onUnauthorized:loginNext});
    async function loadMoldLabel(){labelDataReady=false;$("batchSort").disabled=true;$("copyCount").disabled=true;return moldLabelPrintPage.load()}
    function refreshFromControls(){void refreshRenderedLabels().catch(()=>{})}$("batchControls").classList.toggle("hidden",!batchMode);$("batchSort").onchange=refreshFromControls;$("copyCount").oninput=refreshFromControls;loadMoldLabel();
  </script>
