<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>模具标签 - 天明ERP</title>
  <style id="pageStyle">@page{size:40mm 30mm;margin:0}</style>
  <style>
    :root{--paper-width:40mm;--paper-height:30mm;--blue:#2563eb;--line:#cbd5e1;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111827;font:14px/1.35 Arial,"Microsoft YaHei",sans-serif}
    .toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:end;justify-content:center;gap:10px;flex-wrap:wrap}.paper-fixed{height:36px;display:flex;align-items:center;border:1px solid #94a3b8;border-radius:7px;background:#f8fafc;padding:0 12px;font-weight:900}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:3px}.field select,.field input{height:36px;border:1px solid #94a3b8;border-radius:7px;background:#fff;padding:0 9px;font-size:14px}.field input{width:86px}.actions{display:flex;gap:8px}.button{height:36px;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:0 16px;font-weight:800;cursor:pointer}.button.secondary{background:#475569}.button:disabled{cursor:not-allowed;opacity:.45}.button.link{display:inline-flex;align-items:center;text-decoration:none;background:#e2e8f0;color:#1e293b}.batch-fields{display:flex;gap:8px}.hidden,[hidden]{display:none!important}
    .notice,.error,.load-state{max-width:860px;margin:12px auto;padding:10px 12px;border-radius:8px}.notice,.load-state{background:#eff6ff;color:#1e3a8a}.error{background:#fee2e2;color:#991b1b}.preview-summary{max-width:860px;margin:12px auto 8px;color:#475569;text-align:center}
    .labels{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 12px 24px}.label{position:relative;width:var(--paper-width);height:var(--paper-height);background:#fff;border:.25mm solid #111;padding:1mm 1.25mm;display:flex;flex-direction:column;gap:.45mm;overflow:hidden;page-break-after:always;break-after:page}.label:last-child{page-break-after:auto;break-after:auto}.topline{min-width:0;border-bottom:.22mm solid #111;padding-bottom:.45mm}.mold-code{min-width:0;font-size:3.8mm;line-height:1;font-weight:900;letter-spacing:.03mm;white-space:nowrap}.mold-code.long{font-size:3.25mm}.mold-code.xlong{font-size:2.65mm;white-space:normal;overflow-wrap:anywhere}.location{display:flex;align-items:baseline;gap:.7mm;border-bottom:.18mm solid #94a3b8;padding:.35mm 0 .45mm;font-size:2.55mm;line-height:1.05}.field-key{flex:0 0 auto;color:#374151;font-size:1.8mm;font-weight:700}.field-value{min-width:0;font-weight:900;overflow-wrap:anywhere}.location .field-value{font-size:2.7mm}.location .field-value.long{font-size:2.2mm}.label-body{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 13.9mm;gap:1mm;align-items:center}.dimensions{min-height:0;height:100%;display:grid;grid-template-rows:1fr 1fr;gap:.3mm}.dimension-card{min-width:0;display:flex;flex-direction:column;justify-content:center}.dimension-key{font-size:1.75mm;line-height:1;color:#374151;font-weight:700}.dimension-value{font-size:3mm;line-height:1.05;font-weight:900;white-space:nowrap}.dimension-value.long{font-size:2.35mm}.missing{color:#5f6368}.qr{width:13.9mm;height:13.9mm;display:block;align-self:center;justify-self:end;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}.qr-missing{border:.18mm solid #111;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.45mm;font-weight:900}.prototype-mark{position:absolute;right:1.25mm;top:8.8mm;font-size:1.25mm;color:#5f6368}
    @media print{body,html{width:40mm;height:auto;margin:0;background:#fff;overflow:visible}body>*:not(#previewContent){display:none!important}#previewContent,#labels{display:block!important;margin:0!important;padding:0!important}#previewContent,#labels{width:40mm!important}.notice,.error,.load-state,.preview-summary{display:none!important}.label{display:flex!important;width:40mm!important;height:30mm!important;margin:0!important;padding:1mm 1.25mm!important;border:.25mm solid #000!important}.label-body,.dimensions{display:grid!important}.dimension-card{display:flex!important}.qr{display:block!important}}
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="field"><label>标签纸</label><div class="paper-fixed">40 × 30 mm（固定）</div></div>
    <div id="batchControls" class="batch-fields hidden">
      <div class="field"><label for="batchSort">打印顺序</label><select id="batchSort" disabled><option value="selected">选择顺序</option><option value="code">模具编号</option><option value="location">货架位置</option></select></div>
      <div class="field"><label for="copyCount">每件份数</label><input id="copyCount" type="number" min="1" max="10" step="1" value="1" disabled></div>
    </div>
    <div class="actions"><button id="printButton" disabled class="button" type="button">打印当前标签</button><button id="retryButton" class="button secondary hidden" type="button" hidden>重新读取</button><a class="button link" href="/warehouse.html">返回仓库</a><a id="prototypeLink" class="button secondary link" href="/mold-label.html?prototype=1">匿名样式预览</a></div>
  </div>
  <div id="loadState" class="load-state">正在读取模具标签，请稍候…</div>
  <div id="errorBox" class="error" role="alert" hidden></div>
  <section id="previewContent" hidden><div id="notice"></div><div id="summary" class="preview-summary"></div><main id="labels" class="labels"></main></section>
  <script src="/static/assets/print-recovery.js"></script>
  <script>
    const $=id=>document.getElementById(id);const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    const params=new URLSearchParams(location.search);const prototypeMode=params.get("prototype")==="1";const rawBatchIds=params.get("mold_ids")||"",batchParts=rawBatchIds.split(",").map(value=>value.trim()).filter(Boolean),batchIds=batchParts.filter((value,index,rows)=>/^\d+$/.test(value)&&Number(value)>0&&rows.indexOf(value)===index),batchMode=!prototypeMode&&rawBatchIds!=="",batchSelectionValid=batchParts.length>0&&batchIds.length===batchParts.length&&batchIds.length<=100;let sourceRows=[],labelRows=[],labelDataReady=false;
    function loginNext(){location.href=`/?next=${encodeURIComponent(location.pathname+location.search)}`}
    function demoProduct(customerShortName,customerCode,code,name,specification,reportSpecification){return {customer_short_name:customerShortName,customer_code:customerCode,product_code:code,product_name:name,specification,report_specification:reportSpecification}}
    const prototypeQr="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGMAAABjAQAAAACnQIM4AAABIklEQVR4nNVUMU7DQBCcvTNyZ9wiOXIkXkDnIpLp+AcvsEyTyjEPCIEPhHekcyTE8QJqB5Dc+pImlo4sIg1UXpewxUorjeZ2ZkdHjJ/aqF8D8LcmS5S/UL4mJSGJHU916HMrvrAeozs7gMp+pPfdApjgddDWu8VkKSoCW3YF2Bq2XPdzMnk7Myo7CiXOY8XH3ssJtnvQ3iGNSEK2qbYmyoCZhDykUZG4II1FRXTbKOib1dNScn6L7uR583lpROd51synk60/Eu4Obn0X+I4qJyhSIHueJ16WNEq+Jk6ruIXkp0IAfkP9wM1B3BPIfJCByEnscPFeJlExIPNUgenjfkCS+Wqcpe56ADLo6seVDgdlXnMVL8TUAVmi78R80j/5wb4A8WaPfe2cmwoAAAAASUVORK5CYII=";
    function prototypeRows(){return [
      {mold_code:"JCD-61452621",label_identity:"聚晟达61452621",mold_name:"聚晟达61452621",rack_location:"1F-M-R01-L2-G01",location_guide:{kind:"storage_grid",floor:"1F",rack:1,level:2,grid:1},is_active:true,product_count:1,qr_data_url:prototypeQr,products:[demoProduct("聚晟达","JSD","61452621R1F","模切内盒","430 × 68","880 × 425")]},
      {mold_code:"SME-CPN087075",label_identity:"思迈尔CPN087075",mold_name:"思迈尔CPN087075",rack_location:"1F-M-R02-L2-G03",location_guide:{kind:"storage_grid",floor:"1F",rack:2,level:2,grid:3},is_active:true,product_count:3,qr_data_url:prototypeQr,products:[demoProduct("思迈尔","SME","CPN087075","天地盖内盒","420 × 300 × 55","962 × 1037"),demoProduct("思迈尔","SME","CPN087076","配套内盒B","350 × 260 × 45","600 × 550"),demoProduct("思迈尔","SME","CPN087077","配套内盒C","360 × 270 × 45","610 × 550")]},
      {mold_code:"YY-Z.001.000093",label_identity:"仪元Z.001.000093",mold_name:"资料待完善",rack_location:"待归位",location_guide:{kind:"manual"},is_active:true,product_count:1,qr_data_url:prototypeQr,products:[demoProduct("仪元","YY","Z.001.000093","仪元模切件","","")]}
    ]}
    function textClass(value,medium,long){const length=String(value||"").length;return length>long?"xlong":length>medium?"long":""}
    function shortLocation(row){const guide=row.location_guide||{},rack=Number(guide.rack),level=Number(guide.level),grid=Number(guide.grid),line=Number(guide.row);if(Number.isInteger(rack)&&rack>0){const parts=[guide.floor||"",`R${String(rack).padStart(2,"0")}`];if(Number.isInteger(level)&&level>0)parts.push(`${level}层`);if(Number.isInteger(grid)&&grid>0)parts.push(`${grid}排`);else if(Number.isInteger(line)&&line>0)parts.push(`${line}排`);if(guide.kind==="vertical"||guide.kind==="vertical_legacy")parts.push("竖放");return parts.filter(Boolean).join(" · ")}if(guide.kind==="archive_area")return "模具归档区";return row.rack_location||"待归位"}
    function dimensionCard(label,value,missingText){const text=String(value||"").trim();return `<div class="dimension-card ${text?"":"missing"}"><span class="dimension-key">${h(label)}</span><strong class="dimension-value ${text.length>14?"long":""}">${h(text||missingText)}</strong></div>`}
    function labelHtml(row){const products=row.products||[],product=products[0]||null,identity=row.label_identity||row.mold_code||"待完善",locationText=shortLocation(row),productSize=String(row.label_product_specification??product?.specification??"").trim(),board=String(row.label_report_specification??product?.report_specification??"").trim(),qr=row.qr_data_url?`<img class="qr" src="${h(row.qr_data_url)}" alt="扫码查看模具实时信息">`:'<div class="qr qr-missing">二维码<br>待生成</div>';return `<article class="label"><div class="topline"><div class="mold-code ${textClass(identity,12,16)}">${h(identity)}</div></div><div class="location"><span class="field-key">位置</span><span class="field-value ${locationText.length>20?"long":""}">${h(locationText)}</span></div><div class="label-body"><div class="dimensions">${dimensionCard("产品尺寸",productSize,"待完善")}${dimensionCard("片料尺寸",board,"待完善")}</div>${qr}</div>${prototypeMode?'<span class="prototype-mark">样例</span>':""}</article>`}
    function renderLabels(){$("labels").innerHTML=labelRows.map(labelHtml).join("")}
    async function waitForQrImages(){const images=[...document.querySelectorAll("#labels img.qr")];await Promise.all(images.map(image=>image.decode?image.decode():image.complete&&image.naturalWidth>0?Promise.resolve():new Promise((resolve,reject)=>{image.addEventListener("load",resolve,{once:true});image.addEventListener("error",()=>reject(new Error("二维码图片加载失败")),{once:true})})));if(images.some(image=>!image.complete||!image.naturalWidth))throw new Error("二维码图片尚未完整加载")}
    let renderGeneration=0;
    function rebuildLabelRows(){let rows=[...sourceRows];if(batchMode&&$("batchSort").value==="code")rows.sort((a,b)=>String(a.mold_code||"").localeCompare(String(b.mold_code||""),"zh-CN",{numeric:true}));if(batchMode&&$("batchSort").value==="location")rows.sort((a,b)=>String(a.rack_location||"").localeCompare(String(b.rack_location||""),"zh-CN",{numeric:true})||String(a.mold_code||"").localeCompare(String(b.mold_code||""),"zh-CN",{numeric:true}));const copies=batchMode?Math.max(1,Math.min(10,Number($("copyCount").value)||1)):1;labelRows=rows.flatMap(row=>Array.from({length:copies},()=>row));$("summary").textContent=`当前预览：40 × 30 mm · ${sourceRows.length} 件模具 · ${labelRows.length} 张标签`;renderLabels()}
    async function refreshRenderedLabels(){const generation=++renderGeneration;$("printButton").disabled=true;if(!labelDataReady||!sourceRows.length)return;rebuildLabelRows();try{await waitForQrImages();if(generation===renderGeneration&&labelDataReady){$("errorBox").hidden=true;$("printButton").disabled=false}}catch(error){if(generation===renderGeneration){$("errorBox").textContent="二维码加载失败，请重新读取后再打印。";$("errorBox").hidden=false;$("printButton").disabled=true}throw error}}
    async function renderMoldLabel(data){labelDataReady=false;$("batchSort").disabled=true;$("copyCount").disabled=true;if(prototypeMode){sourceRows=prototypeRows();$("notice").innerHTML='<div class="notice">40×30 mm 匿名样例：实体标签只显示客户名称+模具编号、位置、产品尺寸、片料尺寸和固定二维码；正式模具扫码后登录 ERP 查看实时订单、收料和材料位置。样例二维码会打开无业务数据的测试地址。</div>';$("prototypeLink").classList.add("hidden");$("printButton").textContent="打印匿名测试标签"}else{sourceRows=batchMode?(data.items||[]):[data];if(!sourceRows.length)throw new Error("没有可打印的模具标签");$("notice").innerHTML=batchMode?'<div class="notice">请核对模具、顺序和份数。每件模具的多份 40×30 mm 标签连续排列。</div>':"";$("prototypeLink").classList.remove("hidden");$("printButton").textContent=batchMode?"打印整批标签":"打印当前标签"}labelDataReady=true;await refreshRenderedLabels();if(batchMode){$("batchSort").disabled=false;$("copyCount").disabled=false}}
    const moldLabelPrintPage=TmPrintRecovery.createPrintPage({id:prototypeMode?"1":batchMode?(batchSelectionValid?batchIds[0]:null):params.get("mold_id"),url:id=>prototypeMode?"/api/auth/me":batchMode?`/api/warehouse/molds/labels?mold_ids=${encodeURIComponent(batchIds.join(","))}`:`/api/warehouse/molds/${id}/label`,printButton:$("printButton"),retryButton:$("retryButton"),loadState:$("loadState"),errorBox:$("errorBox"),content:$("previewContent"),loadingMessage:batchMode?"正在读取整批模具标签，请稍候…":"正在读取模具标签，请稍候…",invalidMessage:batchMode?"批量标签选择无效，请返回模具列表重新选择。":"模具 ID 无效，请从模具列表重新打开，或进入匿名样式预览。",authMessage:"登录已失效，正在返回 ERP 登录。",failureMessage:batchMode?"整批模具标签读取失败":"模具标签读取失败",render:renderMoldLabel,print:()=>window.print(),onUnauthorized:loginNext});
    async function loadMoldLabel(){labelDataReady=false;$("batchSort").disabled=true;$("copyCount").disabled=true;return moldLabelPrintPage.load()}
    function refreshFromControls(){void refreshRenderedLabels().catch(()=>{})}$("batchControls").classList.toggle("hidden",!batchMode);$("batchSort").onchange=refreshFromControls;$("copyCount").oninput=refreshFromControls;loadMoldLabel();
  </script>
</body>
</html>
