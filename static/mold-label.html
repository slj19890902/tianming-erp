<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>模具标签 - 天明ERP</title>
  <style id="pageStyle">@page{size:90mm 60mm;margin:0}</style>
  <style>
    :root{--paper-width:90mm;--paper-height:60mm;--blue:#2563eb;--line:#cbd5e1;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111827;font:14px/1.35 Arial,"Microsoft YaHei",sans-serif}
    .toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:end;justify-content:center;gap:10px;flex-wrap:wrap}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:3px}.field select,.field input{height:36px;border:1px solid #94a3b8;border-radius:7px;background:#fff;padding:0 9px;font-size:14px}.field input{width:86px}.actions{display:flex;gap:8px}.button{height:36px;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:0 16px;font-weight:800;cursor:pointer}.button.secondary{background:#475569}.button:disabled{cursor:not-allowed;opacity:.45}.button.link{display:inline-flex;align-items:center;text-decoration:none;background:#e2e8f0;color:#1e293b}.custom-fields{display:flex;gap:8px}.hidden,[hidden]{display:none!important}
    .notice,.error,.load-state{max-width:860px;margin:12px auto;padding:10px 12px;border-radius:8px}.notice,.load-state{background:#eff6ff;color:#1e3a8a}.error{background:#fee2e2;color:#991b1b}.preview-summary{max-width:860px;margin:12px auto 8px;color:#475569;text-align:center}
    .labels{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 12px 24px}.label{width:var(--paper-width);height:var(--paper-height);background:#fff;border:.35mm solid #111;padding:3mm;display:grid;grid-template-columns:minmax(0,1fr) 24mm;gap:2.5mm;overflow:hidden;page-break-after:always;break-after:page}.label:last-child{page-break-after:auto;break-after:auto}.label-main{min-width:0;display:flex;flex-direction:column}.topline{display:flex;align-items:center;gap:2mm;min-width:0}.mold-code{font-size:18pt;line-height:1;font-weight:900;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{flex:0 0 auto;border:1px solid #991b1b;color:#991b1b;border-radius:3px;padding:.4mm 1.2mm;font-size:8pt;font-weight:900}.mold-name{font-size:10pt;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1.1mm}.location{display:flex;align-items:baseline;gap:2mm;border-top:.25mm solid #111;border-bottom:.25mm solid #111;padding:1mm 0;margin:1.2mm 0}.location-label{font-size:7.5pt;color:#334155}.location-code{font-size:11pt;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.products{min-height:0;overflow:hidden}.product{display:grid;grid-template-columns:minmax(19mm,.8fr) minmax(0,1.4fr) minmax(19mm,.9fr);gap:1.2mm;border-bottom:.2mm solid #94a3b8;padding:1mm 0;align-items:center;font-size:8pt}.product:last-child{border-bottom:0}.product-code{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.board-size{font-weight:800;text-align:right;white-space:nowrap}.missing{color:#b45309}.overflow-note{font-size:7.5pt;font-weight:800;margin-top:1mm;color:#334155}.qr{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;min-width:0}.qr img{width:22mm;height:22mm;image-rendering:auto}.qr-title{font-size:8pt;font-weight:900;margin-top:1mm}.qr-note{font-size:6.8pt;color:#475569;margin-top:.5mm}.prototype-mark{font-size:6.5pt;color:#b45309;font-weight:700;margin-top:1mm}.orientation-portrait .label{grid-template-columns:minmax(0,1fr)}.orientation-portrait .qr{position:absolute;right:3mm;bottom:3mm}.orientation-portrait .label{position:relative;padding-bottom:28mm}.orientation-portrait .qr img{width:21mm;height:21mm}.orientation-portrait .product{grid-template-columns:minmax(18mm,.8fr) minmax(0,1.2fr)}.orientation-portrait .board-size{grid-column:1/-1;text-align:left}.orientation-portrait .mold-code{font-size:16pt}
    @media print{body{background:#fff}.toolbar,.notice,.error,.load-state,.preview-summary{display:none!important}.labels{display:block;padding:0}.label{margin:0;border:.25mm solid #000}}
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="field"><label for="paperPreset">标签纸</label><select id="paperPreset"><option value="90x60">90 × 60 mm</option><option value="custom">自定义尺寸</option></select></div>
    <div class="field"><label for="orientation">方向</label><select id="orientation"><option value="landscape">横向</option><option value="portrait">竖向</option></select></div>
    <div id="customFields" class="custom-fields hidden">
      <div class="field"><label for="customWidth">宽 mm</label><input id="customWidth" type="number" min="40" max="300" step="1" value="100"></div>
      <div class="field"><label for="customHeight">高 mm</label><input id="customHeight" type="number" min="40" max="300" step="1" value="70"></div>
    </div>
    <div class="actions"><button id="printButton" disabled class="button" type="button">打印当前标签</button><button id="retryButton" class="button secondary hidden" type="button" hidden>重新读取</button><a class="button link" href="/warehouse.html">返回仓库</a><a id="prototypeLink" class="button secondary link" href="/mold-label.html?prototype=1">匿名样式预览</a></div>
  </div>
  <div id="loadState" class="load-state">正在读取模具标签，请稍候…</div>
  <div id="errorBox" class="error" role="alert" hidden></div>
  <section id="previewContent" hidden><div id="notice"></div><div id="summary" class="preview-summary"></div><main id="labels" class="labels"></main></section>
  <script src="/static/assets/print-recovery.js"></script>
  <script>
    const $=id=>document.getElementById(id);const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    const params=new URLSearchParams(location.search);const prototypeMode=params.get("prototype")==="1";let labelRows=[];
    function loginNext(){location.href=`/?next=${encodeURIComponent(location.pathname+location.search)}`}
    function prototypeQr(){return `data:image/svg+xml;charset=utf-8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="white"/><rect x="4" y="4" width="92" height="92" fill="none" stroke="black" stroke-width="4"/><text x="50" y="48" text-anchor="middle" font-size="17" font-family="sans-serif" font-weight="bold">匿名</text><text x="50" y="68" text-anchor="middle" font-size="13" font-family="sans-serif">样例</text></svg>')}`}
    function demoProduct(code,name,reportSpecification){return {product_code:code,product_name:name,report_specification:reportSpecification}}
    function prototypeRows(){const qr=prototypeQr();return [
      {mold_code:"DEMO-001",mold_name:"单款模具",rack_location:"3F-M-R01-L1-P01",is_active:true,product_count:1,products:[demoProduct("P-10001","三层外箱","780 × 560")],qr_data_url:qr},
      {mold_code:"DEMO-002",mold_name:"一模多款",rack_location:"3F-M-R01-L1-P02",is_active:true,product_count:5,products:[demoProduct("P-20001","外箱甲","820 × 610"),demoProduct("P-20002","外箱乙","820 × 610"),demoProduct("P-20003","外箱丙","820 × 610"),demoProduct("P-20004","外箱丁","820 × 610"),demoProduct("P-20005","外箱戊","820 × 610")],qr_data_url:qr},
      {mold_code:"DEMO-003",mold_name:"多片料尺寸",rack_location:"3F-M-R02-L2-P03",is_active:true,product_count:2,products:[demoProduct("P-30001","内盒甲","575 × 550"),demoProduct("P-30002","内盒乙","600 × 550")],qr_data_url:qr},
      {mold_code:"DEMO-004",mold_name:"资料待完善",rack_location:"待归位",is_active:true,product_count:1,products:[demoProduct("P-40001","未登记片料","")],qr_data_url:qr},
      {mold_code:"DEMO-005",mold_name:"已停用模具",rack_location:"3F-M-R03-L1-P05",is_active:false,product_count:1,products:[demoProduct("P-50001","停用样例","900 × 600")],qr_data_url:qr}
    ]}
    function paperDimensions(){let width=90,height=60;if($("paperPreset").value==="custom"){width=Math.max(40,Math.min(300,Number($("customWidth").value)||100));height=Math.max(40,Math.min(300,Number($("customHeight").value)||70))}if($("orientation").value==="portrait"&&width>height)[width,height]=[height,width];if($("orientation").value==="landscape"&&width<height)[width,height]=[height,width];return {width,height}}
    function applyPaper(){const {width,height}=paperDimensions();document.documentElement.style.setProperty("--paper-width",`${width}mm`);document.documentElement.style.setProperty("--paper-height",`${height}mm`);document.body.classList.toggle("orientation-portrait",$("orientation").value==="portrait");$("pageStyle").textContent=`@page{size:${width}mm ${height}mm;margin:0}`;$("summary").textContent=`当前预览：${width} × ${height} mm · ${{landscape:"横向",portrait:"竖向"}[$("orientation").value]} · ${labelRows.length} 张标签`;renderLabels()}
    function productHtml(row){const board=(row.report_specification||"").trim();return `<div class="product"><span class="product-code">${h(row.product_code||"待完善")}</span><span class="product-name">${h(row.product_name||"未登记产品")}</span><span class="board-size ${board?"":"missing"}">${board?h(`${board} mm`):"片料待完善"}</span></div>`}
    function labelHtml(row){const maxProducts=$("orientation").value==="portrait"?2:3,shown=(row.products||[]).slice(0,maxProducts),total=Number(row.product_count??shown.length),overflow=total>shown.length?`<div class="overflow-note">共 ${total} 款，扫码查看全部</div>`:"";return `<article class="label"><div class="label-main"><div class="topline"><div class="mold-code">${h(row.mold_code||"未编号")}</div>${row.is_active===false?'<span class="status">已停用</span>':""}</div><div class="mold-name">${h(row.mold_name||"未登记模具名称")}</div><div class="location"><span class="location-label">位置</span><span class="location-code">${h(row.rack_location||"待归位")}</span></div><div class="products">${shown.map(productHtml).join("")||'<div class="product"><span class="missing">未绑定存货</span><span></span><span class="missing">片料待完善</span></div>'}${overflow}</div></div><div class="qr"><img src="${h(row.qr_data_url||prototypeQr())}" alt="模具查询二维码"><div class="qr-title">扫码查模具</div><div class="qr-note">登录后按权限查看</div>${prototypeMode?'<div class="prototype-mark">匿名占位码，不可扫码</div>':""}</div></article>`}
    function renderLabels(){$("labels").innerHTML=labelRows.map(labelHtml).join("")}
    function renderMoldLabel(data){if(prototypeMode){labelRows=prototypeRows();$("notice").innerHTML='<div class="notice">这是匿名版式原型：包含单款、多款、不同片料尺寸、资料缺失和停用模具。占位码不可扫码；正式标签二维码仍进入登录后的模具查询。</div>';$("prototypeLink").classList.add("hidden");$("printButton").textContent="打印匿名测试标签"}else{labelRows=[data];$("notice").innerHTML="";$("prototypeLink").classList.remove("hidden");$("printButton").textContent="打印当前标签"}applyPaper()}
    const moldLabelPrintPage=TmPrintRecovery.createPrintPage({id:prototypeMode?"1":params.get("mold_id"),url:id=>prototypeMode?"/api/auth/me":`/api/warehouse/molds/${id}/label`,printButton:$("printButton"),retryButton:$("retryButton"),loadState:$("loadState"),errorBox:$("errorBox"),content:$("previewContent"),loadingMessage:"正在读取模具标签，请稍候…",invalidMessage:"模具 ID 无效，请从模具列表重新打开，或进入匿名样式预览。",authMessage:"登录已失效，正在返回 ERP 登录。",failureMessage:"模具标签读取失败",render:renderMoldLabel,print:()=>window.print(),onUnauthorized:loginNext});
    async function loadMoldLabel(){return moldLabelPrintPage.load()}
    $("paperPreset").onchange=()=>{$("customFields").classList.toggle("hidden",$("paperPreset").value!=="custom");applyPaper()};$("orientation").onchange=applyPaper;$("customWidth").oninput=applyPaper;$("customHeight").oninput=applyPaper;loadMoldLabel();
  </script>
</body>
</html>
