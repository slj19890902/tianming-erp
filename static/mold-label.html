<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>模具标签 - 天明ERP</title>
  <style id="pageStyle">@page{size:40mm 30mm;margin:0}</style>
  <style>
    :root{--paper-width:40mm;--paper-height:30mm;--blue:#2563eb;--line:#cbd5e1;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111827;font:14px/1.35 Arial,"Microsoft YaHei",sans-serif}
    .toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:end;justify-content:center;gap:10px;flex-wrap:wrap}.paper-fixed{height:36px;display:flex;align-items:center;border:1px solid #94a3b8;border-radius:7px;background:#f8fafc;padding:0 12px;font-weight:900}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:3px}.field select,.field input{height:36px;border:1px solid #94a3b8;border-radius:7px;background:#fff;padding:0 9px;font-size:14px}.field input{width:86px}.actions{display:flex;gap:8px}.button{height:36px;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:0 16px;font-weight:800;cursor:pointer}.button.secondary{background:#475569}.button:disabled{cursor:not-allowed;opacity:.45}.button.link{display:inline-flex;align-items:center;text-decoration:none;background:#e2e8f0;color:#1e293b}.batch-fields{display:flex;gap:8px}.hidden,[hidden]{display:none!important}
    .notice,.error,.load-state{max-width:860px;margin:12px auto;padding:10px 12px;border-radius:8px}.notice,.load-state{background:#eff6ff;color:#1e3a8a}.error{background:#fee2e2;color:#991b1b}.preview-summary{max-width:860px;margin:12px auto 8px;color:#475569;text-align:center}
    .labels{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 12px 24px}.label{width:var(--paper-width);height:var(--paper-height);background:#fff;border:.25mm solid #111;padding:1mm 1.25mm;display:flex;flex-direction:column;gap:.5mm;overflow:hidden;page-break-after:always;break-after:page}.label:last-child{page-break-after:auto;break-after:auto}.topline{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:1mm;border-bottom:.22mm solid #111;padding-bottom:.45mm}.mold-code{min-width:0;font-size:3.8mm;line-height:1;font-weight:900;letter-spacing:.05mm;white-space:nowrap}.mold-code.long{font-size:3.25mm}.mold-code.xlong{font-size:2.65mm;white-space:normal;overflow-wrap:anywhere}.topline.with-status .mold-code{white-space:normal;overflow-wrap:anywhere}.topline.with-status .mold-code.long{font-size:2.45mm}.topline.with-status .mold-code.xlong{font-size:2.1mm}.status{flex:0 0 auto;border:.22mm solid #111;border-radius:.5mm;padding:.15mm .65mm;font-size:1.9mm;line-height:1.25;font-weight:900}.identity{display:grid;grid-template-columns:minmax(0,12mm) minmax(0,1fr);gap:1mm;align-items:baseline;font-size:2.45mm;line-height:1.12}.field-pair{min-width:0;display:flex;gap:.6mm;align-items:baseline}.field-key{flex:0 0 auto;color:#374151;font-size:1.8mm;font-weight:700}.field-value{min-width:0;font-weight:900;overflow-wrap:anywhere}.customer-value.long{font-size:2mm}.inventory-code.long{font-size:2mm}.location{display:flex;align-items:baseline;gap:.7mm;border-top:.18mm solid #94a3b8;border-bottom:.18mm solid #94a3b8;padding:.45mm 0;font-size:2.55mm;line-height:1.05}.location .field-value{font-size:2.7mm}.location .field-value.long{font-size:2.2mm}.dimensions{min-height:0;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:.8mm;align-items:stretch}.dimension-card{min-width:0;display:flex;flex-direction:column;justify-content:center}.dimension-key{font-size:1.8mm;line-height:1;color:#374151;font-weight:700}.dimension-value{font-size:3.2mm;line-height:1.05;font-weight:900;white-space:nowrap}.dimension-value.long{font-size:2.5mm}.missing{color:#5f6368}.overflow-note{font-size:1.6mm;font-weight:900;white-space:nowrap}.unbound{grid-column:1/-1;align-self:center;font-size:2.15mm;font-weight:800}.prototype-mark{position:absolute;right:1.25mm;bottom:.7mm;font-size:1.4mm;color:#5f6368}.label{position:relative}
    @media print{body,html{width:40mm;height:auto;margin:0;background:#fff;overflow:visible}body>*:not(#previewContent){display:none!important}#previewContent,#labels{display:block!important;margin:0!important;padding:0!important}#previewContent,#labels{width:40mm!important}.notice,.error,.load-state,.preview-summary{display:none!important}.label{display:flex!important;width:40mm!important;height:30mm!important;margin:0!important;padding:1mm 1.25mm!important;border:.25mm solid #000!important}.dimensions{display:grid!important}.dimension-card{display:flex!important}}
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="field"><label>标签纸</label><div class="paper-fixed">40 × 30 mm（固定）</div></div>
    <div id="batchControls" class="batch-fields hidden">
      <div class="field"><label for="batchSort">打印顺序</label><select id="batchSort"><option value="selected">选择顺序</option><option value="code">模具编号</option><option value="location">货架位置</option></select></div>
      <div class="field"><label for="copyCount">每件份数</label><input id="copyCount" type="number" min="1" max="10" step="1" value="1"></div>
    </div>
    <div class="actions"><button id="printButton" disabled class="button" type="button">打印当前标签</button><button id="retryButton" class="button secondary hidden" type="button" hidden>重新读取</button><a class="button link" href="/warehouse.html">返回仓库</a><a id="prototypeLink" class="button secondary link" href="/mold-label.html?prototype=1">匿名样式预览</a></div>
  </div>
  <div id="loadState" class="load-state">正在读取模具标签，请稍候…</div>
  <div id="errorBox" class="error" role="alert" hidden></div>
  <section id="previewContent" hidden><div id="notice"></div><div id="summary" class="preview-summary"></div><main id="labels" class="labels"></main></section>
  <script src="/static/assets/print-recovery.js"></script>
  <script>
    const $=id=>document.getElementById(id);const h=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    const params=new URLSearchParams(location.search);const prototypeMode=params.get("prototype")==="1";const rawBatchIds=params.get("mold_ids")||"",batchParts=rawBatchIds.split(",").map(value=>value.trim()).filter(Boolean),batchIds=batchParts.filter((value,index,rows)=>/^\d+$/.test(value)&&Number(value)>0&&rows.indexOf(value)===index),batchMode=!prototypeMode&&rawBatchIds!=="",batchSelectionValid=batchParts.length>0&&batchIds.length===batchParts.length&&batchIds.length<=100;let sourceRows=[],labelRows=[];
    function loginNext(){location.href=`/?next=${encodeURIComponent(location.pathname+location.search)}`}
    function demoProduct(customerShortName,customerCode,code,name,specification,reportSpecification){return {customer_short_name:customerShortName,customer_code:customerCode,product_code:code,product_name:name,specification,report_specification:reportSpecification}}
    function prototypeRows(){return [
      {mold_code:"JSD-61494052",mold_name:"聚晟达61494052",rack_location:"1F-M-R01-L2-G01",location_guide:{kind:"storage_grid",floor:"1F",rack:1,level:2,grid:1},is_active:true,product_count:1,products:[demoProduct("聚晟达","JSD","61494052R1F","模切内盒","430 × 68","575 × 550")]},
      {mold_code:"SME-CPN087075",mold_name:"思迈尔CPN087075",rack_location:"1F-M-R02-L2-G03",location_guide:{kind:"storage_grid",floor:"1F",rack:2,level:2,grid:3},is_active:true,product_count:3,products:[demoProduct("思迈尔","SME","CPN087075","天地盖内盒","420 × 300 × 55","962 × 1037"),demoProduct("思迈尔","SME","CPN087076","配套内盒B","350 × 260 × 45","600 × 550"),demoProduct("思迈尔","SME","CPN087077","配套内盒C","360 × 270 × 45","610 × 550")]},
      {mold_code:"YY-Z.001.000093",mold_name:"资料待完善",rack_location:"待归位",location_guide:{kind:"manual"},is_active:true,product_count:1,products:[demoProduct("仪元","YY","Z.001.000093","仪元模切件","","")]},
      {mold_code:"ARCHIVE-DEMO-005",mold_name:"已停用模具",rack_location:"MOLD-ARCHIVE",location_guide:{kind:"archive_area"},is_active:false,product_count:0,products:[]}
    ]}
    function textClass(value,medium,long){const length=String(value||"").length;return length>long?"xlong":length>medium?"long":""}
    function shortLocation(row){const guide=row.location_guide||{},rack=Number(guide.rack),level=Number(guide.level),grid=Number(guide.grid),line=Number(guide.row);if(Number.isInteger(rack)&&rack>0){const parts=[guide.floor||"",`R${String(rack).padStart(2,"0")}`];if(Number.isInteger(level)&&level>0)parts.push(`${level}层`);if(Number.isInteger(grid)&&grid>0)parts.push(`${grid}排`);else if(Number.isInteger(line)&&line>0)parts.push(`${line}排`);if(guide.kind==="vertical"||guide.kind==="vertical_legacy")parts.push("竖放");return parts.filter(Boolean).join(" · ")}if(guide.kind==="archive_area")return "模具归档区";return row.rack_location||"待归位"}
    function dimensionCard(label,value,missingText){const text=String(value||"").trim();return `<div class="dimension-card ${text?"":"missing"}"><span class="dimension-key">${h(label)}</span><strong class="dimension-value ${text.length>14?"long":""}">${h(text||missingText)}</strong></div>`}
    function labelHtml(row){const products=row.products||[],product=products[0]||null,total=Number(row.product_count??products.length),moldCode=row.mold_code||"未编号",customer=product?.customer_short_name||product?.customer_name||product?.customer_code||"待完善",inventory=product?.product_code||"未绑定",locationText=shortLocation(row),productSize=(product?.specification||"").trim(),board=(product?.report_specification||"").trim(),extra=total>1?`另 ${total-1} 款`:"",stopped=row.is_active===false;return `<article class="label"><div class="topline${stopped?" with-status":""}"><div class="mold-code ${textClass(moldCode,12,16)}">${h(moldCode)}</div>${stopped?'<span class="status">停用</span>':""}</div><div class="identity"><div class="field-pair"><span class="field-key">客户</span><span class="field-value customer-value ${String(customer).length>8?"long":""}">${h(customer)}</span></div><div class="field-pair"><span class="field-key">存货</span><span class="field-value inventory-code ${String(inventory).length>16?"long":""}">${h(inventory)}</span></div></div><div class="location"><span class="field-key">位置</span><span class="field-value ${locationText.length>20?"long":""}">${h(locationText)}</span></div><div class="dimensions">${product?`${dimensionCard("产品尺寸",productSize,"产品尺寸待完善")}${dimensionCard("片料尺寸",board,"片料待完善")}${extra?`<span class="overflow-note">${h(extra)}</span>`:""}`:'<span class="unbound missing">未绑定常用箱 / 存货编码</span>'}</div>${prototypeMode?'<span class="prototype-mark">样例</span>':""}</article>`}
    function renderLabels(){$("labels").innerHTML=labelRows.map(labelHtml).join("")}
    function rebuildLabelRows(){let rows=[...sourceRows];if(batchMode&&$("batchSort").value==="code")rows.sort((a,b)=>String(a.mold_code||"").localeCompare(String(b.mold_code||""),"zh-CN",{numeric:true}));if(batchMode&&$("batchSort").value==="location")rows.sort((a,b)=>String(a.rack_location||"").localeCompare(String(b.rack_location||""),"zh-CN",{numeric:true})||String(a.mold_code||"").localeCompare(String(b.mold_code||""),"zh-CN",{numeric:true}));const copies=batchMode?Math.max(1,Math.min(10,Number($("copyCount").value)||1)):1;labelRows=rows.flatMap(row=>Array.from({length:copies},()=>row));$("summary").textContent=`当前预览：40 × 30 mm · ${sourceRows.length} 件模具 · ${labelRows.length} 张标签`;renderLabels()}
    function renderMoldLabel(data){if(prototypeMode){sourceRows=prototypeRows();$("notice").innerHTML='<div class="notice">40×30 mm 匿名样例：实体标签只保留模具号、客户、存货、位置、产品尺寸和片料尺寸；多款数量如实提示，完整资料仍在 ERP 模具档案查询。</div>';$("prototypeLink").classList.add("hidden");$("printButton").textContent="打印匿名测试标签"}else{sourceRows=batchMode?(data.items||[]):[data];if(!sourceRows.length)throw new Error("没有可打印的模具标签");$("notice").innerHTML=batchMode?'<div class="notice">请核对模具、顺序和份数。每件模具的多份 40×30 mm 标签连续排列。</div>':"";$("prototypeLink").classList.remove("hidden");$("printButton").textContent=batchMode?"打印整批标签":"打印当前标签"}rebuildLabelRows()}
    const moldLabelPrintPage=TmPrintRecovery.createPrintPage({id:prototypeMode?"1":batchMode?(batchSelectionValid?batchIds[0]:null):params.get("mold_id"),url:id=>prototypeMode?"/api/auth/me":batchMode?`/api/warehouse/molds/labels?mold_ids=${encodeURIComponent(batchIds.join(","))}`:`/api/warehouse/molds/${id}/label`,printButton:$("printButton"),retryButton:$("retryButton"),loadState:$("loadState"),errorBox:$("errorBox"),content:$("previewContent"),loadingMessage:batchMode?"正在读取整批模具标签，请稍候…":"正在读取模具标签，请稍候…",invalidMessage:batchMode?"批量标签选择无效，请返回模具列表重新选择。":"模具 ID 无效，请从模具列表重新打开，或进入匿名样式预览。",authMessage:"登录已失效，正在返回 ERP 登录。",failureMessage:batchMode?"整批模具标签读取失败":"模具标签读取失败",render:renderMoldLabel,print:()=>window.print(),onUnauthorized:loginNext});
    async function loadMoldLabel(){return moldLabelPrintPage.load()}
    $("batchControls").classList.toggle("hidden",!batchMode);$("batchSort").onchange=rebuildLabelRows;$("copyCount").oninput=rebuildLabelRows;loadMoldLabel();
  </script>
</body>
</html>
