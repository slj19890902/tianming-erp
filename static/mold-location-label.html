<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模具架与格位标签</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font:16px Arial,"Microsoft YaHei",sans-serif}.toolbar{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:9px;font:inherit}#labels{display:flex;gap:12px;flex-wrap:wrap;padding:16px}.label{width:80mm;height:40mm;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:3mm;page-break-after:always;break-inside:avoid;border:1px solid #cbd5e1}.label b{display:block;font-size:14mm;line-height:1.1}.label[data-kind="rack"] b{font-size:7mm}.label small{display:block;font-size:3mm;margin-bottom:2mm}.label>div{flex:1;min-width:0;margin-right:2mm}.label:last-child{page-break-after:auto;break-after:auto}.label img{flex:none;width:29mm;height:29mm;image-rendering:pixelated}#message{padding:10px}@page{size:80mm 40mm;margin:0}@media print{body{background:#fff}.toolbar,#message{display:none!important}#labels{display:block;padding:0}.label{border:0;margin:0}}
</style></head><body><div class="toolbar"><b>模具架与格位标签</b><select id="kind" aria-label="打印内容"><option value="all">整架＋全部格位</option><option value="rack">整架标识</option><option value="cell">全部格位</option></select><button id="print" disabled>打印</button><a id="back" href="/warehouse.html">返回地图</a></div><div id="message">正在读取…</div><div id="labels"></div><script>
const $=id=>document.getElementById(id),h=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),params=new URLSearchParams(location.search);let labels=[],generation=0;$("back").href="/warehouse.html?floor="+encodeURIComponent(params.get("floor_code")||"1F")+(params.get("rack_id")?"&mold_rack_id="+encodeURIComponent(params.get("rack_id")):"");
async function render(){const current=++generation;$("print").disabled=true;const kind=$("kind").value,rows=labels.filter(row=>kind==='all'||row.kind===kind);$("labels").innerHTML=rows.map(row=>{const qr=row.qr_data_url||row.qr_code;const src=qr?.startsWith('data:')?qr:'data:image/png;base64,'+qr;return `<article class="label" data-kind="${h(row.kind)}"><div><small>${row.kind==='cell'?'模具位':'模具货架'}</small><b>${h(row.alias||(row.kind==='cell'?String(row.label||'').replace(/^模具位\s*/,''):row.label))}</b></div><img src="${h(src)}" alt="扫码打开模具${row.kind==='cell'?'格位':'货架'}"></article>`}).join('');try{await Promise.all([...document.querySelectorAll('.label img')].map(img=>img.decode()));for(const text of document.querySelectorAll(".label b")){let size=Number.parseFloat(getComputedStyle(text).fontSize);while(size>12&&text.scrollWidth>text.clientWidth+1){size-=1;text.style.fontSize=size+"px"}if(text.scrollWidth>text.clientWidth+1||text.scrollHeight>text.clientHeight+1)throw new Error("标签文字超出纸张，请核对格号")}if(current===generation){$("print").disabled=!rows.length;$("message").textContent='共 '+rows.length+' 张标签'}}catch{$("message").textContent='二维码或正文未完整载入，请刷新后重试'}}
async function load(){try{const query=new URLSearchParams();['floor_code','rack_id','feature_code'].forEach(key=>{if(params.get(key))query.set(key,params.get(key))});const response=await fetch('/api/warehouse/molds/location-labels?'+query,{credentials:'same-origin'}),data=await response.json();if(response.status===401){location.assign('/?next='+encodeURIComponent(location.pathname+location.search));return}if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:data.detail?.message||'读取失败');labels=data.labels||[];await render()}catch(error){$("message").textContent=error.message}}$("kind").onchange=render;$("print").onclick=()=>window.print();load();
</script></body></html>
