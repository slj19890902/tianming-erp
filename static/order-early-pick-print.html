<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>提前备货单</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#17212b;background:#edf0f3;font-family:"Microsoft YaHei",sans-serif}
    nav{display:flex;justify-content:center;gap:12px;padding:16px}button{padding:10px 18px;border:0;border-radius:6px;background:#176348;color:white;font-size:15px;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}.secondary{background:#526172}
    #state{max-width:800px;margin:18px auto;padding:14px;background:#fff4d9;white-space:pre-wrap}
    main{max-width:1000px;margin:0 auto 30px;padding:28px;background:white}h1{text-align:center;font-size:25px;margin:0 0 18px}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13px;margin-bottom:14px;overflow-wrap:anywhere}
    table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}
    th,td{border:1px solid #64748b;padding:8px 5px;vertical-align:top;overflow-wrap:anywhere}
    th{background:#f1f5f9;text-align:left}td.num{text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
    .code{font-size:16px}.sub{font-size:11px;line-height:1.5;color:#526172;margin-top:4px}.warning{color:#8c3b10}
    .write{display:block;min-height:22px;border-bottom:1px solid #77818b}.notice{font-size:12px;line-height:1.7;margin:14px 0}.sign{display:flex;gap:60px;margin:24px 0 8px;font-size:13px}
    [hidden]{display:none!important}
    @page{size:A4 portrait;margin:12mm}
    @media print{body{background:white}nav{display:none}main{max-width:none;margin:0;padding:0}thead{display:table-header-group}tr{break-inside:avoid}th,td{padding:6px 4px}#state{margin:0}h1{font-size:23px}.sign{break-inside:avoid}}
  </style>
</head>
<body>
  <nav><button id="print" disabled>刷新数量并打印</button><button id="refresh" class="secondary">刷新预览</button><button class="secondary" onclick="window.close()">关闭</button></nav>
  <div id="state" role="status">正在读取订单及当前库存…</div>
  <main id="sheet" hidden></main>
  <script src="/static/assets/order-early-pick-print.js"></script>
</body>
</html>
