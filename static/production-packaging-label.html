<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>生产包装标签</title>
  <style>
    :root {
      color-scheme:light;
      font-family:"Microsoft YaHei","SimHei","SimSun",sans-serif;
      color:#000;
      --label-width:65mm;
      --label-height:45mm;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { background:#f3f4f6; }
    .toolbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 16px; background:#fff; border-bottom:1px solid #cbd5e1; }
    button { border:1px solid #64748b; border-radius:5px; background:#fff; color:#111827; padding:8px 15px; cursor:pointer; font-size:14px; }
    button.primary { border-width:2px; border-color:#111827; font-weight:700; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .toolbar-note { margin-left:auto; color:#475569; font-size:12px; }
    .message { max-width:680px; margin:18px auto; padding:12px 16px; border:1px solid #94a3b8; border-radius:6px; color:#334155; background:#fff; text-align:center; }
    .message.error { color:#7f1d1d; border-color:#991b1b; }
    .label-list { display:grid; gap:14px; justify-items:center; padding:18px; }
    .label-card {
      width:var(--label-width);
      height:var(--label-height);
      display:grid;
      grid-template-rows:6.4mm 9.8mm 6.3mm 6.3mm 1fr;
      overflow:hidden;
      border:.35mm solid #000;
      border-radius:1.4mm;
      background:#fff;
      box-shadow:0 2px 10px rgb(15 23 42 / 14%);
      break-inside:avoid;
      page-break-inside:avoid;
    }
    .customer-row { display:grid; grid-template-columns:11mm 1fr; align-items:center; padding:0 1.5mm; border-bottom:.35mm solid #000; }
    .field-name { color:#374151; font-size:2.45mm; font-weight:700; line-height:1; white-space:nowrap; }
    .customer-name { min-width:0; overflow:hidden; font-size:4.35mm; font-weight:900; line-height:1.05; text-align:center; white-space:nowrap; text-overflow:ellipsis; }
    .code-row { display:flex; flex-direction:column; justify-content:center; padding:.7mm 1.5mm .55mm; border-bottom:.25mm solid #000; text-align:center; }
    .code-row .field-name { align-self:flex-start; margin-bottom:.4mm; }
    .product-code { min-width:0; overflow:hidden; font-family:"Arial","Microsoft YaHei",sans-serif; font-size:5.2mm; font-weight:900; letter-spacing:.08mm; line-height:1; white-space:nowrap; text-overflow:ellipsis; }
    .detail-row { display:grid; grid-template-columns:11mm 1fr; align-items:center; padding:0 1.5mm; border-bottom:.2mm solid #9ca3af; }
    .detail-value { min-width:0; overflow:hidden; font-size:3.3mm; font-weight:700; line-height:1.1; text-align:right; white-space:nowrap; text-overflow:ellipsis; }
    .quantity-row { display:flex; align-items:baseline; justify-content:center; gap:1.2mm; padding:.75mm 1.5mm .55mm; }
    .quantity-row .field-name { color:#000; font-size:3mm; }
    .quantity-number { font-family:"Arial","Microsoft YaHei",sans-serif; font-size:7.2mm; font-weight:900; line-height:1; }
    .quantity-unit { font-size:3.6mm; font-weight:900; }
    [hidden] { display:none !important; }
    @page { size:65mm 45mm; margin:0; }
    @media (max-width:520px) {
      .toolbar-note { display:none; }
    }
    @media print {
      html,body { width:var(--label-width); min-height:var(--label-height); background:#fff; }
      .toolbar,.message { display:none !important; }
      .label-list { display:block; padding:0; }
      .label-card { width:var(--label-width); height:var(--label-height); margin:0; box-shadow:none; break-after:page; page-break-after:always; }
      .label-card:last-child { break-after:auto; page-break-after:auto; }
    }
  </style>
</head>
<body>
  <nav class="toolbar">
    <button id="retryButton" type="button">重新加载</button>
    <button id="printButton" class="primary" type="button" disabled>打印包装标签</button>
    <button id="closeButton" type="button">关闭</button>
    <span class="toolbar-note">65 × 45 mm｜100% 实际大小｜黑白打印</span>
  </nav>
  <div id="message" class="message">正在读取冻结的生产包装标签计划……</div>
  <main id="labelList" class="label-list" aria-live="polite"></main>
  <script>
    (() => {
      "use strict";
      const message = document.getElementById("message");
      const labelList = document.getElementById("labelList");
      const retryButton = document.getElementById("retryButton");
      const printButton = document.getElementById("printButton");
      const closeButton = document.getElementById("closeButton");
      const params = new URLSearchParams(window.location.search);
      const supplierOrderId = Number(params.get("id"));
      let loadGeneration = 0;
      let activeController = null;
      let loadedPackage = null;

      const escapeHtml = (value) => String(value ?? "-")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
      const positiveInteger = (value) => Number.isInteger(Number(value)) && Number(value) > 0;

      function errorMessage(status, payload) {
        const detail = payload && typeof payload === "object" ? payload.detail : null;
        if (typeof detail === "string" && detail.trim()) return detail.trim();
        if (detail && typeof detail === "object" && typeof detail.message === "string") {
          const reasons = Array.isArray(detail.reasons) && detail.reasons.length
            ? `：${detail.reasons.map((item) => String(item)).join("；")}`
            : "";
          return `${detail.message}${detail.code ? `（${detail.code}）` : ""}${reasons}`;
        }
        if (Array.isArray(detail) && detail.length) {
          return detail.map((item) => item && item.msg ? item.msg : String(item)).join("；");
        }
        if (status === 401) return "登录已失效，请回到 ERP 重新登录后再试";
        if (status === 403) return "没有查看该报料单包装标签的权限";
        if (status === 404) return "报料单不存在";
        return `加载失败（HTTP ${status || "网络连接失败"}）`;
      }

      function validatePackage(packageData) {
        if (!packageData || typeof packageData !== "object" || !Array.isArray(packageData.labels)) {
          throw new Error("服务器返回的包装标签数据不完整，请重试");
        }
        if (packageData.review_required || packageData.printable === false) {
          throw new Error("生产计划已变化或标签快照不完整，请先核对并重新报料");
        }
        if (!packageData.labels.length || Number(packageData.label_count) !== packageData.labels.length) {
          throw new Error("该报料单没有可打印的生产包装标签");
        }
        packageData.labels.forEach((label) => {
          if (![label.quantity, label.total_quantity, label.units_per_label, label.label_number, label.label_count].every(positiveInteger)) {
            throw new Error("包装标签数量快照不完整，已停止打印");
          }
          if (Number(label.label_number) > Number(label.label_count) || Number(label.quantity) > Number(label.units_per_label)) {
            throw new Error("包装标签序号或数量异常，已停止打印");
          }
        });
      }

      function labelHtml(label) {
        const customer = label.customer_code || label.customer_name || "客户待确认";
        const productCode = label.product_code || "存货编码待确认";
        const productName = label.product_name || "产品名称待确认";
        const specification = label.specification || "规格待确认";
        return `<article class="label-card" aria-label="生产包装标签">
          <div class="customer-row"><span class="field-name">客户名称</span><strong class="customer-name" title="${escapeHtml(customer)}">${escapeHtml(customer)}</strong></div>
          <div class="code-row"><span class="field-name">存货编码</span><strong class="product-code" title="${escapeHtml(productCode)}">${escapeHtml(productCode)}</strong></div>
          <div class="detail-row"><span class="field-name">产品名称</span><strong class="detail-value" title="${escapeHtml(productName)}">${escapeHtml(productName)}</strong></div>
          <div class="detail-row"><span class="field-name">规格</span><strong class="detail-value" title="${escapeHtml(specification)}">${escapeHtml(specification)}</strong></div>
          <div class="quantity-row"><span class="field-name">每捆数量</span><strong class="quantity-number">${escapeHtml(label.quantity)}</strong><span class="quantity-unit">只</span></div>
        </article>`;
      }

      function render(packageData) {
        validatePackage(packageData);
        labelList.innerHTML = packageData.labels.map((label) => labelHtml(label)).join("");
        loadedPackage = packageData;
        message.hidden = true;
        printButton.disabled = false;
      }

      async function loadPackage() {
        const generation = ++loadGeneration;
        if (activeController) activeController.abort();
        activeController = new AbortController();
        loadedPackage = null;
        printButton.disabled = true;
        labelList.innerHTML = "";
        message.hidden = false;
        message.className = "message";
        message.textContent = "正在读取冻结的生产包装标签计划……";
        if (!Number.isInteger(supplierOrderId) || supplierOrderId <= 0) {
          message.className = "message error";
          message.textContent = "报料单编号无效";
          return;
        }
        try {
          const response = await fetch(`/api/requisition/supplier-orders/${supplierOrderId}/production-packaging-label-package`, {
            method:"GET",
            credentials:"include",
            cache:"no-store",
            headers:{"Accept":"application/json"},
            signal:activeController.signal,
          });
          let payload = null;
          try { payload = await response.json(); } catch (_error) { payload = null; }
          if (!response.ok) throw Object.assign(new Error(errorMessage(response.status, payload)), {status:response.status});
          if (generation !== loadGeneration) return;
          render(payload);
        } catch (error) {
          if (error && error.name === "AbortError") return;
          if (generation !== loadGeneration) return;
          message.className = "message error";
          message.textContent = error instanceof TypeError
            ? "无法连接 ERP 服务，请检查网络后重试"
            : error && error.message
            ? error.message
            : "连接 ERP 失败，请重试";
        }
      }

      retryButton.addEventListener("click", loadPackage);
      printButton.addEventListener("click", () => { if (loadedPackage) window.print(); });
      closeButton.addEventListener("click", () => window.close());
      loadPackage();
    })();
  </script>
</body>
</html>
