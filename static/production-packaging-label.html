<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>生产包装标签</title>
  <style>
    :root {
      color-scheme:light;
      font-family:"Microsoft YaHei","SimHei","SimSun",sans-serif;
      color:#000;
      --label-width:40mm;
      --label-height:30mm;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { background:#f3f4f6; }
    .toolbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:10px 16px; background:#fff; border-bottom:1px solid #cbd5e1; }
    button,.button-link { border:1px solid #64748b; border-radius:5px; background:#fff; color:#111827; padding:8px 13px; cursor:pointer; font:14px/1.2 inherit; text-decoration:none; }
    button.primary { border-width:2px; border-color:#111827; font-weight:700; }
    button.confirm { border-color:#166534; background:#166534; color:#fff; font-weight:700; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .toolbar-note { margin-left:auto; max-width:520px; color:#475569; font-size:12px; text-align:right; }
    .message { max-width:760px; margin:18px auto; padding:12px 16px; border:1px solid #94a3b8; border-radius:6px; color:#334155; background:#fff; text-align:center; }
    .message.error { color:#7f1d1d; border-color:#991b1b; }
    .message.success { color:#14532d; border-color:#15803d; }
    .print-plan-panel { max-width:1120px; margin:14px auto 0; padding:12px; border:1px solid #94a3b8; border-radius:7px; background:#fff; }
    .print-plan-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
    .print-plan-summary { margin-left:auto; color:#0f172a; font-weight:700; }
    .print-plan-table-wrap { overflow:auto; }
    .print-plan-table { width:100%; border-collapse:collapse; font-size:13px; }
    .print-plan-table th,.print-plan-table td { padding:7px 8px; border:1px solid #cbd5e1; text-align:left; vertical-align:middle; }
    .print-plan-table th { background:#f1f5f9; white-space:nowrap; }
    .print-count-input { width:92px; padding:6px 7px; border:1px solid #64748b; border-radius:4px; font:15px/1.2 inherit; }
    .print-count-input.invalid { border-color:#b91c1c; background:#fef2f2; }
    .skip-note { color:#b45309; font-weight:700; }
    .label-list { display:grid; gap:14px; justify-items:center; padding:18px; }
    .label-card {
      width:var(--label-width);
      height:var(--label-height);
      display:grid;
      grid-template-rows:5.4mm 7mm 5mm 5mm 7mm;
      border:.3mm solid #000;
      border-radius:.8mm;
      background:#fff;
      box-shadow:0 2px 10px rgb(15 23 42 / 14%);
      break-inside:avoid;
      page-break-inside:avoid;
    }
    .customer-row,.detail-row { display:grid; grid-template-columns:8.2mm 1fr; align-items:center; min-width:0; padding:0 .65mm; }
    .customer-row { border-bottom:.25mm solid #000; }
    .detail-row { border-bottom:.2mm solid #6b7280; }
    .field-name { color:#111827; font-size:2.15mm; font-weight:700; line-height:1; white-space:nowrap; }
    .fit-cell { display:flex; align-items:center; justify-content:center; min-width:0; min-height:0; width:100%; height:100%; padding:.25mm .2mm; }
    .fit-value {
      display:block;
      max-width:100%;
      color:#000;
      font-weight:800;
      line-height:1.02;
      text-align:center;
      white-space:normal;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    .customer-name { font-size:3.15mm; }
    .code-row { display:grid; grid-template-columns:8.2mm 1fr; align-items:center; min-width:0; padding:0 .65mm; border-bottom:.25mm solid #000; }
    .product-code { font-family:"Arial","Microsoft YaHei",sans-serif; font-size:3.45mm; font-weight:900; word-break:break-all; }
    .detail-value { font-size:2.75mm; }
    .quantity-row { display:flex; align-items:baseline; justify-content:center; gap:.75mm; min-width:0; padding:.5mm .65mm .3mm; }
    .quantity-row .field-name { color:#000; font-size:2.35mm; }
    .quantity-number { font-family:"Arial","Microsoft YaHei",sans-serif; font-size:5.3mm; font-weight:900; line-height:1; }
    .quantity-unit { font-size:2.8mm; font-weight:900; }
    html[data-template="current_40x30_v2"] .label-card { grid-template-rows:4.8mm 6.4mm 4.8mm 4.8mm 8.6mm; }
    html[data-template="current_40x30_v2"] .compact-row { display:flex; align-items:center; justify-content:center; min-width:0; min-height:0; padding:.25mm .7mm; border-bottom:.2mm solid #6b7280; }
    html[data-template="current_40x30_v2"] .compact-customer { border-bottom:.25mm solid #000; }
    html[data-template="current_40x30_v2"] .compact-customer .fit-value { font-size:3.65mm; font-weight:900; }
    html[data-template="current_40x30_v2"] .compact-code { border-bottom:.25mm solid #000; }
    html[data-template="current_40x30_v2"] .compact-code .fit-value { font-family:"Arial","Microsoft YaHei",sans-serif; font-size:3.6mm; font-weight:900; word-break:break-all; }
    html[data-template="current_40x30_v2"] .compact-detail .fit-value { font-size:2.85mm; }
    html[data-template="current_40x30_v2"] .quantity-row { padding:.35mm .65mm .25mm; }
    html[data-template="current_40x30_v2"] .quantity-number { font-size:6.1mm; }
    html[data-template="current_40x30_v2"] .quantity-unit { font-size:3.05mm; }
    .label-card.layout-driven { position:relative; display:block; overflow:hidden; border:0; }
    .label-card.layout-driven::after {
      content:"";
      position:absolute;
      inset:0;
      z-index:2;
      border:.3mm solid #000;
      border-radius:.8mm;
      pointer-events:none;
    }
    .layout-print-element { position:absolute; display:flex; align-items:center; min-width:0; min-height:0; overflow:hidden; line-height:1.02; overflow-wrap:anywhere; word-break:break-word; }
    .layout-print-element.align-left { justify-content:flex-start; text-align:left; }
    .layout-print-element.align-center { justify-content:center; text-align:center; }
    .layout-print-element.align-right { justify-content:flex-end; text-align:right; }
    .layout-print-element.code { font-family:"Arial","Microsoft YaHei",sans-serif; word-break:break-all; }
    .layout-print-element.quantity { gap:.7mm; line-height:1; }
    .layout-print-element.quantity .layout-unit { font-size:.5em; font-weight:900; }
    html[data-template="legacy_65x45_v1"] .label-card { grid-template-rows:6.4mm 9.8mm 6.3mm 6.3mm 1fr; border-width:.35mm; border-radius:1.4mm; }
    html[data-template="legacy_65x45_v1"] .customer-row,
    html[data-template="legacy_65x45_v1"] .code-row,
    html[data-template="legacy_65x45_v1"] .detail-row { grid-template-columns:11mm 1fr; padding:0 1.5mm; }
    html[data-template="legacy_65x45_v1"] .field-name { font-size:2.45mm; }
    html[data-template="legacy_65x45_v1"] .customer-name { font-size:4.35mm; }
    html[data-template="legacy_65x45_v1"] .product-code { font-size:5.2mm; }
    html[data-template="legacy_65x45_v1"] .detail-value { font-size:3.3mm; }
    html[data-template="legacy_65x45_v1"] .quantity-row .field-name { font-size:3mm; }
    html[data-template="legacy_65x45_v1"] .quantity-number { font-size:7.2mm; }
    html[data-template="legacy_65x45_v1"] .quantity-unit { font-size:3.6mm; }
    .layout-editor { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:18px; background:rgb(15 23 42 / 72%); }
    .layout-editor-shell { width:min(1040px,96vw); max-height:94vh; overflow:auto; border:1px solid #64748b; border-radius:8px; background:#f8fafc; box-shadow:0 18px 55px rgb(15 23 42 / 35%); }
    .layout-editor-header { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid #cbd5e1; background:#fff; }
    .layout-editor-header h2 { margin:0; font-size:18px; }
    .layout-editor-header .version-note { margin-left:auto; color:#475569; font-size:12px; }
    .layout-editor-body { display:grid; grid-template-columns:minmax(510px,1fr) 330px; gap:18px; padding:18px; }
    .layout-preview-wrap { min-width:0; }
    .layout-preview-title { margin:0 0 8px; color:#334155; font-size:13px; }
    .layout-stage-frame { display:inline-block; padding:18px; border:1px solid #94a3b8; background:#e2e8f0; }
    .layout-stage { position:relative; width:480px; height:360px; overflow:hidden; border:3px solid #111827; background:#fff; touch-action:none; user-select:none; }
    .layout-editor-element { position:absolute; display:flex; align-items:center; overflow:hidden; border:1px dashed #64748b; background:rgb(255 255 255 / 72%); line-height:1.02; overflow-wrap:anywhere; word-break:break-word; cursor:move; }
    .layout-editor-element.selected { border:2px solid #2563eb; background:rgb(219 234 254 / 78%); }
    .layout-editor-element.qr-placeholder { align-items:center; justify-content:center; border-style:dotted; color:#64748b; background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#e2e8f0 6px,#e2e8f0 12px); font-size:12px; text-align:center; }
    .layout-panel { display:flex; flex-direction:column; gap:12px; min-width:0; }
    .layout-help { margin:0; padding:9px 10px; border-left:4px solid #2563eb; background:#eff6ff; color:#1e3a8a; font-size:12px; line-height:1.55; }
    .layout-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .layout-field { display:flex; flex-direction:column; gap:4px; color:#334155; font-size:12px; }
    .layout-field.full { grid-column:1 / -1; }
    .layout-field input,.layout-field select { width:100%; border:1px solid #94a3b8; border-radius:4px; background:#fff; padding:7px 8px; color:#111827; font:14px/1.2 inherit; }
    .layout-inline-control { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px; align-items:center; }
    .layout-field-note { color:#64748b; font-size:11px; line-height:1.4; }
    .layout-visibility-button { grid-column:1 / -1; border-color:#b91c1c; color:#991b1b; background:#fff; }
    .layout-visibility-button.restore { border-color:#15803d; color:#166534; }
    .layout-stage-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; color:#64748b; font-size:15px; text-align:center; }
    .layout-preflight-surface { position:fixed; top:0; left:-10000px; z-index:-1; width:40mm; visibility:hidden; pointer-events:none; }
    .layout-actions { display:flex; flex-wrap:wrap; gap:8px; padding-top:4px; }
    .layout-status { min-height:36px; margin:0; padding:8px 10px; border:1px solid #cbd5e1; border-radius:5px; background:#fff; color:#334155; font-size:12px; line-height:1.45; }
    .layout-status.error { color:#7f1d1d; border-color:#b91c1c; }
    .layout-status.success { color:#14532d; border-color:#15803d; }
    [hidden] { display:none !important; }
    @page { size: 40mm 30mm; margin: 0; }
    @media (max-width:680px) {
      .toolbar-note { width:100%; margin-left:0; text-align:left; }
      .layout-editor-body { grid-template-columns:1fr; }
      .layout-stage-frame { max-width:100%; overflow:auto; }
    }
    @media print {
      html,body { width:var(--label-width); min-height:0; background:#fff; }
      .toolbar,.message,.print-plan-panel,.layout-editor { display:none !important; }
      .label-list { display:block; padding:0; }
      .label-card { width:var(--label-width); height:var(--label-height); margin:0; box-shadow:none; break-after:page; page-break-after:always; }
      .label-card:last-child { break-after:auto; page-break-after:auto; }
    }
  </style>
  <style id="legacyPageSize"></style>
</head>
<body>
  <nav class="toolbar">
    <button id="retryButton" type="button">重新加载</button>
    <button id="printButton" class="primary" type="button" disabled>打印包装标签</button>
    <button id="layoutButton" type="button" hidden>编辑标签布局</button>
    <button id="confirmPrintedButton" class="confirm" type="button" hidden>确认已实际打印</button>
    <a id="latestJobLink" class="button-link" href="#" hidden>补打最近已登记作业</a>
    <button id="closeButton" type="button">关闭</button>
    <span id="toolbarNote" class="toolbar-note">40 × 30 mm｜缩放选 100%“实际大小”｜关闭“适合页面”、自动旋转和页眉页脚</span>
  </nav>
  <div id="message" class="message">正在读取冻结的生产包装标签计划……</div>
  <section id="printPlanPanel" class="print-plan-panel" hidden aria-label="本次打印标签张数">
    <div class="print-plan-actions">
      <button id="allPlannedButton" type="button">全部按计划</button>
      <button id="allZeroButton" type="button">全部设为 0</button>
      <span id="printPlanSummary" class="print-plan-summary"></span>
    </div>
    <div class="print-plan-table-wrap">
      <table class="print-plan-table">
        <thead><tr><th>客户简称</th><th>存货编码</th><th>产品名称</th><th>计划成品只数</th><th>每张只数</th><th>系统计划张数</th><th>本次打印张数</th><th>结果</th></tr></thead>
        <tbody id="printPlanBody"></tbody>
      </table>
    </div>
  </section>
  <main id="labelList" class="label-list" aria-live="polite"></main>
  <section id="layoutEditor" class="layout-editor" hidden aria-modal="true" role="dialog" aria-labelledby="layoutEditorTitle">
    <div class="layout-editor-shell">
      <header class="layout-editor-header">
        <h2 id="layoutEditorTitle">40 × 30 mm 标签布局编辑</h2>
        <span id="layoutVersionNote" class="version-note"></span>
        <button id="layoutCloseButton" type="button">关闭</button>
      </header>
      <div class="layout-editor-body">
        <div class="layout-preview-wrap">
          <p class="layout-preview-title">按住元素拖动；蓝框表示当前选中元素。尺寸和位置单位均为毫米。</p>
          <div class="layout-stage-frame"><div id="layoutStage" class="layout-stage" aria-label="标签布局预览"></div></div>
        </div>
        <aside class="layout-panel">
          <p class="layout-help">“保存草稿”不会影响打印；只有“发布为下次打印布局”后，新创建的打印作业才使用新布局。已经冻结的历史作业继续使用旧布局。</p>
          <div class="layout-form-grid">
            <label class="layout-field full">元素<select id="layoutElementSelect"></select></label>
            <label class="layout-field">X 位置<input id="layoutX" data-layout-field="x_mm" type="number" min="0" max="40" step="0.1"></label>
            <label class="layout-field">Y 位置<input id="layoutY" data-layout-field="y_mm" type="number" min="0" max="30" step="0.1"></label>
            <label class="layout-field">总体宽度<input id="layoutWidth" data-layout-field="width_mm" type="number" min="0.1" max="40" step="0.1"></label>
            <label class="layout-field">总体高度<input id="layoutHeight" data-layout-field="height_mm" type="number" min="0.1" max="30" step="0.1"></label>
            <label id="layoutFontField" class="layout-field">字体大小<input id="layoutFontSize" data-layout-field="font_size_mm" type="number" min="1" max="10" step="0.05"></label>
            <label id="layoutAlignField" class="layout-field">文字对齐<select id="layoutAlign" data-layout-field="text_align"><option value="left">左对齐</option><option value="center">居中</option><option value="right">右对齐</option></select></label>
            <div id="layoutFixedSuffixField" class="layout-field full" hidden>
              <label for="layoutFixedSuffix">数量后固定说明</label>
              <div class="layout-inline-control">
                <input id="layoutFixedSuffix" type="text" maxlength="8" autocomplete="off" placeholder="例如：只/捆、只">
                <button id="layoutClearFixedSuffixButton" type="button">删除固定说明</button>
              </div>
              <span class="layout-field-note">这里只修改实际数量后面的固定文字；留空时只打印实际数量，例如 50。</span>
            </div>
            <button id="layoutVisibilityButton" class="layout-visibility-button" type="button">删除显示（可恢复）</button>
          </div>
          <p id="layoutStatus" class="layout-status">尚未修改。</p>
          <div class="layout-actions">
            <button id="layoutSaveButton" class="primary" type="button">保存草稿</button>
            <button id="layoutPublishButton" class="confirm" type="button">保存并用于下次打印</button>
            <button id="layoutDefaultButton" type="button">恢复默认并发布</button>
            <button id="layoutRollbackButton" type="button">回滚上一发布版</button>
          </div>
        </aside>
      </div>
    </div>
  </section>
  <script>
    (() => {
      "use strict";

      const TEMPLATE_DEFINITIONS = Object.freeze({
        current_40x30_v2: Object.freeze({ widthMm:40, heightMm:30, label:"40 × 30 mm 精简版" }),
        current_40x30_v1: Object.freeze({ widthMm:40, heightMm:30, label:"40 × 30 mm" }),
        legacy_65x45_v1: Object.freeze({ widthMm:65, heightMm:45, label:"65 × 45 mm（历史作业）" }),
      });
      const CURRENT_TEMPLATE_VERSION = "current_40x30_v2";
      const LEGACY_TEMPLATE_VERSION = "legacy_65x45_v1";
      const MIN_TEXT_SIZE_PX = 5;

      const message = document.getElementById("message");
      const printPlanPanel = document.getElementById("printPlanPanel");
      const printPlanBody = document.getElementById("printPlanBody");
      const printPlanSummary = document.getElementById("printPlanSummary");
      const allPlannedButton = document.getElementById("allPlannedButton");
      const allZeroButton = document.getElementById("allZeroButton");
      const labelList = document.getElementById("labelList");
      const retryButton = document.getElementById("retryButton");
      const printButton = document.getElementById("printButton");
      const layoutButton = document.getElementById("layoutButton");
      const confirmPrintedButton = document.getElementById("confirmPrintedButton");
      const latestJobLink = document.getElementById("latestJobLink");
      const closeButton = document.getElementById("closeButton");
      const toolbarNote = document.getElementById("toolbarNote");
      const legacyPageSize = document.getElementById("legacyPageSize");
      const layoutEditor = document.getElementById("layoutEditor");
      const layoutCloseButton = document.getElementById("layoutCloseButton");
      const layoutVersionNote = document.getElementById("layoutVersionNote");
      const layoutStage = document.getElementById("layoutStage");
      const layoutElementSelect = document.getElementById("layoutElementSelect");
      const layoutX = document.getElementById("layoutX");
      const layoutY = document.getElementById("layoutY");
      const layoutWidth = document.getElementById("layoutWidth");
      const layoutHeight = document.getElementById("layoutHeight");
      const layoutFontSize = document.getElementById("layoutFontSize");
      const layoutAlign = document.getElementById("layoutAlign");
      const layoutFontField = document.getElementById("layoutFontField");
      const layoutAlignField = document.getElementById("layoutAlignField");
      const layoutFixedSuffixField = document.getElementById("layoutFixedSuffixField");
      const layoutFixedSuffix = document.getElementById("layoutFixedSuffix");
      const layoutClearFixedSuffixButton = document.getElementById("layoutClearFixedSuffixButton");
      const layoutVisibilityButton = document.getElementById("layoutVisibilityButton");
      const layoutStatus = document.getElementById("layoutStatus");
      const layoutSaveButton = document.getElementById("layoutSaveButton");
      const layoutPublishButton = document.getElementById("layoutPublishButton");
      const layoutDefaultButton = document.getElementById("layoutDefaultButton");
      const layoutRollbackButton = document.getElementById("layoutRollbackButton");
      const params = new URLSearchParams(window.location.search);
      const supplierOrderId = Number(params.get("id"));
      const compositeBatchId = Number(params.get("batch_id"));
      const compositeItemIds = [...new Set(
        String(params.get("item_ids") || "")
          .split(",")
          .map((value) => Number(value.trim()))
          .filter((value) => Number.isInteger(value) && value > 0)
      )].sort((a, b) => a - b);
      const requestedJobId = Number(params.get("job_id"));
      let loadGeneration = 0;
      let activeController = null;
      let loadedPackage = null;
      let loadedJob = null;
      let prepareAttempt = null;
      let confirmationAttempt = null;
      let printing = false;
      let plannedPackage = null;
      let printCounts = new Map();
      let layoutAdminState = null;
      let editorLayout = null;
      let selectedLayoutElementId = "customer_short_name";
      let layoutMutationAttempt = null;
      let layoutOperationBusy = false;
      let layoutDrag = null;

      const LAYOUT_CATALOG_VERSION = "p1-66b-v1";
      const DEFAULT_QUANTITY_FIXED_SUFFIX = "只/捆";
      const MAX_FIXED_SUFFIX_LENGTH = 8;
      const LAYOUT_ELEMENT_LABELS = Object.freeze({
        customer_short_name:"客户中文简称",
        product_code:"存货编码",
        product_name:"产品名称",
        specification:"规格",
        quantity:"数量（只/捆）",
        product_qr:"产品二维码（暂未启用）",
      });
      const REQUIRED_LAYOUT_IDS = Object.freeze(Object.keys(LAYOUT_ELEMENT_LABELS));

      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
      const positiveInteger = (value) => Number.isInteger(Number(value)) && Number(value) > 0;
      const requiredText = (value) => typeof value === "string" && value.trim() ? value.trim() : "";
      const newIdempotencyKey = (prefix) => `${prefix}-${globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`}`;
      const deepClone = (value) => JSON.parse(JSON.stringify(value));
      const finiteNumber = (value) => Number.isFinite(Number(value)) ? Number(value) : null;
      const roundedMm = (value) => Math.round(Number(value) * 1000) / 1000;
      const clipped = (value, minimum, maximum) => Math.min(maximum, Math.max(minimum, value));
      const hasOwn = (value, key) => Object.prototype.hasOwnProperty.call(value, key);

      function quantityFixedSuffix(element) {
        if (!element || element.id !== "quantity") return "";
        return hasOwn(element, "fixed_suffix")
          ? String(element.fixed_suffix)
          : DEFAULT_QUANTITY_FIXED_SUFFIX;
      }

      function validFixedSuffix(value) {
        return typeof value === "string"
          && value === value.trim()
          && value.length <= MAX_FIXED_SUFFIX_LENGTH
          && /^[A-Za-z\u3400-\u9fff/／·_ -]*$/u.test(value)
          && !/(?:script|javascript|alert|onerror|onload|style|data|https?|www|url)/iu.test(value);
      }

      function findVisibleLayoutOverlap(layout) {
        const visible = (layout?.elements || []).filter((element) => element.visible);
        for (let index = 0; index < visible.length; index += 1) {
          const first = visible[index];
          for (const second of visible.slice(index + 1)) {
            const overlaps = Number(first.x_mm) < Number(second.x_mm) + Number(second.width_mm) - .001
              && Number(second.x_mm) < Number(first.x_mm) + Number(first.width_mm) - .001
              && Number(first.y_mm) < Number(second.y_mm) + Number(second.height_mm) - .001
              && Number(second.y_mm) < Number(first.y_mm) + Number(first.height_mm) - .001;
            if (overlaps) return [first.id, second.id];
          }
        }
        return null;
      }

      function validateLayoutEnvelope(envelope, {checkVisibleOverlap=false} = {}) {
        const layout = envelope?.layout;
        if (!layout || layout.catalog_version !== LAYOUT_CATALOG_VERSION) {
          throw new Error("标签布局目录版本不受支持，已停止打印");
        }
        if (Number(layout.paper?.width_mm) !== 40 || Number(layout.paper?.height_mm) !== 30) {
          throw new Error("标签布局纸张不是40×30毫米，已停止打印");
        }
        if (!Array.isArray(layout.elements) || layout.elements.length !== REQUIRED_LAYOUT_IDS.length) {
          throw new Error("标签布局元素不完整，已停止打印");
        }
        const seen = new Set();
        layout.elements.forEach((element) => {
          if (!REQUIRED_LAYOUT_IDS.includes(element?.id) || seen.has(element.id)) {
            throw new Error("标签布局包含未登记或重复元素，已停止打印");
          }
          seen.add(element.id);
          const x = finiteNumber(element.x_mm);
          const y = finiteNumber(element.y_mm);
          const width = finiteNumber(element.width_mm);
          const height = finiteNumber(element.height_mm);
          if ([x, y, width, height].includes(null) || x < 0 || y < 0 || width <= 0 || height <= 0 || x + width > 40.001 || y + height > 30.001) {
            throw new Error(`${LAYOUT_ELEMENT_LABELS[element.id]}超出40×30毫米纸张，已停止打印`);
          }
          if (typeof element.visible !== "boolean") {
            throw new Error(`${LAYOUT_ELEMENT_LABELS[element.id]}的显示状态无效，已停止打印`);
          }
          if (element.id !== "product_qr") {
            const fontSize = finiteNumber(element.font_size_mm);
            if (fontSize === null || fontSize < 1 || fontSize > 10 || ![400, 700, 800, 900].includes(element.font_weight) || !["left", "center", "right"].includes(element.text_align)) {
              throw new Error(`${LAYOUT_ELEMENT_LABELS[element.id]}的布局参数无效，已停止打印`);
            }
          } else if (element.visible) {
            throw new Error("产品二维码数据源尚未启用，已停止打印");
          }
          if (hasOwn(element, "fixed_suffix") && (element.id !== "quantity" || !validFixedSuffix(element.fixed_suffix))) {
            throw new Error("数量后的固定说明无效，已停止打印");
          }
        });
        if (seen.size !== REQUIRED_LAYOUT_IDS.length) throw new Error("标签布局缺少必要元素，已停止打印");
        const overlap = checkVisibleOverlap ? findVisibleLayoutOverlap(layout) : null;
        if (overlap) {
          throw new Error(`${LAYOUT_ELEMENT_LABELS[overlap[0]]}与${LAYOUT_ELEMENT_LABELS[overlap[1]]}不能重叠，请先调整后再保存`);
        }
        return layout;
      }

      function errorMessage(status, payload) {
        const detail = payload && typeof payload === "object" ? payload.detail : null;
        if (typeof detail === "string" && detail.trim()) return detail.trim();
        if (detail && typeof detail === "object" && typeof detail.message === "string") {
          const reasons = Array.isArray(detail.reasons) && detail.reasons.length
            ? `：${detail.reasons.map((item) => String(item)).join("；")}`
            : "";
          return `${detail.message}${detail.code ? `（${detail.code}）` : ""}${reasons}`;
        }
        if (Array.isArray(detail) && detail.length) {
          return detail.map((item) => item && item.msg ? item.msg : String(item)).join("；");
        }
        if (status === 401) return "登录已失效，请回到 ERP 重新登录后再试";
        if (status === 403) return "没有查看或打印该报料单包装标签的权限";
        if (status === 404) return "报料单或打印作业不存在";
        if (status === 409) return "标签计划已变化，请重新加载并核对后再打印";
        return `请求失败（HTTP ${status || "网络连接失败"}）`;
      }

      async function requestJson(url, options = {}) {
        const response = await fetch(url, {
          credentials:"include",
          cache:"no-store",
          headers:{"Accept":"application/json", ...(options.body ? {"Content-Type":"application/json"} : {}), ...(options.headers || {})},
          ...options,
        });
        let payload = null;
        try { payload = await response.json(); } catch (_error) { payload = null; }
        if (!response.ok) throw Object.assign(new Error(errorMessage(response.status, payload)), {status:response.status});
        return payload;
      }

      function parseMaybeJson(value) {
        if (typeof value !== "string") return value;
        try { return JSON.parse(value); } catch (_error) { return null; }
      }

      function normalizeResponse(payload) {
        const root = payload && typeof payload === "object" ? payload : {};
        const job = root.job || root.print_job || (root.job_id || root.id && root.status ? root : null);
        const nested = root.package || root.label_package || root.frozen_package || root.frozen_payload || root.payload
          || job?.package || job?.label_package || job?.frozen_package || job?.frozen_payload || job?.payload;
        const packageData = parseMaybeJson(nested) || (Array.isArray(root.labels) ? root : null);
        if (!packageData || typeof packageData !== "object") throw new Error("服务器返回的冻结标签数据不完整，请重试");
        const templateVersion = String(job?.template_version || root.template_version || packageData.template_version || "").trim();
        const normalizedJob = job ? {
          ...job,
          id:Number(job.id || job.job_id || root.job_id || 0),
          status:String(job.status || root.status || "").trim(),
          printed_at:job.printed_at || root.printed_at || null,
          template_version:templateVersion,
        } : null;
        return {
          packageData:{...packageData, template_version:templateVersion},
          job:normalizedJob,
          latestPrintedJob:root.latest_printed_job || root.latest_print_job || packageData.latest_printed_job || null,
          latestPrintedJobId:Number(root.latest_printed_job_id || packageData.latest_printed_job_id || 0),
        };
      }

      function validatePackage(packageData) {
        if (!packageData || typeof packageData !== "object" || !Array.isArray(packageData.labels)) {
          throw new Error("服务器返回的包装标签数据不完整，请重试");
        }
        if (!TEMPLATE_DEFINITIONS[packageData.template_version]) {
          throw new Error("标签作业缺少受支持的模板版本，已停止打印");
        }
        if (packageData.review_required || packageData.printable === false) {
          throw new Error("生产计划已变化或标签快照不完整，请先核对标签计划");
        }
        if (!packageData.labels.length || Number(packageData.label_count) !== packageData.labels.length) {
          throw new Error("该报料单没有可打印的生产包装标签");
        }
        packageData.labels.forEach((label) => {
          if (![label.quantity, label.total_quantity, label.units_per_label, label.label_number, label.label_count].every(positiveInteger)) {
            throw new Error("包装标签数量快照不完整，已停止打印");
          }
          if (Number(label.label_number) > Number(label.label_count) || Number(label.quantity) > Number(label.units_per_label)) {
            throw new Error("包装标签序号或数量异常，已停止打印");
          }
          const customerField = packageData.template_version === CURRENT_TEMPLATE_VERSION
            ? ["客户中文简称", label.customer_short_name]
            : ["客户名称", label.customer_name];
          const missing = [
            customerField,
            ["存货编码", label.product_code],
            ["产品名称", label.product_name],
            ["规格", label.specification],
          ].filter(([, value]) => !requiredText(value)).map(([name]) => name);
          if (missing.length) throw new Error(`包装标签缺少${missing.join("、")}，已停止打印`);
        });
        if (packageData.template_version === CURRENT_TEMPLATE_VERSION && packageData.label_layout) {
          validateLayoutEnvelope(packageData.label_layout);
        }
      }

      function parsePrintCount(value, maximum) {
        const text = String(value ?? "").trim();
        if (!/^\d+$/.test(text)) throw new Error(`本次打印张数必须是 0～${maximum} 的整数`);
        const count = Number(text);
        if (!Number.isSafeInteger(count) || count < 0 || count > maximum) {
          throw new Error(`本次打印张数必须是 0～${maximum} 的整数`);
        }
        return count;
      }

      function selectedPrintPackage() {
        if (!plannedPackage) return null;
        const selected = deepClone(plannedPackage);
        const counts = new Map([...printCounts.entries()].map(([key, value]) => [Number(key), Number(value)]));
        selected.plans = selected.plans.filter((plan) => (counts.get(Number(plan.production_task_id)) || 0) > 0);
        selected.labels = selected.labels.filter((label) => Number(label.label_number) <= (counts.get(Number(label.production_task_id)) || 0));
        selected.label_count = selected.labels.length;
        selected.production_task_count = selected.plans.length;
        return selected;
      }

      function renderSelectedLabels() {
        const selected = selectedPrintPackage();
        labelList.innerHTML = selected?.labels?.map((label) => labelHtml(label, selected)).join("") || "";
        const total = selected?.labels?.length || 0;
        const products = selected?.plans?.length || 0;
        printPlanSummary.textContent = `本次 ${products} 款，共 ${total} 张标签`;
        printButton.disabled = total === 0;
        if (total === 0) showMessage("本次未选择需要打印的标签");
        else message.hidden = true;
      }

      function renderPrintPlanEditor(packageData) {
        plannedPackage = deepClone(packageData);
        printCounts = new Map((packageData.plans || []).map((plan) => [Number(plan.production_task_id), Number(plan.label_count)]));
        printPlanBody.innerHTML = (packageData.plans || []).map((plan) => `<tr data-task-id="${escapeHtml(plan.production_task_id)}">
          <td>${escapeHtml(plan.customer_short_name || plan.customer_name || "-")}</td>
          <td>${escapeHtml(plan.product_code || "-")}</td>
          <td>${escapeHtml(plan.product_name || "-")}</td>
          <td>${escapeHtml(plan.total_quantity)}</td>
          <td>${escapeHtml(plan.units_per_label)}</td>
          <td>${escapeHtml(plan.label_count)}</td>
          <td><input class="print-count-input" type="number" inputmode="numeric" min="0" max="${escapeHtml(plan.label_count)}" step="1" value="${escapeHtml(plan.label_count)}" aria-label="${escapeHtml(plan.product_code || plan.production_task_id)}本次打印标签张数"></td>
          <td class="print-count-result">按计划打印</td>
        </tr>`).join("");
        printPlanBody.querySelectorAll("tr").forEach((row) => {
          const taskId = Number(row.dataset.taskId);
          const plan = packageData.plans.find((item) => Number(item.production_task_id) === taskId);
          const input = row.querySelector(".print-count-input");
          input.addEventListener("input", () => {
            try {
              const count = parsePrintCount(input.value, Number(plan.label_count));
              input.classList.remove("invalid");
              printCounts.set(taskId, count);
              row.querySelector(".print-count-result").innerHTML = count === 0 ? '<span class="skip-note">本次跳过</span>' : count < Number(plan.label_count) ? `少印 ${Number(plan.label_count) - count} 张` : "按计划打印";
              prepareAttempt = null;
              renderSelectedLabels();
            } catch (error) {
              input.classList.add("invalid");
              printButton.disabled = true;
              row.querySelector(".print-count-result").textContent = error.message;
            }
          });
        });
        printPlanPanel.hidden = false;
        renderSelectedLabels();
      }

      function setAllPrintCounts(mode) {
        printPlanBody.querySelectorAll("tr").forEach((row) => {
          const taskId = Number(row.dataset.taskId);
          const plan = plannedPackage.plans.find((item) => Number(item.production_task_id) === taskId);
          const input = row.querySelector(".print-count-input");
          input.value = mode === "planned" ? String(plan.label_count) : "0";
          input.dispatchEvent(new Event("input", {bubbles:true}));
        });
      }

      function applyTemplate(templateVersion) {
        const template = TEMPLATE_DEFINITIONS[templateVersion];
        if (!template) throw new Error("标签模板版本不受支持，已停止打印");
        document.documentElement.dataset.template = templateVersion;
        document.documentElement.style.setProperty("--label-width", `${template.widthMm}mm`);
        document.documentElement.style.setProperty("--label-height", `${template.heightMm}mm`);
        legacyPageSize.textContent = templateVersion === LEGACY_TEMPLATE_VERSION
          ? "@page { size: 65mm 45mm; margin: 0; }"
          : "";
        toolbarNote.textContent = `${template.label}｜缩放选 100%“实际大小”｜关闭“适合页面”、自动旋转和页眉页脚`;
      }

      function compactLabelHtml(label) {
        return `<article class="label-card" aria-label="生产包装标签 ${escapeHtml(label.label_number)}/${escapeHtml(label.label_count)}">
          <div class="compact-row compact-customer"><span class="fit-cell"><strong class="fit-value" title="${escapeHtml(label.customer_short_name)}">${escapeHtml(label.customer_short_name)}</strong></span></div>
          <div class="compact-row compact-code"><span class="fit-cell"><strong class="fit-value" title="${escapeHtml(label.product_code)}">${escapeHtml(label.product_code)}</strong></span></div>
          <div class="compact-row compact-detail"><span class="fit-cell"><strong class="fit-value" title="${escapeHtml(label.product_name)}">${escapeHtml(label.product_name)}</strong></span></div>
          <div class="compact-row compact-detail"><span class="fit-cell"><strong class="fit-value" title="${escapeHtml(label.specification)}">${escapeHtml(label.specification)}</strong></span></div>
          <div class="quantity-row"><strong class="quantity-number">${escapeHtml(label.quantity)}</strong><span class="quantity-unit">只/捆</span></div>
        </article>`;
      }

      function layoutElementValue(label, elementId) {
        if (elementId === "customer_short_name") return requiredText(label.customer_short_name);
        if (elementId === "product_code") return requiredText(label.product_code);
        if (elementId === "product_name") return requiredText(label.product_name);
        if (elementId === "specification") return requiredText(label.specification);
        if (elementId === "quantity") return String(label.quantity);
        return "";
      }

      function layoutDrivenLabelHtml(label, layout) {
        const elements = layout.elements.filter((element) => element.visible).map((element) => {
          const value = layoutElementValue(label, element.id);
          const style = [
            `left:${element.x_mm}mm`,
            `top:${element.y_mm}mm`,
            `width:${element.width_mm}mm`,
            `height:${element.height_mm}mm`,
            `font-size:${element.font_size_mm}mm`,
            `font-weight:${element.font_weight}`,
          ].join(";");
          const classes = [
            "layout-print-element",
            `align-${element.text_align}`,
            element.id === "product_code" ? "code" : "",
            element.id === "quantity" ? "quantity" : "",
          ].filter(Boolean).join(" ");
          const suffix = quantityFixedSuffix(element);
          const content = element.id === "quantity"
            ? `<strong>${escapeHtml(value)}</strong>${suffix ? `<span class="layout-unit">${escapeHtml(suffix)}</span>` : ""}`
            : `<strong>${escapeHtml(value)}</strong>`;
          return `<div class="${classes}" data-layout-element="${escapeHtml(element.id)}" style="${style}" title="${escapeHtml(`${value}${suffix}`)}">${content}</div>`;
        }).join("");
        return `<article class="label-card layout-driven" aria-label="生产包装标签 ${escapeHtml(label.label_number)}/${escapeHtml(label.label_count)}">${elements}</article>`;
      }

      function legacyLabelHtml(label) {
        return `<article class="label-card" aria-label="生产包装标签 ${escapeHtml(label.label_number)}/${escapeHtml(label.label_count)}">
          <div class="customer-row"><span class="field-name">客户名称</span><span class="fit-cell"><strong class="fit-value customer-name" title="${escapeHtml(label.customer_name)}">${escapeHtml(label.customer_name)}</strong></span></div>
          <div class="code-row"><span class="field-name">存货编码</span><span class="fit-cell"><strong class="fit-value product-code" title="${escapeHtml(label.product_code)}">${escapeHtml(label.product_code)}</strong></span></div>
          <div class="detail-row"><span class="field-name">产品名称</span><span class="fit-cell"><strong class="fit-value detail-value" title="${escapeHtml(label.product_name)}">${escapeHtml(label.product_name)}</strong></span></div>
          <div class="detail-row"><span class="field-name">规格</span><span class="fit-cell"><strong class="fit-value detail-value" title="${escapeHtml(label.specification)}">${escapeHtml(label.specification)}</strong></span></div>
          <div class="quantity-row"><span class="field-name">本标签数量</span><strong class="quantity-number">${escapeHtml(label.quantity)}</strong><span class="quantity-unit">只</span></div>
        </article>`;
      }

      function labelHtml(label, packageData) {
        const editableLayout = packageData.template_version === CURRENT_TEMPLATE_VERSION && packageData.label_layout
          ? validateLayoutEnvelope(packageData.label_layout)
          : null;
        return label.template_version === CURRENT_TEMPLATE_VERSION
          ? (editableLayout ? layoutDrivenLabelHtml(label, editableLayout) : compactLabelHtml(label))
          : legacyLabelHtml(label);
      }

      function fitElement(element) {
        const container = element.parentElement;
        let fontSize = Number.parseFloat(getComputedStyle(element).fontSize);
        while (fontSize > MIN_TEXT_SIZE_PX && (element.scrollWidth > container.clientWidth + 1 || element.scrollHeight > container.clientHeight + 1)) {
          fontSize = Math.max(MIN_TEXT_SIZE_PX, fontSize - .25);
          element.style.fontSize = `${fontSize}px`;
        }
        return element.scrollWidth <= container.clientWidth + 1 && element.scrollHeight <= container.clientHeight + 1;
      }

      function validateRenderedLabels() {
        const textFits = [...labelList.querySelectorAll(".fit-value")].every(fitElement);
        const layoutTextFits = [...labelList.querySelectorAll(".layout-print-element")].every((element) =>
          element.scrollWidth <= element.clientWidth + 1 && element.scrollHeight <= element.clientHeight + 1
        );
        const cardsFit = [...labelList.querySelectorAll(".label-card")].every((card) =>
          card.scrollWidth <= card.clientWidth + 1 && card.scrollHeight <= card.clientHeight + 1
        );
        if (!textFits || !layoutTextFits || !cardsFit) {
          throw new Error("核心字段过长，无法在当前纸型完整显示；已停止打印，请先缩短主档字段或联系管理员调整模板");
        }
      }

      async function preflightEditorLayout() {
        if (!editorLayout || !loadedPackage?.labels?.length) return;
        const surface = document.createElement("div");
        surface.className = "layout-preflight-surface";
        surface.setAttribute("aria-hidden", "true");
        surface.innerHTML = loadedPackage.labels.map((label) => layoutDrivenLabelHtml(label, editorLayout)).join("");
        document.body.appendChild(surface);
        try {
          if (document.fonts?.ready) await document.fonts.ready;
          await new Promise((resolve) => requestAnimationFrame(resolve));
          const overflow = [...surface.querySelectorAll(".layout-print-element")].find((element) =>
            element.scrollWidth > element.clientWidth + 1 || element.scrollHeight > element.clientHeight + 1
          );
          if (overflow) {
            const elementId = overflow.dataset.layoutElement;
            throw new Error(`${LAYOUT_ELEMENT_LABELS[elementId] || "标签文字"}在当前宽高和字号下无法完整显示，请先调整后再保存`);
          }
          const cardOverflow = [...surface.querySelectorAll(".label-card")].some((card) =>
            card.scrollWidth > card.clientWidth + 1 || card.scrollHeight > card.clientHeight + 1
          );
          if (cardOverflow) throw new Error("标签内容超出40×30毫米纸张，请先调整后再保存");
        } finally {
          surface.remove();
        }
      }

      function showMessage(text, className = "message") {
        message.hidden = false;
        message.className = className;
        message.textContent = text;
      }

      function latestJobMetadata(normalized) {
        const raw = normalized.latestPrintedJob || {};
        const id = Number(raw.id || raw.job_id || normalized.latestPrintedJobId || 0);
        return id > 0 ? {id, template_version:String(raw.template_version || "").trim()} : null;
      }

      function updateLatestJobLink(normalized) {
        const latest = latestJobMetadata(normalized);
        latestJobLink.hidden = !latest;
        if (!latest) return;
        const linkParams = new URLSearchParams({job_id:String(latest.id)});
        if (Number.isInteger(supplierOrderId) && supplierOrderId > 0) linkParams.set("id", String(supplierOrderId));
        if (Number.isInteger(compositeBatchId) && compositeBatchId > 0) {
          linkParams.set("batch_id", String(compositeBatchId));
          linkParams.set("item_ids", compositeItemIds.join(","));
        }
        latestJobLink.href = `${window.location.pathname}?${linkParams.toString()}`;
        latestJobLink.textContent = latest.template_version === LEGACY_TEMPLATE_VERSION
          ? "补打最近 65 × 45 mm 历史作业"
          : "补打最近已登记作业";
      }

      function showLayoutStatus(text, kind = "") {
        layoutStatus.textContent = text;
        layoutStatus.className = `layout-status${kind ? ` ${kind}` : ""}`;
      }

      function showEditorLayoutMutationStatus(message) {
        const overlap = editorLayout ? findVisibleLayoutOverlap(editorLayout) : null;
        showLayoutStatus(
          overlap
            ? `${LAYOUT_ELEMENT_LABELS[overlap[0]]}与${LAYOUT_ELEMENT_LABELS[overlap[1]]}重叠，请先调整位置。`
            : message,
          overlap ? "error" : "",
        );
      }

      function setLayoutEditorBusy(busy) {
        layoutOperationBusy = busy;
        [layoutSaveButton, layoutPublishButton, layoutDefaultButton, layoutRollbackButton, layoutCloseButton, layoutVisibilityButton, layoutClearFixedSuffixButton].forEach((button) => {
          button.disabled = busy;
        });
        [layoutElementSelect, layoutX, layoutY, layoutWidth, layoutHeight, layoutFontSize, layoutAlign, layoutFixedSuffix].forEach((control) => {
          control.disabled = busy;
        });
        layoutRollbackButton.disabled = busy || !layoutAdminState?.can_rollback;
      }

      function currentEditorElement() {
        return editorLayout?.elements?.find((element) => element.id === selectedLayoutElementId) || null;
      }

      function layoutPreviewValue(elementId) {
        const sample = loadedPackage?.labels?.[0] || {};
        const value = layoutElementValue(sample, elementId);
        if (value) return value;
        const examples = {
          customer_short_name:"思迈",
          product_code:"SM-380260220",
          product_name:"三层瓦楞外箱",
          specification:"380×260×220mm",
          quantity:"50",
        };
        return examples[elementId] || "";
      }

      function editorElementHtml(element) {
        const selected = element.id === selectedLayoutElementId ? " selected" : "";
        const left = Number(element.x_mm) * 12;
        const top = Number(element.y_mm) * 12;
        const width = Number(element.width_mm) * 12;
        const height = Number(element.height_mm) * 12;
        if (element.kind === "qr") {
          return `<div class="layout-editor-element qr-placeholder${selected}" data-layout-editor-id="${escapeHtml(element.id)}" style="left:${left}px;top:${top}px;width:${width}px;height:${height}px;opacity:${element.visible ? 1 : .58}">二维码位置<br>数据源待启用</div>`;
        }
        const value = layoutPreviewValue(element.id);
        const quantity = element.id === "quantity" ? `${value}${quantityFixedSuffix(element)}` : value;
        return `<div class="layout-editor-element${selected}" data-layout-editor-id="${escapeHtml(element.id)}" style="left:${left}px;top:${top}px;width:${width}px;height:${height}px;font-size:${Number(element.font_size_mm) * 12}px;font-weight:${element.font_weight};justify-content:${element.text_align === "left" ? "flex-start" : element.text_align === "right" ? "flex-end" : "center"};text-align:${element.text_align}">${escapeHtml(quantity)}</div>`;
      }

      function renderLayoutEditor() {
        if (!editorLayout || !layoutAdminState) return;
        validateLayoutEnvelope({layout:editorLayout});
        const stageElements = editorLayout.elements.filter((element) => element.visible || element.kind === "qr");
        layoutStage.innerHTML = stageElements.length
          ? stageElements.map(editorElementHtml).join("")
          : '<div class="layout-stage-empty">当前布局没有显示元素，请从右侧元素列表选择后恢复显示。</div>';
        const elementOption = (element) => `<option value="${escapeHtml(element.id)}">${escapeHtml(LAYOUT_ELEMENT_LABELS[element.id])}</option>`;
        const shownOptions = editorLayout.elements.filter((element) => element.visible).map(elementOption).join("");
        const hiddenOptions = editorLayout.elements.filter((element) => !element.visible).map(elementOption).join("");
        layoutElementSelect.innerHTML = `${shownOptions ? `<optgroup label="显示中">${shownOptions}</optgroup>` : ""}${hiddenOptions ? `<optgroup label="已隐藏（可恢复）">${hiddenOptions}</optgroup>` : ""}`;
        layoutElementSelect.value = selectedLayoutElementId;
        layoutElementSelect.disabled = layoutOperationBusy;
        const element = currentEditorElement();
        if (!element) return;
        layoutX.value = element.x_mm;
        layoutY.value = element.y_mm;
        layoutWidth.value = element.width_mm;
        layoutHeight.value = element.height_mm;
        const isText = element.kind === "text";
        const editableGeometry = (element.visible || element.kind === "qr") && !layoutOperationBusy;
        layoutFontField.hidden = !isText;
        layoutAlignField.hidden = !isText;
        layoutFontSize.value = isText ? element.font_size_mm : "";
        layoutAlign.value = isText ? element.text_align : "center";
        [layoutX, layoutY, layoutWidth, layoutHeight, layoutFontSize, layoutAlign].forEach((control) => {
          control.disabled = !editableGeometry;
        });
        layoutFixedSuffixField.hidden = element.id !== "quantity";
        layoutFixedSuffix.value = element.id === "quantity" ? quantityFixedSuffix(element) : "";
        layoutFixedSuffix.disabled = !editableGeometry || element.id !== "quantity";
        layoutClearFixedSuffixButton.disabled = !editableGeometry || element.id !== "quantity" || quantityFixedSuffix(element) === "";
        layoutVisibilityButton.textContent = element.visible ? "删除显示（可恢复）" : "恢复显示";
        layoutVisibilityButton.classList.toggle("restore", !element.visible);
        layoutVisibilityButton.disabled = layoutOperationBusy || element.kind === "qr";
        layoutVisibilityButton.title = element.kind === "qr" ? "产品二维码数据源尚未启用" : "";
        layoutVersionNote.textContent = `草稿 v${layoutAdminState.draft.version}｜已发布 v${layoutAdminState.published.version}`;
        layoutRollbackButton.disabled = layoutOperationBusy || !layoutAdminState.can_rollback;
      }

      function closeLayoutEditor(force = false) {
        if (layoutOperationBusy && !force) return;
        layoutEditor.hidden = true;
        editorLayout = null;
        layoutDrag = null;
        layoutMutationAttempt = null;
      }

      async function refreshLayoutAdminState() {
        layoutButton.hidden = true;
        layoutAdminState = null;
        if (!loadedPackage || loadedPackage.template_version !== CURRENT_TEMPLATE_VERSION || positiveInteger(loadedJob?.id)) return false;
        try {
          const state = await requestJson("/api/requisition/production-packaging-label-layout/admin", {method:"GET"});
          if (!loadedPackage || loadedPackage.template_version !== CURRENT_TEMPLATE_VERSION || positiveInteger(loadedJob?.id)) return false;
          validateLayoutEnvelope({layout:state?.draft?.layout});
          validateLayoutEnvelope({layout:state?.published?.layout});
          layoutAdminState = state;
          layoutButton.hidden = false;
          return true;
        } catch (error) {
          if (error?.status !== 403) console.warn("包装标签布局管理状态不可用", error);
          return false;
        }
      }

      async function openLayoutEditor() {
        if (positiveInteger(loadedJob?.id)) {
          showMessage("历史打印作业布局已经冻结，不能在补打页面修改。", "message error");
          return;
        }
        const available = layoutAdminState || await refreshLayoutAdminState();
        if (!available || !layoutAdminState) return;
        editorLayout = deepClone(layoutAdminState.draft.layout);
        selectedLayoutElementId = editorLayout.elements.some((element) => element.id === selectedLayoutElementId)
          ? selectedLayoutElementId
          : editorLayout.elements[0].id;
        showLayoutStatus("可拖动元素，也可直接输入毫米数值。保存草稿后仍需发布才会影响下次打印。");
        setLayoutEditorBusy(false);
        renderLayoutEditor();
        layoutEditor.hidden = false;
      }

      function updateEditorLayoutField(field, rawValue) {
        const element = currentEditorElement();
        if (!element || layoutOperationBusy || (!element.visible && element.kind !== "qr")) return;
        if (field === "text_align") {
          if (["left", "center", "right"].includes(rawValue)) element.text_align = rawValue;
        } else {
          const number = finiteNumber(rawValue);
          if (number === null) return;
          if (field === "x_mm") element.x_mm = roundedMm(clipped(number, 0, 40 - Number(element.width_mm)));
          if (field === "y_mm") element.y_mm = roundedMm(clipped(number, 0, 30 - Number(element.height_mm)));
          if (field === "width_mm") element.width_mm = roundedMm(clipped(number, .1, 40 - Number(element.x_mm)));
          if (field === "height_mm") element.height_mm = roundedMm(clipped(number, .1, 30 - Number(element.y_mm)));
          if (field === "font_size_mm" && element.kind === "text") element.font_size_mm = roundedMm(clipped(number, 1, 10));
        }
        showEditorLayoutMutationStatus("布局有未保存修改。先保存草稿，再发布给后续打印使用。");
        renderLayoutEditor();
      }

      function updateQuantityFixedSuffix(rawValue) {
        const element = currentEditorElement();
        if (!element || element.id !== "quantity" || !element.visible || layoutOperationBusy) return;
        const value = String(rawValue ?? "").trim();
        if (!validFixedSuffix(value)) {
          layoutFixedSuffix.value = quantityFixedSuffix(element);
          showLayoutStatus("数量后的固定说明最多8个字符，只能使用简短中文、英文字母或单位分隔符。", "error");
          return;
        }
        element.fixed_suffix = value;
        showEditorLayoutMutationStatus(value
          ? `数量将显示为“实际数量${value}”，真实数量不会被修改。`
          : "固定说明已删除，标签只显示真实数量。保存草稿后再发布才会生效。");
        renderLayoutEditor();
      }

      function toggleCurrentLayoutElementVisibility() {
        const element = currentEditorElement();
        if (!element || element.kind === "qr" || layoutOperationBusy) return;
        element.visible = !element.visible;
        layoutDrag = null;
        const overlap = element.visible ? findVisibleLayoutOverlap(editorLayout) : null;
        showLayoutStatus(overlap
          ? `${LAYOUT_ELEMENT_LABELS[element.id]}已恢复，但${LAYOUT_ELEMENT_LABELS[overlap[0]]}与${LAYOUT_ELEMENT_LABELS[overlap[1]]}重叠，请先调整位置。`
          : element.visible
            ? `${LAYOUT_ELEMENT_LABELS[element.id]}已恢复显示；保存草稿后再发布才会生效。`
            : `${LAYOUT_ELEMENT_LABELS[element.id]}已从标签中删除显示；业务数据仍保留，可随时恢复。`,
        overlap ? "error" : "");
        renderLayoutEditor();
      }

      function layoutMutationKey(signature, prefix) {
        if (!layoutMutationAttempt || layoutMutationAttempt.signature !== signature) {
          layoutMutationAttempt = {signature, operationKey:newIdempotencyKey(prefix)};
        }
        return layoutMutationAttempt.operationKey;
      }

      async function saveLayoutDraft({quiet=false} = {}) {
        if (!editorLayout || !layoutAdminState || layoutOperationBusy) return false;
        setLayoutEditorBusy(true);
        try {
          validateLayoutEnvelope({layout:editorLayout}, {checkVisibleOverlap:true});
          await preflightEditorLayout();
          const signature = `draft|${layoutAdminState.draft.version}|${JSON.stringify(editorLayout)}`;
          const result = await requestJson("/api/requisition/production-packaging-label-layout/admin/draft", {
            method:"PUT",
            body:JSON.stringify({
              operation_key:layoutMutationKey(signature, "p166b-layout-draft"),
              expected_draft_version:layoutAdminState.draft.version,
              layout:editorLayout,
            }),
          });
          layoutMutationAttempt = null;
          layoutAdminState = result;
          editorLayout = deepClone(result.draft.layout);
          if (!quiet) showLayoutStatus(`草稿 v${result.draft.version} 已保存；打印仍使用已发布 v${result.published.version}。`, "success");
          return true;
        } catch (error) {
          showLayoutStatus(error instanceof TypeError ? "无法连接 ERP 服务，重试会复用同一操作编号。" : error?.message || "保存草稿失败", "error");
          return false;
        } finally {
          setLayoutEditorBusy(false);
          renderLayoutEditor();
        }
      }

      async function runReleaseOperation(operation, endpoint, confirmationText) {
        if (!layoutAdminState || layoutOperationBusy || !window.confirm(confirmationText)) return false;
        const signature = `${operation}|${layoutAdminState.draft.version}|${layoutAdminState.published.version}`;
        setLayoutEditorBusy(true);
        try {
          const result = await requestJson(endpoint, {
            method:"POST",
            body:JSON.stringify({
              operation_key:layoutMutationKey(signature, `p166b-layout-${operation}`),
              expected_draft_version:layoutAdminState.draft.version,
              expected_release_version:layoutAdminState.published.version,
            }),
          });
          layoutMutationAttempt = null;
          layoutAdminState = result;
          editorLayout = deepClone(result.draft.layout);
          closeLayoutEditor(true);
          await loadPackage();
          showMessage(`标签布局已发布为 v${result.published.version}；从下一次新建打印作业起生效，历史作业不变。`, "message success");
          return true;
        } catch (error) {
          showLayoutStatus(error instanceof TypeError ? "无法连接 ERP 服务，重试会复用同一操作编号。" : error?.message || "发布布局失败", "error");
          return false;
        } finally {
          setLayoutEditorBusy(false);
          if (!layoutEditor.hidden) renderLayoutEditor();
        }
      }

      async function publishLayout() {
        if (!editorLayout || !layoutAdminState || layoutOperationBusy) return;
        const draftMatches = JSON.stringify(editorLayout) === JSON.stringify(layoutAdminState.draft.layout);
        if (!draftMatches && !(await saveLayoutDraft({quiet:true}))) return;
        await runReleaseOperation(
          "publish",
          "/api/requisition/production-packaging-label-layout/admin/publish",
          "确认发布当前草稿吗？发布后只影响下一次新建的打印作业，历史作业保持原布局。",
        );
      }

      async function render(normalized, {isPrepared=false, showPrintConfirmation=false} = {}) {
        const packageData = normalized.packageData;
        validatePackage(packageData);
        applyTemplate(packageData.template_version);
        if (isPrepared) {
          printPlanPanel.hidden = true;
          plannedPackage = null;
          printCounts = new Map();
          labelList.innerHTML = packageData.labels.map((label) => labelHtml(label, packageData)).join("");
        } else {
          renderPrintPlanEditor(packageData);
        }
        if (document.fonts?.ready) await document.fonts.ready;
        await new Promise((resolve) => requestAnimationFrame(resolve));
        validateRenderedLabels();
        loadedPackage = packageData;
        loadedJob = normalized.job || null;
        updateLatestJobLink(normalized);
        printButton.textContent = Number.isInteger(requestedJobId) && requestedJobId > 0 ? "补打冻结作业" : "打印包装标签";
        printButton.disabled = false;
        confirmPrintedButton.hidden = !(showPrintConfirmation && isPrepared && loadedJob && !loadedJob.printed_at && loadedJob.status !== "printed");
        if (isPrepared && !showPrintConfirmation) {
          const summary = packageData.print_summary;
          showMessage(summary
            ? `已载入冻结打印作业：本次 ${summary.print_label_count} 张 / 系统计划 ${summary.system_label_count} 张；补打数量不会自动扩大。`
            : "已载入冻结打印作业；本次补打不会改写原标签计划。", "message");
        } else {
          message.hidden = true;
        }
        void refreshLayoutAdminState();
      }

      function resetView() {
        loadedPackage = null;
        loadedJob = null;
        plannedPackage = null;
        printCounts = new Map();
        printPlanPanel.hidden = true;
        printButton.disabled = true;
        confirmPrintedButton.hidden = true;
        latestJobLink.hidden = true;
        layoutButton.hidden = true;
        layoutAdminState = null;
        labelList.innerHTML = "";
        showMessage("正在读取冻结的生产包装标签计划……");
      }

      async function loadPackage() {
        const generation = ++loadGeneration;
        if (activeController) activeController.abort();
        activeController = new AbortController();
        resetView();
        const loadingJob = Number.isInteger(requestedJobId) && requestedJobId > 0;
        const loadingSupplier = Number.isInteger(supplierOrderId) && supplierOrderId > 0;
        const loadingComposite = Number.isInteger(compositeBatchId) && compositeBatchId > 0 && compositeItemIds.length > 0;
        if (!loadingJob && !loadingSupplier && !loadingComposite) {
          showMessage("报料单编号无效", "message error");
          return;
        }
        try {
          const url = loadingJob
            ? `/api/requisition/production-packaging-label-jobs/${requestedJobId}`
            : loadingComposite
              ? `/api/requisition/batches/${compositeBatchId}/production-packaging-label-package?item_ids=${encodeURIComponent(compositeItemIds.join(","))}`
              : `/api/requisition/supplier-orders/${supplierOrderId}/production-packaging-label-package`;
          const payload = await requestJson(url, {method:"GET", signal:activeController.signal});
          if (generation !== loadGeneration) return;
          const normalized = normalizeResponse(payload);
          await render(normalized, {isPrepared:loadingJob, showPrintConfirmation:false});
        } catch (error) {
          if (error && error.name === "AbortError") return;
          if (generation !== loadGeneration) return;
          showMessage(error instanceof TypeError
            ? "无法连接 ERP 服务，请检查网络后重试"
            : error?.message || "连接 ERP 失败，请重试", "message error");
        }
      }

      function planFingerprint(packageData) {
        return requiredText(packageData?.plan_fingerprint || packageData?.fingerprint || packageData?.label_plan_fingerprint);
      }

      async function preparePrintJob() {
        const fingerprint = planFingerprint(loadedPackage);
        if (!fingerprint) throw new Error("标签计划缺少校验指纹，已停止创建打印作业；请重新加载");
        const items = (plannedPackage?.plans || []).map((plan) => ({
          production_task_id:Number(plan.production_task_id),
          print_label_count:parsePrintCount(printCounts.get(Number(plan.production_task_id)), Number(plan.label_count)),
        }));
        if (!items.some((item) => item.print_label_count > 0)) throw new Error("本次未选择需要打印的标签");
        const sourceSignature = Number.isInteger(compositeBatchId) && compositeBatchId > 0
          ? `composite:${compositeBatchId}:${compositeItemIds.join(",")}`
          : `supplier:${supplierOrderId}`;
        const signature = `${sourceSignature}|${loadedPackage.template_version}|${fingerprint}|${JSON.stringify(items)}`;
        if (!prepareAttempt || prepareAttempt.signature !== signature) {
          prepareAttempt = {signature, idempotencyKey:newIdempotencyKey("p150c-label-job")};
        }
        const isComposite = Number.isInteger(compositeBatchId) && compositeBatchId > 0;
        const url = isComposite
          ? `/api/requisition/batches/${compositeBatchId}/production-packaging-label-jobs`
          : `/api/requisition/supplier-orders/${supplierOrderId}/production-packaging-label-jobs`;
        const payload = await requestJson(url, {
          method:"POST",
          body:JSON.stringify({
            idempotency_key:prepareAttempt.idempotencyKey,
            confirmed:true,
            plan_fingerprint:fingerprint,
            items,
            ...(isComposite ? {selected_item_ids:compositeItemIds} : {}),
          }),
        });
        const normalized = normalizeResponse(payload);
        if (!normalized.job || !positiveInteger(normalized.job.id)) throw new Error("服务器未返回冻结打印作业编号，已停止打印");
        prepareAttempt = null;
        return normalized;
      }

      async function startPrint() {
        if (printing || !loadedPackage) return;
        printing = true;
        printButton.disabled = true;
        confirmPrintedButton.hidden = true;
        try {
          if (!positiveInteger(loadedJob?.id) && !(selectedPrintPackage()?.labels?.length)) throw new Error("本次未选择需要打印的标签");
          validateRenderedLabels();
          const hasFrozenJob = positiveInteger(loadedJob?.id);
          if (!hasFrozenJob) {
            showMessage("正在冻结本次打印作业……");
            const normalized = await preparePrintJob();
            await render(normalized, {isPrepared:true, showPrintConfirmation:false});
          }
          validateRenderedLabels();
          window.print();
          if (loadedJob?.status === "printed" || loadedJob?.printed_at) {
            showMessage("已打开历史作业打印对话框；补打沿用原作业的冻结内容和纸型。", "message");
          } else {
            confirmPrintedButton.hidden = false;
            showMessage("若打印机已经实际出纸，请点“确认已实际打印”；取消或仅预览时不要确认。", "message");
          }
        } catch (error) {
          showMessage(error instanceof TypeError
            ? "无法连接 ERP 服务；本次未登记实际打印，可直接重试"
            : `${error?.message || "打印准备失败"}；本次未登记实际打印`, "message error");
        } finally {
          printing = false;
          printButton.disabled = !loadedPackage || (!positiveInteger(loadedJob?.id) && !(selectedPrintPackage()?.labels?.length));
        }
      }

      allPlannedButton.addEventListener("click", () => setAllPrintCounts("planned"));
      allZeroButton.addEventListener("click", () => setAllPrintCounts("zero"));

      async function confirmPrinted() {
        const jobId = Number(loadedJob?.id || 0);
        if (!positiveInteger(jobId) || confirmationAttempt?.submitting) return;
        const signature = String(jobId);
        if (!confirmationAttempt || confirmationAttempt.signature !== signature) {
          confirmationAttempt = {signature, idempotencyKey:newIdempotencyKey("p150c-label-printed"), submitting:false};
        }
        confirmationAttempt.submitting = true;
        confirmPrintedButton.disabled = true;
        try {
          await requestJson(`/api/requisition/production-packaging-label-jobs/${jobId}/confirm`, {
            method:"POST",
            body:JSON.stringify({idempotency_key:confirmationAttempt.idempotencyKey, confirmed:true}),
          });
          confirmationAttempt = null;
          loadedJob.status = "printed";
          loadedJob.printed_at = new Date().toISOString();
          confirmPrintedButton.hidden = true;
          const summary = loadedPackage?.print_summary;
          const countText = summary ? `本次 ${summary.print_label_count} 张 / 系统计划 ${summary.system_label_count} 张；` : "";
          showMessage(`打印作业 #${jobId} 已登记为“实际打印”；${countText}标签计划与生产状态均未改变。`, "message success");
        } catch (error) {
          confirmationAttempt.submitting = false;
          confirmPrintedButton.disabled = false;
          showMessage(error instanceof TypeError
            ? "无法连接 ERP 服务，尚未登记实际打印；重试会复用同一幂等键"
            : `${error?.message || "登记失败"}；尚未登记实际打印，重试会复用同一幂等键`, "message error");
        }
      }

      layoutElementSelect.addEventListener("change", () => {
        if (!editorLayout || !REQUIRED_LAYOUT_IDS.includes(layoutElementSelect.value)) return;
        selectedLayoutElementId = layoutElementSelect.value;
        renderLayoutEditor();
      });
      [layoutX, layoutY, layoutWidth, layoutHeight, layoutFontSize].forEach((input) => {
        input.addEventListener("change", () => updateEditorLayoutField(input.dataset.layoutField, input.value));
      });
      layoutAlign.addEventListener("change", () => updateEditorLayoutField("text_align", layoutAlign.value));
      layoutFixedSuffix.addEventListener("change", () => updateQuantityFixedSuffix(layoutFixedSuffix.value));
      layoutClearFixedSuffixButton.addEventListener("click", () => updateQuantityFixedSuffix(""));
      layoutVisibilityButton.addEventListener("click", toggleCurrentLayoutElementVisibility);
      layoutStage.addEventListener("pointerdown", (event) => {
        const target = event.target.closest("[data-layout-editor-id]");
        if (!target || !editorLayout || layoutOperationBusy) return;
        selectedLayoutElementId = target.dataset.layoutEditorId;
        const element = currentEditorElement();
        if (!element) return;
        layoutDrag = {
          pointerId:event.pointerId,
          startClientX:event.clientX,
          startClientY:event.clientY,
          startX:Number(element.x_mm),
          startY:Number(element.y_mm),
        };
        layoutStage.setPointerCapture?.(event.pointerId);
        renderLayoutEditor();
        event.preventDefault();
      });
      layoutStage.addEventListener("pointermove", (event) => {
        if (!layoutDrag || event.pointerId !== layoutDrag.pointerId || !editorLayout) return;
        const element = currentEditorElement();
        if (!element) return;
        const rect = layoutStage.getBoundingClientRect();
        const scaleX = rect.width / 40;
        const scaleY = rect.height / 30;
        element.x_mm = roundedMm(clipped(layoutDrag.startX + (event.clientX - layoutDrag.startClientX) / scaleX, 0, 40 - Number(element.width_mm)));
        element.y_mm = roundedMm(clipped(layoutDrag.startY + (event.clientY - layoutDrag.startClientY) / scaleY, 0, 30 - Number(element.height_mm)));
        showEditorLayoutMutationStatus("布局有未保存修改。先保存草稿，再发布给后续打印使用。");
        renderLayoutEditor();
        event.preventDefault();
      });
      const endLayoutDrag = (event) => {
        if (!layoutDrag || event.pointerId !== layoutDrag.pointerId) return;
        try { layoutStage.releasePointerCapture?.(event.pointerId); } catch (_error) { /* no-op */ }
        layoutDrag = null;
      };
      layoutStage.addEventListener("pointerup", endLayoutDrag);
      layoutStage.addEventListener("pointercancel", endLayoutDrag);

      retryButton.addEventListener("click", loadPackage);
      printButton.addEventListener("click", startPrint);
      layoutButton.addEventListener("click", openLayoutEditor);
      layoutCloseButton.addEventListener("click", () => closeLayoutEditor());
      layoutSaveButton.addEventListener("click", () => saveLayoutDraft());
      layoutPublishButton.addEventListener("click", publishLayout);
      layoutDefaultButton.addEventListener("click", () => runReleaseOperation(
        "restore-default",
        "/api/requisition/production-packaging-label-layout/admin/restore-default",
        "确认恢复默认布局并立即发布吗？当前草稿不会继续用于打印。",
      ));
      layoutRollbackButton.addEventListener("click", () => runReleaseOperation(
        "rollback",
        "/api/requisition/production-packaging-label-layout/admin/rollback",
        "确认把上一版已发布布局重新发布为当前布局吗？",
      ));
      confirmPrintedButton.addEventListener("click", confirmPrinted);
      closeButton.addEventListener("click", () => window.close());
      loadPackage();
    })();
  </script>
</body>
</html>
