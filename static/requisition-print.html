<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>供应商采购报料单</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#111;font:14px/1.35 "Microsoft YaHei",sans-serif}
    .sheet{width:900px;margin:18px auto;padding:20px 24px;background:#fff;box-shadow:0 4px 18px #0002}
    .title{text-align:center}.title h1{margin:0;font-size:21px}.title div{margin-top:3px;font-size:21px;letter-spacing:8px}
    .head{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0 10px}.meta{text-align:right;line-height:1.7}
    table{width:100%;border-collapse:collapse}th,td{border:1px solid #111;padding:6px;text-align:center}th{background:#f3f4f6}
    .left{text-align:left}.footer{margin-top:12px;text-align:right;font-size:12px;line-height:1.7}.actions{text-align:center;margin:15px}
    button{padding:9px 20px;border:0;border-radius:4px;background:#1769aa;color:#fff;font-weight:700}
    @media print{body{background:#fff}.sheet{width:auto;margin:0;padding:0;box-shadow:none}.actions{display:none}@page{size:A4 landscape;margin:10mm}}
  </style>
</head>
<body>
  <div class="actions" id="printToolbar"><button id="printButton" type="button" data-print-action="print">打印 / 保存为 PDF</button></div>
  <main class="sheet">
    <div class="title"><h1 id="company-name">苏州工业园区天明纸品包装厂</h1><div data-print-edit-key="document_title" data-print-edit-label="单据标题">采购单</div></div>
    <div class="head">
      <div><span data-print-edit-key="supplier_label" data-print-edit-label="供应商标签">TO：</span><span id="supplier"></span></div>
      <div class="meta">
        <div><span data-print-edit-key="number_label" data-print-edit-label="单号标签">NO：</span><span id="number"></span></div>
        <div><span data-print-edit-key="date_label" data-print-edit-label="日期标签">日期：</span><span id="date"></span></div>
      </div>
    </div>
    <table><thead><tr><th data-print-edit-key="column_sequence">序号</th><th data-print-edit-key="column_board_size">纸板长宽（mm）</th><th data-print-edit-key="column_crease">压线(mm）</th><th data-print-edit-key="column_material">材质/楞型</th><th data-print-edit-key="column_quantity">数量</th><th data-print-edit-key="column_remarks">报料备注</th></tr></thead><tbody id="rows"></tbody></table>
    <div id="company-footer" class="footer">
      <div id="addressRow" hidden><span data-print-edit-key="address_label" data-print-edit-label="地址标签">地址：</span><span id="addressValue"></span></div>
      <div id="phoneRow" hidden><span data-print-edit-key="phone_label" data-print-edit-label="电话标签">电话：</span><span id="phoneValue"></span></div>
    </div>
  </main>
  <script src="/static/assets/time-utils.js"></script>
  <script src="/static/assets/print-template-editor.js"></script>
  <script>
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[char]));
    const shortDate = value => {
      try {
        const [year, month, day] = TmTime.formatBusinessDate(value).split("-");
        return `${year.slice(-2)}.${Number(month)}.${Number(day)}`;
      } catch (_) {
        return String(value || "");
      }
    };
    const templateEditor = PrintTemplateEditor.create({
      templateKey:"legacy_requisition",
      root:document,
      toolbar:document.getElementById("printToolbar"),
      printButton:document.getElementById("printButton"),
      onPrint:()=>window.print(),
    });

    (async () => {
      const id = new URLSearchParams(location.search).get("id");
      const response = await fetch(`/api/requisition/batches/${encodeURIComponent(id)}/print`, { credentials: "include" });
      if (!response.ok) {
        document.body.innerHTML = "<p>无法读取报料单，请确认登录状态。</p>";
        return;
      }
      const data = await response.json();
      document.getElementById("company-name").textContent = data.sender?.company_name || "苏州工业园区天明纸品包装厂";
      document.getElementById("number").textContent = data.requisition_number || "";
      document.getElementById("date").textContent = shortDate(data.requisition_date);
      document.getElementById("supplier").textContent = data.supplier_name || "未指定供应商";
      document.getElementById("rows").innerHTML = data.items.map((row, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${escapeHtml(row.specification)}</td>
          <td>${escapeHtml(row.crease_display || "")}</td>
          <td>${escapeHtml(row.material)}</td>
          <td>${escapeHtml(row.quantity)}</td>
          <td class="left">${escapeHtml(row.report_remark || "")}</td>
        </tr>
      `).join("");
      [["addressRow","addressValue",data.sender?.address],["phoneRow","phoneValue",data.sender?.phone]].forEach(([rowId,valueId,value])=>{
        document.getElementById(rowId).hidden=!value;
        document.getElementById(valueId).textContent=value||"";
      });
      await templateEditor.ready;
    })();
  </script>
</body>
</html>
