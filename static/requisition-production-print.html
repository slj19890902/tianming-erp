<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>生产任务单</title>
  <style>
    :root { color-scheme:light; font-family:"Microsoft YaHei","SimSun",sans-serif; color:#111; font-size:14pt; line-height:1.35; }
    * { box-sizing:border-box; }
    body { margin:0; background:#ececec; }
    .toolbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 16px; background:#fff; border-bottom:1px solid #aaa; }
    button { border:1px solid #222; border-radius:4px; background:#fff; color:#111; padding:7px 14px; cursor:pointer; font-size:14px; }
    button.primary { background:#111; color:#fff; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .toolbar-note { margin-left:auto; color:#444; font-size:13px; }
    .message { max-width:980px; margin:16px auto; padding:14px 16px; border-radius:4px; background:#fff; border:1px solid #aaa; }
    .message.error { color:#111; border:2px solid #111; font-weight:700; }
    .pages { display:flex; flex-direction:column; align-items:center; gap:12px; padding:14px; }
    .page { width:210mm; min-height:297mm; padding:8mm 10mm; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.16); overflow:visible; break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    .batch-page { display:block; }
    .task-card { position:relative; min-height:0; padding:4mm 2mm 3mm; overflow:visible; break-inside:auto; page-break-inside:auto; }
    .task-card + .task-card { margin-top:8mm; border-top:.35mm dashed #555; }
    .task-card.blank { display:none; }
    .card-head { display:grid; grid-template-columns:1fr auto; gap:4mm; align-items:start; border-bottom:.55mm solid #111; padding-bottom:1.5mm; }
    .brand { font-size:14pt; font-weight:800; letter-spacing:.3mm; }
    h1 { margin:.8mm 0 0; font-size:15pt; line-height:1.15; letter-spacing:.5mm; }
    .product-qr { width:19.5mm; min-height:19.5mm; display:flex; align-items:center; justify-content:center; text-align:center; font-size:14pt; line-height:1.15; overflow-wrap:anywhere; }
    .product-qr img { display:block; width:19mm; height:19mm; image-rendering:pixelated; }
    .product-qr-missing { border:.3mm solid #777; padding:1.5mm; color:#444; }
    .status { display:inline-block; min-width:18mm; padding:1mm 2mm; border:.3mm solid #111; border-radius:3mm; text-align:center; color:#111; font-size:14pt; font-weight:800; }
    .status.warn { border-width:.55mm; }
    .headline-metrics { display:grid; grid-template-columns:1.24fr .62fr 1.14fr; gap:1.5mm; margin:1.7mm 0; }
    .headline-metric { border:.28mm solid #777; border-radius:2mm; padding:1.4mm 2mm; min-width:0; }
    .headline-metric span { display:block; color:#444; font-size:14pt; }
    .headline-metric strong { display:block; margin-top:.5mm; font-size:14pt; line-height:1.15; overflow-wrap:anywhere; }
    .customer-metric strong { white-space:normal; font-size:14pt; }
    .code-metric strong { font-size:14pt; letter-spacing:-.08mm; }
    .name-metric strong { font-size:14pt; }
    .headline-metric strong.fit-long { font-size:14pt; letter-spacing:-.12mm; }
    .headline-metric strong.fit-very-long { white-space:normal; font-size:14pt; line-height:1.08; }
    .product-strip { display:grid; grid-template-columns:1.25fr .9fr .55fr; gap:2mm; padding:1.2mm 0 1.4mm; border-bottom:.28mm solid #888; }
    .order-facts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1mm; margin:1mm 0; }
    .order-fact { min-width:0; padding:.7mm 1mm; border:.28mm solid #777; border-radius:1.2mm; }
    .order-fact span { display:block; color:#444; font-size:14pt; }
    .order-fact strong { display:block; margin-top:.2mm; font-size:14pt; line-height:1.1; overflow-wrap:anywhere; }
    .field-label { display:block; color:#444; font-size:14pt; }
    .field-value { display:block; margin-top:.5mm; font-weight:800; font-size:14pt; overflow-wrap:anywhere; }
    .production-key-value,.detail-row.production-key-fact .value { font-size:14pt; line-height:1.15; font-weight:800; }
    .process-title { margin:1.6mm 0 .8mm; color:#333; font-size:14pt; font-weight:700; }
    .process-route { display:flex; flex-wrap:wrap; gap:1.2mm; margin:0; padding:0; list-style:none; }
    .process-route li { flex:1 1 35mm; min-width:0; border:.3mm solid #111; border-radius:3mm; padding:1.1mm 1.5mm; text-align:center; font-size:14pt; font-weight:700; overflow-wrap:anywhere; }
    .detail-grid { display:grid; grid-template-columns:1fr; margin-top:1.2mm; border:.3mm solid #555; border-radius:2mm; overflow:visible; min-height:25mm; }
    .detail-list { padding:2mm 2.5mm; }
    .detail-row { display:grid; grid-template-columns:32mm minmax(0,1fr); gap:2mm; padding:.8mm 0; font-size:14pt; line-height:1.25; }
    .detail-row .label { color:#444; }
    .detail-row .value { font-weight:750; overflow-wrap:anywhere; }
    .printing-block { margin:.8mm 0; padding:.8mm 0; border-top:.28mm solid #999; border-bottom:.28mm solid #999; }
    .printing-block-title { margin:.4mm 0; font-size:14pt; font-weight:800; overflow-wrap:anywhere; }
    .printing-plate-line { white-space:normal; overflow-wrap:anywhere; }
    .printing-stack { min-width:0; }
    .printing-plates-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1mm; margin:.7mm 0; }
    .printing-plate-card { min-width:0; padding:.7mm .9mm; border:.28mm solid #777; border-radius:1.2mm; font-size:14pt; line-height:1.16; overflow-wrap:anywhere; }
    .printing-plate-card > span { display:block; color:#444; font-size:14pt; }
    .printing-plate-card > strong { display:block; margin:.2mm 0; font-size:14pt; }
    .printing-plate-card > small { display:block; margin-top:.2mm; color:#333; font-size:14pt; line-height:1.12; }
    .process-detail-stack { display:grid; gap:1mm; margin-top:1.4mm; }
    .mold-focus { border:.55mm solid #111; border-radius:2mm; padding:1.3mm 2mm; }
    .mold-focus-title { display:flex; justify-content:space-between; gap:2mm; font-size:14pt; font-weight:800; }
    .mold-focus-row { display:grid; grid-template-columns:1fr 1.2fr; gap:2mm; align-items:baseline; margin-top:.8mm; }
    .mold-focus-code { font-size:14pt; line-height:1.1; font-weight:900; overflow-wrap:anywhere; }
    .mold-focus-location { font-size:14pt; line-height:1.15; font-weight:850; overflow-wrap:anywhere; }
    .mold-focus-note { margin-top:.7mm; color:#333; font-size:14pt; }
    .joining-block { border-top:.28mm solid #999; border-bottom:.28mm solid #999; padding:.9mm 0; }
    .warning { margin-top:1.5mm; padding:1.2mm 2mm; border:.55mm solid #111; color:#111; font-size:14pt; font-weight:800; }
    .receipt-facts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1mm; margin:1.5mm 0; padding:1.2mm 1.5mm; border:.45mm solid #111; }
    .receipt-fact span { display:block; color:#444; font-size:14pt; }
    .receipt-fact strong { display:block; margin-top:.4mm; font-size:14pt; overflow-wrap:anywhere; }
    .supporting-grid { display:grid; grid-template-columns:1fr; gap:1mm; }
    .supporting-stack { min-width:0; }
    .foot { display:flex; justify-content:space-between; align-items:flex-end; gap:3mm; margin-top:1.2mm; color:#444; font-size:14pt; }
    .safe-only { display:none !important; }
    body.customer-safe .internal-only { display:none !important; }
    body.customer-safe .safe-only { display:inline !important; }
    .task-card small { font-size:14pt; }
    @page { size:A4 portrait; margin:8mm 10mm; }
    @media print {
      body { background:#fff; }
      .toolbar,.message { display:none !important; }
      .pages { display:block; padding:0; }
      .page { width:auto; min-height:0; padding:0; box-shadow:none; margin:0; }
      .task-card { padding:0; orphans:3; widows:3; }
      .task-card + .task-card { margin-top:0; border-top:0; break-before:page; page-break-before:always; }
      .card-head { break-inside:avoid; page-break-inside:avoid; }
      .headline-metrics,.product-strip,.order-facts,.receipt-facts { display:grid; }
      .process-detail-stack,.supporting-grid,.detail-grid,.printing-plates-grid { display:block; }
      .printing-plate-card { margin-bottom:2mm; }
      .detail-row { display:block; }
      .detail-row .label,.detail-row .value { display:block; }
      .printing-block-title,.process-title { break-after:avoid; page-break-after:avoid; }
      .foot { display:block; }
      .foot > span { display:block; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="retryButton" type="button">重新加载</button>
    <button id="printButton" class="primary" type="button" disabled>打印</button>
    <button id="modeButton" type="button">切换客户随货版</button>
    <button id="labelButton" type="button" disabled>生产包装标签</button>
    <button id="labelRefreshButton" type="button" hidden disabled>按常用箱刷新标签计划</button>
    <button id="closeButton" type="button">关闭</button>
    <span id="toolbarNote" class="toolbar-note">黑白打印 · 每个生产任务另起页 · 正文字号不小于 14pt · 长内容自动续页</span>
  </div>
  <div id="message" class="message">正在读取正式报料快照…</div>
  <main id="pages" class="pages" aria-live="polite"></main>
  <script>
    (() => {
      "use strict";
      const message = document.getElementById("message");
      const pagesHost = document.getElementById("pages");
      const retryButton = document.getElementById("retryButton");
      const printButton = document.getElementById("printButton");
      const modeButton = document.getElementById("modeButton");
      const labelButton = document.getElementById("labelButton");
      const labelRefreshButton = document.getElementById("labelRefreshButton");
      const closeButton = document.getElementById("closeButton");
      const toolbarNote = document.getElementById("toolbarNote");
      const params = new URLSearchParams(window.location.search);
      const batchId = (params.get("batch_id") || "").trim().toLowerCase();
      const batchMode = /^[0-9a-f]{64}$/.test(batchId);
      const receiptItemIdsText = (params.get("receipt_item_ids") || "").trim();
      const receiptItemIds = receiptItemIdsText
        ? receiptItemIdsText.split(",").map((value) => Number(value.trim())).filter((value) => Number.isInteger(value) && value > 0)
        : [];
      const receiptBatchMode = receiptItemIds.length > 0
        && new Set(receiptItemIds).size === receiptItemIds.length
        && receiptItemIds.length <= 20;
      const receiptMode = window.location.pathname.endsWith("/incoming-production-card.html")
        || params.has("receipt_item_id")
        || receiptBatchMode;
      const sourceId = Number(params.get("receipt_item_id") || params.get("id"));
      const orderId = receiptMode ? null : sourceId;
      const receiptItemId = receiptMode ? sourceId : null;
      const openToken = params.get("open_token") || "";
      const readyChannel = receiptMode && openToken && typeof BroadcastChannel === "function"
        ? new BroadcastChannel(`erp-incoming-production-card-${openToken}`)
        : null;
      readyChannel?.postMessage({type:"ready"});
      setTimeout(() => readyChannel?.close(), 0);
      let customerSafe = params.get("mode") === "customer";
      let loadGeneration = 0;
      let activeController = null;
      let loadedPackage = null;

      const escapeHtml = (value) => String(value ?? "-")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
      const textList = (value) => Array.isArray(value) && value.length
        ? value.map((item) => String(item)).join(" / ") : "-";
      const dateText = (value) => value ? String(value).slice(0, 10) : "-";
      const unique = (values) => Array.from(new Set(values.filter((value) => value !== null && value !== undefined && String(value).trim()).map((value) => String(value).trim())));
      const numberText = (value) => value === null || value === undefined || value === "" ? "-" : String(value).replace(/\.0+$/, "");
      const paperText = (value, limit = 48) => {
        const text = String(value ?? "-").trim() || "-";
        const characters = Array.from(text);
        return characters.length > limit ? `${characters.slice(0, limit).join("")}…扫码查看` : text;
      };
      const paperList = (values, limit, fitLevel) => {
        const text = textList(values);
        return fitLevel === "ultra" ? paperText(text, limit) : text;
      };

      function errorMessage(status, payload) {
        const detail = payload && typeof payload === "object" ? payload.detail : null;
        if (typeof detail === "string" && detail.trim()) return detail.trim();
        if (detail && typeof detail === "object" && typeof detail.message === "string") {
          return detail.code ? `${detail.message}（${detail.code}）` : detail.message;
        }
        if (Array.isArray(detail) && detail.length) return detail.map((item) => item && item.msg ? item.msg : String(item)).join("；");
        if (status === 401) return "登录已失效，请回到 ERP 重新登录后再试";
        if (status === 403) return "没有查看该报料单的权限";
        if (status === 404) return "报料单不存在";
        return `加载失败（HTTP ${status || "网络连接失败"}）`;
      }

      function titleFor(card) {
        if (card.source_type === "stock_replenishment") return "库存补库待来料任务单";
        if (card.layout_kind === "die_cut") return "模切内盒生产任务单";
        if (card.layout_kind === "liner") return "衬板生产任务单";
        if (card.box_type_code === "a1_0201") return "A1 型纸箱生产任务单";
        return `${card.box_style || "纸箱"}生产任务单`;
      }

      function componentSizes(card) {
        return unique((card.components || []).map((line) => {
          if (!line.report_length_mm || !line.report_width_mm) return null;
          const label = (card.components || []).length > 1 ? `${line.component_label || "整片"} ` : "";
          return `${label}${numberText(line.report_length_mm)} × ${numberText(line.report_width_mm)} mm`;
        }));
      }

      function finishedSize(card) {
        const frozen = textList(card.specifications || []);
        if (frozen !== "-") return frozen;
        const values = [card.finished_length_mm, card.finished_width_mm];
        if (card.layout_kind !== "liner") values.push(card.finished_height_mm);
        if (values.some((value) => value === null || value === undefined || value === "")) return textList(card.specifications);
        return `${values.map(numberText).join(" × ")} mm`;
      }

      function firstValues(card, key) {
        return unique((card.components || []).map((line) => line[key]));
      }

      function processSteps(card) {
        if (card.layout_kind === "liner") return ["无需后加工", "计数", "捆扎"];
        const text = textList(card.production_steps || []);
        const steps = [];
        const add = (value) => { if (!steps.includes(value)) steps.push(value); };
        if ((card.components || []).some((line) => line.mold_display_name || line.mold_name || line.mold_code)) add("模具");
        if (text.includes("印刷") || firstValues(card, "print_content").some((value) => !["无印刷", "无", "否", "不印刷"].includes(value))) add("印刷");
        if (card.joining_method && card.joining_method.includes("粘贴")) add("粘贴");
        if (text.includes("开槽")) add("开槽");
        if (text.includes("压线")) add("压线");
        if (!(card.components || []).some((line) => line.mold_display_name || line.mold_name || line.mold_code) && (card.layout_kind === "die_cut" || text.includes("模切"))) add("模切");
        if (text.includes("清废")) add("清废");
        if (card.joining_method) card.joining_method.split(" / ").filter((value) => !["粘贴", "无需结合"].includes(value)).forEach(add);
        return steps.length ? steps.slice(0, 6) : ["无需后加工"];
      }

      function processHtml(card, fitLevel = "normal") {
        return `<div data-capacity-label="工艺路线"><div class="process-title">工艺路线</div><ol class="process-route">${processSteps(card).map((step) => `<li>${escapeHtml(fitLevel === "ultra" ? paperText(step, 10) : step)}</li>`).join("")}</ol></div>`;
      }

      function detailRow(label, value, extraClass = "") {
        return `<div class="detail-row ${extraClass}"><span class="label">${escapeHtml(label)}</span><span class="value">${escapeHtml(value || "-")}</span></div>`;
      }

      function printingComponentHtml(component, componentIndex, componentCount) {
        const fitLevel = arguments[3] || "normal";
        const content = String(component && (component.printing_situation || component.print_content) || "").trim();
        if (!content || ["无印刷", "无", "否", "不印刷"].includes(content)) return "";
        const compact = fitLevel === "ultra";
        const titlePrefix = component && (component.mold_display_name || component.mold_name || component.mold_code) ? "第 2 工序 · " : "";
        const title = componentCount > 1
          ? `${titlePrefix}${component.component_label || component.product_code || `组件${componentIndex + 1}`} · 印刷`
          : `${titlePrefix}印刷`;
        const rows = [];
        let plateCards = "";
        if (component.printing_plate_mode !== "plate") {
          rows.push(detailRow("印刷情况", compact ? paperText(content, 30) : content));
          if (component.printing_colors_frozen === false) {
            rows.push(detailRow("印刷颜色", "历史颜色未冻结"));
          } else {
            const colors = Array.isArray(component.printing_colors)
              ? component.printing_colors.map((value) => String(value || "").trim()).filter(Boolean)
              : [];
            rows.push(detailRow("印刷颜色", compact ? paperList(colors, 30, fitLevel) : (colors.length ? colors.join("＋") : "颜色待完善")));
          }
          rows.push(detailRow("挂板方式", "不挂板"));
        } else {
          const plates = Array.isArray(component.printing_plates) ? component.printing_plates : [];
          rows.push(detailRow("印刷情况", compact ? paperText(component.printing_situation || `挂板印刷（${plates.length}色）`, 30) : (component.printing_situation || `挂板印刷（${plates.length}色）`)));
          if (compact && plates.length) {
            const summary = plates.map((plate, index) => `第${index + 1}色 ${paperText(plate.color_name || "未冻结", 8)} / ${paperText(plate.plate_code || "未冻结", 12)}`).join("；");
            rows.push(detailRow("挂板", `${paperText(summary, 68)}（明细扫码查看）`));
          }
          plateCards = !compact && plates.length ? `<div class="printing-plates-grid">${plates.map((plate, index) => `
            <div class="printing-plate-card printing-plate-line">
              <span>第${index + 1}色</span>
              <strong>颜色：${escapeHtml(plate.color_name || "未冻结")}</strong>
              <div>挂板编号：${escapeHtml(plate.plate_code || "未冻结")}</div>
              <div>挂板内容：${escapeHtml(plate.plate_name || "未冻结")}</div>
              ${plate.current_location ? `<small class="internal-only">当前位置：${escapeHtml(plate.current_location)}</small>` : ""}
            </div>`).join("")}</div>` : "";
          if (!plates.length) rows.push(detailRow("挂板快照", "历史挂板明细未冻结"));
          const machine = [component.machine_set_length_mm, component.machine_set_width_mm, component.machine_set_height_mm]
            .map(numberText).join(" × ");
          if (compact) {
            rows.push(detailRow("设备", `对版 ${numberText(component.plate_alignment_value_mm)}｜挂版 ${numberText(component.plate_mount_value_mm)}｜机设 ${paperText(machine, 20)} mm`, "internal-only printing-machine-line"));
          } else {
            rows.push(detailRow(
              "设备参数",
              `对版值 ${numberText(component.plate_alignment_value_mm)} mm｜挂版值 ${numberText(component.plate_mount_value_mm)} mm｜机器设定 ${machine} mm`,
              "internal-only printing-machine-line",
            ));
          }
        }
        return `<section class="printing-block"><div class="printing-block-title">${escapeHtml(compact ? paperText(title, 22) : title)}</div>${rows.join("")}${plateCards}</section>`;
      }

      function printingHtml(card) {
        const fitLevel = arguments[1] || "normal";
        const components = Array.isArray(card.components) ? card.components : [];
        const printable = components.filter((component) => {
          const content = String(component && (component.printing_situation || component.print_content) || "").trim();
          return content && !["无印刷", "无", "否", "不印刷"].includes(content);
        });
        const visible = fitLevel === "ultra" ? printable.slice(0, 2) : printable;
        const blocks = visible.map((component, index) => printingComponentHtml(component, index, printable.length, fitLevel)).filter(Boolean).join("");
        if (!blocks) return "";
        const more = fitLevel === "ultra" && printable.length > visible.length
          ? `<section class="printing-block"><div class="printing-block-title">其余印刷</div>${detailRow("印刷组件", `另 ${printable.length - visible.length} 项，扫码核对完整挂板信息`)}</section>`
          : "";
        return `<div class="printing-stack">${blocks}${more}</div>`;
      }

      function printingComplexity(card) {
        return (Array.isArray(card && card.components) ? card.components : []).reduce((total, component) => {
          const content = String(component && (component.printing_situation || component.print_content) || "").trim();
          if (!content || ["无印刷", "无", "否", "不印刷"].includes(content)) return total;
          if (component.printing_plate_mode !== "plate") return total + 2;
          const plateCount = Array.isArray(component.printing_plates) ? component.printing_plates.length : 0;
          return total + 4 + plateCount * 2;
        }, 0);
      }

      function cardNeedsCompactLayout(card) {
        const components = Array.isArray(card && card.components) ? card.components : [];
        const printableComponents = components.filter((component) => {
          const content = String(component && (component.printing_situation || component.print_content) || "").trim();
          return content && !["无印刷", "无", "否", "不印刷"].includes(content);
        });
        return printingComplexity(card) >= 6 || printableComponents.length > 1;
      }

      function printPageLayouts(cards) {
        const layouts = [];
        const source = Array.isArray(cards) ? cards : [];
        for (let index = 0; index < source.length; index += 2) {
          layouts.push({ fullPage:false, top:source[index], bottom:source[index + 1] || null });
        }
        return layouts;
      }

      function detailHtml(card) {
        const fitLevel = arguments[1] || "normal";
        const sizes = textList(componentSizes(card));
        const materials = unique((card.components || []).map((line) => line.material_code));
        const flute = unique((card.components || []).map((line) => [line.flute_type, line.layer_count ? `${line.layer_count}层` : null].filter(Boolean).join(" / ")));
        const crease = textList(firstValues(card, "crease_display"));
        const cutting = textList(firstValues(card, "cutting_mode"));
        const fit = (value, limit = 42) => fitLevel === "ultra" ? paperText(value, limit) : value;
        if (card.layout_kind === "liner") {
          const quantityUnit = card.output_unit || "张";
          const perBundle = card.production_label_units_per_bundle ? `${card.production_label_units_per_bundle} ${quantityUnit}` : "未设置";
          const bundleCount = card.estimated_bundle_count ? `${card.estimated_bundle_count} 捆` : "待核对";
          return [
            detailRow("成品尺寸", fit(finishedSize(card))),
            detailRow("材质 / 楞型", fit(`${textList(materials)} / ${textList(flute)}`)),
            detailRow("开料方式", fit(cutting)),
            detailRow("总数量", `${card.planned_finished_quantity || 0} ${card.output_unit || "张"}`),
            detailRow("每捆数量", perBundle),
            detailRow("预计捆数", bundleCount),
            detailRow("加工要求", "无需加工，齐边捆扎"),
          ].join("");
        }
        if (card.layout_kind === "die_cut") {
          return [
            detailRow("纸板尺寸", fit(sizes)),
            detailRow("材质 / 楞型", fit(`${textList(materials)} / ${textList(flute)}`)),
            detailRow("开料方式", fit(cutting)),
            ...(card.joining_method && card.joining_method.includes("粘贴") ? [] : [detailRow("结合方式", fit(card.joining_method || "无需结合"), "production-key-fact")]),
          ].join("");
        }
        return [
          detailRow("纸板尺寸", fit(sizes)),
          detailRow("材质 / 楞型", fit(`${textList(materials)} / ${textList(flute)}`)),
          detailRow("压线尺寸", fit(crease), "production-key-fact"),
          ...(card.joining_method && card.joining_method.includes("粘贴") ? [] : [detailRow("结合方式", fit(card.joining_method || "无需结合"), "production-key-fact")]),
        ].join("");
      }

      function receiptFactsHtml(card, fitLevel = "normal") {
        if (card.paper_phase !== "actual_receipt") return "";
        const actualSize = card.actual_board_length_mm && card.actual_board_width_mm
          ? `${numberText(card.actual_board_length_mm)} × ${numberText(card.actual_board_width_mm)} mm`
          : "与计划冻结规格一致";
        const trace = [card.inventory_lot_number, card.employee_location_name || card.current_address_name || card.warehouse_location].filter(Boolean).join(" / ") || "实收明细已留痕";
        return `<section class="receipt-facts internal-only" data-capacity-label="实收到料与垛位追溯">
          <div class="receipt-fact"><span>实收单 / 版本</span><strong>${escapeHtml(fitLevel === "ultra" ? paperText(`${card.receipt_number || "-"} / ${card.paper_phase_label || "实收版"}`, 24) : `${card.receipt_number || "-"} / ${card.paper_phase_label || "实收版"}`)}</strong></div>
          <div class="receipt-fact"><span>本次实收</span><strong>${escapeHtml(numberText(card.received_sheet_quantity))} 张</strong></div>
          <div class="receipt-fact"><span>本批最多生产</span><strong>${escapeHtml(numberText(card.production_capacity_quantity))} ${escapeHtml(card.layout_kind === "liner" ? "张" : "只")}</strong></div>
          <div class="receipt-fact"><span>规格 / 垛位追溯</span><strong>${escapeHtml(fitLevel === "ultra" ? paperText(`${actualSize}｜${trace}`, 38) : `${actualSize}｜${trace}`)}</strong></div>
        </section>`;
      }

      function fulfillmentReminderHtml(card, fitLevel = "normal") {
        const reminders = Array.isArray(card && card.fulfillment_reminders) ? card.fulfillment_reminders : [];
        if (!reminders.length) return "";
        const compact = fitLevel === "ultra";
        const visible = compact ? reminders.slice(0, 1) : reminders;
        const rows = visible.map((row) => {
          const scope = row.scope_type === "product"
            ? `指定常用箱：${row.product_code || "-"} / ${row.product_name || "-"}`
            : "该客户";
          const quantity = row.suggested_quantity ? `｜建议数量 ${row.suggested_quantity}` : "";
          if (compact) return `<div class="detail-row"><span class="label">${escapeHtml(paperText(scope, 18))}</span><span class="value">${escapeHtml(paperText(row.content || "-", 56))}（扫码查看完整交代）</span></div>`;
          return `<div class="detail-row"><span class="label">${escapeHtml(scope)}</span><span class="value">${escapeHtml(row.content || "-")}<br><small>来源 ${escapeHtml(row.source_delivery_number || "-")}｜回单日 ${escapeHtml(row.source_received_date || "-")}${escapeHtml(quantity)}｜记录人 ${escapeHtml(row.created_by_name || "-")}</small></span></div>`;
        }).join("");
        const more = compact && reminders.length > visible.length ? `<div class="detail-row"><span class="label">其余交代</span><span class="value">另 ${reminders.length - visible.length} 项，扫码查看</span></div>` : "";
        return `<section class="printing-block internal-only"><div class="printing-block-title">客户回单交代（仅内部）</div>${rows}${more}</section>`;
      }

      function drawingReferenceText(card) {
        const drawing = card && card.structure_reference;
        return drawing && (drawing.name || drawing.url) ? "有图纸，扫码查看" : "未登记";
      }

      function orderFactsHtml(card, fitLevel = "normal") {
        const quantityUnit = card.output_unit || (card.layout_kind === "liner" ? "张" : "只");
        const rows = card.source_type !== "stock_replenishment"
          ? [
              ["客户订单号", textList(card.customer_pos || [])],
              ["订单数量", `${numberText(card.customer_order_quantity)} ${quantityUnit}`],
              ["库存抵扣", `${numberText(card.stock_deduction_quantity || 0)} ${quantityUnit}`],
              ["计划生产", `${numberText(card.planned_finished_quantity)} ${quantityUnit}`],
              ["采购张数", `${numberText(card.requisition_quantity)} 张`],
            ]
          : [
              ["来源单号", textList(card.order_numbers || [])],
              ["计划备库", `${numberText(card.planned_replenishment_quantity)} ${quantityUnit}`],
              ["累计已收", `${numberText(card.received_quantity || 0)} ${quantityUnit}`],
              ["剩余待收", `${numberText(card.remaining_quantity || 0)} ${quantityUnit}`],
              ["采购张数", `${numberText(card.requisition_quantity)} 张`],
            ];
        return `<div class="order-facts" data-capacity-label="订单与生产数量">${rows.map(([label, value]) => `<div class="order-fact"><span>${escapeHtml(label)}</span><strong>${escapeHtml(fitLevel === "ultra" ? paperText(value, 20) : value)}</strong></div>`).join("")}</div>`;
      }

      function productionNotesHtml(card, fitLevel = "normal") {
        const notes = textList(card.production_steps || []);
        if (notes === "-") return "";
        const compact = fitLevel === "ultra";
        return `<section class="printing-block"><div class="printing-block-title">特别注意事项</div>${detailRow("生产要求", compact ? `${paperText(notes, 72)}（完整要求扫码查看）` : notes)}</section>`;
      }

      function moldHtml(card, fitLevel = "normal") {
        const moldRows = [];
        const seen = new Set();
        (card.components || []).forEach((line) => {
          const name = String(line.mold_display_name || line.mold_name || "").trim();
          if (!name) return;
          const key = `${line.mold_tool_id || ""}|${name}|${line.mold_location || ""}`;
          if (seen.has(key)) return;
          seen.add(key);
          const state = line.mold_is_active === false ? " · 已停用，请勿直接领用" : "";
          moldRows.push({ name, location: `${line.mold_location_display || line.mold_location || "位置待完善"}${state}` });
        });
        if (!moldRows.length) return "";
        const compact = fitLevel === "ultra";
        const visible = compact ? moldRows.slice(0, 2) : moldRows;
        const rows = visible.map((row) => `<div class="mold-focus-row"><strong class="mold-focus-code">${escapeHtml(compact ? paperText(row.name, 16) : row.name)}</strong><span class="mold-focus-location">${escapeHtml(compact ? paperText(row.location, 20) : row.location)}</span></div>`).join("");
        const more = compact && moldRows.length > visible.length ? `<div class="mold-focus-note">另 ${moldRows.length - visible.length} 副模具，扫码查看</div>` : "";
        const note = compact ? "先核对模具与位置；完整任务扫码查看。" : "扫描模具上的固定二维码，可查看本任务其余信息并登记本次扫码时间；扫码不会自动开工。";
        return `<section class="mold-focus internal-only"><div class="mold-focus-title"><span>第 1 工序 · 模具名称与现场位置</span><span>先核对再领用</span></div>${rows}${more}<div class="mold-focus-note">${note}</div></section>`;
      }

      function joiningHtml(card, fitLevel = "normal") {
        if (!card.joining_method || !card.joining_method.includes("粘贴")) return "";
        const components = Array.isArray(card.components) ? card.components : [];
        const hasMold = components.some((component) => component && (component.mold_display_name || component.mold_name || component.mold_code));
        const hasPrinting = components.some((component) => {
          const content = String(component && (component.printing_situation || component.print_content) || "").trim();
          return content && !["无印刷", "无", "否", "不印刷"].includes(content);
        });
        const title = hasMold && hasPrinting ? "第 3 工序 · 粘贴" : "粘贴";
        return `<section class="joining-block"><div class="printing-block-title">${fitLevel === "ultra" ? paperText(title, 18) : title}</div>${detailRow("粘贴要求", fitLevel === "ultra" ? paperText(card.joining_method, 38) : card.joining_method, "production-key-fact")}</section>`;
      }

      function processDetailsHtml(card, fitLevel = "normal") {
        const mold = moldHtml(card, fitLevel);
        const printing = printingHtml(card, fitLevel);
        const joining = joiningHtml(card, fitLevel);
        const stateClasses = `${mold ? " has-mold" : ""}${printing ? " has-printing" : ""}${joining ? " has-joining" : ""}`;
        return `<div class="process-detail-stack${stateClasses}" data-capacity-label="模具、印刷与结合工艺">${mold}${printing}${joining}</div>`;
      }

      function productQrHtml(card) {
        const qr = card.product_qr;
        if (qr && qr.qr_data_url && qr.product_id) {
          return `<div class="product-qr"><img src="${escapeHtml(qr.qr_data_url)}" alt="扫码查看当前产品资料"></div>`;
        }
        return `<div class="product-qr product-qr-missing">${escapeHtml(card.product_qr_unavailable_reason || "无正式产品二维码")}</div>`;
      }

      function headlineValueHtml(value, kind, fitLevel = "normal") {
        const text = fitLevel === "ultra"
          ? paperText(value, kind === "name" ? 30 : 20)
          : String(value || "-");
        const length = Array.from(text).length;
        const longAt = kind === "code" ? 13 : kind === "customer" ? 15 : 14;
        const veryLongAt = kind === "code" ? 20 : kind === "customer" ? 24 : 22;
        const fitClass = length > veryLongAt ? " fit-very-long" : length > longAt ? " fit-long" : "";
        return `<strong class="${kind}-value${fitClass}">${escapeHtml(text)}</strong>`;
      }

      function cardHtml(card, packageData, fitLevel = "normal", cardKey = "") {
        if (!card) return '<section class="task-card half-card blank" aria-hidden="true"></section>';
        const compact = fitLevel === "ultra";
        const warnings = card.review_required ? `<div class="warning">请核对后再打印：${escapeHtml(compact ? `${paperText(textList(card.review_messages), 56)}（完整提示扫码查看）` : textList(card.review_messages))}</div>` : "";
        const denseClass = (card.components || []).length > 3 ? " dense" : "";
        const actualPhase = card.paper_phase === "actual_receipt";
        const printingClass = cardNeedsCompactLayout(card) || actualPhase ? " printing-heavy" : "";
        const actualClass = actualPhase ? " actual-card" : "";
        const safeNote = '<span class="safe-only">客户随货版 · 已隐藏内部任务及资产定位信息</span>';
        const fitClass = compact ? " ultra-compact" : "";
        return `<section class="task-card half-card${denseClass}${printingClass}${actualClass}${fitClass}" data-card-key="${escapeHtml(cardKey)}" data-layout="${escapeHtml(card.layout_kind || "carton")}">
          <header class="card-head" data-capacity-label="任务标题与二维码"><div><div class="brand">TM 天明包装 · ${escapeHtml(card.paper_phase_label || "待来料计划版")}</div><h1>${escapeHtml(titleFor(card))}</h1></div>${productQrHtml(card)}</header>
          <div class="headline-metrics" data-capacity-label="客户、存货编码与产品名称">
            <div class="headline-metric customer-metric"><span>客户</span>${headlineValueHtml(card.customer_name, "customer", fitLevel)}</div>
            <div class="headline-metric code-metric"><span>存货编码</span>${headlineValueHtml(card.product_code, "code", fitLevel)}</div>
            <div class="headline-metric name-metric"><span>产品名称</span>${headlineValueHtml(card.product_name, "name", fitLevel)}</div>
          </div>
          <div class="product-strip"><div><span class="field-label">成品内尺寸</span><span class="field-value production-key-value">${escapeHtml(compact ? paperText(finishedSize(card), 36) : finishedSize(card))}</span></div><div><span class="field-label">图纸</span><span class="field-value">${escapeHtml(drawingReferenceText(card))}</span></div><div><span class="field-label">交期</span><span class="field-value">${escapeHtml(compact ? paperList((card.delivery_dates || []).map(dateText), 20, fitLevel) : textList((card.delivery_dates || []).map(dateText)))}</span></div></div>
          ${orderFactsHtml(card, fitLevel)}
          ${receiptFactsHtml(card, fitLevel)}
          ${processHtml(card, fitLevel)}
          ${processDetailsHtml(card, fitLevel)}
          <div class="supporting-grid" data-capacity-label="材料、注意事项与回单交代">
            <div class="detail-grid"><div class="detail-list">${detailHtml(card, fitLevel)}</div></div>
            <div class="supporting-stack">${productionNotesHtml(card, fitLevel)}${fulfillmentReminderHtml(card, fitLevel)}${warnings}</div>
          </div>
          <footer class="foot internal-only" data-capacity-label="报料追溯页脚"><span>报料单 ${escapeHtml(card.supplier_order_number || packageData.supplier_order_number || "-")} · 纸面版本 ${escapeHtml(String(card.paper_version_key || packageData.plan_fingerprint || "").slice(-20))}</span><span>生成 ${escapeHtml(card.received_at || packageData.created_at || "-")}</span></footer>
          <footer class="foot safe-only">${safeNote}<span>尺寸单位：mm</span></footer>
        </section>`;
      }

      function applyMode() {
        document.body.classList.toggle("customer-safe", customerSafe);
        modeButton.textContent = customerSafe ? "切换内部生产版" : "切换客户随货版";
        const next = new URL(window.location.href);
        if (customerSafe) next.searchParams.set("mode", "customer"); else next.searchParams.delete("mode");
        window.history.replaceState(null, "", next);
      }

      function productionLabelRefreshAction(packageData) {
        const labelCount = Number(packageData.production_label_count || 0);
        const refreshOptions = Array.isArray(packageData.production_label_refresh_options)
          ? packageData.production_label_refresh_options : [];
        const refreshable = refreshOptions.filter((row) => row && row.can_refresh === true && row.current_enabled === true);
        if (labelCount <= 0) return {kind:"refresh", options:refreshable};
        const compactUpgrades = refreshable.filter((row) => row.frozen_template_version === "current_40x30_v1");
        return {kind:compactUpgrades.length ? "upgrade_compact" : "none", options:compactUpgrades};
      }

      function applyProductionLabelActions(packageData) {
        const labelCount = Number(packageData.production_label_count || 0);
        const refreshAction = productionLabelRefreshAction(packageData);
        labelButton.hidden = batchMode;
        labelButton.textContent = labelCount > 0 ? `生产包装标签（${labelCount}张）` : "未启用包装标签";
        // Packaging labels use their own frozen plan and do not depend on the
        // A4 production paper's QR-image or page-overflow checks.
        labelButton.disabled = batchMode || receiptBatchMode || labelCount <= 0;
        labelRefreshButton.hidden = batchMode || receiptBatchMode || !refreshAction.options.length;
        labelRefreshButton.disabled = labelRefreshButton.hidden;
        labelRefreshButton.textContent = refreshAction.kind === "upgrade_compact"
          ? `升级到无抬头中文简称版${refreshAction.options.length > 1 ? `（${refreshAction.options.length}款）` : ""}`
          : refreshAction.options.length > 1
          ? `按常用箱刷新 ${refreshAction.options.length} 款标签计划`
          : "按常用箱刷新标签计划";
      }

      async function waitForProductQrImages() {
        const images = Array.from(pagesHost.querySelectorAll("img[alt='扫码查看当前产品资料']"));
        await Promise.all(images.map((image) => image.decode
          ? image.decode()
          : image.complete && image.naturalWidth > 0
          ? Promise.resolve()
          : new Promise((resolve, reject) => {
              image.addEventListener("load", resolve, {once:true});
              image.addEventListener("error", () => reject(new Error("产品二维码图片加载失败，请重试")), {once:true});
            })));
        if (images.some((image) => !image.complete || !image.naturalWidth)) throw new Error("产品二维码图片尚未完整加载，请重试");
      }

      function capacityOverflowSource(card) {
        const sections = Array.from(card.querySelectorAll("[data-capacity-label]"));
        if (!sections.length) return "未识别的超长内容";
        const measured = sections.map((element) => {
          const height = element.getBoundingClientRect().height;
          const ownOverflow = Math.max(0, element.scrollHeight - element.clientHeight);
          const textLength = Array.from((element.textContent || "").trim()).length;
          return {
            label:element.dataset.capacityLabel || "未识别的超长内容",
            score:ownOverflow * 20 + height + Math.min(textLength, 400) * .08,
          };
        }).sort((left, right) => right.score - left.score);
        return measured[0].label;
      }

      function cardKey(card, index) {
        if (!card) return `blank:${index}`;
        return String(card.paper_version_key || card.paper_fingerprint || card.source_identity || card.supplier_order_item_id || `card:${index}`);
      }

      function renderPages(packageData) {
        // Keep every frozen business fact on paper. CSS starts each task on a
        // new page and lets long content continue instead of shrinking it.
        const layouts = printPageLayouts(packageData.cards || []);
        let cardIndex = 0;
        pagesHost.innerHTML = layouts.map((layout, index) => {
          const topKey = cardKey(layout.top, cardIndex++);
          const bottomKey = layout.bottom ? cardKey(layout.bottom, cardIndex++) : "";
          return `<article class="page batch-page" data-page="${index + 1}">${cardHtml(layout.top, packageData, "normal", topKey)}${cardHtml(layout.bottom, packageData, "normal", bottomKey)}</article>`;
        }).join("");
        return layouts;
      }

      function overflowingCards() {
        return Array.from(pagesHost.querySelectorAll(".task-card:not(.blank)")).filter((card) => {
          if (card.scrollHeight > card.clientHeight + 1 || card.scrollWidth > card.clientWidth + 1) return true;
          const constrained = [card, ...card.querySelectorAll(".detail-grid,.detail-list,.order-facts")];
          return constrained.slice(1).some((element) => element.scrollHeight > element.clientHeight + 1 || element.scrollWidth > element.clientWidth + 1);
        });
      }

      async function render(packageData) {
        const layouts = renderPages(packageData);
        applyProductionLabelActions(packageData);
        await waitForProductQrImages();
        toolbarNote.textContent = receiptBatchMode
          ? `已核验 ${packageData.card_count || 0} 项实收生产卡 · 每款另起页 · 正文字号不小于 14pt · 长内容自动续页`
          : batchMode
          ? `已冻结 ${packageData.card_count || 0} 项人工选择 · 每个生产任务另起页 · 正文字号不小于 14pt · 长内容自动续页`
          : receiptMode
          ? (packageData.reuses_planned_card
            ? "实收与计划完全一致 · 沿用原计划卡即可，不强制重复打印"
            : `${packageData.paper_phase_label || "实收版"} · 每个生产任务另起页 · 正文字号不小于 14pt · 长内容自动续页`)
          : "黑白打印 · 每个生产任务另起页 · 正文字号不小于 14pt · 长内容自动续页";
        applyMode();
        message.hidden = true;
        printButton.disabled = !layouts.length || packageData.printable === false;
      }

      async function loadPackage() {
        const generation = ++loadGeneration;
        if (activeController) activeController.abort();
        activeController = new AbortController();
        loadedPackage = null;
        printButton.disabled = true;
        labelButton.disabled = true;
        labelRefreshButton.disabled = true;
        pagesHost.innerHTML = "";
        message.hidden = false;
        message.className = "message";
        message.textContent = receiptBatchMode ? "正在核验勾选的实收生产卡…" : batchMode ? "正在核验已冻结的批量打印任务…" : receiptMode ? "正在读取同一生产任务的实收纸面版本…" : "正在读取正式报料快照…";
        if (!batchMode && !receiptBatchMode && (!Number.isInteger(sourceId) || sourceId <= 0)) {
          message.className = "message error";
          message.textContent = receiptMode ? "来料实收明细编号无效" : "报料单编号无效";
          return;
        }
        try {
          const endpoint = receiptBatchMode
            ? `/api/incoming/production-card-batch?${receiptItemIds.map((value) => `receipt_item_id=${encodeURIComponent(value)}`).join("&")}`
            : batchMode
            ? `/api/requisition/production-print-batches/${encodeURIComponent(batchId)}`
            : receiptMode
            ? `/api/incoming/receipt-items/${encodeURIComponent(receiptItemId)}/production-card`
            : `/api/requisition/supplier-orders/${encodeURIComponent(orderId)}/production-print-package`;
          const response = await fetch(endpoint, {
            method:"GET", credentials:"include", cache:"no-store", headers:{"Accept":"application/json"}, signal:activeController.signal,
          });
          let payload = null;
          try { payload = await response.json(); } catch (_error) { payload = null; }
          if (!response.ok) throw Object.assign(new Error(errorMessage(response.status, payload)), {status:response.status});
          if (generation !== loadGeneration) return;
          if (!payload || typeof payload !== "object" || !Array.isArray(payload.pages) || !Array.isArray(payload.cards)) throw new Error("服务器返回的统一任务单数据不完整，请重试");
          loadedPackage = payload;
          await render(payload);
        } catch (error) {
          if (error && error.name === "AbortError") return;
          if (generation !== loadGeneration) return;
          message.className = "message error";
          message.textContent = error instanceof TypeError ? "无法连接 ERP 服务，请检查网络后重试" : error && error.message ? error.message : "连接 ERP 失败，请重试";
        }
      }

      retryButton.addEventListener("click", loadPackage);
      printButton.addEventListener("click", () => { if (loadedPackage) window.print(); });
      modeButton.addEventListener("click", () => { customerSafe = !customerSafe; applyMode(); });
      labelButton.addEventListener("click", () => {
        const supplierOrderId = Number(loadedPackage && loadedPackage.supplier_order_id);
        if (loadedPackage && !batchMode && !receiptBatchMode && Number.isInteger(supplierOrderId) && supplierOrderId > 0) {
          window.open(`/production-packaging-label.html?id=${encodeURIComponent(supplierOrderId)}`, "_blank", "noopener");
        }
      });
      labelRefreshButton.addEventListener("click", async () => {
        const packageSnapshot = loadedPackage;
        const refreshAction = productionLabelRefreshAction(packageSnapshot || {});
        const refreshable = refreshAction.options;
        if (!refreshable.length) return;
        const productText = refreshable.map((row) => row.product_code || row.product_name || `任务 ${row.task_id}`).join("、");
        const actionText = refreshAction.kind === "upgrade_compact"
          ? "升级到无抬头中文简称版"
          : "按当前常用箱设置刷新标签计划";
        if (!window.confirm(`确认这些任务尚未开始生产、也没有打印过包装标签，并${actionText}吗？\n${productText}`)) return;
        labelRefreshButton.disabled = true;
        labelButton.disabled = true;
        let refreshed = 0;
        try {
          for (const row of refreshable) {
            const key = typeof crypto !== "undefined" && typeof crypto.randomUUID === "function"
              ? crypto.randomUUID()
              : `label-refresh-${Date.now()}-${row.task_id}-${Math.random().toString(16).slice(2)}`;
            const response = await fetch(`/api/production/tasks/${encodeURIComponent(row.task_id)}/label-plan-refresh`, {
              method:"POST",
              credentials:"include",
              headers:{"Accept":"application/json", "Content-Type":"application/json"},
              body:JSON.stringify({
                idempotency_key:key,
                expected_task_version:row.expected_task_version,
                expected_product_version:row.expected_product_version,
                confirmed_not_started:true,
                confirmed_no_prior_print:true,
              }),
            });
            let payload = null;
            try { payload = await response.json(); } catch (_error) { payload = null; }
            if (!response.ok) throw new Error(errorMessage(response.status, payload));
            refreshed += 1;
          }
          await loadPackage();
          if (loadedPackage && Number(loadedPackage.production_label_count || 0) > 0) {
            message.hidden = false;
            message.className = "message";
            message.textContent = refreshAction.kind === "upgrade_compact"
              ? `已将 ${refreshed} 款标签计划升级到无抬头中文简称版，现在可以打印生产包装标签。`
              : `已按当前常用箱刷新 ${refreshed} 款标签计划，现在可以打印生产包装标签。`;
          }
        } catch (error) {
          await loadPackage();
          message.hidden = false;
          message.className = "message error";
          message.textContent = `${refreshed ? `已成功刷新 ${refreshed} 款；` : ""}${error && error.message ? error.message : "标签计划刷新失败，请重试"}`;
        }
      });
      closeButton.addEventListener("click", () => window.close());
      applyMode();
      document.title = receiptBatchMode ? "生产任务单 · 实收批量" : batchMode ? "生产任务单 · 批量勾选" : receiptMode ? "生产任务单 · 实收版" : "生产任务单 · 计划版";
      loadPackage();
    })();
  </script>
</body>
</html>
