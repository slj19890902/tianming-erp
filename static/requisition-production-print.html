<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>生产任务单</title>
  <style>
    :root { color-scheme:light; font-family:"Microsoft YaHei","SimSun",sans-serif; color:#111; }
    * { box-sizing:border-box; }
    body { margin:0; background:#ececec; }
    .toolbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 16px; background:#fff; border-bottom:1px solid #aaa; }
    button { border:1px solid #222; border-radius:4px; background:#fff; color:#111; padding:7px 14px; cursor:pointer; font-size:14px; }
    button.primary { background:#111; color:#fff; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .toolbar-note { margin-left:auto; color:#444; font-size:13px; }
    .message { max-width:980px; margin:16px auto; padding:14px 16px; border-radius:4px; background:#fff; border:1px solid #aaa; }
    .message.error { color:#111; border:2px solid #111; font-weight:700; }
    .pages { display:flex; flex-direction:column; align-items:center; gap:12px; padding:14px; }
    .page { width:210mm; height:297mm; padding:8mm 10mm; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.16); overflow:hidden; break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    .batch-page { display:grid; grid-template-rows:140.5mm 140.5mm; }
    .single-page { display:grid; grid-template-rows:1fr; }
    .task-card { min-height:0; padding:4mm 2mm 3mm; overflow:hidden; break-inside:avoid; page-break-inside:avoid; }
    .batch-page .task-card:first-child { border-bottom:.35mm dashed #555; }
    .task-card.blank { visibility:hidden; }
    .task-card.dense { font-size:8px; }
    .task-card.layout-overflow { overflow:auto; outline:.7mm solid #111; outline-offset:-.7mm; }
    .card-head { display:grid; grid-template-columns:1fr auto; gap:4mm; align-items:start; border-bottom:.55mm solid #111; padding-bottom:1.5mm; }
    .brand { font-size:8pt; font-weight:800; letter-spacing:.3mm; }
    h1 { margin:.8mm 0 0; font-size:15pt; line-height:1.15; letter-spacing:.5mm; }
    .product-qr { width:22mm; min-height:22mm; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:5.8pt; line-height:1.15; overflow-wrap:anywhere; }
    .product-qr img { display:block; width:19mm; height:19mm; image-rendering:pixelated; }
    .product-qr span { margin-top:.5mm; }
    .product-qr-missing { border:.3mm solid #777; padding:1.5mm; color:#444; }
    .status { display:inline-block; min-width:18mm; padding:1mm 2mm; border:.3mm solid #111; border-radius:3mm; text-align:center; color:#111; font-size:8pt; font-weight:800; }
    .status.warn { border-width:.55mm; }
    .headline-metrics { display:grid; grid-template-columns:1.1fr .9fr .9fr; gap:2mm; margin:2.3mm 0; }
    .headline-metric { border:.28mm solid #777; border-radius:2mm; padding:1.4mm 2mm; min-width:0; }
    .headline-metric span { display:block; color:#444; font-size:7pt; }
    .headline-metric strong { display:block; margin-top:.5mm; font-size:12pt; line-height:1.15; overflow-wrap:anywhere; }
    .product-strip { display:grid; grid-template-columns:1.1fr .65fr .85fr; gap:3mm; padding:1.5mm 0 1.8mm; border-bottom:.28mm solid #888; }
    .field-label { display:block; color:#444; font-size:7pt; }
    .field-value { display:block; margin-top:.5mm; font-weight:800; font-size:9.5pt; overflow-wrap:anywhere; }
    .production-key-value,.detail-row.production-key-fact .value { font-size:12pt; line-height:1.15; font-weight:800; }
    .process-title { margin:1.6mm 0 .8mm; color:#333; font-size:7.5pt; font-weight:700; }
    .process-route { display:flex; gap:1.2mm; margin:0; padding:0; list-style:none; }
    .process-route li { flex:1 1 0; min-width:0; border:.3mm solid #111; border-radius:3mm; padding:1.1mm 1.5mm; text-align:center; font-size:8pt; font-weight:700; overflow-wrap:anywhere; }
    .detail-grid { display:grid; grid-template-columns:1.08fr .92fr; margin-top:2mm; border:.3mm solid #555; border-radius:2mm; overflow:hidden; min-height:42mm; }
    .detail-list { padding:2mm 2.5mm; }
    .detail-row { display:grid; grid-template-columns:23mm 1fr; gap:2mm; padding:.8mm 0; font-size:8pt; line-height:1.25; }
    .detail-row .label { color:#444; }
    .detail-row .value { font-weight:750; overflow-wrap:anywhere; }
    .printing-block { margin:.8mm 0; padding:.8mm 0; border-top:.28mm solid #999; border-bottom:.28mm solid #999; }
    .printing-block-title { margin:.4mm 0; font-size:7.5pt; font-weight:800; overflow-wrap:anywhere; }
    .printing-plate-line { white-space:normal; overflow-wrap:anywhere; }
    .process-detail-stack { display:grid; gap:1mm; margin-top:1.4mm; }
    .mold-focus { border:.55mm solid #111; border-radius:2mm; padding:1.3mm 2mm; }
    .mold-focus-title { display:flex; justify-content:space-between; gap:2mm; font-size:7.5pt; font-weight:800; }
    .mold-focus-row { display:grid; grid-template-columns:1fr 1.2fr; gap:2mm; align-items:baseline; margin-top:.8mm; }
    .mold-focus-code { font-size:12pt; line-height:1.1; font-weight:900; overflow-wrap:anywhere; }
    .mold-focus-location { font-size:10pt; line-height:1.15; font-weight:850; overflow-wrap:anywhere; }
    .mold-focus-note { margin-top:.7mm; color:#333; font-size:7pt; }
    .joining-block { border-top:.28mm solid #999; border-bottom:.28mm solid #999; padding:.9mm 0; }
    .structure { border-left:.28mm solid #777; padding:2mm; min-width:0; min-height:0; display:flex; flex-direction:column; }
    .structure-title { display:flex; justify-content:space-between; gap:2mm; color:#333; font-size:7.5pt; font-weight:700; }
    .structure-source { color:#555; font-weight:400; }
    .structure-body { flex:1 1 auto; min-height:0; margin-top:1mm; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .structure-body img,.structure-body object { display:block; max-width:100%; width:100%; height:100%; max-height:37mm; object-fit:contain; filter:grayscale(1) contrast(1.08); }
    .structure-empty { width:100%; padding:3mm; border-top:.28mm solid #999; border-bottom:.28mm solid #999; color:#444; text-align:center; font-size:8pt; line-height:1.5; }
    .warning { margin-top:1.5mm; padding:1.2mm 2mm; border:.55mm solid #111; color:#111; font-size:7.5pt; font-weight:800; }
    .receipt-facts { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1mm; margin:1.5mm 0; padding:1.2mm 1.5mm; border:.45mm solid #111; }
    .receipt-fact span { display:block; color:#444; font-size:6.5pt; }
    .receipt-fact strong { display:block; margin-top:.4mm; font-size:8.5pt; overflow-wrap:anywhere; }
    .foot { display:flex; justify-content:space-between; align-items:flex-end; gap:3mm; margin-top:1.2mm; color:#444; font-size:6.5pt; }
    .safe-only { display:none !important; }
    body.customer-safe .internal-only { display:none !important; }
    body.customer-safe .safe-only { display:inline !important; }
    .single-page .task-card { padding:8mm 7mm 6mm; display:flex; flex-direction:column; }
    .single-page .brand { font-size:10pt; }
    .single-page h1 { margin-top:1.5mm; font-size:25pt; }
    .single-page .product-qr { width:30mm; min-height:30mm; font-size:8pt; }
    .single-page .product-qr img { width:27mm; height:27mm; }
    .single-page .status { padding:1.6mm 4mm; font-size:11pt; }
    .single-page .headline-metrics { gap:4mm; margin:6mm 0; }
    .single-page .headline-metric { padding:4mm 5mm; border-radius:3mm; }
    .single-page .headline-metric span,.single-page .field-label { font-size:10pt; }
    .single-page .headline-metric strong { margin-top:1.5mm; font-size:20pt; }
    .single-page .product-strip { gap:8mm; padding:3mm 0 4mm; }
    .single-page .field-value { margin-top:1.5mm; font-size:15pt; }
    .single-page .production-key-value,.single-page .detail-row.production-key-fact .value { font-size:20pt; line-height:1.15; }
    .single-page .process-title { margin:5mm 0 2mm; font-size:10pt; }
    .single-page .process-route { gap:3mm; }
    .single-page .process-route li { padding:3mm; border-radius:5mm; font-size:12pt; }
    .single-page .detail-grid { flex:1 1 auto; margin-top:5mm; min-height:102mm; border-radius:3mm; }
    .single-page .detail-list { padding:7mm 8mm; }
    .single-page .detail-row { grid-template-columns:34mm 1fr; gap:5mm; padding:2.4mm 0; font-size:12pt; }
    .single-page .structure { padding:7mm; }
    .single-page .structure-title { font-size:10pt; }
    .single-page .structure-body { margin-top:4mm; }
    .single-page .structure-body img,.single-page .structure-body object { max-height:122mm; }
    .single-page .structure-empty { padding:8mm; font-size:11pt; }
    .single-page .warning { margin-top:4mm; padding:3mm 4mm; font-size:10pt; }
    .single-page .receipt-facts { gap:3mm; margin:4mm 0; padding:3mm 4mm; }
    .single-page .receipt-fact span { font-size:9pt; }
    .single-page .receipt-fact strong { margin-top:1mm; font-size:13pt; }
    .single-page .foot { margin-top:4mm; font-size:8pt; }
    .single-page .task-card.printing-heavy { padding:4mm 3mm 3mm; }
    .single-page .task-card.printing-heavy h1 { font-size:18pt; }
    .single-page .task-card.printing-heavy .product-qr { width:23mm; min-height:23mm; font-size:6pt; }
    .single-page .task-card.printing-heavy .product-qr img { width:21mm; height:21mm; }
    .single-page .task-card.printing-heavy .status { padding:1mm 2.5mm; font-size:9pt; }
    .single-page .task-card.printing-heavy .headline-metrics { gap:2.5mm; margin:2.5mm 0; }
    .single-page .task-card.printing-heavy .headline-metric { padding:2mm 3mm; }
    .single-page .task-card.printing-heavy .headline-metric span,
    .single-page .task-card.printing-heavy .field-label { font-size:8pt; }
    .single-page .task-card.printing-heavy .headline-metric strong { margin-top:.8mm; font-size:14pt; }
    .single-page .task-card.printing-heavy .product-strip { gap:5mm; padding:2mm 0 2.5mm; }
    .single-page .task-card.printing-heavy .field-value { margin-top:.8mm; font-size:11pt; }
    .single-page .task-card.printing-heavy .production-key-value,
    .single-page .task-card.printing-heavy .detail-row.production-key-fact .value { font-size:13pt; }
    .single-page .task-card.printing-heavy .process-title { margin:2.5mm 0 1mm; font-size:8.5pt; }
    .single-page .task-card.printing-heavy .process-route { gap:1.5mm; }
    .single-page .task-card.printing-heavy .process-route li { padding:1.5mm 2mm; font-size:9pt; }
    .single-page .task-card.printing-heavy .detail-grid { grid-template-columns:1.4fr .6fr; margin-top:2.5mm; min-height:0; }
    .single-page .task-card.printing-heavy .detail-list { padding:2.5mm 3mm; }
    .single-page .task-card.printing-heavy .detail-row { grid-template-columns:27mm 1fr; gap:2.5mm; padding:.8mm 0; font-size:8.5pt; line-height:1.22; }
    .single-page .task-card.printing-heavy .printing-block { margin:.4mm 0; padding:.4mm 0; }
    .single-page .task-card.printing-heavy .printing-block-title { margin:.2mm 0; font-size:8pt; }
    .single-page .mold-focus { padding:2.5mm 3mm; }
    .single-page .mold-focus-title { font-size:10pt; }
    .single-page .mold-focus-code { font-size:18pt; }
    .single-page .mold-focus-location { font-size:15pt; }
    .single-page .mold-focus-note { font-size:9pt; }
    .single-page .task-card.printing-heavy .structure { padding:3mm; }
    .single-page .task-card.printing-heavy .structure-title { font-size:8pt; }
    .single-page .task-card.printing-heavy .structure-body { margin-top:2mm; }
    .single-page .task-card.printing-heavy .structure-body img,
    .single-page .task-card.printing-heavy .structure-body object { max-height:105mm; }
    .single-page .task-card.printing-heavy .structure-empty { padding:3mm; font-size:8.5pt; }
    .single-page .task-card.printing-heavy .warning { margin-top:2mm; padding:1.5mm 2mm; font-size:8pt; }
    .single-page .task-card.printing-heavy .foot { margin-top:2mm; font-size:7pt; }
    .single-page .task-card.actual-card .receipt-facts { gap:1.5mm; margin:2mm 0; padding:1.5mm 2mm; }
    .single-page .task-card.actual-card .receipt-fact span { font-size:7.5pt; }
    .single-page .task-card.actual-card .receipt-fact strong { margin-top:.5mm; font-size:10pt; line-height:1.2; }
    @page { size:A4 portrait; margin:0; }
    @media print {
      body { background:#fff; }
      .toolbar,.message { display:none !important; }
      .pages { display:block; padding:0; }
      .page { box-shadow:none; margin:0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="retryButton" type="button">重新加载</button>
    <button id="printButton" class="primary" type="button" disabled>打印</button>
    <button id="modeButton" type="button">切换客户随货版</button>
    <button id="labelButton" type="button" disabled>生产包装标签</button>
    <button id="labelRefreshButton" type="button" hidden disabled>按常用箱刷新标签计划</button>
    <button id="closeButton" type="button">关闭</button>
    <span id="toolbarNote" class="toolbar-note">黑白打印 · 批量每张 A4 上下两款</span>
  </div>
  <div id="message" class="message">正在读取正式报料快照…</div>
  <main id="pages" class="pages" aria-live="polite"></main>
  <script>
    (() => {
      "use strict";
      const message = document.getElementById("message");
      const pagesHost = document.getElementById("pages");
      const retryButton = document.getElementById("retryButton");
      const printButton = document.getElementById("printButton");
      const modeButton = document.getElementById("modeButton");
      const labelButton = document.getElementById("labelButton");
      const labelRefreshButton = document.getElementById("labelRefreshButton");
      const closeButton = document.getElementById("closeButton");
      const toolbarNote = document.getElementById("toolbarNote");
      const params = new URLSearchParams(window.location.search);
      const batchId = (params.get("batch_id") || "").trim().toLowerCase();
      const batchMode = /^[0-9a-f]{64}$/.test(batchId);
      const receiptMode = window.location.pathname.endsWith("/incoming-production-card.html")
        || params.has("receipt_item_id");
      const sourceId = Number(params.get("receipt_item_id") || params.get("id"));
      const orderId = receiptMode ? null : sourceId;
      const receiptItemId = receiptMode ? sourceId : null;
      const openToken = params.get("open_token") || "";
      const readyChannel = receiptMode && openToken && typeof BroadcastChannel === "function"
        ? new BroadcastChannel(`erp-incoming-production-card-${openToken}`)
        : null;
      readyChannel?.postMessage({type:"ready"});
      setTimeout(() => readyChannel?.close(), 0);
      let customerSafe = params.get("mode") === "customer";
      let loadGeneration = 0;
      let activeController = null;
      let loadedPackage = null;

      const escapeHtml = (value) => String(value ?? "-")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
      const textList = (value) => Array.isArray(value) && value.length
        ? value.map((item) => String(item)).join(" / ") : "-";
      const dateText = (value) => value ? String(value).slice(0, 10) : "-";
      const unique = (values) => Array.from(new Set(values.filter((value) => value !== null && value !== undefined && String(value).trim()).map((value) => String(value).trim())));
      const numberText = (value) => value === null || value === undefined || value === "" ? "-" : String(value).replace(/\.0+$/, "");

      function errorMessage(status, payload) {
        const detail = payload && typeof payload === "object" ? payload.detail : null;
        if (typeof detail === "string" && detail.trim()) return detail.trim();
        if (detail && typeof detail === "object" && typeof detail.message === "string") {
          return detail.code ? `${detail.message}（${detail.code}）` : detail.message;
        }
        if (Array.isArray(detail) && detail.length) return detail.map((item) => item && item.msg ? item.msg : String(item)).join("；");
        if (status === 401) return "登录已失效，请回到 ERP 重新登录后再试";
        if (status === 403) return "没有查看该报料单的权限";
        if (status === 404) return "报料单不存在";
        return `加载失败（HTTP ${status || "网络连接失败"}）`;
      }

      function titleFor(card) {
        if (card.layout_kind === "die_cut") return "模切内盒生产任务单";
        if (card.layout_kind === "liner") return "衬板生产任务单";
        if (card.box_type_code === "a1_0201") return "A1 型纸箱生产任务单";
        return `${card.box_style || "纸箱"}生产任务单`;
      }

      function componentSizes(card) {
        return unique((card.components || []).map((line) => {
          if (!line.report_length_mm || !line.report_width_mm) return null;
          const label = (card.components || []).length > 1 ? `${line.component_label || "整片"} ` : "";
          return `${label}${numberText(line.report_length_mm)} × ${numberText(line.report_width_mm)} mm`;
        }));
      }

      function finishedSize(card) {
        const frozen = textList(card.specifications || []);
        if (frozen !== "-") return frozen;
        const values = [card.finished_length_mm, card.finished_width_mm];
        if (card.layout_kind !== "liner") values.push(card.finished_height_mm);
        if (values.some((value) => value === null || value === undefined || value === "")) return textList(card.specifications);
        return `${values.map(numberText).join(" × ")} mm`;
      }

      function firstValues(card, key) {
        return unique((card.components || []).map((line) => line[key]));
      }

      function processSteps(card) {
        if (card.layout_kind === "liner") return ["无需后加工", "计数", "捆扎"];
        const text = textList(card.production_steps || []);
        const steps = [];
        const add = (value) => { if (!steps.includes(value)) steps.push(value); };
        if ((card.components || []).some((line) => line.mold_code)) add("模具");
        if (text.includes("印刷") || firstValues(card, "print_content").some((value) => !["无印刷", "无", "否", "不印刷"].includes(value))) add("印刷");
        if (card.joining_method && card.joining_method.includes("粘贴")) add("粘贴");
        if (text.includes("开槽")) add("开槽");
        if (text.includes("压线")) add("压线");
        if (!(card.components || []).some((line) => line.mold_code) && (card.layout_kind === "die_cut" || text.includes("模切"))) add("模切");
        if (text.includes("清废")) add("清废");
        if (card.joining_method) card.joining_method.split(" / ").filter((value) => !["粘贴", "无需结合"].includes(value)).forEach(add);
        return steps.length ? steps.slice(0, 6) : ["无需后加工"];
      }

      function processHtml(card) {
        return `<div class="process-title">工艺路线</div><ol class="process-route">${processSteps(card).map((step) => `<li>${escapeHtml(step)}</li>`).join("")}</ol>`;
      }

      function detailRow(label, value, extraClass = "") {
        return `<div class="detail-row ${extraClass}"><span class="label">${escapeHtml(label)}</span><span class="value">${escapeHtml(value || "-")}</span></div>`;
      }

      function printingComponentHtml(component, componentIndex, componentCount) {
        const content = String(component && (component.printing_situation || component.print_content) || "").trim();
        if (!content || ["无印刷", "无", "否", "不印刷"].includes(content)) return "";
        const titlePrefix = component && component.mold_code ? "第 2 工序 · " : "";
        const title = componentCount > 1
          ? `${titlePrefix}${component.component_label || component.product_code || `组件${componentIndex + 1}`} · 印刷`
          : `${titlePrefix}印刷`;
        const rows = [];
        if (component.printing_plate_mode !== "plate") {
          rows.push(detailRow("印刷情况", content));
          if (component.printing_colors_frozen === false) {
            rows.push(detailRow("印刷颜色", "历史颜色未冻结"));
          } else {
            const colors = Array.isArray(component.printing_colors)
              ? component.printing_colors.map((value) => String(value || "").trim()).filter(Boolean)
              : [];
            rows.push(detailRow("印刷颜色", colors.length ? colors.join("＋") : "颜色待完善"));
          }
          rows.push(detailRow("挂板方式", "不挂板"));
        } else {
          const plates = Array.isArray(component.printing_plates) ? component.printing_plates : [];
          rows.push(detailRow("印刷情况", component.printing_situation || `挂板印刷（${plates.length}色）`));
          plates.forEach((plate, index) => {
            rows.push(detailRow(
              `第${index + 1}色`,
              `颜色：${plate.color_name || "未冻结"}｜挂板编号：${plate.plate_code || "未冻结"}｜挂板内容：${plate.plate_name || "未冻结"}`,
              "printing-plate-line",
            ));
            if (plate.current_location) rows.push(detailRow(`第${index + 1}色当前位置`, plate.current_location, "internal-only"));
          });
          if (!plates.length) rows.push(detailRow("挂板快照", "历史挂板明细未冻结"));
          rows.push(detailRow("对版值", numberText(component.plate_alignment_value_mm), "internal-only"));
          rows.push(detailRow("挂版值", numberText(component.plate_mount_value_mm), "internal-only"));
          const machine = [component.machine_set_length_mm, component.machine_set_width_mm, component.machine_set_height_mm]
            .map(numberText).join(" × ");
          rows.push(detailRow("机器设定", `${machine} mm`, "internal-only"));
        }
        return `<section class="printing-block"><div class="printing-block-title">${escapeHtml(title)}</div>${rows.join("")}</section>`;
      }

      function printingHtml(card) {
        const components = Array.isArray(card.components) ? card.components : [];
        return components.map((component, index) => printingComponentHtml(component, index, components.length)).filter(Boolean).join("");
      }

      function printingComplexity(card) {
        return (Array.isArray(card && card.components) ? card.components : []).reduce((total, component) => {
          const content = String(component && (component.printing_situation || component.print_content) || "").trim();
          if (!content || ["无印刷", "无", "否", "不印刷"].includes(content)) return total;
          if (component.printing_plate_mode !== "plate") return total + 2;
          const plateCount = Array.isArray(component.printing_plates) ? component.printing_plates.length : 0;
          return total + 4 + plateCount * 2;
        }, 0);
      }

      function cardNeedsFullPage(card) {
        const components = Array.isArray(card && card.components) ? card.components : [];
        const printableComponents = components.filter((component) => {
          const content = String(component && (component.printing_situation || component.print_content) || "").trim();
          return content && !["无印刷", "无", "否", "不印刷"].includes(content);
        });
        return printingComplexity(card) >= 6 || printableComponents.length > 1;
      }

      function printPageLayouts(cards) {
        if (Array.isArray(cards) && cards.length === 1) {
          return [{ fullPage:true, top:cards[0], bottom:null }];
        }
        const layouts = [];
        let pending = null;
        (Array.isArray(cards) ? cards : []).forEach((card) => {
          if (cardNeedsFullPage(card)) {
            if (pending) {
              layouts.push({ fullPage:false, top:pending, bottom:null });
              pending = null;
            }
            layouts.push({ fullPage:true, top:card, bottom:null });
          } else if (pending) {
            layouts.push({ fullPage:false, top:pending, bottom:card });
            pending = null;
          } else {
            pending = card;
          }
        });
        if (pending) layouts.push({ fullPage:false, top:pending, bottom:null });
        return layouts;
      }

      function detailHtml(card) {
        const sizes = textList(componentSizes(card));
        const flute = unique((card.components || []).map((line) => [line.flute_type, line.layer_count ? `${line.layer_count}层` : null].filter(Boolean).join(" / ")));
        const crease = textList(firstValues(card, "crease_display"));
        const cutting = textList(firstValues(card, "cutting_mode"));
        if (card.layout_kind === "liner") {
          const perBundle = card.production_label_units_per_bundle ? `${card.production_label_units_per_bundle} 张` : "未设置";
          const bundleCount = card.estimated_bundle_count ? `${card.estimated_bundle_count} 捆` : "待核对";
          return [
            detailRow("成品尺寸", finishedSize(card)),
            detailRow("楞型", textList(flute)),
            detailRow("开料方式", cutting),
            detailRow("总数量", `${card.planned_finished_quantity || 0} 张`),
            detailRow("每捆数量", perBundle),
            detailRow("预计捆数", bundleCount),
            detailRow("加工要求", "无需加工，齐边捆扎"),
          ].join("");
        }
        if (card.layout_kind === "die_cut") {
          return [
            detailRow("纸板尺寸", sizes),
            detailRow("楞型", textList(flute)),
            detailRow("开料方式", cutting),
            ...(card.joining_method && card.joining_method.includes("粘贴") ? [] : [detailRow("结合方式", card.joining_method || "无需结合", "production-key-fact")]),
          ].join("");
        }
        return [
          detailRow("纸板尺寸", sizes),
          detailRow("楞型", textList(flute)),
          detailRow("压线尺寸", crease, "production-key-fact"),
          ...(card.joining_method && card.joining_method.includes("粘贴") ? [] : [detailRow("结合方式", card.joining_method || "无需结合", "production-key-fact")]),
        ].join("");
      }

      function receiptFactsHtml(card) {
        if (card.paper_phase !== "actual_receipt") return "";
        const actualSize = card.actual_board_length_mm && card.actual_board_width_mm
          ? `${numberText(card.actual_board_length_mm)} × ${numberText(card.actual_board_width_mm)} mm`
          : "与计划冻结规格一致";
        const trace = [card.inventory_lot_number, card.pallet_code, card.warehouse_location].filter(Boolean).join(" / ") || "实收明细已留痕";
        return `<section class="receipt-facts internal-only">
          <div class="receipt-fact"><span>实收单 / 版本</span><strong>${escapeHtml(card.receipt_number || "-")} / ${escapeHtml(card.paper_phase_label || "实收版")}</strong></div>
          <div class="receipt-fact"><span>本次实收</span><strong>${escapeHtml(numberText(card.received_sheet_quantity))} 张</strong></div>
          <div class="receipt-fact"><span>本批最多生产</span><strong>${escapeHtml(numberText(card.production_capacity_quantity))} ${escapeHtml(card.layout_kind === "liner" ? "张" : "只")}</strong></div>
          <div class="receipt-fact"><span>规格 / 垛位追溯</span><strong>${escapeHtml(actualSize)}｜${escapeHtml(trace)}</strong></div>
        </section>`;
      }

      function fulfillmentReminderHtml(card) {
        const reminders = Array.isArray(card && card.fulfillment_reminders) ? card.fulfillment_reminders : [];
        if (!reminders.length) return "";
        const rows = reminders.map((row) => {
          const scope = row.scope_type === "product"
            ? `指定常用箱：${row.product_code || "-"} / ${row.product_name || "-"}`
            : "该客户";
          const quantity = row.suggested_quantity ? `｜建议数量 ${row.suggested_quantity}` : "";
          return `<div class="detail-row"><span class="label">${escapeHtml(scope)}</span><span class="value">${escapeHtml(row.content || "-")}<br><small>来源 ${escapeHtml(row.source_delivery_number || "-")}｜回单日 ${escapeHtml(row.source_received_date || "-")}${escapeHtml(quantity)}｜记录人 ${escapeHtml(row.created_by_name || "-")}</small></span></div>`;
        }).join("");
        return `<section class="printing-block internal-only"><div class="printing-block-title">客户回单交代（仅内部）</div>${rows}</section>`;
      }

      function structureHtml(card) {
        const drawing = card.structure_reference;
        let body = '<div class="structure-empty">未登记结构图纸<br>请按文字尺寸与工艺要求生产</div>';
        if (drawing && drawing.url && drawing.kind === "image") {
          body = `<img src="${escapeHtml(drawing.url)}" alt="${escapeHtml(drawing.name || "产品结构图纸")}">`;
        } else if (drawing && drawing.url && drawing.kind === "pdf") {
          body = `<object data="${escapeHtml(drawing.url)}" type="application/pdf" aria-label="${escapeHtml(drawing.name || "产品结构图纸 PDF")}"><a href="${escapeHtml(drawing.url)}" target="_blank" rel="noopener">打开 PDF 图纸</a></object>`;
        } else if (drawing && drawing.name) {
          body = `<div class="structure-empty">已登记图纸：${escapeHtml(drawing.name)}<br>当前文件暂无可打印预览</div>`;
        }
        return `<section class="structure"><div class="structure-title"><span>结构参考</span><span class="structure-source">${escapeHtml(drawing && drawing.source ? drawing.source : "")}</span></div><div class="structure-body">${body}</div></section>`;
      }

      function moldHtml(card) {
        const rows = [];
        const seen = new Set();
        (card.components || []).forEach((line) => {
          const code = String(line.mold_code || "").trim();
          if (!code) return;
          const key = `${line.mold_tool_id || ""}|${code}|${line.mold_location || ""}`;
          if (seen.has(key)) return;
          seen.add(key);
          const state = line.mold_is_active === false ? " · 已停用，请勿直接领用" : "";
          rows.push(`<div class="mold-focus-row"><strong class="mold-focus-code">${escapeHtml(code)}</strong><span class="mold-focus-location">${escapeHtml(line.mold_location || "位置待完善")}${escapeHtml(state)}</span></div>`);
        });
        if (!rows.length) return "";
        return `<section class="mold-focus internal-only"><div class="mold-focus-title"><span>第 1 工序 · 模具编号与现场位置</span><span>先核对再领用</span></div>${rows.join("")}<div class="mold-focus-note">扫描模具上的固定二维码，可查看本任务其余信息并登记本次扫码时间；扫码不会自动开工。</div></section>`;
      }

      function joiningHtml(card) {
        if (!card.joining_method || !card.joining_method.includes("粘贴")) return "";
        const components = Array.isArray(card.components) ? card.components : [];
        const hasMold = components.some((component) => component && component.mold_code);
        const hasPrinting = components.some((component) => {
          const content = String(component && (component.printing_situation || component.print_content) || "").trim();
          return content && !["无印刷", "无", "否", "不印刷"].includes(content);
        });
        const title = hasMold && hasPrinting ? "第 3 工序 · 粘贴" : "粘贴";
        return `<section class="joining-block"><div class="printing-block-title">${title}</div>${detailRow("粘贴要求", card.joining_method, "production-key-fact")}</section>`;
      }

      function processDetailsHtml(card) {
        return `<div class="process-detail-stack">${moldHtml(card)}${printingHtml(card)}${joiningHtml(card)}</div>`;
      }

      function productQrHtml(card) {
        const qr = card.product_qr;
        if (qr && qr.qr_data_url && qr.product_id) {
          return `<div class="product-qr"><img src="${escapeHtml(qr.qr_data_url)}" alt="扫码查看当前产品资料"><span>扫码看当前资料</span></div>`;
        }
        return `<div class="product-qr product-qr-missing">${escapeHtml(card.product_qr_unavailable_reason || "无正式产品二维码")}</div>`;
      }

      function cardHtml(card, packageData, fullPage = false) {
        if (!card) return '<section class="task-card half-card blank" aria-hidden="true"></section>';
        const warnings = card.review_required ? `<div class="warning">请核对后再打印：${escapeHtml(textList(card.review_messages))}</div>` : "";
        const denseClass = (card.components || []).length > 3 ? " dense" : "";
        const quantityUnit = card.layout_kind === "liner" ? "张" : "只";
        const actualPhase = card.paper_phase === "actual_receipt";
        const printingClass = cardNeedsFullPage(card) || actualPhase ? " printing-heavy" : "";
        const actualClass = actualPhase ? " actual-card" : "";
        const displayQuantity = actualPhase
          ? card.production_capacity_quantity
          : card.planned_finished_quantity;
        const quantityLabel = actualPhase ? "本批最多生产" : "数量";
        const safeNote = '<span class="safe-only">客户随货版 · 已隐藏内部任务及资产定位信息</span>';
        return `<section class="task-card half-card${fullPage ? " full-card" : ""}${denseClass}${printingClass}${actualClass}" data-layout="${escapeHtml(card.layout_kind || "carton")}">
          <header class="card-head"><div><div class="brand">TM 天明包装 · ${escapeHtml(card.paper_phase_label || "待来料计划版")}</div><h1>${escapeHtml(titleFor(card))}</h1></div>${productQrHtml(card)}</header>
          <div class="headline-metrics">
            <div class="headline-metric"><span>客户</span><strong>${escapeHtml(card.customer_name || "-")}</strong></div>
            <div class="headline-metric"><span>存货编码</span><strong>${escapeHtml(card.product_code || "-")}</strong></div>
            <div class="headline-metric"><span>产品名称</span><strong>${escapeHtml(card.product_name || "-")}</strong></div>
          </div>
          <div class="product-strip"><div><span class="field-label">成品内尺寸</span><span class="field-value production-key-value">${escapeHtml(finishedSize(card))}</span></div><div><span class="field-label">${escapeHtml(quantityLabel)}</span><span class="field-value production-key-value">${escapeHtml(displayQuantity || 0)} ${quantityUnit}</span></div><div><span class="field-label">交期</span><span class="field-value">${escapeHtml(textList((card.delivery_dates || []).map(dateText)))}</span></div></div>
          ${receiptFactsHtml(card)}
          ${processHtml(card)}
          ${processDetailsHtml(card)}
          <div class="detail-grid"><div class="detail-list">${detailHtml(card)}</div>${structureHtml(card)}</div>
          ${fulfillmentReminderHtml(card)}
          ${warnings}
          <footer class="foot internal-only"><span>报料单 ${escapeHtml(card.supplier_order_number || packageData.supplier_order_number || "-")} · 纸面版本 ${escapeHtml(String(card.paper_version_key || packageData.plan_fingerprint || "").slice(-20))}</span><span>生成 ${escapeHtml(card.received_at || packageData.created_at || "-")}</span></footer>
          <footer class="foot safe-only">${safeNote}<span>尺寸单位：mm</span></footer>
        </section>`;
      }

      function applyMode() {
        document.body.classList.toggle("customer-safe", customerSafe);
        modeButton.textContent = customerSafe ? "切换内部生产版" : "切换客户随货版";
        const next = new URL(window.location.href);
        if (customerSafe) next.searchParams.set("mode", "customer"); else next.searchParams.delete("mode");
        window.history.replaceState(null, "", next);
      }

      async function waitForProductQrImages() {
        const images = Array.from(pagesHost.querySelectorAll("img[alt='扫码查看当前产品资料']"));
        await Promise.all(images.map((image) => image.decode
          ? image.decode()
          : image.complete && image.naturalWidth > 0
          ? Promise.resolve()
          : new Promise((resolve, reject) => {
              image.addEventListener("load", resolve, {once:true});
              image.addEventListener("error", () => reject(new Error("产品二维码图片加载失败，请重试")), {once:true});
            })));
        if (images.some((image) => !image.complete || !image.naturalWidth)) throw new Error("产品二维码图片尚未完整加载，请重试");
      }

      async function render(packageData) {
        const layouts = printPageLayouts(packageData.cards || []);
        pagesHost.innerHTML = layouts.map((layout, index) => layout.fullPage
          ? `<article class="page single-page" data-page="${index + 1}">${cardHtml(layout.top, packageData, true)}</article>`
          : `<article class="page batch-page" data-page="${index + 1}">${cardHtml(layout.top, packageData)}${cardHtml(layout.bottom, packageData)}</article>`
        ).join("");
        await waitForProductQrImages();
        const fullPageCount = layouts.filter((layout) => layout.fullPage).length;
        const singleCard = packageData.card_count === 1 && layouts.length === 1;
        toolbarNote.textContent = batchMode
          ? `已冻结 ${packageData.card_count || 0} 项人工选择 · 共 ${layouts.length} 页 · 本批次不会随页面后续勾选改变`
          : receiptMode
          ? (packageData.reuses_planned_card
            ? "实收与计划完全一致 · 沿用原计划卡即可，不强制重复打印"
            : `${packageData.paper_phase_label || "实收版"} · 一笔实收事实一张卡`)
          : (fullPageCount
            ? `黑白打印 · ${fullPageCount} 款复杂印刷任务单独占 A4，其余每页上下两款`
            : (singleCard
              ? "黑白打印 · 单张任务单独占一张 A4"
              : "黑白打印 · 批量每张 A4 上下两款"));
        applyMode();
        const overflowingCards = Array.from(pagesHost.querySelectorAll(".task-card:not(.blank)")).filter((card) => {
          if (card.scrollHeight > card.clientHeight + 1 || card.scrollWidth > card.clientWidth + 1) return true;
          const constrained = [card, ...card.querySelectorAll(".detail-grid,.detail-list,.structure")];
          return constrained.slice(1).some((element) => element.scrollHeight > element.clientHeight + 1 || element.scrollWidth > element.clientWidth + 1);
        });
        if (overflowingCards.length) {
          overflowingCards.forEach((card) => card.classList.add("layout-overflow"));
          message.hidden = false;
          message.className = "message error";
          message.textContent = "任务内容超过页面容量，已停止打印。请核对过长工艺说明或拆分报料。";
          printButton.disabled = true;
          return;
        }
        message.hidden = true;
        printButton.disabled = !layouts.length || packageData.printable === false;
        const labelCount = Number(packageData.production_label_count || 0);
        const refreshOptions = Array.isArray(packageData.production_label_refresh_options)
          ? packageData.production_label_refresh_options : [];
        const refreshable = refreshOptions.filter((row) => row && row.can_refresh === true && row.current_enabled === true);
        labelButton.hidden = batchMode;
        labelButton.textContent = labelCount > 0 ? `生产包装标签（${labelCount}张）` : "未启用包装标签";
        // The packaging-label endpoint performs its own frozen-plan checks.
        // A production-paper review warning must not hide an otherwise valid
        // label plan, especially on the posted-receipt card.
        labelButton.disabled = batchMode || labelCount <= 0;
        labelRefreshButton.hidden = batchMode || labelCount > 0 || !refreshable.length;
        labelRefreshButton.disabled = labelRefreshButton.hidden;
        labelRefreshButton.textContent = refreshable.length > 1
          ? `按常用箱刷新 ${refreshable.length} 款标签计划`
          : "按常用箱刷新标签计划";
      }

      async function loadPackage() {
        const generation = ++loadGeneration;
        if (activeController) activeController.abort();
        activeController = new AbortController();
        loadedPackage = null;
        printButton.disabled = true;
        labelButton.disabled = true;
        labelRefreshButton.disabled = true;
        pagesHost.innerHTML = "";
        message.hidden = false;
        message.className = "message";
        message.textContent = batchMode ? "正在核验已冻结的批量打印任务…" : receiptMode ? "正在读取同一生产任务的实收纸面版本…" : "正在读取正式报料快照…";
        if (!batchMode && (!Number.isInteger(sourceId) || sourceId <= 0)) {
          message.className = "message error";
          message.textContent = receiptMode ? "来料实收明细编号无效" : "报料单编号无效";
          return;
        }
        try {
          const endpoint = batchMode
            ? `/api/requisition/production-print-batches/${encodeURIComponent(batchId)}`
            : receiptMode
            ? `/api/incoming/receipt-items/${encodeURIComponent(receiptItemId)}/production-card`
            : `/api/requisition/supplier-orders/${encodeURIComponent(orderId)}/production-print-package`;
          const response = await fetch(endpoint, {
            method:"GET", credentials:"include", cache:"no-store", headers:{"Accept":"application/json"}, signal:activeController.signal,
          });
          let payload = null;
          try { payload = await response.json(); } catch (_error) { payload = null; }
          if (!response.ok) throw Object.assign(new Error(errorMessage(response.status, payload)), {status:response.status});
          if (generation !== loadGeneration) return;
          if (!payload || typeof payload !== "object" || !Array.isArray(payload.pages) || !Array.isArray(payload.cards)) throw new Error("服务器返回的统一任务单数据不完整，请重试");
          loadedPackage = payload;
          await render(payload);
        } catch (error) {
          if (error && error.name === "AbortError") return;
          if (generation !== loadGeneration) return;
          message.className = "message error";
          message.textContent = error instanceof TypeError ? "无法连接 ERP 服务，请检查网络后重试" : error && error.message ? error.message : "连接 ERP 失败，请重试";
        }
      }

      retryButton.addEventListener("click", loadPackage);
      printButton.addEventListener("click", () => { if (loadedPackage) window.print(); });
      modeButton.addEventListener("click", () => { customerSafe = !customerSafe; applyMode(); });
      labelButton.addEventListener("click", () => {
        const supplierOrderId = Number(loadedPackage && loadedPackage.supplier_order_id);
        if (loadedPackage && !batchMode && Number.isInteger(supplierOrderId) && supplierOrderId > 0) {
          window.open(`/production-packaging-label.html?id=${encodeURIComponent(supplierOrderId)}`, "_blank", "noopener");
        }
      });
      labelRefreshButton.addEventListener("click", async () => {
        const packageSnapshot = loadedPackage;
        const refreshable = Array.isArray(packageSnapshot && packageSnapshot.production_label_refresh_options)
          ? packageSnapshot.production_label_refresh_options.filter((row) => row && row.can_refresh === true && row.current_enabled === true)
          : [];
        if (!refreshable.length) return;
        const productText = refreshable.map((row) => row.product_code || row.product_name || `任务 ${row.task_id}`).join("、");
        if (!window.confirm(`确认这些任务尚未开始生产、也没有打印过包装标签，并按当前常用箱设置刷新标签计划吗？\n${productText}`)) return;
        labelRefreshButton.disabled = true;
        labelButton.disabled = true;
        let refreshed = 0;
        try {
          for (const row of refreshable) {
            const key = typeof crypto !== "undefined" && typeof crypto.randomUUID === "function"
              ? crypto.randomUUID()
              : `label-refresh-${Date.now()}-${row.task_id}-${Math.random().toString(16).slice(2)}`;
            const response = await fetch(`/api/production/tasks/${encodeURIComponent(row.task_id)}/label-plan-refresh`, {
              method:"POST",
              credentials:"include",
              headers:{"Accept":"application/json", "Content-Type":"application/json"},
              body:JSON.stringify({
                idempotency_key:key,
                expected_task_version:row.expected_task_version,
                expected_product_version:row.expected_product_version,
                confirmed_not_started:true,
                confirmed_no_prior_print:true,
              }),
            });
            let payload = null;
            try { payload = await response.json(); } catch (_error) { payload = null; }
            if (!response.ok) throw new Error(errorMessage(response.status, payload));
            refreshed += 1;
          }
          await loadPackage();
          if (loadedPackage && Number(loadedPackage.production_label_count || 0) > 0) {
            message.hidden = false;
            message.className = "message";
            message.textContent = `已按当前常用箱刷新 ${refreshed} 款标签计划，现在可以打印生产包装标签。`;
          }
        } catch (error) {
          await loadPackage();
          message.hidden = false;
          message.className = "message error";
          message.textContent = `${refreshed ? `已成功刷新 ${refreshed} 款；` : ""}${error && error.message ? error.message : "标签计划刷新失败，请重试"}`;
        }
      });
      closeButton.addEventListener("click", () => window.close());
      applyMode();
      document.title = batchMode ? "生产任务单 · 批量勾选" : receiptMode ? "生产任务单 · 实收版" : "生产任务单 · 计划版";
      loadPackage();
    })();
  </script>
</body>
</html>
