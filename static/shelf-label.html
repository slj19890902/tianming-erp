<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>货架标签</title><style>
@page{size:80mm 40mm;margin:0}*{box-sizing:border-box}body{margin:0;background:#eef2f7;font:14px Arial,"Microsoft YaHei",sans-serif}
header{text-align:center;padding:12px}button{padding:10px 18px;border:0;border-radius:6px;background:#15803d;color:white;cursor:pointer}button:disabled{opacity:.5}
#message{text-align:center;padding:8px}#labels{display:grid;justify-content:center;gap:12px}
.label{width:80mm;height:40mm;padding:2mm;background:white;overflow:hidden;break-after:page}.label:last-child{break-after:auto}
.location{display:grid;grid-template-columns:minmax(0,1fr) 28mm;gap:2mm;align-items:center;height:100%}.location h1{font-size:19pt;line-height:1.3;margin:0 0 4mm;overflow-wrap:anywhere}.location strong{font-size:20pt}.location img{width:28mm;height:28mm}
.product-head{display:grid;grid-template-columns:minmax(0,1fr) 18mm;gap:2mm;height:18mm;align-items:center;border-bottom:.2mm solid #333}
.product-head h1{font-size:13pt;line-height:1.15;margin:0 0 1mm;white-space:nowrap}.product-head strong{font-size:13pt}.product-head img{width:18mm;height:18mm}
.fields{padding-top:.5mm}.field{display:grid;grid-template-columns:17mm minmax(0,1fr);height:4.1mm;align-items:center;font-size:9pt}.value{white-space:nowrap}.code{font-size:12pt;font-weight:800}
@media print{header,#message{display:none}body{background:white}#labels{display:block}.label{margin:0}}
</style></head><body>
<header><button id="print" disabled>打印</button> <button id="retry">刷新</button></header>
<div id="message">读取标签…</div><main id="labels"></main>
<script src="/static/shelf-label.js"></script></body></html>
