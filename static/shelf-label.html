<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>货架标签</title><style>
@page{size:40mm 80mm;margin:0}*{box-sizing:border-box}body{margin:0;background:#eef2f7;font:14px Arial,"Microsoft YaHei",sans-serif}
header{text-align:center;padding:12px}button{padding:10px 18px;border:0;border-radius:6px;background:#15803d;color:white;cursor:pointer}button:disabled{opacity:.5}
#message{text-align:center;padding:8px}#labels{display:grid;justify-content:center;gap:12px}
.label-page{position:relative;width:40mm;height:80mm;overflow:hidden;break-inside:avoid;page-break-after:always;break-after:page;background:white}.label-page:last-child{page-break-after:auto;break-after:auto}
.label{position:absolute;left:0;top:0;transform:translateX(40mm) rotate(90deg);transform-origin:top left;width:80mm;height:40mm;padding:2mm;background:white;overflow:hidden;break-after:auto}
.location{display:grid;grid-template-columns:minmax(0,1fr) 28mm;gap:2mm;align-items:center;height:100%}.location h1{font-size:19pt;line-height:1.3;margin:0 0 4mm;overflow-wrap:anywhere}.location strong{font-size:20pt}.location img{width:28mm;height:28mm}
.rack-only{display:grid;grid-template-columns:minmax(0,1fr) 28mm;gap:2mm;align-items:center;height:100%;text-align:center}.rack-only img{width:28mm;height:28mm}.rack-only h1{width:100%;font-size:40pt;line-height:1.2;margin:0;white-space:nowrap}
.product-layout{display:grid;grid-template-columns:44mm 30mm;gap:2mm;height:36mm;align-items:center}.product-details{min-width:0;height:36mm}.product-head{height:9mm;border-bottom:.2mm solid #333;padding-top:1mm}.product-head h1{font-size:20pt;line-height:1.15;margin:0;white-space:nowrap}.product-qr{width:30mm;height:30mm}
.fields{padding-top:.8mm}.field{display:grid;grid-template-columns:10mm minmax(0,1fr);height:6mm;align-items:center;font-size:9pt}.field>span{white-space:nowrap}.value{display:block;min-width:0;white-space:nowrap;line-height:1.15;font-size:11.5pt}.code{font-size:16pt;font-weight:800}.customer{font-weight:700;font-size:14pt}
.print-raster{display:none;width:40mm;height:80mm}
@media print{html,body{width:40mm;margin:0;background:white}header,#message{display:none!important}#labels{display:block;width:40mm;margin:0;padding:0}.label-page{margin:0;padding:0;contain:strict}.label{display:none!important}.print-raster{display:block!important;width:40mm;height:80mm;margin:0}}
</style></head><body>
<header><div>40×80 mm 纵向纸型 · 缩放100% · 无边距 · 不再手动旋转<br>打印机请选择 Gprinter GP-3120TU - 40x80纵向标签</div><label id="contentControl">标签内容 <select id="labelContent"><option value="cell">每层每格（含二维码）</option><option value="rack">货架编号＋二维码（不含层格）</option></select></label> <button id="print" disabled>打印</button> <button id="retry">刷新</button></header>
